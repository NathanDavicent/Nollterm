<script>
const CONTENT = [{"id":"cpp","badge":"C++","title":"Programmering C/C++","short":"C/C++","tag":"IoT","desc":"Från Hello World till pekare, klasser och felhantering, med fokus på sensordata och inbyggda system.","headline":"Varje byte har en <em>adress</em>.","lessons":[{"id":"kom-igang","cat":"Grunder","min":7,"title":"Kom igång med C och C++","lead":"Skriv, kompilera och kör ditt första program, och lär dig vad som skiljer C från C++.","src":["C/C++ – V39 Studiehäfte"],"goals":["Förklara skillnaden mellan C och C++ på en grundläggande nivå","Kompilera och köra ett program, både i en IDE och från terminalen","Använda variabler, de vanligaste datatyperna och operatorer"],"blocks":[["h","C och C++: släkt men inte samma"],["p","<strong>C</strong> är ett litet, procedurellt språk som ligger nära hårdvaran. Det finns en C-kompilator till nästan varje mikrokontroller, och därför är C fortfarande standard i inbyggda system. <strong>C++</strong> bygger vidare på C och lägger till bland annat klasser, referenser, <code>std::string</code>, <code>std::vector</code> och exceptions."],["p","Det mesta av giltig C-kod kompilerar också som C++, men inte tvärtom. I den här kursen skriver du båda, ofta samma uppgift två gånger, så att du ser vad C++ gör enklare och vad C kräver att du gör själv."],["table",["","C","C++"],[["Utskrift","<code>printf</code> från <code>&lt;stdio.h&gt;</code>","<code>std::cout</code> från <code>&lt;iostream&gt;</code>"],["Inläsning","<code>scanf</code>, <code>fgets</code>","<code>std::cin</code>, <code>std::getline</code>"],["Text","<code>char</code>-array som slutar med <code>'\\0'</code>","<code>std::string</code>"],["Filändelse",".c",".cpp"],["Kompilator (CLI)","gcc","g++"]]],["h","Sätt upp din miljö"],["p","Det finns två vägar. Båda fungerar, välj den du trivs med."],["list",["<strong>A. IDE (rekommenderas för nybörjare):</strong> Visual Studio, CLion, Code::Blocks eller Dev-C++. Du skriver, kompilerar, kör och debuggar på samma ställe.","<strong>B. Kommandoraden:</strong> gcc/g++ via MinGW på Windows, eller i terminalen på Linux och Mac."]],["code","bash","# Kompilera och kör från terminalen\ngcc hello.c -o hello      # C\ng++ hello.cpp -o hello    # C++\n./hello                   # Windows: hello.exe","terminal"],["h","Hello, World"],["p","Första milstolpen i ett nytt språk är att få ut en rad text. Då vet du att kompilatorn, länkningen och körningen fungerar."],["code","c","#include <stdio.h>\n\nint main(void) {\n    printf(\"Hello, World!\\n\");\n    return 0;   // 0 betyder \"allt gick bra\"\n}","hello.c"],["code","cpp","#include <iostream>\n\nint main() {\n    std::cout << \"Hello, World!\" << std::endl;\n    return 0;\n}","hello.cpp"],["h","Variabler och datatyper"],["p","En variabel är en namngiven behållare för data. Typen bestämmer vilka värden som får plats och hur mycket minne som används."],["table",["Typ","Innehåll","Exempel","Vanlig storlek"],[["<code>int</code>","heltal","<code>int age = 20;</code>","4 byte"],["<code>float</code>","decimaltal","<code>float price = 19.99f;</code>","4 byte"],["<code>double</code>","decimaltal, högre precision","<code>double pi = 3.14159;</code>","8 byte"],["<code>char</code>","ett tecken","<code>char grade = 'A';</code>","1 byte"],["<code>bool</code>","sant/falskt","<code>bool on = true;</code>","1 byte"],["<code>std::string</code>","text (bara C++)","<code>std::string name = \"Anna\";</code>","varierar"]]],["note","tip","Storlekarna gäller en vanlig PC. På en mikrokontroller kan <code>int</code> vara 2 byte. Kontrollera med <code>sizeof(int)</code> när det spelar roll."],["h","Operatorer"],["list",["<strong>Aritmetiska:</strong> <code>+ - * / %</code>","<strong>Jämförelse:</strong> <code>== != &lt; &gt; &lt;= &gt;=</code>, ger alltid sant eller falskt","<strong>Logiska:</strong> <code>&amp;&amp;</code> (och), <code>||</code> (eller), <code>!</code> (inte)"]],["code","cpp","int a = 7, b = 2;\nstd::cout << a / b   << \"\\n\";   // 3   heltalsdivision, decimalerna kapas\nstd::cout << a % b   << \"\\n\";   // 1   resten\nstd::cout << 7.0 / 2 << \"\\n\";   // 3.5 minst ett decimaltal ger decimaldivision","heltalsdivision"],["note","warn","<code>=</code> tilldelar, <code>==</code> jämför. <code>if (x = 5)</code> kompilerar men sätter x till 5 och är alltid sant."],["h","Mini-labb"],["ex","Ditt första program","<p>Skriv ett program som:</p><ol><li>skriver ut ditt namn och din ålder</li><li>beräknar summan av två tal</li><li>avgör om åldern är över eller under 18</li></ol><p>Gör det i både C och C++. För varje nytt begrepp: slå upp det på cppreference.com.</p>","#include <iostream>\n#include <string>\n\nint main() {\n    std::string name = \"Nathanael\";\n    int age = 20;\n    int x = 4, y = 7;\n\n    std::cout << name << \", \" << age << \" år\\n\";\n    std::cout << \"Summa: \" << x + y << \"\\n\";\n    if (age >= 18) {\n        std::cout << \"Myndig\\n\";\n    } else {\n        std::cout << \"Under 18\\n\";\n    }\n    return 0;\n}","cpp"]],"pool":[{"t":"mc","q":"Vad skriver <code>std::cout &lt;&lt; 7 / 2;</code> ut?","o":["3.5","3","4","3.0"],"a":1,"why":"Båda operanderna är <code>int</code>, så det blir heltalsdivision och decimalerna kapas. Skriv <code>7.0 / 2</code> för att få 3.5."},{"t":"mc","q":"Vilken typ passar bäst för ett enskilt tecken, till exempel betyget 'A'?","o":["<code>std::string</code>","<code>char</code>","<code>int</code>","<code>bool</code>"],"a":1,"why":"<code>char</code> rymmer exakt ett tecken (1 byte). Enkla citattecken <code>'A'</code> betyder ett tecken, dubbla <code>\"A\"</code> betyder en sträng."},{"t":"mc","q":"Vilket påstående om C och C++ stämmer?","o":["<code>std::string</code> finns bara i C++","C har klasser precis som C++","C++ kan inte använda <code>printf</code>","C-kod måste skrivas om helt för att kompilera som C++"],"a":0,"why":"Standardbiblioteket med <code>std::string</code>, <code>std::vector</code> och <code>std::cout</code> är C++. C++ kan fortfarande använda <code>printf</code> via <code>&lt;cstdio&gt;</code>."},{"t":"mc","q":"Vad blir <code>10 % 3</code>?","o":["3","0","1","3.33"],"a":2,"why":"<code>%</code> ger resten vid heltalsdivision: 10 = 3 · 3 + <strong>1</strong>."},{"t":"mc","q":"Vilken operator betyder logiskt OCH?","o":["<code>&amp;</code>","<code>&amp;&amp;</code>","<code>||</code>","<code>!</code>"],"a":1,"why":"<code>&amp;&amp;</code> är logiskt och. En ensam <code>&amp;</code> är bitvis och, eller adressoperatorn, beroende på sammanhang."},{"t":"mc","q":"Vilket kommando kompilerar <code>main.cpp</code> till programmet <code>app</code>?","o":["<code>gcc main.cpp app</code>","<code>g++ main.cpp -o app</code>","<code>g++ -o main.cpp app</code>","<code>run main.cpp</code>"],"a":1,"why":"<code>g++</code> är C++-kompilatorn och <code>-o</code> anger namnet på den körbara filen."},{"t":"mc","q":"Vad returnerar <code>main</code> för att signalera att allt gick bra?","o":["1","0","-1","true"],"a":1,"why":"<code>return 0;</code> betyder att programmet avslutades utan fel. Allt annat tolkas som en felkod."},{"t":"multi","q":"Vilka av följande är jämförelseoperatorer? Välj alla som stämmer.","o":["<code>==</code>","<code>!=</code>","<code>=</code>","<code>&lt;=</code>","<code>&amp;&amp;</code>"],"a":[0,1,3],"why":"<code>=</code> är tilldelning och <code>&amp;&amp;</code> är en logisk operator."},{"t":"text","q":"Vilken datatyp ger dubbel precision för decimaltal? Skriv typens namn.","accept":["double"],"ph":"typnamn","why":"<code>double</code> har ungefär 15–16 siffrors precision, <code>float</code> ungefär 7."},{"t":"text","q":"Vad skriver <code>std::cout &lt;&lt; 17 % 5;</code> ut?","accept":["2"],"ph":"svar","why":"17 = 3 · 5 + 2, så resten är 2."},{"t":"text","q":"Vilken header inkluderar du för att använda <code>printf</code> i C? Skriv hela raden.","accept":["#include <stdio.h>","#include<stdio.h>","stdio.h","<stdio.h>"],"ph":"#include ...","why":"<code>#include &lt;stdio.h&gt;</code> (i C++ heter den <code>&lt;cstdio&gt;</code>)."},{"t":"code","q":"Läs in två heltal och skriv ut deras summa, skillnad och produkt på var sin rad.","why":"Tre utskrifter med <code>endl</code> efter varje ger tre rader.","task":"01-kom-igang-1","tests":[{"in":"7 3\n","out":"10\n4\n21\n"},{"in":"-2 5\n","out":"3\n-7\n-10\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int a, b;\n    scanf(\"%d %d\", &a, &b);\n    /* skriv ut summa, skillnad och produkt på var sin rad */\n\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int a, b;\n    scanf(\"%d %d\", &a, &b);\n    printf(\"%d\\n\", a + b);\n    printf(\"%d\\n\", a - b);\n    printf(\"%d\\n\", a * b);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int a, b;\n    cin >> a >> b;\n    // skriv ut summa, skillnad och produkt på var sin rad\n\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int a, b;\n    cin >> a >> b;\n    cout << a + b << endl;\n    cout << a - b << endl;\n    cout << a * b << endl;\n    return 0;\n}\n"},"py":{"starter":"a, b = map(int, input().split())\n# skriv ut summa, skillnad och produkt på var sin rad\n","sol":"a, b = map(int, input().split())\nprint(a + b)\nprint(a - b)\nprint(a * b)\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Läs in en temperatur i Celsius (decimaltal) och skriv ut den i Fahrenheit. Formel: F = C · 9 / 5 + 32.","why":"Eftersom <code>c</code> är en double blir hela uttrycket en decimalberäkning.","task":"01-kom-igang-2","tests":[{"in":"100\n","out":"212\n"},{"in":"37\n","out":"98.6\n"},{"in":"20\n","out":"68\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    double c;\n    scanf(\"%lf\", &c);\n    /* räkna ut och skriv ut Fahrenheit med printf(\"%g\\n\", ...) */\n\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    double c;\n    scanf(\"%lf\", &c);\n    printf(\"%g\\n\", c * 9 / 5 + 32);   /* %g skriver som cout: 98.6, 212 */\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    double c;\n    cin >> c;\n    // räkna ut och skriv ut Fahrenheit\n\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    double c;\n    cin >> c;\n    cout << c * 9 / 5 + 32 << endl;\n    return 0;\n}\n"},"py":{"starter":"c = float(input())\n# räkna ut Fahrenheit och skriv ut med f\"{f:g}\" (samma format som cout)\n","sol":"c = float(input())\nf = c * 9 / 5 + 32\nprint(f\"{f:g}\")   # :g ger 98.6 istället för 98.60000000000001\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false}]},{"id":"villkor","cat":"Grunder","min":6,"title":"Villkor och menyval","lead":"Låt programmet välja väg med if, else och switch, och bygg en meny som användaren styr.","src":["C/C++ – V39 Studiehäfte","Repetitionsövningar"],"goals":["Skriva logiska uttryck som blir sanna eller falska","Använda if, else if och else, och veta när switch passar bättre","Bygga ett menyprogram som upprepas tills användaren avslutar"],"blocks":[["h","Logiska uttryck"],["p","Jämförelser som <code>temp &gt; 25</code> blir alltid <code>true</code> eller <code>false</code>. I C++ finns typen <code>bool</code>. I C räknas <code>0</code> som falskt och allt annat som sant, men du kan inkludera <code>&lt;stdbool.h&gt;</code> för att få <code>bool</code>, <code>true</code> och <code>false</code>."],["code","cpp","bool tooHot   = temp > 25.0;\nbool inRange  = temp >= 18.0 && temp <= 24.0;\nbool alarm    = tooHot || sensorFailed;\nbool ok       = !alarm;"],["h","if, else if, else"],["p","Använd if/else när du jämför intervall. Villkoren testas uppifrån och ner, och det första som är sant vinner."],["code","cpp","int age;\nstd::cin >> age;\n\nif (age < 13) {\n    std::cout << \"Barn\\n\";\n} else if (age < 20) {\n    std::cout << \"Ungdom\\n\";\n} else if (age < 65) {\n    std::cout << \"Vuxen\\n\";\n} else {\n    std::cout << \"Pensionär\\n\";\n}","ålderskategori"],["h","switch för fasta val"],["p","<code>switch</code> passar när värdet ska jämföras mot ett antal fasta konstanter, som menyval. Varje <code>case</code> avslutas med <code>break</code>, annars fortsätter körningen in i nästa case."],["code","c","switch (choice) {\n    case 1: printf(\"Area\\n\");   break;\n    case 2: printf(\"Volym\\n\");  break;\n    case 3: printf(\"Hej då\\n\"); break;\n    default: printf(\"Fel val!\\n\");\n}"],["h","Kodstil som sparar dig buggar"],["list",["Använd alltid klamrar <code>{ }</code>, även när blocket bara är en rad. När du lägger till en rad senare hamnar den annars utanför villkoret.","Använd if/else för intervall, till exempel åldersgrupper eller temperaturgränser.","Använd switch för menyer och fasta val.","Indentera konsekvent så att blockstrukturen syns."]],["code","cpp","if (x > 0);          // semikolonet avslutar if-satsen här\n{\n    std::cout << \"Körs alltid!\\n\";\n}\n\nif (x = 0) { }       // tilldelning, inte jämförelse: alltid falskt","två klassiska fällor"],["h","Labb: miniräknare med meny"],["p","Menyn ska visas om och om igen tills användaren väljer att avsluta. En <code>do-while</code>-loop passar bra, eftersom menyn alltid ska visas minst en gång (mer om loopar i nästa ämne)."],["code","cpp","#include <iostream>\n\nint main() {\n    int choice;\n    do {\n        std::cout << \"\\n1. Addera\\n2. Subtrahera\\n3. Multiplicera\\n4. Dividera\\n5. Avsluta\\nVal: \";\n        std::cin >> choice;\n        if (choice >= 1 && choice <= 4) {\n            double a, b;\n            std::cout << \"Två tal: \";\n            std::cin >> a >> b;\n            switch (choice) {\n                case 1: std::cout << a + b << \"\\n\"; break;\n                case 2: std::cout << a - b << \"\\n\"; break;\n                case 3: std::cout << a * b << \"\\n\"; break;\n                case 4:\n                    if (b == 0) std::cout << \"Kan inte dela med noll\\n\";\n                    else        std::cout << a / b << \"\\n\";\n                    break;\n            }\n        } else if (choice != 5) {\n            std::cout << \"Ogiltigt val\\n\";\n        }\n    } while (choice != 5);\n    return 0;\n}","kalkylator.cpp"],["ex","Utöka miniräknaren","<ul><li>Lägg till potens (x<sup>y</sup>) och rest (modulus, <code>%</code>).</li><li>Tips: <code>std::pow</code> finns i <code>&lt;cmath&gt;</code>. <code>%</code> fungerar bara på heltal; för decimaltal finns <code>std::fmod</code>.</li></ul>"],["ex","Skottår","<p>Läs in ett år och skriv ut om det är ett skottår. Regeln: delbart med 4, men inte med 100, om det inte också är delbart med 400.</p>","bool isLeap(int y) {\n    return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);\n}","cpp"],["ex","Positivt, negativt eller noll","<p>Läs in ett heltal och skriv ut om det är positivt, negativt eller noll. Tre grenar: <code>if</code>, <code>else if</code>, <code>else</code>.</p>"]],"pool":[{"t":"mc","q":"Vad händer om du glömmer <code>break</code> i ett <code>case</code>?","o":["Kompilatorn ger ett fel","Körningen fortsätter in i nästa case","Programmet hoppar till default","Inget, break är valfritt och påverkar inget"],"a":1,"why":"Det kallas <em>fall-through</em>: koden i följande case körs också, tills ett <code>break</code> eller slutet på switchen nås."},{"t":"mc","q":"Vilket uttryck är sant när x ligger mellan 10 och 20, inklusive gränserna?","o":["<code>10 &lt;= x &lt;= 20</code>","<code>x &gt;= 10 || x &lt;= 20</code>","<code>x &gt;= 10 &amp;&amp; x &lt;= 20</code>","<code>x &gt; 10 &amp;&amp; x &lt; 20</code>"],"a":2,"why":"Båda villkoren måste gälla, alltså <code>&amp;&amp;</code>. <code>10 &lt;= x &lt;= 20</code> kompilerar men betyder <code>(10 &lt;= x) &lt;= 20</code>, vilket alltid är sant."},{"t":"mc","q":"När passar switch bäst?","o":["När du jämför intervall, som åldersgrupper","När ett värde ska matchas mot fasta val, som en meny","När du jämför två strängar","När villkoret är ett decimaltal"],"a":1,"why":"switch jämför mot konstanta heltalsvärden (eller tecken). Intervall och decimaltal hanteras med if/else."},{"t":"mc","q":"Vad gör <code>if (x = 0) { ... }</code>?","o":["Kontrollerar om x är 0","Sätter x till 0, och blocket körs aldrig","Ger kompileringsfel","Sätter x till 0, och blocket körs alltid"],"a":1,"why":"<code>=</code> är tilldelning. Uttrycket får värdet 0, som räknas som falskt, så blocket hoppas över. Dessutom har x skrivits över."},{"t":"mc","q":"Varför ska du använda klamrar även runt en enda rad?","o":["Koden går snabbare","Annars kompilerar den inte","En rad som läggs till senare hamnar annars utanför villkoret","Klamrar krävs bara i C"],"a":2,"why":"Utan klamrar hör bara nästa sats till if-satsen. Indenteringen kan lura dig att tro att fler rader gör det."},{"t":"mc","q":"Vad skrivs ut?<br><code>int t = 25; if (t &gt; 30) cout &lt;&lt; \"A\"; else if (t &gt; 20) cout &lt;&lt; \"B\"; else cout &lt;&lt; \"C\";</code>","o":["A","B","C","BC"],"a":1,"why":"Första villkoret är falskt, andra är sant. Efter första sanna grenen hoppas resten över."},{"t":"mc","q":"Vad gör <code>default</code> i en switch?","o":["Körs alltid först","Körs när inget case matchar","Avslutar switchen","Är ett obligatoriskt case"],"a":1,"why":"<code>default</code> fångar alla värden som inte matchar något case, ungefär som en avslutande <code>else</code>."},{"t":"multi","q":"Vilka uttryck är sanna när <code>x = 0</code>? Välj alla.","o":["<code>!x</code>","<code>x == 0</code>","<code>x</code>","<code>x &lt;= 0 &amp;&amp; x &gt;= 0</code>"],"a":[0,1,3],"why":"0 räknas som falskt, så <code>x</code> är falskt och <code>!x</code> är sant."},{"t":"text","q":"Vilket nyckelord avslutar ett case i en switch så att körningen inte fortsätter till nästa?","accept":["break","break;"],"ph":"nyckelord","why":"<code>break;</code> hoppar ut ur switchen."},{"t":"text","q":"Skriv villkoret (utan <code>if</code> och parenteser) som är sant när <code>temp</code> ligger utanför intervallet 18–24, gränserna inräknade som inne.","accept":["temp < 18 || temp > 24","temp>24||temp<18","!(temp>=18&&temp<=24)"],"ph":"temp ...","why":"Utanför betyder under 18 <em>eller</em> över 24: <code>temp &lt; 18 || temp &gt; 24</code>."},{"t":"code","q":"Läs in ett heltal och skriv ut <code>positivt</code>, <code>negativt</code> eller <code>noll</code>.","why":"Tre grenar: if, else if och else.","task":"02-villkor-1","tests":[{"in":"5\n","out":"positivt\n"},{"in":"-3\n","out":"negativt\n"},{"in":"0\n","out":"noll\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    /* skriv ut positivt, negativt eller noll */\n\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    if (n > 0) {\n        printf(\"positivt\\n\");\n    } else if (n < 0) {\n        printf(\"negativt\\n\");\n    } else {\n        printf(\"noll\\n\");\n    }\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    // skriv ut positivt, negativt eller noll\n\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    if (n > 0) {\n        cout << \"positivt\" << endl;\n    } else if (n < 0) {\n        cout << \"negativt\" << endl;\n    } else {\n        cout << \"noll\" << endl;\n    }\n    return 0;\n}\n"},"py":{"starter":"n = int(input())\n# skriv ut positivt, negativt eller noll\n","sol":"n = int(input())\nif n > 0:\n    print(\"positivt\")\nelif n < 0:\n    print(\"negativt\")\nelse:\n    print(\"noll\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Läs in ett årtal och skriv ut <code>ja</code> om det är ett skottår, annars <code>nej</code>. Delbart med 4, men inte med 100, om det inte också är delbart med 400.","why":"1900 är delbart med 100 men inte med 400, så det är inget skottår.","task":"02-villkor-2","tests":[{"in":"2024\n","out":"ja\n"},{"in":"1900\n","out":"nej\n"},{"in":"2000\n","out":"ja\n"},{"in":"2023\n","out":"nej\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int y;\n    scanf(\"%d\", &y);\n\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int y;\n    scanf(\"%d\", &y);\n    if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) {\n        printf(\"ja\\n\");\n    } else {\n        printf(\"nej\\n\");\n    }\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int y;\n    cin >> y;\n\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int y;\n    cin >> y;\n    if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) {\n        cout << \"ja\" << endl;\n    } else {\n        cout << \"nej\" << endl;\n    }\n    return 0;\n}\n"},"py":{"starter":"y = int(input())\n","sol":"y = int(input())\nif (y % 4 == 0 and y % 100 != 0) or y % 400 == 0:\n    print(\"ja\")\nelse:\n    print(\"nej\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false}]},{"id":"loopar","cat":"Kontrollflöde","min":9,"title":"Loopar och iteration","lead":"Upprepa kod med for, while och do-while, och känn igen de vanligaste loopbuggarna innan de händer.","src":["Torsdag 2/10 – Loopar","Repetitionsövningar"],"goals":["Välja rätt loop: for, while eller do-while","Gå igenom arrayer och vektorer med index och med range-based for","Summera, hitta min/max, räkna och söka i en lista","Känna igen off-by-one, oändliga loopar och division med noll"],"blocks":[["h","Vilket problem löser loopar?"],["list",["<strong>Mindre upprepning:</strong> skriv logiken en gång och låt loopen köra den så många gånger som behövs.","<strong>Bearbeta samlad data:</strong> arrayer, listor och andra sekvenser.","<strong>Automatisera:</strong> validera input tills den är giltig, summera mätvärden, söka efter ett värde."]],["h","Snabbintro: arrayer"],["p","En array lagrar flera värden av samma typ bredvid varandra i minnet. Du når varje värde med ett <strong>index som börjar på 0</strong>. En array med 5 element har alltså index 0–4."],["code","c","int temps[5] = {21, 22, 20, 19, 23};\nprintf(\"%d\\n\", temps[0]);   // 21, första värdet\nprintf(\"%d\\n\", temps[4]);   // 23, sista värdet","C"],["code","cpp","#include <vector>\nstd::vector<int> temps = {21, 22, 20, 19, 23};\ntemps.push_back(25);              // vektorn växer\nstd::cout << temps.size();        // 6","C++: std::vector är flexiblare och säkrare"],["h","for-loopen"],["p","Används när du vet hur många varv det blir, eller när du ska gå igenom alla element i en array."],["code","cpp","for (int i = 0; i < 5; i++) {      // start; villkor; uppdatering\n    std::cout << \"Temp \" << i << \": \" << temps[i] << \"\\n\";\n}\n\n// Range-based for (bara C++): inget index behövs\nfor (int t : temps) {\n    std::cout << t << \" \";\n}"],["widget","offbyone"],["h","while-loopen"],["p","Upprepar så länge ett villkor är sant. Du vet inte nödvändigtvis i förväg hur många varv det blir, till exempel när du väntar på giltig input eller på att ett sensorvärde ska passera en tröskel."],["code","cpp","int value = -1;\nwhile (value < 0 || value > 100) {\n    std::cout << \"Ange ett värde 0–100: \";\n    std::cin >> value;\n}"],["h","do-while-loopen"],["p","Som while, men villkoret kontrolleras <em>efter</em> varje varv. Kroppen körs därför alltid minst en gång. Typexemplet är en meny som ska visas innan användaren hunnit välja något."],["code","cpp","int choice;\ndo {\n    printMenu();\n    std::cin >> choice;\n} while (choice != 0);"],["table",["Loop","Använd när","Exempel"],[["for","antalet varv är känt eller kan räknas","gå igenom en array"],["while","du upprepar tills något händer","läs input tills den är giltig"],["do-while","kroppen ska köras minst en gång","menyprogram"]]],["h","Iterationsmönster"],["p","Fyra mönster återkommer hela tiden: summera, hitta min/max, räkna och söka. Du kommer att använda alla i inlämningsuppgiften."],["code","cpp","std::vector<double> v = {21.5, 22.0, 19.8, 23.4, 20.1};\n\ndouble sum = 0;                     // nollställ före loopen\ndouble minV = v[0], maxV = v[0];    // starta med första värdet, inte 0\nint evenCount = 0;\nint foundAt = -1;\n\nfor (size_t i = 0; i < v.size(); i++) {\n    sum += v[i];\n    if (v[i] < minV) minV = v[i];\n    if (v[i] > maxV) maxV = v[i];\n    if (static_cast<int>(v[i]) % 2 == 0) evenCount++;\n    if (foundAt == -1 && v[i] == 23.4) foundAt = i;\n}\n\nif (!v.empty()) {\n    std::cout << \"Medel: \" << sum / v.size() << \"\\n\";\n}","summa, min/max, räkna, sök"],["h","Vanliga fel i loopar"],["list",["<strong>Off-by-one:</strong> ett varv för mycket eller för lite, ofta <code>&lt;=</code> där det skulle vara <code>&lt;</code>.","<strong>Oändlig loop:</strong> loopvariabeln uppdateras aldrig, eller villkoret kan aldrig bli falskt.","<strong>Felaktig initiering:</strong> summan nollställs inte före loopen.","<strong>Loopvariabeln ändras inuti loopen</strong> på ett sätt du inte räknat med.","<strong>Division med noll:</strong> medelvärdet av en tom lista."]],["h","Övningar"],["ex","1–10 med alla tre looparna","<ul><li>Skriv ut talen 1–10 med for, while och do-while.</li><li>Skriv ut 10–1 baklänges med en while-loop.</li><li>Förutsäg vad som skrivs ut innan du kör koden.</li></ul>"],["ex","Statistik på en array","<ol><li>Skapa en array med minst 5 tal och beräkna summa och medelvärde.</li><li>Hitta det minsta och största talet.</li><li>Räkna hur många av talen som är jämna.</li></ol>"],["ex","FizzBuzz","<p>Skriv ut 1–100, men byt ut multipler av 3 mot \"Fizz\", multipler av 5 mot \"Buzz\" och multipler av båda mot \"FizzBuzz\".</p>","for (int i = 1; i <= 100; i++) {\n    if (i % 15 == 0)      std::cout << \"FizzBuzz\\n\";   // testa det mest specifika först\n    else if (i % 3 == 0)  std::cout << \"Fizz\\n\";\n    else if (i % 5 == 0)  std::cout << \"Buzz\\n\";\n    else                  std::cout << i << \"\\n\";\n}","cpp"],["ex","Primtalskontroll","<p>Läs in ett tal med <code>std::cin</code> och avgör med en loop om det är ett primtal. Det räcker att testa delare upp till √n.</p>","bool isPrime(int n) {\n    if (n < 2) return false;\n    for (int d = 2; d * d <= n; d++) {\n        if (n % d == 0) return false;\n    }\n    return true;\n}","cpp"],["ex","Debugga buggyLoops.cpp","<p>Klona kursens repo och hitta buggarna (oändlig loop, off-by-one) i <code>buggyLoops.cpp</code>: <a href=\"https://github.com/CalleFreme/c-cpp-cj\" target=\"_blank\" rel=\"noopener\">github.com/CalleFreme/c-cpp-cj</a>.</p>"]],"pool":[{"t":"mc","q":"Vilken loop körs alltid minst en gång?","o":["for","while","do-while","range-based for"],"a":2,"why":"do-while kontrollerar villkoret efter varje varv, så kroppen hinner köras en gång innan villkoret testas."},{"t":"mc","q":"<code>int a[5];</code> loopas med <code>for (int i = 0; i &lt;= 5; i++)</code>. Vad är problemet?","o":["Inget, loopen går igenom alla fem","Loopen hoppar över a[0]","Loopen läser a[5], som ligger utanför arrayen","Loopen blir oändlig"],"a":2,"why":"Giltiga index är 0–4. Med <code>&lt;=</code> körs ett sjätte varv med i = 5: ett klassiskt off-by-one-fel som läser minne utanför arrayen."},{"t":"mc","q":"Vad är den vanligaste orsaken till en oändlig loop?","o":["För många varv i en for-loop","Loopvariabeln uppdateras aldrig","Att använda break","Att loopa över en tom vektor"],"a":1,"why":"Om inget i loopen ändrar det som villkoret testar förblir villkoret sant för evigt."},{"t":"mc","q":"Vad stämmer om <code>for (int t : temps)</code>?","o":["Det fungerar i både C och C++","Det går igenom varje element utan att du behöver ett index","Det ändrar elementen i temps","Det kräver att temps är en std::map"],"a":1,"why":"Range-based for finns bara i C++. <code>t</code> är en kopia av varje element. Vill du ändra elementen skriver du <code>int&amp; t</code>."},{"t":"mc","q":"Varför kontrollerar man att listan inte är tom innan man beräknar medelvärdet?","o":["För att loopen annars blir oändlig","För att undvika division med noll","För att summan annars blir negativ","Det behövs inte"],"a":1,"why":"Medelvärdet är summa / antal. Med 0 element delar du med 0: ett körningsfel för heltal och <code>nan</code> för decimaltal."},{"t":"mc","q":"Hur många gånger körs kroppen i <code>for (int i = 10; i &gt; 0; i -= 3)</code>?","o":["3","4","10","Oändligt många"],"a":1,"why":"i = 10, 7, 4, 1. Sedan blir i = -2 och villkoret är falskt."},{"t":"mc","q":"Vad skrivs ut?<br><code>int i = 5; while (i &lt; 5) { cout &lt;&lt; i; i++; }</code>","o":["5","Ingenting","01234","Oändlig loop"],"a":1,"why":"Villkoret är falskt redan från början, så while-kroppen körs aldrig. Med do-while hade 5 skrivits ut."},{"t":"multi","q":"Vilka är vanliga orsaker till buggar i loopar? Välj alla.","o":["Off-by-one i villkoret","Summan nollställs inte före loopen","Att använda range-based for","Loopvariabeln uppdateras aldrig"],"a":[0,1,3],"why":"Range-based for är tvärtom ett sätt att undvika indexfel."},{"t":"text","q":"Vilket nyckelord avbryter en loop direkt?","accept":["break","break;"],"ph":"nyckelord","why":"<code>break</code> lämnar loopen. <code>continue</code> hoppar bara till nästa varv."},{"t":"text","q":"En array har 8 element. Vilket är det sista giltiga indexet?","accept":["7"],"ph":"index","why":"Index börjar på 0, så 8 element har index 0–7."},{"t":"code","q":"Läs in ett heltal <code>n</code> och skriv ut summan 1 + 2 + … + n.","why":"Här ska loopen ta med n, därför <code>&lt;=</code>.","task":"03-loopar-1","tests":[{"in":"4\n","out":"10\n"},{"in":"100\n","out":"5050\n"},{"in":"1\n","out":"1\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    int sum = 0;\n    /* loopa och summera */\n\n    printf(\"%d\\n\", sum);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    int sum = 0;\n    for (int i = 1; i <= n; i++) {\n        sum += i;\n    }\n    printf(\"%d\\n\", sum);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    int sum = 0;\n    // loopa och summera\n\n    cout << sum << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    int sum = 0;\n    for (int i = 1; i <= n; i++) {\n        sum += i;\n    }\n    cout << sum << endl;\n    return 0;\n}\n"},"py":{"starter":"n = int(input())\ntotal = 0\n# loopa och summera\n\nprint(total)\n","sol":"n = int(input())\ntotal = 0\nfor i in range(1, n + 1):   # range slutar FÖRE n + 1, alltså tar den med n\n    total += i\nprint(total)\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"FizzBuzz: läs in <code>n</code> och skriv ut 1 till n, ett tal per rad. Byt multipler av 3 mot <code>Fizz</code>, av 5 mot <code>Buzz</code> och av båda mot <code>FizzBuzz</code>.","why":"Testa det mest specifika fallet (delbart med 15) först.","task":"03-loopar-2","tests":[{"in":"15\n","out":"1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n"},{"in":"5\n","out":"1\n2\nFizz\n4\nBuzz\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    for (int i = 1; i <= n; i++) {\n        if (i % 15 == 0)     printf(\"FizzBuzz\\n\");\n        else if (i % 3 == 0) printf(\"Fizz\\n\");\n        else if (i % 5 == 0) printf(\"Buzz\\n\");\n        else                 printf(\"%d\\n\", i);\n    }\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    for (int i = 1; i <= n; i++) {\n        if (i % 15 == 0)     cout << \"FizzBuzz\" << endl;\n        else if (i % 3 == 0) cout << \"Fizz\" << endl;\n        else if (i % 5 == 0) cout << \"Buzz\" << endl;\n        else                 cout << i << endl;\n    }\n    return 0;\n}\n"},"py":{"starter":"n = int(input())\n","sol":"n = int(input())\nfor i in range(1, n + 1):\n    if i % 15 == 0:\n        print(\"FizzBuzz\")\n    elif i % 3 == 0:\n        print(\"Fizz\")\n    elif i % 5 == 0:\n        print(\"Buzz\")\n    else:\n        print(i)\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Läs in <code>n</code> och sedan n heltal. Skriv ut det minsta och det största talet, separerade med ett mellanslag.","why":"Startar du min med 0 blir svaret fel när alla tal är positiva, och max blir fel när alla är negativa.","task":"03-loopar-3","tests":[{"in":"5\n3 9 -2 7 4\n","out":"-2 9\n"},{"in":"1\n42\n","out":"42 42\n"},{"in":"3\n-5 -1 -9\n","out":"-9 -1\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int n, x;\n    scanf(\"%d %d\", &n, &x);\n    int minV = x, maxV = x;          /* starta med första värdet, inte 0 */\n    for (int i = 1; i < n; i++) {\n        scanf(\"%d\", &x);\n        if (x < minV) minV = x;\n        if (x > maxV) maxV = x;\n    }\n    printf(\"%d %d\\n\", minV, maxV);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int n, x;\n    cin >> n >> x;\n    int minV = x, maxV = x;          // starta med första värdet, inte 0\n    for (int i = 1; i < n; i++) {\n        cin >> x;\n        if (x < minV) minV = x;\n        if (x > maxV) maxV = x;\n    }\n    cout << minV << \" \" << maxV << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\ndata = sys.stdin.read().split()\nn = int(data[0])\nvalues = [int(x) for x in data[1:1 + n]]\n# skriv ut minsta och största, utan att använda min() och max()\n","sol":"import sys\n\ndata = sys.stdin.read().split()\nn = int(data[0])\nvalues = [int(x) for x in data[1:1 + n]]\n\nmin_v = max_v = values[0]        # starta med första värdet, inte 0\nfor x in values[1:]:\n    if x < min_v:\n        min_v = x\n    if x > max_v:\n        max_v = x\nprint(min_v, max_v)\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false}],"date":"Tors 2/10"},{"id":"funktioner","cat":"Funktioner","min":11,"title":"Funktioner och anropsstacken","lead":"Dela upp programmet i små delar med ett tydligt ansvar, och se vad som händer i minnet när en funktion anropas.","src":["Tis 6/10 – Funktioner","Startkod för klasser och structs (tabellen om const, & och *)"],"goals":["Skriva, anropa och förklara funktioner i C och C++","Skilja på parametrar och argument, och på deklaration och definition","Förklara call by value, call by pointer och call by reference","Beskriva hur stack frames läggs på och tas bort från anropsstacken"],"blocks":[["h","Vad är en funktion?"],["p","En funktion är en namngiven, återanvändbar del av programmet. Den tar <strong>in</strong> data (parametrar), gör något och kan <strong>returnera</strong> ett resultat. Funktioner gör koden mer strukturerad, modulär och lättläst."],["p","Sträva efter <strong>single responsibility</strong>: funktionen gör precis det som namnet säger, varken mer eller mindre. En funktion som heter <code>average</code> räknar ut ett medelvärde. Den skriver inte ut det."],["code","cpp","returtyp namn(typ parameter1, typ parameter2) {\n    // kropp\n    return värde;          // utelämnas om returtypen är void\n}","allmän syntax"],["code","cpp","void greetUser() {                          // ingen indata, inget returvärde\n    std::cout << \"Välkommen!\\n\";\n}\n\nfloat average(float a, float b) {            // parametrar och returvärde\n    return (a + b) / 2.0f;\n}\n\nint main() {\n    greetUser();\n    float avg = average(21.5f, 23.5f);       // 21.5f och 23.5f är argument\n    std::cout << avg << \"\\n\";                // 22.5\n}"],["note","tip","Returnera resultatet istället för att skriva ut det i funktionen, om syftet är en beräkning. Då kan den som anropar välja vad som ska hända med värdet."],["h","Parametrar och argument"],["p","<strong>Parametrar</strong> är variablerna i funktionens definition (<code>a</code> och <code>b</code> ovan). <strong>Argument</strong> är de faktiska värdena du skickar in vid anropet (<code>21.5f</code> och <code>23.5f</code>)."],["h","Deklarera och definiera"],["p","Kompilatorn läser uppifrån och ner. Om <code>main</code> anropar en funktion som definieras längre ner måste funktionen <strong>deklareras</strong> först med en prototyp. <strong>Definitionen</strong> innehåller själva kroppen."],["code","cpp","float toKelvin(float celsius);               // deklaration (prototyp)\n\nint main() {\n    std::cout << toKelvin(20.0f) << \"\\n\";\n}\n\nfloat toKelvin(float celsius) {              // definition\n    return celsius + 273.15f;\n}"],["h","Call by value och stacken"],["p","Som standard får funktionen en <strong>kopia</strong> av argumentet. Ändringar inuti funktionen påverkar inte originalet."],["code","cpp","void increment(int x) { x++; }\n\nint main() {\n    int a = 5;\n    increment(a);\n    std::cout << a;      // 5, bara kopian ökade\n}"],["p","Varje funktion som körs behöver en plats i minnet för sina parametrar och lokala variabler. Den platsen kallas <strong>stack frame</strong> och ligger på <strong>anropsstacken</strong> (call stack). Vid ett anrop läggs en ny frame överst. När funktionen returnerar tas den bort igen, och dess lokala variabler finns inte längre. Stega igenom programmet nedan:"],["widget","stack"],["h","Pekare (C)"],["p","Om funktionen ska ändra originalet skickar du dess <strong>adress</strong>. En pekare är en variabel som innehåller en adress."],["list",["<code>int* p</code> deklarerar en pekare till int.","<code>&amp;x</code> ger adressen till x (adressoperatorn).","<code>*p</code> ger värdet som p pekar på (avreferering, eng. <em>dereferencing</em>)."]],["code","c","void swap(int* a, int* b) {\n    int tmp = *a;     // läs värdet på adressen a\n    *a = *b;\n    *b = tmp;\n}\n\nint x = 1, y = 2;\nswap(&x, &y);         // skicka adresserna\n// nu är x == 2 och y == 1","swap med pekare"],["h","Referenser (C++)"],["p","C++ har ett enklare och säkrare sätt: en <strong>referens</strong> är ett alias för originalet. Ingen <code>*</code> eller <code>&amp;</code> behövs i anropet, och en referens kan aldrig vara null."],["code","cpp","void swap(int& a, int& b) {\n    int tmp = a;\n    a = b;\n    b = tmp;\n}\n\nswap(x, y);           // anropet ser ut som vanligt"],["p","Vill du slippa kopian men inte tillåta ändringar, använd en <strong>konstant referens</strong>. Det är standardvalet för stora objekt som bara ska läsas."],["code","cpp","void printData(const std::vector<int>& data) {\n    for (int v : data) std::cout << v << \" \";\n    // data.push_back(1);   // kompileringsfel: data är const\n}"],["table",["Signatur","Betyder","Använd när"],[["<code>void f(int x)</code>","kopia (pass by value)","datan är liten, som ett heltal"],["<code>void f(int&amp; x)</code>","referens, ingen kopia, kan ändras","funktionen ska ändra originalet"],["<code>void f(const T&amp; x)</code>","konstant referens, ingen kopia, kan inte ändras","stora objekt (vector, string) som bara läses"],["<code>void f(int* p)</code>","pekare, en adress till värdet","i C, eller med dynamiskt minne"]]],["h","Överlagring (overloading)"],["p","I C++ kan flera funktioner ha samma namn så länge parametrarna skiljer sig. Kompilatorn väljer version utifrån argumentens typer."],["code","cpp","void printSensor(int v)    { std::cout << \"int: \"    << v << \"\\n\"; }\nvoid printSensor(float v)  { std::cout << \"float: \"  << v << \"\\n\"; }\nvoid printSensor(double v) { std::cout << \"double: \" << v << \"\\n\"; }\n\nprintSensor(3);       // int-versionen\nprintSensor(3.0f);    // float-versionen\nprintSensor(3.0);     // double-versionen"],["h","Övningar"],["ex","Grundläggande funktioner","<ol><li><code>int square(int x)</code> som returnerar kvadraten</li><li><code>float average(float a, float b, float c)</code></li><li><code>float maxOfThree(float a, float b, float c)</code></li><li><code>bool isEven(int n)</code></li><li><code>int sumRange(int start, int end)</code>, där <code>sumRange(1, 4)</code> ger 10</li><li><code>float toKelvin(float celsius)</code></li></ol>","int sumRange(int start, int end) {\n    int sum = 0;\n    for (int i = start; i <= end; i++) sum += i;\n    return sum;\n}","cpp"],["ex","Value, referens och pekare","<ol><li>Skriv <code>void increment(int x)</code> och <code>void incrementRef(int&amp; x)</code>. Anropa båda i <code>main</code> och se vilken som ändrar värdet.</li><li>C-version: <code>void incrementPtr(int* x)</code>.</li><li>Skriv <code>void setLedState(bool* led, bool state)</code> och <code>void getTempRange(float* min, float* max)</code>.</li><li>Skriv om <code>swap</code> med referenser.</li></ol>"],["ex","Statistik för tre mätvärden","<p>Fråga användaren efter tre värden. Skriv <code>getAverage</code>, <code>getMax</code> och <code>printStats</code> och skriv ut Min, Max och Medel.</p>"],["ex","Utmaning: mini-sensormodul","<ul><li><code>float readSensor()</code> returnerar ett slumpvärde 0–100.</li><li><code>void printSensorData(const float&amp; value)</code> skriver ut värdet med enhet.</li><li><code>void analyzeSensor(float&amp; value)</code> justerar värdet om det är över 80.</li><li>Simulera flera avläsningar i en loop.</li></ul>","#include <cstdlib>\n#include <ctime>\n\nfloat readSensor() {\n    return static_cast<float>(std::rand() % 1001) / 10.0f;   // 0.0–100.0\n}\n\nvoid analyzeSensor(float& value) {\n    if (value > 80.0f) value = 80.0f;   // begränsa till max\n}\n\nint main() {\n    std::srand(static_cast<unsigned>(std::time(nullptr)));\n    for (int i = 0; i < 5; i++) {\n        float v = readSensor();\n        analyzeSensor(v);\n        printSensorData(v);\n    }\n}","cpp"]],"pool":[{"t":"mc","q":"<code>void increment(int x) { x++; }</code> anropas med <code>a</code> som är 5. Vad är <code>a</code> efteråt?","o":["6","5","0","Odefinierat"],"a":1,"why":"Pass by value: funktionen fick en kopia. För att ändra <code>a</code> behövs <code>int&amp; x</code> (C++) eller <code>int* x</code> (C)."},{"t":"mc","q":"Vad är skillnaden mellan parameter och argument?","o":["Det är samma sak","Parametern står i funktionens definition, argumentet är värdet du skickar vid anropet","Argument finns bara i C++","Parametrar är alltid pekare"],"a":1,"why":"I <code>float average(float a, float b)</code> är a och b parametrar. I <code>average(1.0f, 3.0f)</code> är 1.0f och 3.0f argument."},{"t":"mc","q":"Vad händer med en funktions stack frame när funktionen returnerar?","o":["Den sparas tills programmet avslutas","Den flyttas till heapen","Den tas bort, och de lokala variablerna slutar finnas","Den skrivs till en fil"],"a":2,"why":"Stacken krymper automatiskt. Därför får du aldrig returnera en pekare eller referens till en lokal variabel."},{"t":"mc","q":"Hur anropar du <code>void swap(int* a, int* b)</code> med variablerna x och y?","o":["<code>swap(x, y)</code>","<code>swap(*x, *y)</code>","<code>swap(&amp;x, &amp;y)</code>","<code>swap(int* x, int* y)</code>"],"a":2,"why":"Funktionen vill ha adresser. <code>&amp;x</code> ger adressen till x."},{"t":"mc","q":"När passar parametern <code>const std::vector&lt;float&gt;&amp; data</code>?","o":["När funktionen ska lägga till element","När funktionen bara ska läsa en stor lista utan att kopiera den","När listan är tom","Bara i C"],"a":1,"why":"<code>&amp;</code> undviker kopian och <code>const</code> förhindrar ändringar. Det är både effektivt och säkert."},{"t":"mc","q":"Vad är returtypen för en funktion som inte returnerar något?","o":["<code>null</code>","<code>void</code>","<code>int</code>","<code>empty</code>"],"a":1,"why":"<code>void</code> betyder att funktionen inte lämnar tillbaka något värde."},{"t":"mc","q":"<code>void f(int&amp; x) { x = 10; }</code> anropas med <code>a</code> som är 3. Vad är a efteråt?","o":["3","10","13","Kompileringsfel"],"a":1,"why":"x är en referens till a, så tilldelningen ändrar originalet."},{"t":"multi","q":"Vilka påståenden om överlagring i C++ stämmer? Välj alla.","o":["Funktionerna har samma namn","Parameterlistorna måste skilja sig","Det räcker att returtypen skiljer sig","Finns även i C"],"a":[0,1],"why":"Kompilatorn väljer version utifrån argumenten. Returtypen ensam räcker inte, och C saknar överlagring."},{"t":"text","q":"Vad kallas minnesområdet där funktioners parametrar och lokala variabler hamnar? Ett ord.","accept":["stacken","stack","anropsstacken","callstack","call stack","stackminnet"],"ph":"ett ord","why":"Stacken (anropsstacken). Varje anrop får en egen stack frame."},{"t":"text","q":"Skriv prototypen (deklarationen) för en funktion <code>toKelvin</code> som tar en <code>float celsius</code> och returnerar <code>float</code>.","accept":["float toKelvin(float celsius);","float toKelvin(float);","float toKelvin(float c);"],"ph":"float ...","why":"<code>float toKelvin(float celsius);</code> En prototyp slutar med semikolon istället för en kropp."},{"t":"code","q":"Skriv funktionen <code>int square(int x)</code> som returnerar kvadraten. main är färdig.","why":"Funktionen returnerar värdet istället för att skriva ut det. main bestämmer vad som händer med det.","task":"04-funktioner-1","tests":[{"in":"5\n","out":"25\n"},{"in":"-4\n","out":"16\n"},{"in":"0\n","out":"0\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint square(int x) {\n    /* returnera x i kvadrat */\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    printf(\"%d\\n\", square(n));\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint square(int x) {\n    return x * x;\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    printf(\"%d\\n\", square(n));\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint square(int x) {\n    // returnera x i kvadrat\n}\n\nint main() {\n    int n;\n    cin >> n;\n    cout << square(n) << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint square(int x) {\n    return x * x;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    cout << square(n) << endl;\n    return 0;\n}\n"},"py":{"starter":"def square(x):\n    # returnera x i kvadrat\n    pass\n\n\nn = int(input())\nprint(square(n))\n","sol":"def square(x):\n    return x * x\n\n\nn = int(input())\nprint(square(n))\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Skriv <code>bool isPrime(int n)</code>. main skriver ut <code>primtal</code> eller <code>inte primtal</code>.","why":"91 = 7 · 13. Det räcker att testa delare upp till roten ur n.","task":"04-funktioner-2","tests":[{"in":"97\n","out":"primtal\n"},{"in":"1\n","out":"inte primtal\n"},{"in":"91\n","out":"inte primtal\n"},{"in":"2\n","out":"primtal\n"}],"code":{"c":{"starter":"#include <stdio.h>\n#include <stdbool.h>\n\nbool isPrime(int n) {\n\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    if (isPrime(n)) printf(\"primtal\\n\");\n    else printf(\"inte primtal\\n\");\n    return 0;\n}\n","sol":"#include <stdio.h>\n#include <stdbool.h>\n\nbool isPrime(int n) {\n    if (n < 2) return false;\n    for (int d = 2; d * d <= n; d++) {\n        if (n % d == 0) return false;\n    }\n    return true;\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    if (isPrime(n)) printf(\"primtal\\n\");\n    else printf(\"inte primtal\\n\");\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nbool isPrime(int n) {\n\n}\n\nint main() {\n    int n;\n    cin >> n;\n    if (isPrime(n)) cout << \"primtal\" << endl;\n    else cout << \"inte primtal\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nbool isPrime(int n) {\n    if (n < 2) return false;\n    for (int d = 2; d * d <= n; d++) {\n        if (n % d == 0) return false;\n    }\n    return true;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    if (isPrime(n)) cout << \"primtal\" << endl;\n    else cout << \"inte primtal\" << endl;\n    return 0;\n}\n"},"py":{"starter":"def is_prime(n):\n    pass\n\n\nn = int(input())\nprint(\"primtal\" if is_prime(n) else \"inte primtal\")\n","sol":"def is_prime(n):\n    if n < 2:\n        return False\n    d = 2\n    while d * d <= n:\n        if n % d == 0:\n            return False\n        d += 1\n    return True\n\n\nn = int(input())\nprint(\"primtal\" if is_prime(n) else \"inte primtal\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Skriv <code>void swap(int* a, int* b)</code> som byter plats på två värden via pekare.","why":"<code>*a</code> läser och skriver värdet på adressen. Utan en temporär variabel skulle det ena värdet skrivas över.","task":"04-funktioner-3","tests":[{"in":"1 2\n","out":"2 1\n"},{"in":"-7 30\n","out":"30 -7\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nvoid swap(int* a, int* b) {\n\n}\n\nint main(void) {\n    int x, y;\n    scanf(\"%d %d\", &x, &y);\n    swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nvoid swap(int* a, int* b) {\n    int tmp = *a;\n    *a = *b;\n    *b = tmp;\n}\n\nint main(void) {\n    int x, y;\n    scanf(\"%d %d\", &x, &y);\n    swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nvoid swap(int* a, int* b) {\n\n}\n\nint main() {\n    int x, y;\n    cin >> x >> y;\n    swap(&x, &y);\n    cout << x << \" \" << y << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nvoid swap(int* a, int* b) {\n    int tmp = *a;\n    *a = *b;\n    *b = tmp;\n}\n\nint main() {\n    int x, y;\n    cin >> x >> y;\n    swap(&x, &y);\n    cout << x << \" \" << y << endl;\n    return 0;\n}\n"}},"langs":["c","cpp"],"web":["cpp"],"gpp":false}],"date":"Tis 6/10"},{"id":"arrayer-pekare","cat":"Minne","min":11,"title":"Arrayer, pekare, vector och map","lead":"Se hur arrayer ligger i minnet, räkna med pekare och låt std::vector och std::map göra grovjobbet.","src":["Fredag 10/10 – Arrays, pekare, vektorer och maps"],"goals":["Förklara hur en array ligger i minnet och hur den hänger ihop med pekare","Använda enkel pekararitmetik","Skicka arrayer till funktioner","Använda std::vector, malloc/free, 2D-arrayer och std::map"],"blocks":[["h","Varför arrayer?"],["p","Hur skulle du lagra 10 temperaturvärden utan en array? Med tio variabler: <code>t0</code>, <code>t1</code> … <code>t9</code>. Det går inte att loopa över dem, och varje ny mätpunkt kräver ny kod. En array samlar värdena under ett namn."],["code","c","#include <stdio.h>\n\nint main(void) {\n    int temperatures[5] = {21, 22, 20, 19, 23};\n    for (int i = 0; i < 5; ++i) {\n        printf(\"Temp %d: %d\\n\", i, temperatures[i]);\n    }\n    return 0;\n}"],["list",["<strong>Indexering</strong> börjar på 0.","<strong>Minneslayout:</strong> elementen ligger direkt efter varandra (kontinuerligt).","<strong>Storlek:</strong> <code>sizeof(temperatures)</code> ger antal bytes (20), <code>sizeof(temperatures) / sizeof(temperatures[0])</code> ger antal element (5). I C++17 finns <code>std::size(temperatures)</code>."]],["h","Arrayer och pekare"],["p","I de flesta uttryck omvandlas arrayens namn till en pekare till första elementet: <code>temperatures == &amp;temperatures[0]</code>. Lägger du till 1 till en pekare flyttas den ett helt <em>element</em> framåt, inte en byte. Därför är <code>arr[i]</code> och <code>*(arr + i)</code> samma sak."],["widget","pointer"],["code","cpp","int arr[] = {10, 20, 30};\nint* p = arr;\nstd::cout << *p       << \"\\n\";   // 10\nstd::cout << *(p + 1) << \"\\n\";   // 20\nstd::cout << p[2]     << \"\\n\";   // 30"],["h","Arrayer som parametrar"],["p","När du skickar en array till en funktion skickas bara pekaren till första elementet. Funktionen vet alltså inte hur lång arrayen är, så storleken måste skickas med."],["code","c","int sum(int* arr, int size) {\n    int total = 0;\n    for (int i = 0; i < size; i++) {\n        total += *(arr + i);       // samma som arr[i]\n    }\n    return total;\n}\n\nint data[] = {4, 8, 15, 16, 23};\nint s = sum(data, 5);"],["h","std::vector i C++"],["p","Råa arrayer har ingen automatisk storlekskontroll, och det är lätt att skriva utanför gränsen. <code>std::vector</code> löser mycket av det: storleken är dynamisk, minnet hanteras automatiskt och vektorn vet själv hur många element den har."],["code","cpp","#include <vector>\n\ndouble average(const std::vector<int>& v) {\n    if (v.empty()) return 0.0;\n    double sum = 0;\n    for (int x : v) sum += x;\n    return sum / v.size();\n}\n\nint main() {\n    std::vector<int> temps = {21, 22, 20, 19, 23};\n    temps.push_back(25);                       // lägg till sist\n    std::cout << temps.size() << \"\\n\";         // 6\n    std::cout << average(temps) << \"\\n\";\n    std::cout << temps.at(10);                 // at() kastar exception istället för att läsa skräp\n}"],["h","Dynamiska listor i C"],["p","C har ingen vector. Där allokerar du minne på heapen själv med <code>malloc</code>, ändrar storleken med <code>realloc</code> och lämnar tillbaka det med <code>free</code>. Det här är vardag i inbyggda system och IoT."],["code","c","#include <stdlib.h>\n\nint size = 5;\nint* data = malloc(size * sizeof(int));\nif (data == NULL) { /* slut på minne */ return 1; }\n\nfor (int i = 0; i < size; ++i) data[i] = i * 2;\n\nsize = 10;\nint* tmp = realloc(data, size * sizeof(int));   // spara i tmp först\nif (tmp == NULL) { free(data); return 1; }      // annars tappar du data vid fel\ndata = tmp;\n\nfree(data);       // varje malloc ska ha en free\ndata = NULL;"],["note","warn","Kontrollera alltid att <code>malloc</code> och <code>realloc</code> inte returnerade <code>NULL</code>. Använd inte minnet efter <code>free</code>."],["h","2D-arrayer"],["code","cpp","int grid[2][3] = {{1, 2, 3}, {4, 5, 6}};\nfor (int i = 0; i < 2; ++i)\n    for (int j = 0; j < 3; ++j)\n        std::cout << grid[i][j] << \" \";\n\n// C++: nästlade vektorer\nstd::vector<std::vector<int>> g = {{1, 2, 3}, {4, 5, 6}};\nfor (auto& row : g)\n    for (int val : row)\n        std::cout << val << \" \";"],["h","std::map"],["p","En map lagrar par av <strong>nyckel → värde</strong>, sorterade på nyckeln. Perfekt när du vill slå upp en sensor på namn istället för index."],["code","cpp","#include <map>\n#include <string>\n\nstd::map<std::string, int> readings = {\n    {\"Temp\", 22},\n    {\"Humidity\", 45},\n};\nreadings[\"Pressure\"] = 1013;          // lägg till eller skriv över\n\nfor (auto& [key, value] : readings)   // C++17\n    std::cout << key << \": \" << value << \"\\n\";\n\nif (readings.count(\"CO2\") == 0)\n    std::cout << \"Ingen CO2-sensor\\n\";"],["h","Vänd en array på plats"],["code","c","void reverseArray(int* arr, int size) {\n    for (int i = 0; i < size / 2; ++i) {\n        int tmp = arr[i];\n        arr[i] = arr[size - 1 - i];\n        arr[size - 1 - i] = tmp;\n    }\n}","C"],["code","cpp","void reverseArray(std::vector<int>& arr) {\n    for (size_t i = 0; i < arr.size() / 2; ++i)\n        std::swap(arr[i], arr[arr.size() - 1 - i]);\n}","C++"],["h","Övningar"],["ex","Medeltemperatur","<p>Läs in 5 temperaturer från användaren och beräkna medelvärdet. Använd en for-loop för både inläsning och summering.</p>"],["ex","Index och pekarnotation","<ol><li>Skriv ut arrayens värden med både <code>arr[i]</code> och <code>*(arr + i)</code>.</li><li>Skriv <code>int sum(int* arr, int size)</code> som summerar med pekare.</li></ol>"],["ex","makeArray","<p>Skriv <code>int* makeArray(int size)</code> som returnerar en dynamiskt allokerad array fylld med nollor. Skriv ut innehållet och glöm inte <code>free</code>.</p>","int* makeArray(int size) {\n    int* a = malloc(size * sizeof(int));\n    if (a == NULL) return NULL;\n    for (int i = 0; i < size; i++) a[i] = 0;\n    return a;          // anroparen ansvarar för free(a)\n}\n// Alternativ: calloc(size, sizeof(int)) nollställer åt dig","c"],["ex","map med flera mätvärden","<ol><li>Skapa en <code>map&lt;string, vector&lt;int&gt;&gt;</code> där varje sensor har flera mätvärden.</li><li>Skriv en funktion som skriver ut medelvärdet för varje sensor.</li></ol>","void printAverages(const std::map<std::string, std::vector<int>>& m) {\n    for (const auto& [name, values] : m) {\n        if (values.empty()) continue;\n        double sum = 0;\n        for (int v : values) sum += v;\n        std::cout << name << \": \" << sum / values.size() << \"\\n\";\n    }\n}","cpp"],["ex","reverseArray","<p>Implementera <code>reverseArray</code> i C och C++ och skriv ut arrayen före och efter. Bonus: vänd en <code>vector&lt;string&gt;</code> med sensornamn.</p>"]],"pool":[{"t":"mc","q":"<code>int arr[] = {10, 20, 30}; int* p = arr;</code> Vad är <code>*(p + 2)</code>?","o":["12","20","30","Adressen till arr[2]"],"a":2,"why":"<code>p + 2</code> pekar två element framåt, alltså på <code>arr[2]</code>, och <code>*</code> läser värdet där."},{"t":"mc","q":"Varför har <code>int sum(int* arr, int size)</code> en size-parameter?","o":["För att kompilatorn kräver det","Funktionen får bara en pekare och kan inte veta arrayens längd","För att kunna ändra arrayens storlek","Den behövs bara i C++"],"a":1,"why":"Arrayen omvandlas till en pekare vid anropet. <code>sizeof(arr)</code> inuti funktionen ger pekarens storlek, inte arrayens."},{"t":"mc","q":"Vad gör <code>temps.push_back(25)</code>?","o":["Lägger 25 först i vektorn","Ersätter sista elementet med 25","Lägger till 25 sist, och vektorn växer","Tar bort alla element som är 25"],"a":2,"why":"<code>push_back</code> lägger till ett element i slutet. Vektorn allokerar mer minne själv vid behov."},{"t":"mc","q":"Vad måste följa varje lyckad <code>malloc</code>?","o":["<code>delete</code>","<code>free</code>, när minnet inte behövs längre","<code>realloc</code>","Ingenting, minnet frigörs när funktionen returnerar"],"a":1,"why":"Heapminne frigörs inte automatiskt. <code>malloc</code> hör ihop med <code>free</code>, och <code>new</code> med <code>delete</code>. Annars blir det en minnesläcka."},{"t":"mc","q":"I <code>map&lt;string, int&gt; m; m[\"Temp\"] = 22;</code> – vad är \"Temp\"?","o":["Värdet","Nyckeln","Indexet 0","Mapens namn"],"a":1,"why":"En map lagrar nyckel → värde. \"Temp\" är nyckeln och 22 är värdet."},{"t":"mc","q":"<code>int a[10];</code> på en dator där int är 4 bytes. Vad är <code>sizeof(a)</code>?","o":["4","10","40","8"],"a":2,"why":"sizeof för en array ger hela storleken: 10 · 4 = 40 bytes."},{"t":"mc","q":"Vad är skillnaden mellan <code>v[10]</code> och <code>v.at(10)</code> på en vector med 5 element?","o":["Ingen skillnad","<code>at</code> kontrollerar gränsen och kastar ett undantag, <code>[]</code> gör det inte","<code>[]</code> lägger till element som saknas","<code>at</code> returnerar 0"],"a":1,"why":"<code>v[10]</code> är odefinierat beteende. <code>v.at(10)</code> kastar <code>std::out_of_range</code>."},{"t":"multi","q":"<code>int arr[] = {4, 8, 15}; int* p = arr;</code> Vilka uttryck ger värdet 8? Välj alla.","o":["<code>arr[1]</code>","<code>*(p + 1)</code>","<code>p[1]</code>","<code>*p + 1</code>"],"a":[0,1,2],"why":"<code>*p + 1</code> läser första värdet (4) och lägger till 1, vilket ger 5."},{"t":"text","q":"Vilken C-funktion lämnar tillbaka minne som allokerats med <code>malloc</code>?","accept":["free","free()"],"ph":"funktion","why":"<code>free(ptr);</code> Varje malloc ska ha en free."},{"t":"text","q":"Vilken vector-metod lägger till ett element sist?","accept":["push_back","push_back()",".push_back","emplace_back"],"ph":"metod","why":"<code>push_back</code> (eller <code>emplace_back</code>, som bygger elementet på plats)."},{"t":"code","q":"Skriv <code>int sum(int p":false},{"t":"code","q":"Skriv <code>void reverseArray(int* arr, int size)</code> som vänder arrayen på plats.","why":"Byt första med sista, andra med näst sista, och stanna på mitten. Går du hela vägen vänds arrayen tillbaka igen.","task":"05-arrayer-pekare-2","tests":[{"in":"5\n1 2 3 4 5\n","out":"5 4 3 2 1\n"},{"in":"4\n10 20 30 40\n","out":"40 30 20 10\n"},{"in":"1\n7\n","out":"7\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nvoid reverseArray(int* arr, int size) {\n\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    int a[100];\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n    reverseArray(a, n);\n    for (int i = 0; i < n; i++) {\n        printf(\"%d\", a[i]);\n        if (i < n - 1) printf(\" \");\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nvoid reverseArray(int* arr, int size) {\n    for (int i = 0; i < size / 2; i++) {\n        int tmp = arr[i];\n        arr[i] = arr[size - 1 - i];\n        arr[size - 1 - i] = tmp;\n    }\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    int a[100];\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n    reverseArray(a, n);\n    for (int i = 0; i < n; i++) {\n        printf(\"%d\", a[i]);\n        if (i < n - 1) printf(\" \");\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nvoid reverseArray(int* arr, int size) {\n\n}\n\nint main() {\n    int n;\n    cin >> n;\n    int a[100];\n    for (int i = 0; i < n; i++) cin >> a[i];\n    reverseArray(a, n);\n    for (int i = 0; i < n; i++) {\n        cout << a[i];\n        if (i < n - 1) cout << \" \";\n    }\n    cout << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nvoid reverseArray(int* arr, int size) {\n    for (int i = 0; i < size / 2; i++) {\n        int tmp = arr[i];\n        arr[i] = arr[size - 1 - i];\n        arr[size - 1 - i] = tmp;\n    }\n}\n\nint main() {\n    int n;\n    cin >> n;\n    int a[ ;       // 5 tecken + '\\0'\nchar auto_[] = \"Hello\";     // låt kompilatorn räkna: 6 bytes"],["p","Prova själv. Skriv en text och välj buffertstorlek:"],["widget","cstring"],["h","Storlek eller längd?"],["p","<code>strlen</code> räknar tecknen fram till <code>'\\0'</code>. <code>sizeof</code> mäter hur mycket minne arrayen tar, inklusive nolltecknet och eventuellt oanvänt utrymme."],["code","c","char s[] = \"IoT\";\nprintf(\"strlen: %zu, sizeof: %zu\\n\", strlen(s), sizeof(s));   // strlen: 3, sizeof: 4\n\nchar buf[32] = \"IoT\";\n// strlen(buf) == 3, sizeof(buf) == 32"],["h","Gå igenom en sträng med pekare"],["code","c","int my_strlen(const char* str) {\n    int len = 0;\n    while (*str++) len++;       // stannar när *str är '\\0' (0 = falskt)\n    return len;\n}\n\nvoid printChars(const char* str) {\n    while (*str) {\n        printf(\"%c\\n\", *str);\n        str++;\n    }\n}"],["h","Kopiera säkert"],["p","<code>strcpy</code> kopierar tills källan tar slut, oavsett hur stor målbufferten är. <code>strncpy</code> begränsar antalet tecken men lägger <em>inte</em> alltid till <code>'\\0'</code>, så du måste avsluta själv."],["code","c","void safeCopy(char* dest, const char* src, int size) {\n    strncpy(dest, src, size - 1);\n    dest[size - 1] = '\\0';      // alltid avslutad\n}\n\n// Alternativ som alltid avslutar:\nsnprintf(dest, size, \"%s\", src);"],["h","Läs in text säkert"],["p","<code>gets()</code> vet inte hur stor bufferten är och är borttagen ur språket. Använd <code>fgets</code>, som tar buffertstorleken som argument. <code>fgets</code> sparar radbrytningen om den får plats, så ta bort den efteråt."],["code","c","char buffer[64];\nif (fgets(buffer, sizeof(buffer), stdin) != NULL) {\n    buffer[strcspn(buffer, \"\\n\")] = '\\0';   // ersätt '\\n' med '\\0'\n}"],["h","Jämför strängar"],["p","<code>==</code> jämför två adresser, inte texten. Använd <code>strcmp</code>, som returnerar 0 när strängarna är lika."],["code","c","char pw[16];\nfgets(pw, sizeof(pw), stdin);\npw[strcspn(pw, \"\\n\")] = '\\0';\nif (strcmp(pw, \"secret\") == 0) printf(\"Rätt!\\n\");\nelse                           printf(\"Fel.\\n\");"],["h","Tolka IoT-kommandon"],["p","Kommandon som <code>LED=ON</code> och <code>TEMP=25</code> delas upp i nyckel och värde. <code>strchr</code> hittar <code>=</code>. Genom att skriva <code>'\\0'</code> där blir den första delen en egen sträng."],["code","c","#include <ctype.h>\n#include <string.h>\n\nchar cmd[] = \"TEMP=25\";\nchar* value = strchr(cmd, '=');\nif (value != NULL) {\n    *value = '\\0';                 // cmd blir \"TEMP\"\n    value++;                       // value pekar på \"25\"\n\n    int valid = (*value != '\\0');\n    for (char* p = value; *p; p++)\n        if (!isdigit((unsigned char)*p)) valid = 0;\n\n    printf(\"Nyckel: %s, värde: %s (%s)\\n\", cmd, value, valid ? \"numeriskt\" : \"ogiltigt\");\n}","C"],["p","Samma sak i C++ med <code>std::string</code> blir kortare och utan risk för buffer overflow:"],["code","cpp","std::string cmd;\nstd::getline(std::cin, cmd);\n\nauto pos = cmd.find('=');\nif (pos != std::string::npos) {\n    std::string key = cmd.substr(0, pos);\n    std::string val = cmd.substr(pos + 1);\n    if (key == \"LED\" && val == \"ON\") std::cout << \"Tänder LED.\\n\";\n    if (key == \"TEMP\") {\n        try { int t = std::stoi(val); std::cout << \"Mål: \" << t << \" °C\\n\"; }\n        catch (const std::exception&) { std::cout << \"Ogiltigt tal\\n\"; }\n    }\n}","C++"],["code","cpp","std::string trim(const std::string& s) {\n    size_t start = s.find_first_not_of(\" \\t\");\n    if (start == std::string::npos) return \"\";\n    size_t end = s.find_last_not_of(\" \\t\");\n    return s.substr(start, end - start + 1);\n}","ta bort inledande och avslutande mellanslag"],["h","Sammanfattning"],["list",["Ange alltid buffertgränser: <code>fgets</code>, <code>strncpy</code>, <code>snprintf</code>.","Undvik <code>gets()</code> helt.","Förstå pekarlogiken. Den är grunden för min
