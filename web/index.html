n    void addObserver(Observer* o) { observers_.push_back(o); }\n    void newReading(int v) { for (auto* o : observers_) o->onNotify(v); }\n};\n\n// skriv Alarm och Counter (Counter har en publik int count)\n\n\nint main() {\n    Sensor s;\n    Alarm alarm;\n    Counter counter;\n    s.addObserver(&alarm);\n    s.addObserver(&counter);\n    int v;\n    while (cin >> v) s.newReading(v);\n    cout << counter.count << \" notifieringar\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Observer {\n    virtual ~Observer() = default;\n    virtual void onNotify(int value) = 0;\n};\n\nclass Sensor {\n    vector<Observer*> observers_;\npublic:\n    void addObserver(Observer* o) { observers_.push_back(o); }\n    void newReading(int v) { for (auto* o : observers_) o->onNotify(v); }\n};\n\nstruct Alarm : Observer {\n    void onNotify(int v) override {\n        if (v > 30) cout << \"LARM \" << v << endl;\n    }\n};\n\nstruct Counter : Observer {\n    int count = 0;\n    void onNotify(int) override { count++; }\n};\n\nint main() {\n    Sensor s;\n    Alarm alarm;\n    Counter counter;\n    s.addObserver(&alarm);\n    s.addObserver(&counter);\n    int v;\n    while (cin >> v) s.newReading(v);\n    cout << counter.count << \" notifieringar\" << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Observer:\n    def on_notify(self, value):\n        raise NotImplementedError\n\n\nclass Sensor:\n    def __init__(self):\n        self._observers = []\n\n    def add_observer(self, o):\n        self._observers.append(o)\n\n    def new_reading(self, v):\n        for o in self._observers:\n            o.on_notify(v)\n\n\n# skriv Alarm och Counter (Counter har ett attribut count)\n\n\ns = Sensor()\nalarm = Alarm()\ncounter = Counter()\ns.add_observer(alarm)\ns.add_observer(counter)\nfor v in sys.stdin.read().split():\n    s.new_reading(int(v))\nprint(f\"{counter.count} notifieringar\")\n","sol":"import sys\n\n\nclass Observer:\n    def on_notify(self, value):\n        raise NotImplementedError\n\n\nclass Sensor:\n    def __init__(self):\n        self._observers = []\n\n    def add_observer(self, o):\n        self._observers.append(o)\n\n    def new_reading(self, v):\n        for o in self._observers:\n            o.on_notify(v)\n\n\nclass Alarm(Observer):\n    def on_notify(self, value):\n        if value > 30:\n            print(f\"LARM {value}\")\n\n\nclass Counter(Observer):\n    def __init__(self):\n        self.count = 0\n\n    def on_notify(self, value):\n        self.count += 1\n\n\ns = Sensor()\nalarm = Alarm()\ncounter = Counter()\ns.add_observer(alarm)\ns.add_observer(counter)\nfor v in sys.stdin.read().split():\n    s.new_reading(int(v))\nprint(f\"{counter.count} notifieringar\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 13/11"},{"id":"singleton-adapter","cat":"Designmönster","min":8,"title":"Singleton och Adapter","lead":"En enda, kontrollerad instans, och när det är en dålig idé. Plus Adapter för att koppla ihop gränssnitt som inte passar.","src":["Torsdag 13/11 – Design Patterns intro (avsnitt 5–6)"],"goals":["Skriva en trådsäker Singleton i modern C++","Avgöra när Singleton passar och när det är en antipattern","Känna till alternativ som dependency injection","Använda Adapter för att anpassa ett befintligt gränssnitt"],"blocks":[["h","Vad är Singleton till för?"],["p","Ibland ska det bara finnas <strong>en</strong> instans: en global logger, en spelmotor, en konfigurationshanterare. Singleton ser till att endast ett objekt kan skapas, att det är globalt åtkomligt och att det skapas först när det behövs (lazy initialization)."],["h","Modern, trådsäker Singleton"],["code","cpp","class Logger {\npublic:\n    static Logger& instance() {\n        static Logger inst;        // skapas första gången, trådsäkert sedan C++11\n        return inst;\n    }\n    void log(const std::string& msg) { std::cout << \"[LOG] \" << msg << \"\\n\"; }\n\nprivate:\n    Logger() = default;                          // privat konstruktor\n    Logger(const Logger&) = delete;              // ingen kopiering\n    Logger& operator=(const Logger&) = delete;\n};\n\nLogger::instance().log(\"Programmet startar...\");\n// Logger x;           // FEL: konstruktorn är privat\n// Logger y = Logger::instance();   // FEL: kopiering är borttagen"],["list",["Den lokala <code>static</code>-variabeln skapas vid första anropet. C++11 garanterar att det är trådsäkert.","Privat konstruktor och borttagna kopieringsfunktioner gör instance() till enda vägen till objektet."]],["h","När passar Singleton?"],["table",["Bra","Dåligt"],[["en global logger","nästan allt annat"],["konfiguration som läses en gång","för att slippa skicka parametrar"],["spelmotor, resurshanterare, input","objekt som behöver bytas ut i tester"]]],["p","Singletons blir lätt en gömd global variabel: svåra att byta ut i tester, svåra att mocka, och de döljer beroenden. I stora system anses de ofta vara en <strong>antipattern</strong> om de används utan försiktighet."],["h","Vanliga misstag"],["list",["För mycket ansvar i en Singleton.","Singleton bara för att slippa skicka parametrar.","Hela programmet byggs runt global delad state.","Singletons som är omöjliga att testa.","Den gamla varianten med en statisk pekare på heapen istället för <code>static</code> lokal variabel."]],["h","Alternativ"],["code","cpp","// Dependency injection: beroendet skickas in och syns i signaturen\nclass Game {\npublic:\n    explicit Game(GameConfig& config) : config_(config) {}\nprivate:\n    GameConfig& config_;\n};\n\n// Tillståndslös hjälpkod behöver ingen klass alls\nnamespace MathUtil {\n    double clamp(double v, double lo, double hi) { return v < lo ? lo : v > hi ? hi : v; }\n}\n\n// Eller: ett Application-objekt i main äger alla system och skickar referenser"],["h","Adapter: få gränssnitt att passa"],["p","Ett bibliotek eller äldre kod kan ha ett annat gränssnitt än ditt system förväntar sig. En <strong>Adapter</strong> implementerar ditt gränssnitt och översätter anropen till det gamla."],["code","cpp","class OldSensorLib {               // kan inte ändras\npublic:\n    double readValue();\n};\n\nclass ISensor {                     // det vårt system använder\npublic:\n    virtual ~ISensor() = default;\n    virtual double read() = 0;\n};\n\nclass OldSensorAdapter : public ISensor {\npublic:\n    explicit OldSensorAdapter(OldSensorLib os) : old(os) {}\n    double read() override { return old.readValue(); }   // översätt\nprivate:\n    OldSensorLib old;\n};"]],"pool":[{"t":"mc","q":"Varför är Singletonens konstruktor privat?","o":["För att göra den snabbare","Så att ingen utanför klassen kan skapa fler instanser","För att kunna ärva","För att den ska vara virtuell"],"a":1,"why":"Enda vägen till objektet blir <code>instance()</code>."},{"t":"mc","q":"Vad gör <code>static Logger inst;</code> inuti <code>instance()</code>?","o":["Skapar en ny logger varje anrop","Skapar loggern vid första anropet och återanvänder den sedan","Skapar loggern innan main startar","Ger kompileringsfel"],"a":1,"why":"Lazy initialization, och C++11 garanterar att den är trådsäker."},{"t":"mc","q":"Vilket är ett bra användningsområde för Singleton?","o":["Varje sensor i systemet","En global konfiguration som bara ska läsas en gång","Alla spelare i ett spel","För att slippa skicka parametrar"],"a":1,"why":"Ett exempel ur materialet: Config::instance().getStartHealth()."},{"t":"mc","q":"Vad är en nackdel med Singleton?","o":["Den tar mycket minne","Den döljer beroenden och är svår att byta ut i tester","Den kan inte ha metoder","Den måste vara abstrakt"],"a":1,"why":"Därför är dependency injection ofta ett bättre val."},{"t":"mc","q":"Vilket problem löser Adapter?","o":["För många instanser","Ett befintligt gränssnitt passar inte det ditt system förväntar sig","Objekt som skapas på fel ställe","Aviseringar till många mottagare"],"a":1,"why":"OldSensorAdapter implementerar ISensor och översätter read() till readValue()."},{"t":"mc","q":"Varför markeras Singletonens kopieringskonstruktor med <code>= delete</code>?","o":["För att spara minne","Så att ingen kan skapa en kopia och därmed en andra instans","För att den ska bli virtuell","Det behövs inte"],"a":1,"why":"<code>Logger y = Logger::instance();</code> blir då ett kompileringsfel."},{"t":"multi","q":"Vilka är alternativ till Singleton enligt materialet? Välj alla.","o":["Dependency injection via konstruktorn","Tillståndslösa hjälpfunktioner i ett namespace","En Application-klass i main som äger systemen","Fler globala variabler"],"a":[0,1,2],"why":"Globala variabler har samma problem som Singleton, utan kontrollen."},{"t":"text","q":"Vad heter den statiska metoden som ger åtkomst till singleton-objektet i materialets exempel?","accept":["instance","instance()","Logger::instance()","Logger::instance"],"ph":"metod","why":"<code>Logger::instance()</code>"},{"t":"text","q":"Vilket mönster översätter ett befintligt gränssnitt till det ditt system förväntar sig? Skriv namnet på engelska.","accept":["adapter","adapter pattern"],"ph":"namn","why":"Adapter."},{"t":"code","q":"Skriv en Singleton <code>Config</code> med privat konstruktor som sätter <code>startHealth</code> till 100, borttagen kopiering, <code>static Config&amp; instance()</code>, samt <code>startHealth()</code> och <code>setStartHealth(int)</code>. main sätter värdet om indata finns och läser det via två anrop till instance().","why":"Båda referenserna pekar på samma objekt. Den lokala <code>static</code>-variabeln skapas en gång.","task":"09-singleton-adapter-1","tests":[{"in":"\n","out":"100 samma\n"},{"in":"250\n","out":"250 samma\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nclass Config {\n    // Singleton här\n\n};\n\nint main() {\n    int v;\n    if (cin >> v) Config::instance().setStartHealth(v);\n    Config& a = Config::instance();\n    Config& b = Config::instance();\n    cout << a.startHealth() << \" \" << (&a == &b ? \"samma\" : \"olika\") << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass Config {\npublic:\n    static Config& instance() {\n        static Config inst;\n        return inst;\n    }\n    int startHealth() const { return startHealth_; }\n    void setStartHealth(int v) { startHealth_ = v; }\n\n    Config(const Config&) = delete;\n    Config& operator=(const Config&) = delete;\nprivate:\n    Config() : startHealth_(100) {}\n    int startHealth_;\n};\n\nint main() {\n    int v;\n    if (cin >> v) Config::instance().setStartHealth(v);\n    Config& a = Config::instance();\n    Config& b = Config::instance();\n    cout << a.startHealth() << \" \" << (&a == &b ? \"samma\" : \"olika\") << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Config:\n    # Singleton: instance() ska alltid ge samma objekt, start_health börjar på 100\n    pass\n\n\ndata = sys.stdin.read().split()\nif data:\n    Config.instance().start_health = int(data[0])\na = Config.instance()\nb = Config.instance()\nprint(a.start_health, \"samma\" if a is b else \"olika\")\n","sol":"import sys\n\n\nclass Config:\n    _instance = None                 # klassvariabel, delas av alla\n\n    def __init__(self):\n        self.start_health = 100\n\n    @classmethod\n    def instance(cls):\n        if cls._instance is None:    # skapas första gången (lazy)\n            cls._instance = cls()\n        return cls._instance\n\n\ndata = sys.stdin.read().split()\nif data:\n    Config.instance().start_health = int(data[0])\na = Config.instance()\nb = Config.instance()\nprint(a.start_health, \"samma\" if a is b else \"olika\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Adapter: <code>OldThermo</code> har <code>int readTenths()</code> (tiondels grader). Skriv <code>ThermoAdapter</code> som implementerar <code>ISensor::read()</code> och returnerar grader som double.","why":"Adaptern översätter både metodnamnet och enheten. <code>/ 10.0</code> ger decimaldivision.","task":"09-singleton-adapter-2","tests":[{"in":"235\n","out":"23.5\n"},{"in":"-50\n","out":"-5\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nclass OldThermo {              // kan inte ändras\n    int tenths_;\npublic:\n    OldThermo(int t) : tenths_(t) {}\n    int readTenths() const { return tenths_; }\n};\n\nclass ISensor {\npublic:\n    virtual ~ISensor() = default;\n    virtual double read() const = 0;\n};\n\n// skriv ThermoAdapter\n\n\nint main() {\n    int t;\n    cin >> t;\n    ThermoAdapter a{OldThermo(t)};\n    const ISensor& s = a;\n    cout << s.read() << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass OldThermo {              // kan inte ändras\n    int tenths_;\npublic:\n    OldThermo(int t) : tenths_(t) {}\n    int readTenths() const { return tenths_; }\n};\n\nclass ISensor {\npublic:\n    virtual ~ISensor() = default;\n    virtual double read() const = 0;\n};\n\nclass ThermoAdapter : public ISensor {\n    OldThermo old_;\npublic:\n    explicit ThermoAdapter(OldThermo old) : old_(old) {}\n    double read() const override { return old_.readTenths() / 10.0; }\n};\n\nint main() {\n    int t;\n    cin >> t;\n    ThermoAdapter a{OldThermo(t)};\n    const ISensor& s = a;\n    cout << s.read() << endl;\n    return 0;\n}\n"},"py":{"starter":"from abc import ABC, abstractmethod\n\n\nclass OldThermo:                     # kan inte ändras\n    def __init__(self, tenths):\n        self._tenths = tenths\n\n    def read_tenths(self):\n        return self._tenths\n\n\nclass ISensor(ABC):\n    @abstractmethod\n    def read(self):\n        ...\n\n\n# skriv ThermoAdapter\n\n\na = ThermoAdapter(OldThermo(int(input())))\nprint(f\"{a.read():g}\")\n","sol":"from abc import ABC, abstractmethod\n\n\nclass OldThermo:                     # kan inte ändras\n    def __init__(self, tenths):\n        self._tenths = tenths\n\n    def read_tenths(self):\n        return self._tenths\n\n\nclass ISensor(ABC):\n    @abstractmethod\n    def read(self):\n        ...\n\n\nclass ThermoAdapter(ISensor):\n    def __init__(self, old):\n        self._old = old\n\n    def read(self):\n        return self._old.read_tenths() / 10\n\n\na = ThermoAdapter(OldThermo(int(input())))\nprint(f\"{a.read():g}\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 13/11"},{"id":"git-samarbete","cat":"Samarbete","min":7,"title":"Samarbete med Git: branches och pull requests","lead":"Feature branches, små commits, pull requests och code review, i ett mini-projekt i par.","src":["Samarbete med git – branches, merging, PRs"],"goals":["Skapa en feature branch per ändring","Göra små commits med meddelanden som förklarar varför","Öppna en pull request och göra code review","Undvika de vanligaste misstagen i ett delat repo"],"blocks":[["h","Arbetsflödet"],["code","bash","# 1. skapa en branch för EN ändring\ngit checkout -b feature/add-heal-spell\n\n# 2. implementera, testa att det kompilerar, gör små commits\ngit add .\ngit commit -m \"Add heal spell so mages can restore HP\"\n\n# 3. pusha branchen\ngit push -u origin feature/add-heal-spell\n\n# 4. öppna en Pull Request på GitHub, tilldela din partner som reviewer\n# 5. efter review och godkännande: merge via GitHub, sedan lokalt:\ngit checkout main\ngit pull"],["p","<strong>Regel:</strong> en feature branch = en ändring eller en deluppgift. Gör inte allt på samma branch."],["h","Pull request och code review"],["p","I PR-beskrivningen skriver du vad du lagt till, varför, och om något är oklart. Granskaren kommenterar specifika rader, ställer frågor och föreslår förbättringar i GitHubs review-verktyg. När allt är åtgärdat godkänner partnern och PR:en mergas."],["h","Vanliga misstag"],["list",["Stora branches med 300 rader ändringar.","För sena commits.","Dåliga commit-meddelanden, som \"fix\".","PR utan beskrivning.","Merge direkt till main utan review.","Båda jobbar på samma branch.","Konflikter som får växa sig stora.","Pusha utan att testa."]],["h","Mini-projekten"],["table",["Projekt","Minimikrav","Förslag på feature branches"],[["A. Mini-RPG Combat","<code>Character</code> med inkapslade stats, <code>Warrior</code> och <code>Mage</code> med polymorfa attacker, turbaserad stridsloop","print-ui, mage-spell, items, crit-chance"],["B. SmartHome","basklass <code>Device</code>, subklasser <code>Lamp</code>, <code>Thermostat</code>, <code>Fan</code>, polymorf <code>update()</code>/<code>status()</code>, <code>vector&lt;unique_ptr&lt;Device&gt;&gt;</code>","fan-mode (enum), schedules, room (komposition), logging (Singleton)"],["C. Marketplace Shop","<code>Item</code>, <code>Customer</code>, <code>VIPCustomer</code> med rabatt, <code>Shop</code> som säljer så länge lagret räcker","discount-code, out-of-stock-log, csv-load, receipt"]]],["note","tip","Bygg grunden tillsammans först: tomma klasser och en main som kompilerar. Sedan tar ni varsin feature branch. Mindre risk för konflikter."]],"pool":[{"t":"mc","q":"Hur många ändringar bör en feature branch innehålla?","o":["Alla ändringar för veckan","En ändring eller deluppgift","Minst 300 rader","Det spelar ingen roll"],"a":1,"why":"Små branches är lätta att granska och ger färre konflikter."},{"t":"mc","q":"Vad bör ett bra commit-meddelande förklara?","o":["Bara vilka filer som ändrats","Vad som ändrats och varför","Vem som skrev koden","Datumet"],"a":1,"why":"\"Add heal spell so mages can restore HP\" säger mer än \"fix\"."},{"t":"mc","q":"Vad gör <code>git push -u origin feature/x</code>?","o":["Raderar branchen","Pushar branchen och kopplar den lokala branchen till den på GitHub","Mergar till main","Skapar en PR automatiskt"],"a":1,"why":"<code>-u</code> sätter upstream så att senare <code>git push</code> och <code>git pull</code> vet vart de ska."},{"t":"mc","q":"Vem bör godkänna en PR innan merge?","o":["Den som skrev koden","En annan person, efter code review","Ingen","GitHub automatiskt"],"a":1,"why":"Merge till main utan review är ett av de vanliga misstagen."},{"t":"mc","q":"Vad gör du efter att PR:en mergats på GitHub?","o":["Inget","<code>git checkout main</code> och <code>git pull</code>","Raderar repot","<code>git push --force</code>"],"a":1,"why":"Då får du in den mergade koden lokalt innan nästa feature branch."},{"t":"mc","q":"Du och din partner jobbar på samma branch och får konflikter hela tiden. Vad är bästa åtgärden?","o":["Pusha med --force","Ta varsin feature branch och merga via PR","Sluta committa","Jobba i main"],"a":1,"why":"Båda på samma branch är ett av de vanliga misstagen."},{"t":"multi","q":"Vad ska en PR-beskrivning innehålla? Välj alla.","o":["Vad som lagts till","Varför","Om något är oklart eller behöver feedback","Hela källkoden igen"],"a":[0,1,2],"why":"Koden syns redan i diffen."},{"t":"text","q":"Skriv kommandot som skapar och byter till branchen <code>feature/items</code>.","accept":["git checkout -b feature/items","git switch -c feature/items"],"ph":"git ...","why":"<code>git checkout -b feature/items</code>"},{"t":"text","q":"Skriv kommandot som pushar <code>feature/items</code> första gången och sätter upstream.","accept":["git push -u origin feature/items","git push --set-upstream origin feature/items"],"ph":"git push ...","why":"<code>git push -u origin feature/items</code>"}],"date":"Labb"}],"timeline":[{"d":"Tis 28/10","t":"Kursstart: klasser och egna typer","topics":["klasser-typer"]},{"d":"Tors 30/10","t":"Inkapsling, komposition och UML","topics":["inkapsling","komposition-uml"]},{"d":"Tis 4/11","t":"Arv och enums","topics":["arv","enums"]},{"d":"Tors 6/11","t":"Polymorfism och casting · Terminal Game-labben","topics":["polymorfism","agande-casting"]},{"d":"Tors 13/11","t":"Designmönster","topics":["designmonster","singleton-adapter"]},{"d":"Labb","t":"Samarbete med Git","topics":["git-samarbete"]}],"assignments":[{"id":"terminalgame","kind":"Labb, grupp om 3","title":"OOP-design i ett terminalspel","intro":"Bygg vidare på ett textbaserat spel med <code>Player</code>, den abstrakta basklassen <code>Effect</code> och effekterna <code>Slow</code> och <code>Burn</code>. Målet är ett interaktivt spel där två spelare turas om att välja handlingar. Ca 3 timmar.","groups":[{"h":"A. Förstå basprogrammet","items":["Kompilera och kör, se hur Slow och Burn appliceras","Hitta var polymorfismen används","Diskutera: vad betyder <code>virtual</code> och <code>override</code> här?","Diskutera: varför <code>unique_ptr</code> i vektorn?","Diskutera: varför har Effect en virtuell destruktor?"]},{"h":"B. Två spelare och turordning","items":["Lägg till <code>Player player2(\"Villain\")</code>","Spel-loop där spelarna turas om: 1. Attack, 2. Effekt","Använd <code>makeEffect(EffectType::Burn)</code> och <code>effect-&gt;apply(player2)</code>","Byt tur med <code>std::swap(player1, player2)</code>"]},{"h":"C. Fler effekter","items":["Ny effektklass som ärver Effect (Heal, Poison, Freeze eller Shield)","Uppdatera <code>enum class EffectType</code>","Uppdatera <code>makeEffect()</code> med ett nytt case","Låt spelaren välja effekttyp vid inmatning"]},{"h":"D. Unik vidareutveckling (välj 1–3)","items":["Nya klasser: <code>Weapon</code>, <code>Item</code> eller <code>Spell</code> med mana","Nya strukturer: <code>struct Stats</code> eller <code>TurnResult</code>","Enums: <code>enum class Action { Attack, Cast, Wait }</code> eller <code>Status { Normal, Frozen, Poisoned }</code>","Design: abstrakt <code>Entity</code> som Player och Enemy ärver, och effekter på vilken Entity som helst"]},{"h":"E. Test och reflektion","items":["Spela några rundor och diskutera de polymorfa anropen","Hur lätt är det att lägga till nya effekter?","Hur skulle ni spara och läsa in spelstatus från fil?","Skriv ner 2–3 saker ni lärt er om arv, enums och OOP-design"]}],"topics":["arv","enums","polymorfism","agande-casting"],"hint":"Strategy-mönstret passar för Weapon, och en fabrik med <code>enum class EffectType</code> håller main-loopen fri från new."},{"id":"gitprojekt","kind":"Parövning","title":"Samarbete med Git: mini-projekt","intro":"Välj projekt A (Mini-RPG Combat), B (SmartHome) eller C (Marketplace Shop) och bygg det i par med feature branches, pull requests och code review.","groups":[{"h":"Grund","items":["En person skapar repot, båda klonar","Bygg tomma klasser och en main som kompilerar","Uppfyll projektets minimikrav"]},{"h":"Per feature","items":["Ny branch: <code>git checkout -b feature/…</code>","Liten, sammanhängande ändring som kompilerar","Små commits med tydliga meddelanden","<code>git push -u origin feature/…</code>","PR med beskrivning, partnern som reviewer","Åtgärda kommentarer, godkänn och merga","<code>git checkout main</code> och <code>git pull</code>"]},{"h":"Avslutande","items":["Branch som lägger till en ny klass i hierarkin, en enum, en polymorf metod eller komposition","Korsvis code review"]}],"topics":["git-samarbete","polymorfism","designmonster"]},{"id":"dag1","kind":"Övningar","title":"Dag 1: klasser och structs i egna filer","intro":"Trygghet i att definiera egna typer och dela upp dem i .h och .cpp. Inget arv än.","groups":[{"h":"Block 1","items":["Position.h/.cpp med move() och print()","Device.h/.cpp med konstruktor, rename() och printInfo()"]},{"h":"Block 2","items":["SensorReading med print()","Sensor med read() och getName()","Logger med log()"]},{"h":"Block 3","items":["AirSensor och AirMonitor med logAll()","Car och ParkingHouse med addCar, removeCar och printStatus"]},{"h":"Block 4 och extra","items":["Diskutera reflektionsfrågorna","Läs in Car eller Sensor från användaren med std::cin","Felhantering: ogiltigt registreringsnummer, orimligt sensorvärde","Enhetstest med <code>assert</code> för Sensor::read() eller removeCar()"]}],"topics":["klasser-typer","komposition-uml"]},{"id":"enumovn","kind":"Övningar","title":"enum och enum class","intro":"Fem övningar från magiska tal till menyer med enum class.","groups":[{"h":"Övningar","items":["Veckodagar med enum och switch","Gör om till enum class och testa today == 2","<code>Direction</code> med <code>toString()</code> och användarval","<code>Machine</code> med <code>MachineState</code> och printStatus()","Meny med <code>MenuOption</code> och en mappningsfunktion"]}],"topics":["enums"]}],"sources":[{"k":"28/10","t":"Tisdag 28/10 – Klasser","d":"Kursstart, typer, struct och class, kursens mål, repetition av konstruktorer, const och this.","topics":["klasser-typer"]},{"k":"Övn","t":"Övningsuppgifter Dag 1 – klasser och structs","d":"Fyra block: Position/Device, Sensor/Logger, AirMonitor och ParkingHouse, reflektion.","topics":["klasser-typer","komposition-uml"]},{"k":"30/10","t":"Torsdag 30/10 – Inkapsling, komposition","d":"Access-nivåer, getters/setters i idiomatisk C++, komposition med Robot och Position.","topics":["inkapsling","komposition-uml"]},{"k":"4/11","t":"Tisdag 4/11 – Arv","d":"Bas- och subklasser, konstruktorordning, protected, arv eller komposition, intro till enum class.","topics":["arv","enums"]},{"k":"Övn","t":"Övningar – enums","d":"enum och enum class, switch och fem övningar.","topics":["enums"]},{"k":"6/11","t":"Torsdag 6/11 – Polymorfism, casting","d":"virtual, override, final, abstrakta klasser, slicing, unique_ptr, fabriker, RTTI och dynamic_cast.","topics":["polymorfism","agande-casting"]},{"k":"Labb","t":"Labb: Terminal Game","d":"Player, Effect, Slow och Burn, vidareutvecklat till ett turbaserat spel.","topics":["polymorfism","enums"]},{"k":"13/11","t":"Torsdag 13/11 – Design Patterns intro","d":"Strategy, Observer, Factory Method, Singleton och Adapter.","topics":["designmonster","singleton-adapter"]},{"k":"Labb","t":"Samarbete med git","d":"Mini-projekt A–C, feature branches, PR och code review.","topics":["git-samarbete"]}],"links":[{"k":"Ref","t":"cppreference: virtual, override, final","u":"https://en.cppreference.com/w/cpp/language/virtual","d":"Exakta regler för virtuella funktioner."},{"k":"Ref","t":"C++ Core Guidelines: klasser och hierarkier","u":"https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#S-class","d":"Riktlinjer för inkapsling, arv och polymorfism."},{"k":"Bok","t":"Refactoring.Guru: designmönster","u":"https://refactoring.guru/design-patterns","d":"Illustrerade förklaringar av Strategy, Observer, Factory, Singleton och Adapter."},{"k":"UML","t":"UML-klassdiagram (översikt)","u":"https://www.uml-diagrams.org/class-diagrams-overview.html","d":"Notation för klasser, relationer och multiplicitet."}]},{"id":"elek","badge":"EL","title":"Digitalteknik och elektronik","short":"Elektronik","tag":"IoT · Hårdvara","desc":"Ström, spänning och komponenter, sensorer och mikrokontroller, IoT-protokoll, talbaser och logiska grindar.","headline":"Från <em>elektron</em> till IoT.","lessons":[{"id":"grunder-el","cat":"Elektronik","min":12,"title":"Grunderna i elektronik","lead":"Ström, spänning och resistans, och komponenterna du kommer att stöta på: resistorer, kondensatorer, spolar, dioder och transistorer.","src":["Lektion 1 – Grunderna i elektronik"],"goals":["Förklara ström, spänning och resistans och deras enheter","Skilja på likström (DC) och växelström (AC)","Känna igen de vanligaste komponenterna och vad de används till","Veta vad en multimeter och ett oscilloskop mäter"],"blocks":[["h","Tre storheter som allt bygger på"],["p","Nästan allt i den här kursen går att förklara med tre storheter. Tänk på en vattenledning: <strong>spänningen</strong> är trycket, <strong>strömmen</strong> är hur mycket vatten som flödar, och <strong>resistansen</strong> är hur trångt röret är."],["table",["Storhet","Symbol","Enhet","Vad det är"],[["Ström","I","ampere (A)","Hur mycket laddning som passerar en punkt per sekund"],["Spänning","U eller V","volt (V)","Skillnaden i elektrisk potential mellan två punkter"],["Resistans","R","ohm (Ω)","Motståndet mot strömmen"]]],["note","tip","Spänning mäts alltid <em>mellan</em> två punkter, till exempel mellan en pinne och jord (GND). Ström mäts <em>genom</em> en ledare. Därför kopplas en voltmeter parallellt och en amperemeter i serie."],["h","Spänningskällor, AC och DC"],["p","Ett batteri ger <strong>likström (DC)</strong>: spänningen har samma riktning hela tiden. Vägguttaget ger <strong>växelström (AC)</strong>: spänningen byter riktning, i Sverige 50 gånger per sekund (50 Hz). Elektronik som mikrokontroller vill nästan alltid ha DC, ofta 3,3 V eller 5 V, så en nätadapter omvandlar AC till DC."],["p","Det finns också <strong>konstantströmkällor</strong>, som håller strömmen fast i stället för spänningen. De används till exempel för att driva LED-lampor jämnt."],["h","En krets"],["p","En <strong>krets</strong> är en sluten slinga där ström kan gå från källans ena pol, genom komponenterna och tillbaka. Bryts slingan någonstans slutar strömmen gå. Komponenter kan sitta i <strong>serie</strong> (efter varandra, samma ström genom alla) eller <strong>parallellt</strong> (bredvid varandra, samma spänning över alla). Hur man räknar på det kommer i nästa lektion."],["h","Passiva komponenter"],["table",["Komponent","Enhet","Gör"],[["Resistor","ohm (Ω)","Begränsar strömmen och delar spänning. Färgringar anger värdet."],["Kondensator","farad (F)","Lagrar laddning en kort stund. Jämnar ut spänning och filtrerar bort störningar."],["Spole (induktor)","henry (H)","Lagrar energi i ett magnetfält och motverkar snabba strömändringar."],["Transformator","–","Två spolar på en kärna. Ändrar storleken på en växelspänning."]]],["h","Halvledare: dioder och transistorer"],["p","En <strong>halvledare</strong> leder ström bättre än en isolator men sämre än en metall, och dess ledningsförmåga går att styra. Det är grunden för dioder och transistorer."],["list",["<strong>Diod:</strong> släpper igenom ström åt ett håll och spärrar åt det andra. En lysdiod (LED) är en diod som lyser.","<strong>Likriktarbrygga (full bridge rectifier):</strong> fyra dioder som gör om AC till pulserande DC. Finns i nästan varje nätadapter.","<strong>Transistor:</strong> en elektroniskt styrd strömbrytare eller förstärkare."]],["table",["","BJT (bipolär)","MOSFET"],[["Styrs av","Ström genom basen","Spänning på gate"],["Ingångsimpedans","Låg","Hög"],["Bra för","Analog förstärkning, enkla switchar","Höga strömmar, switchar, kraftstyrning"],["Ben","Bas, kollektor, emitter","Gate, drain, source"]]],["note","tip","En GPIO-pinne på en mikrokontroller klarar bara några tiotal milliampere. Vill du styra en motor eller en lång LED-slinga låter du pinnen styra en transistor, som i sin tur släpper på den stora strömmen."],["h","Verktyg"],["list",["<strong>Multimeter:</strong> mäter spänning, ström och resistans. Det första verktyget du tar fram.","<strong>Oscilloskop:</strong> ritar hur en spänning ändras över tid. Bra för att se en PWM-signal eller störningar.","<strong>Funktionsgenerator:</strong> skapar exakta vågformer för att testa kretsar.","<strong>Logikanalysator:</strong> spelar in digitala signaler och kan avkoda protokoll som I2C och UART.","<strong>LCR-mätare:</strong> mäter induktans (L), kapacitans (C) och resistans (R)."]],["ex","Mät med multimetern","<p>Koppla ett 9 V-batteri över två resistorer i serie (till exempel 1 kΩ och 2,2 kΩ). Mät spänningen över varje resistor och över båda. Stämmer det att delspänningarna blir summan? Mät sedan strömmen genom att koppla multimetern i serie.</p>"]],"pool":[{"t":"mc","q":"Vilken enhet har spänning?","o":["Ampere","Volt","Ohm","Watt"],"a":1,"why":"Spänning mäts i volt (V), ström i ampere och resistans i ohm."},{"t":"mc","q":"Hur kopplas en multimeter för att mäta ström?","o":["Parallellt med komponenten","I serie med komponenten","Mellan pinne och jord","Det spelar ingen roll"],"a":1,"why":"Strömmen ska gå <em>genom</em> mätaren, alltså i serie."},{"t":"mc","q":"Vad gör en diod?","o":["Lagrar laddning","Släpper igenom ström åt bara ett håll","Ändrar växelspänningens storlek","Mäter ström"],"a":1,"why":"En diod spärrar i backriktningen. Kondensatorn lagrar laddning och transformatorn ändrar AC-spänning."},{"t":"mc","q":"Vad styr strömmen i en MOSFET?","o":["Ström genom basen","Spänningen på gate","Temperaturen","Kollektorns spänning"],"a":1,"why":"MOSFET styrs av spänning på gate och har hög ingångsimpedans. BJT styrs av basström."},{"t":"multi","q":"Vilka är passiva komponenter?","o":["Resistor","Kondensator","Spole","Transistor"],"a":[0,1,2],"why":"Transistorn är en aktiv halvledarkomponent som kan förstärka."},{"t":"mc","q":"Vad är skillnaden mellan AC och DC?","o":["AC har högre spänning","Vid AC byter strömmen riktning, vid DC går den åt samma håll","DC används bara i batterier","Det finns ingen skillnad"],"a":1,"why":"Växelström byter riktning, i Sverige 50 gånger per sekund."},{"t":"text","q":"Vilken enhet har kapacitans?","accept":["farad","F"],"ph":"enhet","why":"Kapacitans mäts i farad (F). Vanliga kondensatorer är ofta i µF eller nF."},{"t":"text","q":"Vilken enhet har induktans?","accept":["henry","H"],"ph":"enhet","why":"Induktans mäts i henry (H)."},{"t":"mc","q":"Vilket verktyg visar hur en signal ändras över tid?","o":["Multimeter","Oscilloskop","LCR-mätare","Lödkolv"],"a":1,"why":"Oscilloskopet ritar spänning som funktion av tid."},{"t":"mc","q":"Vad gör en likriktarbrygga?","o":["Gör om DC till AC","Gör om AC till (pulserande) DC","Höjer spänningen","Mäter frekvens"],"a":1,"why":"Fyra dioder leder strömmen åt samma håll genom lasten, oavsett vilket håll AC-strömmen går."},{"t":"mc","q":"Varför låter man ofta en GPIO-pinne styra en transistor i stället för en motor direkt?","o":["Pinnen kan bara ge lite ström","Motorer kräver AC","Transistorn gör koden snabbare","Pinnen kan inte vara hög"],"a":0,"why":"GPIO-pinnar klarar bara några tiotal mA. Transistorn släpper igenom den stora strömmen."}]},{"id":"ellagar","cat":"Elektronik","min":14,"title":"Ohms lag och kretsberäkningar","lead":"Räkna på kretsar: Ohms lag, serie och parallell, spänningsdelning, Kirchhoffs lagar och effekt.","src":["Lektion 1 – Grunderna i elektronik (El-lag och labbuppgifter)"],"goals":["Använda Ohms lag U = R · I","Räkna ut ersättningsresistans för serie- och parallellkopplingar","Använda spänningsdelning och strömdelning","Förklara Kirchhoffs ström- och spänningslag","Skilja på effekt (W) och energi (Wh)"],"blocks":[["h","Ohms lag"],["p","Ohms lag kopplar ihop de tre storheterna: <strong>U = R · I</strong>. Känner du två av dem kan du räkna ut den tredje."],["table",["Söker","Formel","Exempel"],[["Spänning","U = R · I","220 Ω och 20 mA ger 4,4 V"],["Ström","I = U / R","5 V över 220 Ω ger ca 23 mA"],["Resistans","R = U / I","3,3 V och 10 mA kräver 330 Ω"]]],["note","warn","Räkna alltid i grundenheter: volt, ampere och ohm. 20 mA är 0,020 A och 4,7 kΩ är 4700 Ω. De flesta fel i labben kommer från glömda prefix."],["h","Serie och parallell"],["p","I <strong>serie</strong> går samma ström genom alla resistorer, och resistanserna adderas: <strong>R = R1 + R2 + … + Rn</strong>."],["p","<strong>Parallellt</strong> ligger samma spänning över alla, och strömmen delar upp sig. Då adderas inverserna: <strong>1/R = 1/R1 + 1/R2 + … + 1/Rn</strong>. För exakt två resistorer finns en genväg: <strong>R = R1 · R2 / (R1 + R2)</strong>, ofta skrivet R1 // R2."],["code","text","Serie:      100 + 220 + 330          = 650 Ω\nParallell:  1 / (1/100 + 1/220 + 1/330) ≈ 56,9 Ω\nTvå lika:   1000 // 1000 = 1000·1000 / 2000 = 500 Ω\n","räkneexempel"],["note","tip","Parallellresistansen är alltid mindre än den minsta resistorn. Två lika stora parallellt ger halva värdet. Det är en bra rimlighetskontroll."],["h","Spänningsdelning och strömdelning"],["p","Två resistorer i serie delar på spänningen i proportion till sina resistanser. Spänningen över R2 blir <strong>Uut = Uin · R2 / (R1 + R2)</strong>. Det är så du gör om 5 V till en nivå som en 3,3 V-mikrokontroller tål, och så en potentiometer fungerar."],["p","På samma sätt delar två parallella grenar på strömmen, men omvänt: mest ström går genom den <em>minsta</em> resistansen. Strömmen genom R1 blir <strong>I1 = I · R2 / (R1 + R2)</strong>."],["h","Kirchhoffs lagar"],["list",["<strong>Strömlagen:</strong> summan av strömmarna in i en nod är lika med summan av strömmarna ut. Laddning försvinner inte.","<strong>Spänningslagen:</strong> summan av alla spänningar runt en sluten slinga är noll. Det som källan ger, förbrukas i komponenterna."]],["h","Effekt och energi"],["p","<strong>Effekt</strong> är hur mycket energi som omvandlas per sekund: <strong>P = U · I = I² · R</strong>, i watt (W). <strong>Energi</strong> är effekt gånger tid och mäts ofta i kilowattimmar (kWh). En 10 W-lampa som lyser i 100 timmar använder 1 kWh."],["note","tip","Resistorer har en högsta effekt de tål, ofta 0,25 W. 12 V över 100 Ω ger 1,44 W och en mycket varm resistor."],["h","Labbuppgifter"],["p","I labben räknar du först ut svaret och bygger sedan kretsen för att jämföra med det uppmätta värdet."],["ex","Bestäm Rab","<p>Mellan a och b sitter 4 Ω parallellt med en gren där 1 Ω och 2 Ω sitter i serie. Bestäm Rab.</p><p><strong>Svar:</strong> grenen blir 3 Ω, och 4 // 3 = 12/7 ≈ 1,71 Ω.</p>"],["ex","Serie före parallell","<p>5 Ω i serie med en parallellkoppling av 3 Ω och 6 Ω. Bestäm Rab.</p><p><strong>Svar:</strong> 3 // 6 = 2 Ω, plus 5 Ω blir 7 Ω.</p>"],["ex","Bestäm R","<p>8 Ω sitter i serie med 6 Ω parallellt med en okänd resistor R. Vad måste R vara för att totalen ska bli 10 Ω?</p><p><strong>Svar:</strong> parallelldelen måste bli 2 Ω. 6 · R / (6 + R) = 2 ger R = 3 Ω.</p>"],["ex","Strömdelning","<p>3 A går in i tre parallella resistorer: 1 Ω, 2 Ω och 3 Ω. Hur stor ström går genom 2 Ω-resistorn?</p><p><strong>Svar:</strong> Rtot = 1 / (1 + 1/2 + 1/3) = 6/11 Ω. Spänningen blir 3 · 6/11 ≈ 1,64 V, och I = 1,64 / 2 ≈ 0,82 A.</p>"],["ex","Stegnät","<p>Räkna bakifrån. R1 = 1 Ω sitter direkt mellan ingångsklämmorna. Sedan kommer R2 = 4 Ω i serie, R3 = 6 Ω tvärs över, R4 = 1 Ω i serie och sist R5 = 2 Ω tvärs över. Vad blir Rtot?</p><p><strong>Svar:</strong> R4 + R5 = 3 Ω. 6 // 3 = 2 Ω. Plus R2 blir 6 Ω. Till sist 1 // 6 = 6/7 ≈ 0,86 Ω.</p>"]],"pool":[{"t":"mc","q":"En LED-krets har 5 V över en 220 Ω-resistor. Ungefär hur stor är strömmen?","o":["2,3 mA","23 mA","230 mA","1,1 A"],"a":1,"why":"I = U / R = 5 / 220 ≈ 0,023 A = 23 mA."},{"t":"text","q":"Två resistorer på 100 Ω och 220 Ω sitter i serie. Vad blir den totala resistansen i ohm?","accept":["320","320 ohm","320Ω","320 Ω"],"ph":"ohm","why":"I serie adderas resistanserna: 100 + 220 = 320 Ω."},{"t":"text","q":"Två resistorer på 1000 Ω sitter parallellt. Vad blir den totala resistansen i ohm?","accept":["500","500 ohm","500Ω","500 Ω"],"ph":"ohm","why":"Två lika stora parallellt ger halva värdet: 1000 · 1000 / 2000 = 500 Ω."},{"t":"mc","q":"Vad gäller alltid för parallellresistansen?","o":["Den är större än den största resistorn","Den är mindre än den minsta resistorn","Den är medelvärdet","Den är summan"],"a":1,"why":"Varje ny parallell gren ger strömmen en väg till, så totalen blir mindre än den minsta."},{"t":"mc","q":"En spänningsdelare har Uin = 5 V, R1 = 1 kΩ och R2 = 1 kΩ. Vad blir spänningen över R2?","o":["1,25 V","2,5 V","5 V","10 V"],"a":1,"why":"Uut = 5 · 1000 / 2000 = 2,5 V."},{"t":"mc","q":"Vad säger Kirchhoffs strömlag?","o":["Spänningen runt en slinga är noll","Strömmen in i en nod är lika med strömmen ut","U = R · I","Effekten är konstant"],"a":1,"why":"Laddning försvinner inte, så det som går in i en nod måste gå ut."},{"t":"mc","q":"Vad säger Kirchhoffs spänningslag?","o":["Summan av spänningarna runt en sluten slinga är noll","Strömmen är lika överallt","Parallella grenar har olika spänning","Spänningen är alltid 5 V"],"a":0,"why":"Det källan ger förbrukas i komponenterna runt slingan."},{"t":"mc","q":"Hur stor effekt utvecklas i en 100 Ω-resistor med 12 V över sig?","o":["0,12 W","1,2 W","1,44 W","12 W"],"a":2,"why":"P = U² / R = 144 / 100 = 1,44 W. För mycket för en vanlig 0,25 W-resistor."},{"t":"multi","q":"Vilka formler ger effekt?","o":["P = U · I","P = I² · R","P = U / I","P = U² / R"],"a":[0,1,3],"why":"U / I är resistans, inte effekt."},{"t":"mc","q":"Vad är skillnaden mellan effekt och energi?","o":["Ingen skillnad","Effekt är energi per tidsenhet, energi är effekt gånger tid","Energi mäts i watt","Effekt mäts i kWh"],"a":1,"why":"Effekt i W, energi i Wh eller kWh."},{"t":"mc","q":"Bestäm Rab: 5 Ω i serie med (3 Ω parallellt med 6 Ω).","o":["2 Ω","7 Ω","14 Ω","4,5 Ω"],"a":1,"why":"3 // 6 = 2 Ω, plus 5 Ω blir 7 Ω."},{"t":"mc","q":"I två parallella grenar med 1 Ω och 3 Ω, var går mest ström?","o":["Genom 1 Ω","Genom 3 Ω","Lika mycket","Det går inte att avgöra"],"a":0,"why":"Samma spänning över båda, så minst resistans ger mest ström."},{"t":"code","q":"Läs in antalet resistorer <code>n</code> och sedan <code>n</code> resistanser. Skriv ut ersättningsresistansen i serie och parallellt med två decimaler, i formatet <code>Serie: 650.00 ohm</code> och <code>Parallell: 56.90 ohm</code>.","why":"Serie: summera. Parallellt: summera 1/R och ta inversen av summan.","task":"02-ellagar-1","tests":[{"in":"3\n100 220 330\n","out":"Serie: 650.00 ohm\nParallell: 56.90 ohm\n"},{"in":"2\n1000 1000\n","out":"Serie: 2000.00 ohm\nParallell: 500.00 ohm\n"},{"in":"1\n47\n","out":"Serie: 47.00 ohm\nParallell: 47.00 ohm\n"},{"in":"4\n4 4 4 4\n","out":"Serie: 16.00 ohm\nParallell: 1.00 ohm\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    double serie = 0, parallell = 0;\n    for (int i = 0; i < n; i++) {\n        double r;\n        scanf(\"%lf\", &r);\n        // TODO: räkna ut serie- och parallellresistansen\n    }\n    printf(\"Serie: %.2f ohm\\n\", serie);\n    printf(\"Parallell: %.2f ohm\\n\", parallell);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    double serie = 0, inverssumma = 0;\n    for (int i = 0; i < n; i++) {\n        double r;\n        scanf(\"%lf\", &r);\n        serie += r;             // i serie: R = R1 + R2 + ...\n        inverssumma += 1.0 / r; // parallellt: 1/R = 1/R1 + 1/R2 + ...\n    }\n    printf(\"Serie: %.2f ohm\\n\", serie);\n    printf(\"Parallell: %.2f ohm\\n\", 1.0 / inverssumma);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    double serie = 0, parallell = 0;\n    for (int i = 0; i < n; i++) {\n        double r;\n        cin >> r;\n        // TODO: räkna ut serie- och parallellresistansen\n    }\n    cout << fixed << setprecision(2);\n    cout << \"Serie: \" << serie << \" ohm\" << endl;\n    cout << \"Parallell: \" << parallell << \" ohm\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    double serie = 0, inverssumma = 0;\n    for (int i = 0; i < n; i++) {\n        double r;\n        cin >> r;\n        serie += r;             // i serie: R = R1 + R2 + ...\n        inverssumma += 1.0 / r; // parallellt: 1/R = 1/R1 + 1/R2 + ...\n    }\n    cout << fixed << setprecision(2);\n    cout << \"Serie: \" << serie << \" ohm\" << endl;\n    cout << \"Parallell: \" << 1.0 / inverssumma << \" ohm\" << endl;\n    return 0;\n}\n"},"py":{"starter":"n = int(input())\nresistanser = [float(x) for x in input().split()]\nserie = 0\nparallell = 0\n# TODO: räkna ut serie- och parallellresistansen\nprint(f\"Serie: {serie:.2f} ohm\")\nprint(f\"Parallell: {parallell:.2f} ohm\")\n","sol":"n = int(input())\nresistanser = [float(x) for x in input().split()]\nserie = sum(resistanser)                          # R = R1 + R2 + ...\nparallell = 1 / sum(1 / r for r in resistanser)   # 1/R = 1/R1 + 1/R2 + ...\nprint(f\"Serie: {serie:.2f} ohm\")\nprint(f\"Parallell: {parallell:.2f} ohm\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Läs in <code>Uin R1 R2</code> och skriv ut spänningen över R2 i en spänningsdelare, till exempel <code>Uut = 2.50 V</code>.","why":"Uut = Uin · R2 / (R1 + R2).","task":"02-ellagar-2","tests":[{"in":"5 1000 1000\n","out":"Uut = 2.50 V\n"},{"in":"12 10000 4700\n","out":"Uut = 3.84 V\n"},{"in":"3.3 2200 3300\n","out":"Uut = 1.98 V\n"},{"in":"9 0 1000\n","out":"Uut = 9.00 V\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    double uin, r1, r2;\n    scanf(\"%lf %lf %lf\", &uin, &r1, &r2);\n    double uut = 0; // TODO: spänningen över R2\n    printf(\"Uut = %.2f V\\n\", uut);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    double uin, r1, r2;\n    scanf(\"%lf %lf %lf\", &uin, &r1, &r2);\n    // Samma ström går genom båda, så spänningen delas i proportion till resistansen.\n    double uut = uin * r2 / (r1 + r2);\n    printf(\"Uut = %.2f V\\n\", uut);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    double uin, r1, r2;\n    cin >> uin >> r1 >> r2;\n    double uut = 0; // TODO: spänningen över R2\n    cout << fixed << setprecision(2) << \"Uut = \" << uut << \" V\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    double uin, r1, r2;\n    cin >> uin >> r1 >> r2;\n    // Samma ström går genom båda, så spänningen delas i proportion till resistansen.\n    double uut = uin * r2 / (r1 + r2);\n    cout << fixed << setprecision(2) << \"Uut = \" << uut << \" V\" << endl;\n    return 0;\n}\n"},"py":{"starter":"uin, r1, r2 = (float(x) for x in input().split())\nuut = 0  # TODO: spänningen över R2\nprint(f\"Uut = {uut:.2f} V\")\n","sol":"uin, r1, r2 = (float(x) for x in input().split())\n# Samma ström går genom båda, så spänningen delas i proportion till resistansen.\nuut = uin * r2 / (r1 + r2)\nprint(f\"Uut = {uut:.2f} V\")\n"}},"langs":["c","cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Läs in spänning <code>U</code> och resistans <code>R</code>. Skriv ut strömmen med tre decimaler och effekten med två, som <code>I = 0.023 A</code> och <code>P = 0.11 W</code>.","why":"I = U / R och P = U · I.","task":"02-ellagar-3","tests":[{"in":"5 220\n","out":"I = 0.023 A\nP = 0.11 W\n"},{"in":"12 4\n","out":"I = 3.000 A\nP = 36.00 W\n"},{"in":"230 52.9\n","out":"I = 4.348 A\nP = 1000.00 W\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    double u, r;\n    scanf(\"%lf %lf\", &u, &r);\n    double i = 0, p = 0; // TODO: Ohms lag och effekt\n    printf(\"I = %.3f A\\n\", i);\n    printf(\"P = %.2f W\\n\", p);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    double u, r;\n    scanf(\"%lf %lf\", &u, &r);\n    double i = u / r;   // Ohms lag: U = R * I\n    double p = u * i;   // effekt: P = U * I\n    printf(\"I = %.3f A\\n\", i);\n    printf(\"P = %.2f W\\n\", p);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    double u, r;\n    cin >> u >> r;\n    double i = 0, p = 0; // TODO: Ohms lag och effekt\n    cout << fixed << setprecision(3) << \"I = \" << i << \" A\" << endl;\n    cout << setprecision(2) << \"P = \" << p << \" W\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    double u, r;\n    cin >> u >> r;\n    double i = u / r;   // Ohms lag: U = R * I\n    double p = u * i;   // effekt: P = U * I\n    cout << fixed << setprecision(3) << \"I = \" << i << \" A\" << endl;\n    cout << setprecision(2) << \"P = \" << p << \" W\" << endl;\n    return 0;\n}\n"},"py":{"starter":"u, r = (float(x) for x in input().split())\ni = 0  # TODO: Ohms lag\np = 0  # TODO: effekt\nprint(f\"I = {i:.3f} A\")\nprint(f\"P = {p:.2f} W\")\n","sol":"u, r = (float(x) for x in input().split())\ni = u / r   # Ohms lag: U = R * I\np = u * i   # effekt: P = U * I\nprint(f\"I = {i:.3f} A\")\nprint(f\"P = {p:.2f} W\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false}]},{"id":"inbyggda-signaler","cat":"Inbyggda system","min":11,"title":"Inbyggda system och signaler","lead":"Vad ett inbyggt system är och varför de finns överallt, och hur analoga och digitala signaler möts via ADC, DAC och PWM.","src":["Lektion 2 – Intro inbyggda system, sensorer och signaler"],"goals":["Förklara vad som skiljer ett inbyggt system från en vanlig dator","Beskriva lagren hårdvara, drivrutiner, OS, middleware och applikation","Skilja på analoga och digitala signaler","Förklara vad ADC, DAC och PWM gör och räkna med dem"],"blocks":[["h","Vad är ett inbyggt system?"],["p","Ett <strong>inbyggt system</strong> är en dator med en bestämd uppgift inuti en större produkt: en termostat, en bils motorstyrning (ECU), en pacemaker eller ett industriellt styrsystem. Hårdvaran och mjukvaran är gjorda för just den uppgiften."],["list",["Specialbyggt för en tillämpning","Resursbegränsat: lite minne, långsam processor, liten energibudget","Ofta krav på realtid: svaret måste komma inom en viss tid","Höga krav på tillförlitlighet, ofta i 10–20 år"]],["table",["Aspekt","Inbyggt system","Vanlig dator"],[["Syfte","En dedikerad funktion","Många tillämpningar"],["Resurser","KB–MB RAM","GB RAM"],["Gränssnitt","Minimalt eller inget","Grafiskt"],["Strömförbrukning","Extremt låg","Inte huvudfokus"],["Kostnad","Optimerad för låg kostnad","Optimerad för prestanda"],["Livslängd","10–20 år","3–5 år"]]],["p","Varför bygga så? För att det blir <strong>billigt, litet, energisnålt, snabbt i realtid, robust och säkert</strong>. Ett system som bara gör en sak har färre sätt att gå sönder."],["h","Arkitekturen i lager"],["p","Ett inbyggt system byggs i lager, där varje lager bara pratar med lagret närmast:"],["list",["<strong>Hårdvara:</strong> SoC (System on Chip), minnen och kringutrustning. Den fysiska grunden.","<strong>Drivrutiner:</strong> kod som kan prata med en viss hårdvara, till exempel en sensor eller UART.","<strong>Operativsystem:</strong> hanterar resurser och låter flera uppgifter köra (ofta ett RTOS som FreeRTOS, eller inget OS alls).","<strong>Middleware:</strong> återanvändbara tjänster, som en nätverksstack eller ett filsystem.","<strong>Applikation:</strong> det som gör produktens jobb."]],["h","Analoga och digitala signaler"],["p","En <strong>analog signal</strong> kan ha vilket värde som helst inom ett intervall, till exempel spänningen från en ljussensor som glider mellan 0 och 3,3 V. En <strong>digital signal</strong> har bara två lägen: låg (0) och hög (1)."],["p","Vi behöver båda: sensorer ger ofta analoga signaler, men mikrokontrollern räknar digitalt. Därför finns omvandlare."],["h","ADC, DAC och PWM"],["table",["Omvandlare","Från → till","Exempel"],[["ADC (Analog-to-Digital)","Spänning → tal","Temperatursensorns spänning blir ett värde 0–4095"],["DAC (Digital-to-Analog)","Tal → spänning","512 av 1024 blir ca 1,65 V vid 3,3 V referens"],["PWM (Pulse Width Modulation)","Digital puls som låtsas vara analog","Dimma en LED, styra motorhastighet eller ett servo"]]],["p","En ADC med <strong>n bitar</strong> delar referensspänningen i 2ⁿ steg. En 10-bitars ADC har 1024 steg, en 12-bitars 4096. Spänningen räknas ut som <strong>U = värde · Vref / 2ⁿ</strong>."],["code","text","10 bitar, Vref = 3,3 V:   värde 512  ->  512 · 3,3 / 1024 = 1,65 V\n12 bitar, Vref = 3,3 V:   värde 2048 -> 2048 · 3,3 / 4096 = 1,65 V\n","ADC-räkning"],["p","<strong>PWM</strong> slår av och på en pinne mycket snabbt. Andelen av tiden den är hög kallas <strong>duty cycle</strong>. 50 % duty ger i medel halva spänningen, så en LED lyser ungefär halvt. På Arduino tar <code>analogWrite()</code> ett värde 0–255, där 255 är 100 %."],["code","cpp","const int LED = 9;\nconst int SENSOR = A0;\n\nvoid setup() {\n    pinMode(LED, OUTPUT);\n    Serial.begin(115200);\n}\n\nvoid loop() {\n    int raw = analogRead(SENSOR);          // 0-1023 på en 10-bitars ADC\n    int brightness = map(raw, 0, 1023, 0, 255);\n    analogWrite(LED, brightness);          // PWM: starkare ljus när sensorn ger mer\n    Serial.println(raw);\n    delay(50);\n}\n","Arduino: sensorvärde styr LED-styrka"],["ex","Wokwi: sensor styr LED","<p>Öppna exemplen <em>LED PWM Control</em> och <em>SENSOR ADC</em> på wokwi.com. Kombinera dem så att LED:ens styrka beror på sensorvärdet, som i koden ovan.</p>"]],"pool":[{"t":"mc","q":"Vad kännetecknar ett inbyggt system?","o":["Det kör många olika program","Det har en dedikerad funktion i en större produkt","Det har alltid en skärm","Det kräver mycket RAM"],"a":1,"why":"En termostat eller en bil-ECU gör en sak och gör den bra."},{"t":"multi","q":"Vilka är typiska egenskaper hos inbyggda system?","o":["Begränsat minne","Krav på realtid","Lång livslängd","Stort grafiskt gränssnitt"],"a":[0,1,2],"why":"Grafiska gränssnitt hör till allmänna datorer."},{"t":"mc","q":"Vilket lager innehåller kod som pratar direkt med en viss sensor?","o":["Applikation","Middleware","Drivrutin","Användargränssnitt"],"a":2,"why":"Drivrutinen kapslar in hur hårdvaran fungerar."},{"t":"mc","q":"Vad är en digital signal?","o":["En signal med vilket värde som helst","En signal med bara två lägen, låg och hög","En signal från en mikrofon","En växelspänning"],"a":1,"why":"Digitala signaler är diskreta: 0 eller 1."},{"t":"mc","q":"Vad gör en ADC?","o":["Gör om ett tal till en spänning","Gör om en spänning till ett tal","Förstärker en signal","Skapar en PWM-signal"],"a":1,"why":"Analog-to-Digital Converter."},{"t":"text","q":"Hur många steg har en 10-bitars ADC?","accept":["1024"],"ph":"antal","why":"2¹⁰ = 1024 steg, värden 0–1023."},{"t":"mc","q":"En 10-bitars ADC med Vref 3,3 V ger värdet 512. Vilken spänning motsvarar det ungefär?","o":["0,5 V","1,65 V","3,3 V","5 V"],"a":1,"why":"512 · 3,3 / 1024 = 1,65 V, alltså halva referensen."},{"t":"mc","q":"Vad betyder 25 % duty cycle i PWM?","o":["Signalen är hög en fjärdedel av tiden","Spänningen är 25 V","Frekvensen är 25 Hz","Signalen är låg en fjärdedel av tiden"],"a":0,"why":"Duty cycle är andelen av perioden som signalen är hög."},{"t":"multi","q":"Vad används PWM till?","o":["Dimma en LED","Styra motorhastighet","Ställa in ett servos vinkel","Mäta temperatur"],"a":[0,1,2],"why":"Att mäta temperatur görs med en ADC eller ett digitalt protokoll."},{"t":"mc","q":"Vilket värde ger ungefär 50 % till analogWrite() på Arduino?","o":["50","128","255","512"],"a":1,"why":"analogWrite tar 0–255, så hälften är ca 128."},{"t":"code","q":"Läs in ett ADC-värde, antal bitar och referensspänningen, till exempel <code>512 10 3.3</code>. Skriv ut spänningen med två decimaler, som <code>1.65 V</code>. Det högsta värdet (2ⁿ − 1) ska räknas som full referensspänning.","why":"U = värde · Vref / 2ⁿ. Med specialfallet blir 4095 på 12 bitar exakt 3,30 V.","task":"03-inbyggda-signaler-1","tests":[{"in":"512 10 3.3\n","out":"1.65 V\n"},{"in":"4095 12 3.3\n","out":"3.30 V\n"},{"in":"0 10 5\n","out":"0.00 V\n"},{"in":"2048 12 3.3\n","out":"1.65 V\n"},{"in":"300 10 5\n","out":"1.46 V\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int raw, bits;\n    double vref;\n    scanf(\"%d %d %lf\", &raw, &bits, &vref);\n    double volt = 0; // TODO: räkna om ADC-värdet till spänning\n    printf(\"%.2f V\\n\", volt);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int raw, bits;\n    double vref;\n    scanf(\"%d %d %lf\", &raw, &bits, &vref);\n    int steg = 1 << bits;   // 10 bitar ger 2^10 = 1024 steg\n    double volt = raw * vref / steg;\n    // Det högsta värdet (steg - 1) räknas som full referensspänning.\n    if (raw == steg - 1) volt = vref;\n    printf(\"%.2f V\\n\", volt);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    int raw, bits;\n    double vref;\n    cin >> raw >> bits >> vref;\n    double volt = 0; // TODO: räkna om ADC-värdet till spänning\n    cout << fixed << setprecision(2) << volt << \" V\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    int raw, bits;\n    double vref;\n    cin >> raw >> bits >> vref;\n    int steg = 1 << bits;   // 10 bitar ger 2^10 = 1024 steg\n    double volt = raw * vref / steg;\n    // Det högsta värdet (steg - 1) räknas som full referensspänning.\n    if (raw == steg - 1) volt = vref;\n    cout << fixed << setprecision(2) << volt << \" V\" << endl;\n    return 0;\n}\n"},"py":{"starter":"raw, bits, vref = input().split()\nraw, bits, vref = int(raw), int(bits), float(vref)\nvolt = 0  # TODO: räkna om ADC-värdet till spänning\nprint(f\"{volt:.2f} V\")\n","sol":"raw, bits, vref = input().split()\nraw, bits, vref = int(raw), int(bits), float(vref)\nsteg = 2 ** bits   # 10 bitar ger 1024 steg\nvolt = raw * vref / steg\n# Det högsta värdet (steg - 1) räknas som full referensspänning.\nif raw == steg - 1:\n    volt = vref\nprint(f\"{volt:.2f} V\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Läs in en duty cycle i procent (0–100) och skriv ut värdet till <code>analogWrite()</code> (0–255), avrundat till närmaste heltal, som <code>analogWrite: 128</code>.","why":"(procent · 255 + 50) / 100 i heltalsaritmetik avrundar rätt.","task":"03-inbyggda-signaler-2","tests":[{"in":"50\n","out":"analogWrite: 128\n"},{"in":"0\n","out":"analogWrite: 0\n"},{"in":"100\n","out":"analogWrite: 255\n"},{"in":"25\n","out":"analogWrite: 64\n"},{"in":"10\n","out":"analogWrite: 26\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint main(void) {\n    int procent;\n    scanf(\"%d\", &procent);\n    int varde = 0; // TODO: 0-100 % till 0-255, avrundat\n    printf(\"analogWrite: %d\\n\", varde);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint main(void) {\n    int procent;\n    scanf(\"%d\", &procent);\n    // 8 bitars PWM: 0 = alltid av, 255 = alltid på. +50 gör att heltalsdivisionen avrundar.\n    int varde = (procent * 255 + 50) / 100;\n    printf(\"analogWrite: %d\\n\", varde);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int procent;\n    cin >> procent;\n    int varde = 0; // TODO: 0-100 % till 0-255, avrundat\n    cout << \"analogWrite: \" << varde << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint main() {\n    int procent;\n    cin >> procent;\n    // 8 bitars PWM: 0 = alltid av, 255 = alltid på. +50 gör att heltalsdivisionen avrundar.\n    int varde = (procent * 255 + 50) / 100;\n    cout << \"analogWrite: \" << varde << endl;\n    return 0;\n}\n"},"py":{"starter":"procent = int(input())\nvarde = 0  # TODO: 0-100 % till 0-255, avrundat\nprint(f\"analogWrite: {varde}\")\n","sol":"procent = int(input())\n# 8 bitars PWM: 0 = alltid av, 255 = alltid på. +50 gör att heltalsdivisionen avrundar.\nvarde = (procent * 255 + 50) // 100\nprint(f\"analogWrite: {varde}\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false}]},{"id":"sensorer-aktuatorer","cat":"Inbyggda system","min":11,"title":"Sensorer och aktuatorer","lead":"Sensorerna som mäter världen och aktuatorerna som påverkar den, hur de läses av och hur du provar allt i en simulator.","src":["Lektion 2 – Intro inbyggda system, sensorer och signaler"],"goals":["Ge exempel på sensorer och om de ger analog eller digital utsignal","Beskriva de vanligaste motortyperna och när de används","Förklara vad ett relä och en breadboard är","Använda en simulator som Wokwi för att testa en krets"],"blocks":[["h","Hur en sensor läses av"],["list",["<strong>Digital läsning:</strong> pinnen är hög eller låg. En knapp eller en PIR-rörelsesensor.","<strong>Analog läsning:</strong> en ADC mäter spänningen. En LDR (ljussensor) i en spänningsdelare.","<strong>Digitalt protokoll:</strong> sensorn skickar färdiga mätvärden via I2C, SPI eller UART."]],["h","Vanliga sensorer"],["table",["Sensor","Mäter","Signal","Används i"],[["Temperatur (DS18B20, DHT22)","Temperatur, ibland luftfuktighet","Digital via protokoll, eller analog","Klimatövervakning, smarta hem"],["Halleffektsensor","Magnetfält","Digital eller analog","Dörrsensorer, varvtal, motorposition"],["LDR","Ljus (resistansen ändras)","Analog","Automatisk belysning"],["Fotodiod","Ljus (ger ström)","Analog","IR-mottagare, optisk kommunikation"],["Gyroskop","Rotationshastighet","Digital via protokoll","Drönare, spelkontroller"],["Accelerometer","Acceleration i flera axlar","Digital via protokoll","Stegräknare, falldetektering"],["Kapacitiv sensor / touch","Närhet eller beröring","Digital (ibland analog)","Touchknappar, nivåmätning"],["Trycksensor","Luft- eller vätsketryck","Ofta digital","Väderstationer, höjdmätare"],["Ultraljudssensor","Avstånd via ljudets eko","Digital puls","Parkeringssensorer, robotar"],["PIR","Rörelse via infraröd strålning","Digital","Larm, belysning som tänds"],["Mikrofon","Ljud","Analog","Ljudnivå, röststyrning"]]],["note","tip","En ultraljudssensor som HC-SR04 mäter tiden tills ekot kommer tillbaka. Avståndet blir tid · ljudets hastighet / 2, eftersom ljudet går fram och tillbaka."],["h","Aktuatorer"],["p","En <strong>aktuator</strong> gör något i den fysiska världen: rör sig, lyser, låter eller slår på något."],["table",["Aktuator","Styrs med","Fördel","Nackdel","Används i"],[["Borstad DC-motor","PWM","Enkel och billig","Borstarna slits","Fläktar, små robotar, pumpar"],["Borstlös motor","PWM + styrkrets","Lång livslängd, effektiv","Kräver styrelektronik","Drönare, elcyklar"],["Stegmotor","Digitala pulser","Exakt positionering","Kan tappa steg","3D-skrivare, CNC"],["Servo","PWM (vinkel)","Exakt vinkel","Begränsad rotation","Robotarmar, RC-bilar"],["Relä","Digital av/på","Låg spänning styr hög","Mekaniskt, långsamt","Lampor, pumpar"]]],["note","warn","Koppla aldrig en motor direkt till en GPIO-pinne. Använd en drivkrets (transistor eller motordrivare) och en diod över motorn som tar hand om spänningsspiken när den stängs av."],["h","Breadboard"],["p","En <strong>kopplingsplatta (breadboard)</strong> låter dig bygga kretsar utan att löda. Hålen i varje kort rad på mitten är ihopkopplade, och de långa skenorna längs kanterna används för plus och jord."],["h","Simulatorer"],["p","En simulator låter dig testa en krets och kod innan du har hårdvaran, utan risk att bränna något. <strong>LTspice</strong> simulerar analoga kretsar, <strong>Fritzing</strong> ritar kopplingar och <strong>Wokwi</strong> simulerar mikrokontroller som Arduino och ESP32 direkt i webbläsaren."],["ex","Wokwi: Serial Hello world","<p>Öppna ett Arduino-projekt på wokwi.com och skriv ut text med <code>Serial.println()</code> en gång per sekund. Lägg sedan till en knapp och skriv ut när den trycks.</p>","const int BUTTON = 2;\n\nvoid setup() {\n    Serial.begin(115200);\n    pinMode(BUTTON, INPUT_PULLUP);   // knappen mellan pinne och GND\n}\n\nvoid loop() {\n    if (digitalRead(BUTTON) == LOW) {   // intryckt = LOW med pull-up\n        Serial.println(\"Knappen trycktes\");\n        delay(200);                     // enkel avstudsning\n    }\n}\n","cpp"]],"pool":[{"t":"mc","q":"Vilken typ av signal ger en LDR?","o":["Digital","Analog","I2C","PWM"],"a":1,"why":"Resistansen ändras med ljuset och läses som spänning via en ADC."},{"t":"mc","q":"Vad mäter ett gyroskop?","o":["Acceleration","Rotationshastighet","Tryck","Avstånd"],"a":1,"why":"Accelerometern mäter acceleration, gyroskopet rotation."},{"t":"mc","q":"Vilken sensor passar för att tända en lampa när någon går förbi?","o":["Trycksensor","PIR-sensor","Halleffektsensor","Mikrofon"],"a":1,"why":"PIR känner av rörelse via infraröd strålning."},{"t":"mc","q":"Hur mäter en ultraljudssensor avstånd?","o":["Den mäter ljusets styrka","Den mäter tiden tills ljudets eko kommer tillbaka","Den mäter magnetfält","Den mäter temperatur"],"a":1,"why":"Avstånd = tid · ljudhastighet / 2."},{"t":"multi","q":"Vilka sensorer kopplas ofta via ett digitalt protokoll som I2C?","o":["Accelerometer","Gyroskop","Trycksensor","LDR"],"a":[0,1,2],"why":"LDR är en enkel analog komponent."},{"t":"mc","q":"Vilken motor passar bäst när du behöver exakt position i en 3D-skrivare?","o":["Borstad DC-motor","Stegmotor","Relä","Borstlös fläktmotor"],"a":1,"why":"Stegmotorn roterar i exakta steg."},{"t":"mc","q":"Vad gör ett relä?","o":["Mäter ström","Låter en låg spänning slå av och på en hög","Omvandlar AC till DC","Förstärker ljud"],"a":1,"why":"Reläet är en strömbrytare som styrs elektriskt."},{"t":"mc","q":"Vad är skillnaden mellan ett servo och en vanlig DC-motor?","o":["Servot har återkoppling och kan ställas på en exakt vinkel","Servot snurrar fortare","DC-motorn har ingen PWM","Det finns ingen skillnad"],"a":0,"why":"Ett servo är en DC-motor med återkoppling och begränsad rotation."},{"t":"text","q":"Vilken webbsimulator används i kursen för Arduino och ESP32?","accept":["wokwi","wokwi.com"],"ph":"namn","why":"Wokwi kör koden och kretsen i webbläsaren."},{"t":"mc","q":"Med <code>INPUT_PULLUP</code> och knappen mellan pinnen och GND, vad läser pinnen när knappen är intryckt?","o":["HIGH","LOW","Ett analogt värde","Det varierar"],"a":1,"why":"Pull-up håller pinnen hög tills knappen drar den till jord."},{"t":"mc","q":"Varför ska en motor inte kopplas direkt till en GPIO-pinne?","o":["Pinnen kan inte ge tillräckligt med ström och kan skadas","Motorn behöver AC","Det blir för långsamt","GPIO kan bara läsa"],"a":0,"why":"Använd en transistor eller motordrivare."}]},{"id":"mcu-arduino","cat":"Inbyggda system","min":12,"title":"Mikrokontroller och Arduino IDE","lead":"Vad som finns inuti en mikrokontroller, hur GPIO, pull-up och register fungerar, och hur koden kommer från datorn till chippet.","src":["Lektion 3 – MCU, mjukvara och Arduino IDE","Arduino IDE setup (inför lektionen)"],"goals":["Beskriva delarna i en mikrokontroller","Förklara GPIO, pull-up och pull-down","Förklara vad register och avbrott är","Beskriva stegen från kod till körning","Installera Arduino IDE med stöd för ESP32"],"blocks":[["h","Vad är en MCU?"],["p","En <strong>mikrokontroller (MCU)</strong> är en hel liten dator på ett chip. Den arbetar med binära signaler och innehåller:"],["list",["<strong>CPU</strong> som kör instruktionerna","<strong>Flash</strong> där programmet ligger kvar utan ström","<strong>RAM</strong> för variabler medan programmet kör","<strong>Register</strong>, små och snabba lagringsplatser i CPU:n","<strong>Kringutrustning</strong> (periferienheter): GPIO, UART, I2C, SPI, ADC, timers","En <strong>kristall</strong> som ger klockfrekvensen"]],["h","GPIO"],["p","<strong>GPIO</strong> (General Purpose Input/Output) är pinnar som programmet kan ställa som in- eller utgång. Många pinnar har fler funktioner:"],["list",["ADC för analoga värden","Timers för exakt tidtagning och PWM","Avbrott (interrupts) som reagerar direkt när en pinne ändras","Sömnlägen som sparar ström","Interna pull-up- och pull-down-resistorer"]],["h","Pull-up och pull-down"],["p","En ingång som inte är kopplad till något <strong>flyter</strong>: den kan läsa slumpmässigt 0 eller 1. En <strong>pull-up</strong>-resistor drar pinnen till hög nivå när inget annat händer, och en <strong>pull-down</strong> drar den till låg. Med pull-up kopplas knappen mellan pinnen och jord, så en intryckt knapp läses som LOW."],["code","cpp","pinMode(2, INPUT_PULLUP);           // intern pull-up, ingen extra resistor behövs\nbool pressed = digitalRead(2) == LOW;\n","Arduino"],["h","Register och avbrott"],["p","<strong>Register</strong> är små lagringsplatser i CPU:n. Allmänna register håller värden som CPU:n räknar med. Specialregister håller status och kontroll. <strong>I/O-register</strong> styr kringutrustningen: att skriva en etta till rätt bit i ett GPIO-register är det som till slut tänder en LED. <strong>Avbrottsregister</strong> styr avbrott, som stoppar det vanliga programmet en kort stund för att hantera en händelse, till exempel en knapptryckning."],["code","c","// Det digitalWrite gör i grunden: sätt en bit i ett register.\n#define LED_BIT 5\nvolatile unsigned int *GPIO_OUT = (unsigned int *)0x60004004; // adress från databladet\n\n*GPIO_OUT |=  (1u << LED_BIT);   // sätt bit 5: LED på\n*GPIO_OUT &= ~(1u << LED_BIT);   // nollställ bit 5: LED av\n","registerskrivning (adressen är bara ett exempel)"],["h","Från kod till körning"],["list",["<strong>Skriv kod</strong> i C eller C++","<strong>Kompilera och länka</strong> till en binärfil med maskinkod för just den processorn","<strong>Flasha</strong>: binärfilen skrivs till MCU:ns flashminne via USB","<strong>Kör</strong>: vid start läser CPU:n instruktionerna från flash"]],["h","Datablad"],["p","Ett <strong>datablad</strong> beskriver en komponent: spänningar den tål, hur den kopplas, hur man pratar med den och hur exakt den är. Läs till exempel databladen för temperatursensorerna DS18B20 (digital, 1-Wire) och TMP235 (analog spänning) och jämför."],["h","Arduino IDE och ESP32"],["p","<strong>Arduino IDE</strong> är en utvecklingsmiljö för att skriva, kompilera och flasha kod till mikrokontroller. Arduino-mjukvaran ger färdiga funktioner som <code>pinMode</code>, <code>digitalWrite</code> och <code>analogRead</code>. Varje program har <code>setup()</code>, som körs en gång, och <code>loop()</code>, som körs om och om igen."],["ex","Installera Arduino IDE för ESP32-C6","<ol><li>Ladda ner Arduino IDE från arduino.cc/en/software och installera.</li><li><em>File → Preferences</em>: lägg till <code>https://espressif.github.io/arduino-esp32/package_esp32_index.json</code> under <em>Additional Board Manager URLs</em>.</li><li><em>Tools → Board → Boards Manager</em>: sök på <code>esp32</code> och installera <em>esp32 by Espressif Systems</em>.</li><li>Installera USB-drivrutinen <em>CP210x Windows Drivers</em> från Silicon Labs om kortet inte syns.</li><li>Välj kortet <em>ESP32C6 Dev Module</em> och rätt COM-port, och ladda upp ett blinkprogram.</li></ol>"],["ex","Från simulator till riktig hårdvara","<p>Ta koden där sensorvärdet styr LED:ens styrka från Wokwi-labben och kör den på ditt ESP32-kort med riktiga komponenter. Mät spänningen på sensorpinnen med multimetern och jämför med värdet i Serial Monitor.</p>"]],"pool":[{"t":"mc","q":"Vad är en mikrokontroller?","o":["En processor som kräver externt RAM","En hel liten dator på ett chip","Ett program för att flasha kod","En typ av sensor"],"a":1,"why":"CPU, minne och kringutrustning på samma chip."},{"t":"multi","q":"Vad finns oftast inuti en MCU?","o":["CPU","Flashminne","RAM","Grafikkort"],"a":[0,1,2],"why":"Grafikkort hör till vanliga datorer."},{"t":"mc","q":"Varför behövs en pull-up- eller pull-down-resistor på en ingång?","o":["För att öka strömmen","För att ingången inte ska flyta och läsa slumpmässiga värden","För att spara minne","För att göra den analog"],"a":1,"why":"Utan den kan en okopplad ingång läsa vad som helst."},{"t":"mc","q":"Var ligger programmet kvar när strömmen stängs av?","o":["RAM","Register","Flash","Cache"],"a":2,"why":"Flash är icke-flyktigt. RAM och register töms."},{"t":"mc","q":"Vad är ett avbrott (interrupt)?","o":["Ett fel som kraschar programmet","En händelse som pausar det vanliga programmet för att hanteras direkt","När strömmen går","En sorts loop"],"a":1,"why":"Avbrottsrutinen körs och sedan fortsätter programmet där det var."},{"t":"mc","q":"Vad är rätt ordning från kod till körning?","o":["Flasha, skriv, kompilera, kör","Skriv, kompilera och länka, flasha, kör","Kompilera, skriv, kör, flasha","Skriv, kör, flasha"],"a":1,"why":"Binärfilen måste finnas innan den kan flashas."},{"t":"mc","q":"Vilken funktion körs om och om igen i ett Arduino-program?","o":["setup()","loop()","main()","run()"],"a":1,"why":"setup() körs en gång, loop() hela tiden därefter."},{"t":"text","q":"Vilken Arduino-funktion ställer in en pinne som in- eller utgång?","accept":["pinMode","pinMode()"],"ph":"funktion","why":"<code>pinMode(13, OUTPUT);</code>"},{"t":"mc","q":"Vad beskriver ett datablad?","o":["Komponentens pris","Hur komponenten kopplas, vad den tål och hur den kommuniceras med","Hur man skriver C","Kursens schema"],"a":1,"why":"Databladet är tillverkarens beskrivning av komponenten."},{"t":"mc","q":"Vad gör I/O-register?","o":["Lagrar programmet","Styr och läser kringutrustning som GPIO och UART","Räknar ut matematik","Håller kristallens frekvens"],"a":1,"why":"Att skriva till rätt bit i ett register är det som sätter en pinne hög."},{"t":"text","q":"Vilken bitoperator använder du för att sätta (ettställa) en bit utan att ändra de andra: <code>reg ? (1 &lt;&lt; 5)</code>?","accept":["|=","|"],"ph":"operator","why":"<code>reg |= (1 &lt;&lt; 5);</code> Med <code>&amp;= ~(1 &lt;&lt; 5)</code> nollställer du den."}]},{"id":"iot-protokoll","cat":"IoT","min":13,"title":"IoT och kommunikationsprotokoll","lead":"Vad som gör något till en IoT-enhet, var IoT används, och protokollen som kopplar ihop allt, från UART på kretskortet till MQTT mot molnet.","src":["Lektion 4 – IoT-intro"],"goals":["Förklara vad IoT är och vad en IoT-enhet gör","Ge exempel på användningsområden","Jämföra UART, I2C, SPI och CAN","Jämföra LoRaWAN, Bluetooth, Zigbee, Z-Wave och Wi-Fi","Känna till internetprotokollen HTTP, TCP, UDP, WebSockets, MQTT och CoAP"],"blocks":[["h","Vad är IoT?"],["p","<strong>Internet of Things</strong> är ett nätverk av saker som <strong>samlar in</strong> data, <strong>bearbetar</strong> den, <strong>delar</strong> den och <strong>agerar</strong> på den. Sakerna är oftast inbyggda system med sensorer och aktuatorer."],["p","En IoT-enhet är alltså en fysisk enhet som kan samla in data, bearbeta den och kommunicera via ett nätverk. En vanlig termometer är inte IoT. En termometer som skickar värdet till en app är det."],["h","Arkitektur"],["p","Ett IoT-system brukar beskrivas i lager: <strong>enheter</strong> (sensorer och aktuatorer), <strong>nätverk eller gateway</strong> som för datan vidare, <strong>moln eller server</strong> som lagrar och analyserar, och <strong>applikation</strong> där användaren ser och styr."],["h","Användningsområden"],["table",["Område","Exempel"],[["Hemautomation","Smarta lampor, termostater, dörrlås, röststyrning"],["Hälsa och träning","Aktivitetsarmband, smarta vågar, pulsmätare"],["Sjukvård","Fjärrövervakning av patienter, insulinpumpar"],["Transport och logistik","GPS-spårning, smarta trafikljus, lagerövervakning"],["Miljö och energi","Smarta elmätare, solpanelsövervakning, luftkvalitet"],["Industri","Prediktivt underhåll, robotstyrning, sensorer i produktionslinjer"]]],["h","Protokoll"],["p","Ett <strong>kommunikationsprotokoll</strong> är formatet och reglerna för hur enheter pratar med varandra. Båda sidor måste prata samma språk. Vi delar upp dem i <strong>interna</strong> (mellan delar inuti enheten) och <strong>externa</strong> (ut från enheten)."],["h","Interna protokoll"],["table",["Protokoll","Ledningar","Egenskaper","Typiskt"],[["UART","2: TX och RX","Asynkront, enhet till enhet. Båda måste ha samma baudrate. Enkelt men begränsad hastighet.","Serial Monitor, GPS-moduler"],["I2C","2: SDA (data) och SCL (klocka)","Buss med master och slavar som har adresser. Många enheter, korta kablar.","Sensorer, små displayer"],["SPI","4: MISO, MOSI, SCLK, CS","Master och slavar, snabbt och stabilt, en CS-ledning per enhet.","SD-kort, snabba displayer"],["CAN","2 (differentiellt par)","Robust buss för många noder. Kräver en CAN-transceiver.","Bilar, industri"]]],["note","tip","UART skickar varje tecken som en startbit, databitar och en stoppbit. 115200 baud betyder ungefär 115200 bitar per sekund. Är baudraten fel i Serial Monitor ser du bara skräptecken."],["h","Externa anslutningar"],["table",["Teknik","Räckvidd","Energi","Övrigt"],[["LoRaWAN","Lång (km)","Mycket låg","Låg datahastighet. Bra för sensorer på landet."],["Bluetooth (BLE)","Kort","Låg","Punkt till punkt eller mesh. Mobil till enhet."],["Zigbee","Kort per nod","Låg","Mesh på 2,4 GHz, kräver en Zigbee-hubb."],["Z-Wave","Kort per nod","Låg","Mesh på 868 MHz i EU. Proprietärt, kräver licens."],["Wi-Fi","Medel","Hög","Direkt mot internet, hög datahastighet."]]],["h","Internetprotokoll"],["list",["<strong>HTTP:</strong> fråga och svar, som när en webbläsare hämtar en sida. Enkelt men pratigt.","<strong>TCP:</strong> pålitlig förbindelse där allt kommer fram i rätt ordning.","<strong>UDP:</strong> snabbt utan garantier. Bra när ett tappat paket inte gör något.","<strong>WebSockets:</strong> en öppen förbindelse där båda sidor kan skicka när som helst.","<strong>MQTT:</strong> publish/subscribe via en broker. Enheter publicerar på ämnen (topics) som <code>hus/kok/temp</code>, och den som prenumererar får värdena. Lätt och mycket vanligt i IoT.","<strong>CoAP:</strong> som en lättviktig HTTP över UDP, för mycket små enheter."]],["h","Inlämningsuppgift och Arduino IoT Cloud"],["p","Inlämningsuppgiften görs i par, men alla lämnar in egen dokumentation och presenterar projektet själva. I labben skapar du ett konto på <strong>Arduino IoT Cloud</strong> (cloud.arduino.cc) och kopplar ditt ESP32-C6-kort, så att ett sensorvärde syns i en dashboard."],["ex","Designa ett enkelt IoT-system","<p>Välj en smart IoT-lösning, till exempel en smart elmätare eller en jordfuktighetssensor i en växthusodling. Ta reda på var den används och beskriv: vilka sensorer och aktuatorer finns, vilka interna och externa protokoll används, var datan lagras och vem som ser den.</p>"]],"pool":[{"t":"mc","q":"Vad gör en enhet till en IoT-enhet?","o":["Den har en skärm","Den samlar in data, bearbetar den och kommunicerar via ett nätverk","Den är batteridriven","Den använder C++"],"a":1,"why":"Uppkopplingen är det centrala."},{"t":"mc","q":"Hur många ledningar använder I2C?","o":["1","2","4","8"],"a":1,"why":"SDA för data och SCL för klocka."},{"t":"mc","q":"Vad måste båda sidor vara överens om i UART?","o":["Adressen","Baudraten","IP-adressen","Antalet slavar"],"a":1,"why":"UART är asynkront, så hastigheten måste bestämmas i förväg."},{"t":"multi","q":"Vilka är SPI:s ledningar?","o":["MISO","MOSI","SCLK","CS","SDA"],"a":[0,1,2,3],"why":"SDA hör till I2C."},{"t":"mc","q":"Vilket protokoll används mycket i bilar för att många styrenheter ska prata robust?","o":["UART","SPI","CAN","HTTP"],"a":2,"why":"Controller Area Network."},{"t":"mc","q":"Vilken teknik passar en batteridriven sensor flera kilometer från närmaste gateway?","o":["Bluetooth","Wi-Fi","LoRaWAN","SPI"],"a":2,"why":"Lång räckvidd och mycket låg energiförbrukning, men låg datahastighet."},{"t":"multi","q":"Vilka bygger mesh-nätverk?","o":["Zigbee","Z-Wave","UART","Bluetooth mesh"],"a":[0,1,3],"why":"UART är en enkel förbindelse mellan två enheter."},{"t":"mc","q":"Hur fungerar MQTT?","o":["Fråga och svar som HTTP","Publish/subscribe via en broker","Direkt mellan två pinnar","Bara över Bluetooth"],"a":1,"why":"Enheter publicerar på topics, och prenumeranter får värdena via brokern."},{"t":"mc","q":"Vad är skillnaden mellan TCP och UDP?","o":["TCP är pålitligt och ordnat, UDP är snabbt utan garantier","UDP är krypterat","TCP används bara lokalt","Det finns ingen skillnad"],"a":0,"why":"TCP skickar om tappade paket. UDP gör det inte."},{"t":"text","q":"Vilket internt protokoll använder ledningarna TX och RX?","accept":["UART"],"ph":"protokoll","why":"Universal Asynchronous Receiver/Transmitter."},{"t":"mc","q":"Vilket protokoll är en lättviktig motsvarighet till HTTP för små enheter, över UDP?","o":["CoAP","CAN","SPI","Zigbee"],"a":0,"why":"Constrained Application Protocol."}]},{"id":"internet-sakerhet-minne","cat":"IoT","min":12,"title":"Internet, säkerhet och minne","lead":"Hur sensordata tar sig från enheten till molnet, hur en IoT-enhet kan attackeras och skyddas, och vilka sorters minne och lagring som finns.","src":["Lektion 5 – Internet, säkerhet och minne"],"goals":["Förklara vad router, switch, DNS, IP-adress och MAC-adress gör","Beskriva OSI-modellens lager ur ett IoT-perspektiv","Ge exempel på attacker mot IoT-enheter och skydd mot dem","Skilja på flyktigt och icke-flyktigt minne och ge exempel"],"blocks":[["h","Internets byggstenar"],["p","Internet är ett globalt nätverk av sammankopplade nätverk."],["table",["Del","Gör","Anvä
