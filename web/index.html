/* ================================================================ C++ runner (Web Worker, lazy) */
let cppWorker = null, cppSeq = 0;
const cppPending = new Map();
function failAllPending(msg) {
  cppPending.forEach(p => { clearTimeout(p.to); p.res({ ok: false, out: "", error: msg }); });
  cppPending.clear();
}
function getCppWorker() {
  if (cppWorker) return cppWorker;
  cppWorker = new Worker("cpp-runner.js");
  cppWorker.onmessage = e => {
    const p = cppPending.get(e.data.id);
    if (!p) return;
    clearTimeout(p.to); cppPending.delete(e.data.id); p.res(e.data);
  };
  cppWorker.onerror = () => { failAllPending("Kodtolken kunde inte laddas här. Öppna koden i Compiler Explorer istället."); try { cppWorker.terminate(); } catch (e) {} cppWorker = null; };
  return cppWorker;
}
/* Gamla Electron-appen exponerade window.nollterm.run. C++-appen kör inte webbsidan, så på webben är NATIVE alltid false. */
const NATIVE = !!(window.nollterm && typeof window.nollterm.run === "function");

/* ================================================================ Python runner (Pyodide i en Web Worker) */
// Pyodide är riktig CPython kompilerad till WebAssembly. Första gången laddas ca 10 MB, sedan cachas det.
let pyWorker = null, pyReady = null, pySeq = 0;
const pyPending = new Map();
function getPyWorker() {
  if (pyWorker) return pyReady;
  pyWorker = new Worker("py-runner.js");
  pyReady = new Promise((ok, fail) => {
    pyWorker.onmessage = e => {
      if (e.data.ready) { ok(pyWorker); return; }
      if (e.data.loadError) { fail(new Error(e.data.loadError)); return; }
      const p = pyPending.get(e.data.id);
      if (!p) return;
      clearTimeout(p.to); pyPending.delete(e.data.id); p.res(e.data);
    };
    pyWorker.onerror = () => fail(new Error("Python kunde inte laddas här."));
  });
  pyReady.catch(() => { try { pyWorker.terminate(); } catch (e) {} pyWorker = null; });
  return pyReady;
}
async function runPy(code, input) {
  let w;
  try { w = await getPyWorker(); }
  catch (e) { return { ok: false, out: "", error: "Python kunde inte laddas. Kolla internetanslutningen (första gången hämtas Pyodide, ca 10 MB)." }; }
  return new Promise(res => {
    const id = ++pySeq;
    const to = setTimeout(() => {
      pyPending.delete(id);
      try { w.terminate(); } catch (e) {}
      pyWorker = null;
      pyPending.forEach(p => { clearTimeout(p.to); p.res({ ok: false, out: "", error: "Avbruten." }); });
      pyPending.clear();
      res({ ok: false, out: "", error: "Tidsgränsen (10 s) överskreds. Har du en oändlig loop, eller väntar programmet på mer indata?" });
    }, 10000);
    pyPending.set(id, { res, to });
    w.postMessage({ id, code, input: input || "" });
  });
}

/* ================================================================ språk */
const LANG_NAME = { c: "C", cpp: "C++", py: "Python" };
const LANG_FILE = { c: "main.c", cpp: "main.cpp", py: "main.py" };
const LANG_HL = { c: "c", cpp: "cpp", py: "python" };
const prefLang = () => state.prefs.lang || "cpp";
// Språket en kodfråga visas i: det sparade svarets språk, annars ditt valda språk om det går på webben.
function langOf(q, a) {
  if (a && a.lang && q.code[a.lang]) return a.lang;
  const pref = prefLang();
  if (q.web.includes(pref)) return pref;
  return q.web[0] || (q.code[pref] ? pref : q.langs[0]);
}
const starterOf = (q, lang) => q.code[lang || langOf(q)].starter;
function runCode(lang, code, input) {
  if (lang === "py") return runPy(code, input);
  return runCpp(code, input);
}
async function runNative(files, input, flags) {
  try {
    const r = await window.nollterm.run({ files, stdin: input || "", flags });
    if (r.stage === "compile" && !r.ok) return { ok: false, out: "", error: "Kompileringsfel:\n" + (r.stderr || r.error || ""), compile: true };
    if (!r.ok) return { ok: false, out: r.out || "", error: r.error || r.stderr || "Programmet avslutades med fel." };
    return { ok: true, out: r.out || "", stderr: r.stderr || "", warnings: r.warnings || "" };
  } catch (e) { return { ok: false, out: "", error: "Kunde inte köra g++: " + (e && e.message || e) }; }
}
function runCpp(code, input) {
  if (NATIVE) return runNative([{ name: /#include\s*<iostream>|std::|\bclass\b|\bcout\b/.test(code) || !/#include\s*<stdio\.h>/.test(code) ? "main.cpp" : "main.c", content: code }], input);
  return runInterp(code, input);
}
function runInterp(code, input) {
  return new Promise(res => {
    let w;
    try { w = getCppWorker(); } catch (e) { res({ ok: false, out: "", error: "Kodtolken är inte tillgänglig i den här vyn. Öppna koden i Compiler Explorer istället." }); return; }
    const id = ++cppSeq;
    const to = setTimeout(() => {
      cppPending.delete(id);
      try { w.terminate(); } catch (e) {}
      cppWorker = null;
      failAllPending("Avbruten.");
      res({ ok: false, out: "", error: "Tidsgränsen överskreds. Har du en oändlig loop, eller väntar programmet på mer indata?" });
    }, 6000);
    cppPending.set(id, { res, to });
    w.postMessage({ id, code, input: input || "" });
  });
}
const normOut = s => String(s || "").replace(/\r/g, "").split("\n").map(l => l.replace(/\s+$/, "")).join("\n").replace(/\n+$/, "").replace(/^\n+/, "");
function explainError(msg) {
  const m = String(msg || "");
  if (!NATIVE && /cannot find library|is not defined|Parsing Failure|not a left value|does not exist/i.test(m))
    return m + "\n\nWebbtolken stöder en del av C/C++: cout/cin, printf/scanf, funktioner, loopar, arrayer, pekare och C-strängar. Använder du string, vector, referenser, struct, klasser eller enum: prova i Compiler Explorer.";
  return m;
}
async function runTests(q, code, lang) {
  const out = [];
  for (const t of q.tests) {
    const r = await runCode(lang || "cpp", code, t.in);
    out.push({ in: t.in, want: t.out, got: r.out || "", error: r.ok ? null : r.error, pass: r.ok && normOut(r.out) === normOut(t.out) });
    if (!r.ok && (r.compile || /Tidsgränsen|inte tillgänglig|kunde inte laddas|Python kunde inte/.test(r.error || ""))) { while (out.length < q.tests.length) out.push({ in: q.tests[out.length].in, want: q.tests[out.length].out, got: "", error: "Hoppades över", pass: false }); break; }
  }
  return out;
}
function godboltUrl(code, stdin, lang) {
  const isC = lang === "c", cid = isC ? "cg132" : "g132";
  const state = { sessions: [{ id: 1, language: isC ? "c" : "c++", source: code, compilers: [{ id: cid, options: "-Wall" }], executors: [{ compiler: { id: cid, libs: [], options: "" }, stdin: stdin || "", stdinVisible: true }] }] };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "https://godbolt.org/clientstate/" + b64;
}

/* ================================================================ grading */
const normText = s => String(s || "").toLowerCase().replace(/[’']/g, '"').replace(/\s+/g, "").replace(/;+$/, "");
function gradeSync(q, a) {
  if (!a || a.v === undefined || a.v === null) return false;
  if (q.t === "mc") return a.v === q.a;
  if (q.t === "multi") { const v = (a.v || []).slice().sort().join(","); return v === q.a.slice().sort().join(","); }
  if (q.t === "text") { const v = normText(a.v); return v !== "" && q.accept.some(x => normText(x) === v); }
  return !!a.ok;
}
const usable = q => !(q.gpp && !NATIVE);   // gpp: ingen av uppgiftens språk går att köra på webben
const isAnswered = (q, a) => !!a && (q.t === "multi" ? (a.v || []).length > 0 : q.t === "text" ? String(a.v || "").trim() !== "" : q.t === "code" ? !!a.v && a.v.trimEnd() !== starterOf(q, a.lang).trimEnd() : a.v !== undefined);

/* ================================================================ question component */
function mountQuestion(el, q, o) {
  const mode = o.mode;                      // practice | exam | review
  let a = o.ans ? JSON.parse(JSON.stringify(o.ans)) : null;
  const order = o.perm || q.o && q.o.map((_, i) => i);
  const emit = () => o.onAnswer && o.onAnswer(a);
  const pts = TYPE_POINTS[q.t];

  function head() {
    return `<div class="qhead"><span class="qn">FRÅGA ${o.n} AV ${o.total}${o.from ? " · " + esc(o.from) : ""}${mode !== "practice" ? ` · ${pts} P` : ""}</span><span class="qtype ${q.t === "code" ? "code" : ""}">${TYPE_LABEL[q.t]}</span></div>
      <div class="qt">${q.q}</div>`;
  }
  function whyBox(ok) { return `<div class="why">${ok ? '<b class="r">Rätt.</b>' : '<b class="w">Inte riktigt.</b>'} ${q.why || ""}</div>`; }

  function renderChoice() {
    const multi = q.t === "multi";
    const sel = multi ? (a && a.v) || [] : a && a.v !== undefined ? [a.v] : [];
    const checked = mode === "review" || (mode === "practice" && a && a.checked);
    const opts = order.map((oi, pos) => {
      let cls = "";
      const picked = sel.includes(oi);
      const correct = multi ? q.a.includes(oi) : q.a === oi;
      if (checked) {
        if (correct && picked) cls = "right picked";
        else if (picked) cls = "wrong";
        else if (correct) cls = multi ? "missed" : "right";
      } else if (picked) cls = "sel";
      return `<button type="button" class="opt ${cls}" data-o="${oi}" ${checked ? "disabled" : ""} ${multi ? `role="checkbox" aria-checked="${picked}"` : ""}><span class="l">${multi ? '<span class="box"></span>' : "ABCDEFG"[pos]}</span><span>${q.o[oi]}</span></button>`;
    }).join("");
    let foot = "";
    if (mode === "practice" && multi && !checked) foot = `<div class="qactions"><button type="button" class="btn primary" data-act="check" ${sel.length ? "" : "disabled"}>Kontrollera</button><span class="status" style="color:var(--muted);font-weight:400">Välj alla alternativ som stämmer.</span></div>`;
    if (mode === "exam" && multi) foot = `<div class="qactions"><span class="status" style="color:var(--muted);font-weight:400">Välj alla alternativ som stämmer.</span></div>`;
    if (checked) foot = whyBox(gradeSync(q, a)) + (mode === "practice" ? `<div class="qactions"><button type="button" class="btn" data-act="retry">Försök igen</button></div>` : "");
    el.innerHTML = `<div class="q ${mode === "review" ? (gradeSync(q, a) ? "review-r" : "review-w") : ""}">${head()}<div class="opts">${opts}</div>${foot}</div>`;
    $$(".opt", el).forEach(b => b.addEventListener("click", () => {
      const oi = +b.dataset.o;
      if (multi) {
        const cur = new Set((a && a.v) || []);
        cur.has(oi) ? cur.delete(oi) : cur.add(oi);
        a = { v: [...cur] };
      } else {
        a = { v: oi };
        if (mode === "practice") { a.checked = true; a.ok = gradeSync(q, a); }
      }
      emit(); renderChoice();
    }));
    const ck = $('[data-act="check"]', el);
    if (ck) ck.addEventListener("click", () => { a.checked = true; a.ok = gradeSync(q, a); emit(); renderChoice(); });
    const rt = $('[data-act="retry"]', el);
    if (rt) rt.addEventListener("click", () => { a = null; emit(); renderChoice(); });
  }

  function renderText() {
    const checked = mode === "review" || (mode === "practice" && a && a.checked);
    const ok = gradeSync(q, a);
    const cls = checked ? (ok ? "right" : "wrong") : "";
    el.innerHTML = `<div class="q ${mode === "review" ? (ok ? "review-r" : "review-w") : ""}">${head()}
      <input class="tin ${cls}" type="text" id="tin-${o.uid}" placeholder="${esc(q.ph || "Ditt svar")}" value="${esc((a && a.v) || "")}" autocomplete="off" spellcheck="false" ${mode === "review" ? "readonly" : ""} aria-label="Ditt svar">
      ${mode === "practice" ? `<div class="qactions"><button type="button" class="btn primary" data-act="check">Kontrollera</button>${checked ? `<span class="status ${ok ? "r" : "w"}">${ok ? "Rätt" : "Inte riktigt, försök igen eller läs förklaringen"}</span>` : '<span class="status" style="color:var(--muted);font-weight:400">Enter för att kontrollera. Stora/små bokstäver och mellanslag spelar ingen roll.</span>'}</div>` : ""}
      ${checked ? `${whyBox(ok)}<div class="accepted">Godkända svar: ${q.accept.map(x => `<code>${esc(x)}</code>`).join(", ")}</div>` : ""}
    </div>`;
    const inp = $(".tin", el);
    if (mode === "review") return;
    inp.addEventListener("input", () => { a = { v: inp.value }; if (mode === "exam") emit(); });
    const check = () => { a = { v: inp.value, checked: true }; a.ok = gradeSync(q, a); emit(); renderText(); const n = $(".tin", el); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    if (mode === "practice") {
      $('[data-act="check"]', el).addEventListener("click", check);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
    }
  }

  function renderCode() {
    const lang = langOf(q, a);
    const blocked = !q.web.includes(lang) && !NATIVE;   // språket går inte att köra i webbläsaren
    const code = a && a.v !== undefined && (a.lang || "cpp") === lang ? a.v : starterOf(q, lang);
    const ex = q.tests[0];
    const res = a && a.res;
    const ok = !!(a && a.ok);
    const showSol = mode === "review" || (mode === "practice" && (res || blocked));
    // I provet går bara språk som kan rättas här att välja. När du övar syns alla, med en notis.
    const choices = mode === "exam" ? q.langs.filter(l => q.web.includes(l)) : q.langs;
    const langBar = mode === "review" ? "" : `<div class="langbar" role="group" aria-label="Språk">${choices.map(l =>
      `<button type="button" class="chip" data-lang="${l}" aria-pressed="${l === lang}">${LANG_NAME[l]}${q.web.includes(l) || NATIVE ? "" : ' <small>appen</small>'}</button>`).join("")}</div>`;
    const note = lang === "py"
      ? "Python körs med Pyodide, riktig CPython i webbläsaren. Första körningen laddar ner Python (ca 10 MB)."
      : 'C och C++ körs i en tolk i webbläsaren som stöder cout/cin, printf/scanf, funktioner, loopar, arrayer, pekare och C-strängar. För full C++: öppna i Compiler Explorer, eller använd <a href="#app">appen med riktig gcc och g++</a>.';
    el.innerHTML = `<div class="q ${mode === "review" ? (ok ? "review-r" : "review-w") : ""}">${head()}
      <div class="example">Exempel: indata <pre>${esc(ex.in)}</pre> ger utdata <pre>${esc(ex.out)}</pre></div>
      ${langBar}
      <div class="editor">
        <div class="bar2"><span>${LANG_FILE[lang]}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${mode !== "review" ? '<button type="button" data-act="reset">Återställ</button>' : ""}${lang !== "py" ? '<a href="https://godbolt.org/" target="_blank" rel="noopener" data-act="gb">Öppna i Compiler Explorer ↗</a>' : ""}</span></div>
        <div class="ed"><div class="gut" aria-hidden="true"></div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" id="ed-${o.uid}" aria-label="Kodredigerare" ${mode === "review" ? "readonly" : ""}>${esc(code)}</textarea></div>
      </div>
      ${blocked && mode !== "review" ? `<div class="note warn" style="margin-top:10px"><span class="tag">app</span><div><p>Den här uppgiften i ${LANG_NAME[lang]} använder delar av språket som webbtolken inte klarar. Byt till ${q.web.length ? q.web.map(l => LANG_NAME[l]).join(" eller ") : "ett annat språk"}, kör den i <a href="#app">appen</a> eller öppna den i Compiler Explorer.</p></div></div>` : ""}
      ${mode !== "review" && !blocked ? `<div class="ioarea"><div><label for="in-${o.uid}">Indata (stdin)</label><textarea id="in-${o.uid}" spellcheck="false">${esc(ex.in)}</textarea></div><div><label>Utdata</label><div class="term" data-out aria-live="polite"><span class="dim">Tryck Kör för att köra programmet.</span></div></div></div>
      <div class="qactions"><button type="button" class="btn" data-act="run">Kör ▶</button>${mode === "practice" ? '<button type="button" class="btn primary" data-act="test">Kör testerna</button>' : '<span class="status" style="color:var(--muted);font-weight:400">Dolda tester körs när du lämnar in.</span>'}<span class="status" data-st></span></div>` : ""}
      <div class="tests" data-tests>${res ? testsHtml(res) : ""}</div>
      ${res && mode !== "exam" ? whyBox(ok) : ""}
      ${showSol ? `<details class="sol" style="margin-top:10px"><summary style="cursor:pointer;color:var(--mask);font-weight:700;font-size:.9rem">Visa lösningsförslag (${LANG_NAME[lang]})</summary>${codeBlock(LANG_HL[lang], q.code[lang].sol, "lösningsförslag")}</details>` : ""}
      ${mode !== "review" ? `<p class="runner-note">${NATIVE ? "Koden kompileras på din dator." : note}</p>` : ""}
    </div>`;
    const ta = $("textarea[id^='ed-']", el), gut = $(".gut", el);
    const syncGut = () => { const n = ta.value.split("\n").length; gut.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n"); ta.style.height = "auto"; ta.style.height = Math.max(220, ta.scrollHeight + 4) + "px"; };
    syncGut();
    $$("pre code", el).forEach(c => { try { window.hljs && hljs.highlightElement(c); } catch (e) {} });
    const gb = $('[data-act="gb"]', el);
    if (gb) gb.addEventListener("click", e => { e.currentTarget.href = godboltUrl(ta.value, ($("textarea[id^='in-']", el) || {}).value || ex.in, lang); });
    if (mode === "review") return;
    // Byt språk: koden i varje språk sparas i a.codes så att inget försvinner när du byter fram och tillbaka.
    $$("[data-lang]", el).forEach(b => b.addEventListener("click", () => {
      const to = b.dataset.lang;
      if (to === lang) return;
      const codes = Object.assign({}, a && a.codes, { [lang]: ta.value });
      a = { lang: to, v: codes[to] !== undefined ? codes[to] : starterOf(q, to), codes };
      state.prefs.lang = to; save();
      emit(); renderCode();
    }));
    ta.addEventListener("input", () => { a = Object.assign({}, a, { v: ta.value, lang }); delete a.res; delete a.ok; syncGut(); emit(); });
    ta.addEventListener("keydown", e => {
      if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
      else if (e.key === "Enter") {
        const before = ta.value.slice(0, ta.selectionStart);
        const line = before.slice(before.lastIndexOf("\n") + 1);
        let ind = (line.match(/^\s*/) || [""])[0];
        if (/\{\s*$/.test(line) || (lang === "py" && /:\s*$/.test(line))) ind += "    ";
        e.preventDefault(); ta.setRangeText("\n" + ind, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input"));
      }
    });
    $('[data-act="reset"]', el).addEventListener("click", () => {
      const codes = Object.assign({}, a && a.codes); delete codes[lang];
      a = { lang, v: starterOf(q, lang), codes }; emit(); renderCode();
    });
    if (blocked) return;
    const outEl = $("[data-out]", el), st = $("[data-st]", el);
    $('[data-act="run"]', el).addEventListener("click", async () => {
      outEl.innerHTML = `<span class="dim">${lang === "py" && !pyWorker ? "Laddar Python…" : "Kör…"}</span>`;
      const r = await runCode(lang, ta.value, $("textarea[id^='in-']", el).value);
      outEl.innerHTML = (r.out ? esc(r.out) : "") + (r.ok ? (r.out ? "" : '<span class="dim">(ingen utdata)</span>') : `<span class="err">${r.out ? "\n" : ""}${esc(explainError(r.error))}</span>`);
    });
    const tb = $('[data-act="test"]', el);
    if (tb) tb.addEventListener("click", async () => {
      st.textContent = lang === "py" && !pyWorker ? "Laddar Python…" : "Kör testerna…"; st.className = "status";
      const r = await runTests(q, ta.value, lang);
      a = Object.assign({}, a, { v: ta.value, lang, res: r, ok: r.every(x => x.pass), checked: true });
      emit(); renderCode();
      const s2 = $("[data-st]", el); const p = r.filter(x => x.pass).length;
      s2.textContent = `${p} av ${r.length} tester godkända`; s2.className = "status " + (p === r.length ? "r" : "w");
    });
  }
  if (q.t === "mc" || q.t === "multi") renderChoice();
  else if (q.t === "text") renderText();
  else renderCode();
}
function testsHtml(res) {
  return res.map((r, i) => `<div class="test ${r.pass ? "pass" : "fail"}"><span class="tag">${r.pass ? "OK" : "FEL"}</span><div>Test ${i + 1}: indata <code>${esc(r.in.replace(/\n/g, " ⏎ "))}</code>${r.pass ? "" : `<pre>Förväntat:\n${esc(r.want)}\n\nFick:\n${esc(r.got || "")}${r.error ? "\n" + esc(explainError(r.error)) : ""}</pre>`}</div></div>`).join("");
}

/* ================================================================ exam */
let examTimer = null;
let examResultIdx = null;   // index into history to show, or null for setup
let examConfirm = false;

function examPrefs(c) {
  const p = state.prefs[c.id] || {};
  return {
    lessons: (p.lessons && p.lessons.length ? p.lessons : c.lessons.map(l => l.id)).filter(id => lessonIdx(c, id) >= 0),
    types: p.types && p.types.length ? p.types : ["mc", "multi", "text", "code"],
    count: p.count || 15,
    time: p.time === undefined ? 0 : p.time,
  };
}
function eligible(c, pr) {
  const out = [];
  pr.lessons.forEach(lid => { const l = c.lessons[lessonIdx(c, lid)]; l.pool.forEach((q, i) => { if (pr.types.includes(q.t) && usable(q)) out.push({ l: lid, i }); }); });
  return out;
}
function drawItems(c, pr) {
  const byL = {};
  eligible(c, pr).forEach(x => (byL[x.l] = byL[x.l] || []).push(x));
  Object.keys(byL).forEach(k => (byL[k] = shuffle(byL[k])));
  const total = Object.values(byL).reduce((n, a) => n + a.length, 0);
  const want = pr.count === "all" ? total : Math.min(pr.count, total);
  const picked = []; let keys = shuffle(Object.keys(byL));
  while (picked.length < want && keys.length) {
    keys = keys.filter(k => byL[k].length);
    for (const k of keys) { if (picked.length >= want) break; picked.push(byL[k].pop()); }
  }
  return shuffle(picked).map(x => { const q = qOf(c, x); return Object.assign(x, q.o ? { perm: shuffle(q.o.map((_, i) => i)) } : {}); });
}
const qOf = (c, it) => c.lessons[lessonIdx(c, it.l)].pool[it.i];
function startExam(c, items, pr) {
  state.run[c.id] = { items, ans: {}, flags: {}, cur: 0, start: Date.now(), limit: pr.time || 0, label: pr.label || "" };
  examResultIdx = null; examConfirm = false; save();
  renderExam(c);
  window.scrollTo(0, 0);
}

function viewExamShell(c) { return `${courseHead(c, "exam")}<div id="exam"></div>`; }
function renderExam(c) {
  clearInterval(examTimer);
  const box = $("#exam"); if (!box) return;
  const run = state.run[c.id];
  if (run) return renderRun(c, box, run);
  if (examResultIdx !== null && (state.exams[c.id] || [])[examResultIdx]) return renderResult(c, box, state.exams[c.id][examResultIdx]);
  renderSetup(c, box);
}

      </fieldset>
      <fieldset class="fieldset"><legend>Antal frågor</legend>
        <div class="pills">${[10, 15, 20, 30, "all"].map(v => `<label><input type="radio" id="exc-${v}" name="c" value="${v}" ${String(pr.count) === String(v) ? "checked" : ""}><span>${v === "all" ? "Alla" : v}</span></label>`).join("")}</div>

        <div class="pills">${[0, 10, 20, 30, 45, 60].map(v => `<label><input type="radio" id="exm-${v}" name="m" value="${v}" ${pr.time === v ? "checked" : ""}><span>${v ? v + " min" : "Ingen"}</span></label>`).join("")}</div>

      <p class="poolinfo"><b>${pool.length}</b> frågor matchar. Provet drar <b>${n}</b> av dem.${(() => { const g = c.lessons.reduce((k, l) => k + l.pool.filter(q => q.gpp && !NATIVE && pr.types.includes(q.t)).length, 0); return g ? ` <br>${g} kodfrågor går inte att köra i webbläsaren och är bara med i <a href="#app">appen</a>.` : ""; })()}</p>
      <button class="btn primary" type="submit" ${n ? "" : "disabled"}>Starta provet →</button>
    </form>
    <div>
      <div class="panel"><h3>Så rättas provet</h3>
        <ul style="margin:0;padding-left:20px;font-size:.92rem">
          <li>Flerval, flera rätt och fritext: 1 poäng. Flera rätt kräver exakt rätt kombination.</li>

        <div class="grade" style="margin-top:12px;grid-template-columns:repeat(3,minmax(0,1fr))"><div><b>IG</b>under 50 %</div><div><b>G</b>från 50 %</div><div><b>VG</b>från 75 %</div></div>
        <p style="font-size:.8rem;color:var(--muted);margin:10px 0 0">Gränserna är satta för självtest, inte av läraren.</p>
      </div>

        ${hist.length ? `<div class="tablewrap" style="margin:0"><table class="hist"><thead><tr><th>Datum</th><th>Poäng</th><th>Betyg</th><th></th></tr></thead><tbody>
        ${hist.map((h, i) => `<tr><td>${esc(fmtDate(h.ts))}</td><td>${h.pts}/${h.max} · ${h.pct}%</td><td><span class="gbadge ${h.grade}">${h.grade}</span></td><td><button type="button" class="chip" data-view="${i}">Visa</button></td></tr>`).join("")}
        </tbody></table></div>` : `<p style="margin:0;color:var(--muted);font-size:.92rem">Inga prov än. Ditt första resultat hamnar här.</p>`}

    save();
  };

  $$("[data-all]", box).forEach(b => b.addEventListener("click", () => {
    $$('input[name="l"]', form).forEach(x => (x.checked = b.dataset.all === "1")); read(); renderSetup(c, box);
  }));
  form.addEventListener("submit", e => { e.preventDefault(); read(); const p = examPrefs(c); startExam(c, drawItems(c, p), p); });
  $$("[data-view]", box).forEach(b => b.addEventListener("click", () => { examResultIdx = +b.dataset.view; renderExam(c); window.scrollTo(0, 0); }));

/* ---------------- running */
function renderRun(c, box, run) {
  const N = run.items.length;
  const it = run.items[run.cur], q = qOf(c, it);
  const answered = run.items.filter((x, i) => isAnswered(qOf(c, x), run.ans[i])).length;
  box.innerHTML = `
  <div class="exambar">
    <div class="row1"><b>Prov${run.label ? " · " + esc(run.label) : ""} · fråga ${run.cur + 1} av ${N}</b><span style="display:flex;gap:10px;align-items:center"><span style="font-size:.85rem;color:var(--muted)">${answered}/${N} besvarade</span><span class="timer" id="timer"></span></span></div>
    <div class="qnav" role="group" aria-label="Hoppa till fråga">${run.items.map((x, i) => `<button type="button" data-go="${i}" class="${i === run.cur ? "cur" : ""} ${isAnswered(qOf(c, x), run.ans[i]) ? "ans" : ""} ${run.flags[i] ? "flag" : ""}" aria-label="Fråga ${i + 1}">${i + 1}</button>`).join("")}</div>
  </div>
  <div id="exq"></div>
  <div class="exnav">
    <div class="grp"><button type="button" class="btn" data-nav="-1" ${run.cur === 0 ? "disabled" : ""}>← Föregående</button><button type="button" class="btn" data-flag>${run.flags[run.cur] ? "Ta bort markering" : "Markera för senare"}</button></div>
    <div class="grp">${run.cur < N - 1 ? `<button type="button" class="btn" data-nav="1">Nästa →</button>` : ""}<button type="button" class="btn primary" data-submit>Lämna in</button></div>
  </div>
  <div id="confirm"></div>
  <p style="margin-top:22px"><button type="button" class="chip" data-abort>Avbryt provet utan att spara</button></p>`;
  mountQuestion($("#exq", box), q, {
    mode: "exam", n: run.cur + 1, total: N, uid: "ex" + run.cur, perm: it.perm,
    from: "Lektion " + nn(lessonIdx(c, it.l)), ans: run.ans[run.cur],
    onAnswer: a => {
      run.ans[run.cur] = a; save();
      const b = $(`[data-go="${run.cur}"]`, box); if (b) b.classList.toggle("ans", isAnswered(q, a));
      const cnt = run.items.filter((x, i) => isAnswered(qOf(c, x), run.ans[i])).length;
      $(".row1 span span", box).textContent = `${cnt}/${N} besvarade`;
    },
  });
  const go = i => { run.cur = i; examConfirm = false; save(); renderRun(c, box, run); };
  $$("[data-go]", box).forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
  $$("[data-nav]", box).forEach(b => b.addEventListener("click", () => go(run.cur + +b.dataset.nav)));
  $("[data-flag]", box).addEventListener("click", () => { run.flags[run.cur] = !run.flags[run.cur]; save(); renderRun(c, box, run); });
  $("[data-abort]", box).addEventListener("click", () => {
    $("#confirm", box).innerHTML = `<div class="confirm"><p>Avbryta provet? Dina svar sparas inte.</p><button type="button" class="btn" data-no>Fortsätt provet</button><button type="button" class="btn primary" data-yes>Avbryt provet</button></div>`;
    $("[data-no]", box).addEventListener("click", () => ($("#confirm", box).innerHTML = ""));
    $("[data-yes]", box).addEventListener("click", () => { delete state.run[c.id]; save(); renderExam(c); });
  });
  const showConfirm = () => {
    const left = N - run.items.filter((x, i) => isAnswered(qOf(c, x), run.ans[i])).length;
    const flagged = Object.values(run.flags).filter(Boolean).length;
    $("#confirm", box).innerHTML = `<div class="confirm"><p><b>Lämna in provet?</b> ${left ? `${left} fråg${left === 1 ? "a" : "or"} är obesvarad${left === 1 ? "" : "e"}.` : "Alla frågor är besvarade."}${flagged ? ` ${flagged} är markerad${flagged === 1 ? "" : "e"} för senare.` : ""}</p><button type="button" class="btn" data-no>Fortsätt skriva</button><button type="button" class="btn primary" data-yes>Lämna in</button></div>`;
    $("[data-no]", box).addEventListener("click", () => { examConfirm = false; $("#confirm", box).innerHTML = ""; });
    $("[data-yes]", box).addEventListener("click", () => submitExam(c));
    $("#confirm", box).scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  $("[data-submit]", box).addEventListener("click", () => { examConfirm = true; showConfirm(); });
  if (examConfirm) showConfirm();
  const tick = () => {
    const el = $("#timer"); if (!el) return clearInterval(examTimer);
    const elapsed = Math.floor((Date.now() - run.start) / 1000);
    if (run.limit) {
      const left = run.limit * 60 - elapsed;
      if (left <= 0) { clearInterval(examTimer); submitExam(c, true); return; }
      el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} kvar`;
      el.classList.toggle("low", left <= 60);
    } else el.textContent = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, "0")}`;
  };
  tick(); clearInterval(examTimer); examTimer = setInterval(tick, 1000);
}

async function submitExam(c, timeout) {
  clearInterval(examTimer);
  const run = state.run[c.id]; if (!run) return;
  const box = $("#exam");
  if (box) box.innerHTML = `<div class="panel" style="margin-top:20px"><h3>${timeout ? "Tiden är ute. " : ""}Rättar provet…</h3><p style="margin:0;color:var(--muted)" id="gprog">Kodfrågorna körs mot dolda tester.</p></div>`;
  const per = [];
  for (let i = 0; i < run.items.length; i++) {
    const it = run.items[i], q = qOf(c, it);
    let a = run.ans[i] ? JSON.parse(JSON.stringify(run.ans[i])) : null;
    let ok = false;
    if (q.t === "code") {
      if (a && isAnswered(q, a)) {
        const p = $("#gprog"); if (p) p.textContent = `Kör tester för fråga ${i + 1}…`;
        const r = await runTests(q, a.v, a.lang || "cpp");
        ok = r.every(x => x.pass); a = Object.assign(a, { res: r, ok });
      }
    } else ok = gradeSync(q, a);
    per.push({ l: it.l, i: it.i, perm: it.perm, ans: a, ok, pts: ok ? TYPE_POINTS[q.t] : 0, max: TYPE_POINTS[q.t] });
  }
  const pts = per.reduce((n, x) => n + x.pts, 0), max = per.reduce((n, x) => n + x.max, 0);
  const pct = max ? Math.round(pts / max * 100) : 0;
  const res = { ts: Date.now(), secs: Math.round((Date.now() - run.start) / 1000), pts, max, pct, grade: gradeOf(pct), per, label: run.label };
  state.exams[c.id] = [res, ...(state.exams[c.id] || [])].slice(0, 15);
  delete state.run[c.id];
  examResultIdx = 0; save();
  renderChrome({ view: "exam", course: c });
  renderExam(c); window.scrollTo(0, 0);
}

/* ---------------- result */
let reviewOnlyWrong = false;
function renderResult(c, box, r) {
  const right = r.per.filter(x => x.ok).length;
  const byL = {}, byT = {};
  r.per.forEach(x => {
    const q = qOf(c, x);
    (byL[x.l] = byL[x.l] || { p: 0, m: 0 }); byL[x.l].p += x.pts; byL[x.l].m += x.max;
    (byT[q.t] = byT[q.t] || { p: 0, m: 0 }); byT[q.t].p += x.pts; byT[q.t].m += x.max;
  });
  const bar = (p, m) => { const v = m ? p / m * 100 : 0; return `<span class="mini-bar"><i class="${v < 50 ? "lowv" : v < 75 ? "midv" : ""}" style="width:${v}%"></i></span>`; };
  const R = 52, C = 2 * Math.PI * R, off = C * (1 - r.pct / 100);
  const missed = r.per.filter(x => !x.ok);
  const weakest = Object.entries(byL).filter(([, v]) => v.m && v.p / v.m < .5).sort((a, b) => (a[1].p / a[1].m) - (b[1].p / b[1].m) || b[1].m - a[1].m).slice(0, 4).map(([k]) => k);
  box.innerHTML = `
  <div class="result-hero">
    <svg class="ring" viewBox="0 0 130 130" role="img" aria-label="${r.pct} procent">
      <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"></circle>
      <circle cx="65" cy="65" r="${R}" fill="none" stroke="${r.grade === "IG" ? "var(--bad)" : r.grade === "G" ? "var(--mask)" : "var(--ok)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"></circle>
      <text x="65" y="62" text-anchor="middle" font-size="28" fill="var(--ink)">${r.pct}%</text>
      <text x="65" y="86" text-anchor="middle" font-size="15" fill="var(--muted)">${r.grade}</text>
    </svg>
    <div>
      <div class="eyebrow">Resultat · ${esc(fmtDate(r.ts))}${r.label ? " · " + esc(r.label) : ""}</div>
      <h2>${r.grade === "VG" ? "Väl godkänt." : r.grade === "G" ? "Godkänt." : "Inte godkänt än."} ${r.pts} av ${r.max} poäng.</h2>
      <p>${right} av ${r.per.length} frågor rätt på ${Math.floor(r.secs / 60)} min ${r.secs % 60} s.</p>
      ${weakest.length ? `<p>Repetera: ${weakest.map(id => `<a href="#${c.id}-${id}">${esc(c.lessons[lessonIdx(c, id)].title)}</a>`).join(", ")}.</p>` : ""}
      <div class="cta" style="margin-top:12px">
        <button type="button" class="btn primary" data-again>Nytt prov</button>
        ${missed.length ? `<button type="button" class="btn" data-missed>Öva på de ${missed.length} du missade</button>` : ""}
        <button type="button" class="btn" data-setup>Inställningar och historik</button>
      </div>
    </div>
  </div>
  <div class="exam-setup">
    <div class="panel"><h3>Per lektion</h3><div class="breakdown">${Object.entries(byL).map(([lid, v]) => `<div class="brow"><span>${nn(lessonIdx(c, lid))} ${esc(c.lessons[lessonIdx(c, lid)].title)}</span>${bar(v.p, v.m)}<span>${v.p}/${v.m}</span></div>`).join("")}</div></div>
    <div class="panel"><h3>Per frågetyp</h3><div class="breakdown">${Object.entries(byT).map(([t, v]) => `<div class="brow"><span>${TYPE_LABEL[t]}</span>${bar(v.p, v.m)}<span>${v.p}/${v.m}</span></div>`).join("")}</div></div>
  </div>
  <div class="review-head"><h3>Genomgång</h3><div class="pfilter" style="margin:0"><button type="button" data-rf="0" aria-pressed="${!reviewOnlyWrong}">Alla · ${r.per.length}</button><button type="button" data-rf="1" aria-pressed="${reviewOnlyWrong}">Bara fel · ${missed.length}</button></div></div>
  <div id="review"></div>`;
  const rv = $("#review", box);
  r.per.forEach((x, i) => {
    if (reviewOnlyWrong && x.ok) return;
    const q = qOf(c, x);
    const el = document.createElement("div"); rv.appendChild(el);
    mountQuestion(el, q, { mode: "review", n: i + 1, total: r.per.length, uid: "rv" + i, perm: x.perm, from: "Lektion " + nn(lessonIdx(c, x.l)), ans: x.ans || (q.t === "code" ? { lang: langOf(q, null), v: starterOf(q), res: null } : null) });
    if (!x.ans || !isAnswered(q, x.ans)) el.querySelector(".q").insertAdjacentHTML("beforeend", `<p class="yours"><b>Obesvarad.</b></p>`);
    else if (q.t === "code" && !x.ans.res) el.querySelector(".q").insertAdjacentHTML("beforeend", `<p class="yours">Koden rättades inte.</p>`);
    if (q.t === "code" && x.ans && x.ans.res) el.querySelector("[data-tests]").innerHTML = testsHtml(x.ans.res);
  });
  $$("[data-rf]", box).forEach(b => b.addEventListener("click", () => { reviewOnlyWrong = b.dataset.rf === "1"; renderResult(c, box, r); }));
  $("[data-again]", box).addEventListener("click", () => { const p = examPrefs(c); startExam(c, drawItems(c, p), p); });
  const mb = $("[data-missed]", box);
  if (mb) mb.addEventListener("click", () => startExam(c, shuffle(missed.map(x => { const q = qOf(c, x); return Object.assign({ l: x.l, i: x.i }, q.o ? { perm: shuffle(q.o.map((_, k) => k)) } : {}); })), { time: 0, label: "missade frågor" }));
  $("[data-setup]", box).addEventListener("click", () => { examResultIdx = null; renderExam(c); window.scrollTo(0, 0); });
}

COURSES.forEach(c => {
  INDEX.push({ href: c.id, title: c.title, sub: "Kurs", text: (c.title + " " + c.desc + " kurs").toLowerCase(), w: 4 });
  INDEX.push({ href: c.id + "-prov", title: "Prov: " + c.short, sub: "Slumpat prov med rättning", text: "prov tenta test slumpa betyg rättning quiz frågor " + c.short.toLowerCase(), w: 3 });
  INDEX.push({ href: c.id + "-uppgifter", title: "Uppgifter: " + c.short, sub: "Inlämningar och labbar", text: "uppgifter inlämning inlämningsuppgift datainsamlare gruppuppgift device manager labb miniräknare repetition betyg", w: 2 });
  INDEX.push({ href: c.id + "-resurser", title: "Resurser: " + c.short, sub: "Kursdokument och länkar", text: "resurser källor pdf cppreference github dokument", w: 1 });
  c.lessons.forEach((t, ti) => {
    const href = c.id + "-" + t.id;
    INDEX.push({ href, title: t.title, sub: `${c.short} · Lektion ${nn(ti)} · ${t.cat}`, text: (t.title + " " + t.lead + " " + t.cat).toLowerCase(), w: 3 });
    let si = 0, buf = "", curH = null;
    const flush = () => { if (curH) INDEX.push({ href, sec: `${t.id}-s${si}`, title: curH, sub: `${c.short} · Lektion ${nn(ti)} · ${t.title}`, text: (curH + " " + buf).toLowerCase(), w: 2 }); };
    t.blocks.forEach(b => {
      if (b[0] === "h") { flush(); si++; curH = b[1]; buf = ""; }
      else if (b[0] === "p" || b[0] === "note") buf += " " + strip(b[0] === "p" ? b[1] : b[2]);
      else if (b[0] === "list") buf += " " + strip(b[1].join(" "));
      else if (b[0] === "code") buf += " " + b[2];
      else if (b[0] === "table") buf += " " + strip(b[2].flat().join(" "));
      else if (b[0] === "ex") buf += " " + b[1] + " " + strip(b[2]);
    });
    flush();
  });
});

let sSel = 0;
function openSearch() { $("#scrim").hidden = false; $("#sq").value = ""; runSearch(); setTimeout(() => $("#sq").focus(), 10); }
function closeSearch() { $("#scrim").hidden = true; }
function runSearch() {
  const q = $("#sq").value.trim().toLowerCase();
  let hits;
  if (!q) hits = INDEX.filter(e => e.w >= 3 && !e.sec).slice(0, 14);
  else {
    const words = q.split(/\s+/);
    hits = INDEX.map(e => words.every(w => e.text.includes(w)) ? Object.assign({ s: e.w * 10 + (e.title.toLowerCase().includes(q) ? 20 : 0) }, e) : null)
      .filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 12);
  }
  sSel = 0;
  $("#sres").innerHTML = hits.length ? hits.map((h, i) => `<a href="#${h.href}" data-sec="${h.sec || ""}" class="${i === 0 ? "act" : ""}"><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></a>`).join("")
    : `<div class="empty">Inget matchade "${esc(q)}". Prova ett annat ord, t.ex. pekare, vector eller exception.</div>`;
}
let pendingSec = null;
$("#sres").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  pendingSec = a.dataset.sec || null; closeSearch();
  if (location.hash === a.getAttribute("href")) { e.preventDefault(); route(); }
});
$("#sq").addEventListener("input", runSearch);
$("#sq").addEventListener("keydown", e => {
  const links = $$("#sres a");
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && links.length) {
    e.preventDefault();
    sSel = (sSel + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
    links.forEach((l, i) => l.classList.toggle("act", i === sSel));
    links[sSel].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && links[sSel]) links[sSel].click();
});
$("#searchbtn").addEventListener("click", openSearch);
$("#sclose").addEventListener("click", closeSearch);
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSearch(); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#scrim").hidden ? openSearch() : closeSearch(); }
  else if (e.key === "Escape") { closeSearch(); toggleMenu(false); }
});

/* ================================================================ menu (mobile) */
function toggleMenu(open) {
  const side = $("#side");
  const o = open === undefined ? !side.classList.contains("open") : open;
  side.classList.toggle("open", o);
  $("#menubtn").setAttribute("aria-expanded", o);
}
$("#menubtn").addEventListener("click", () => toggleMenu());
$("#side").addEventListener("click", e => { if (e.target.closest("a")) toggleMenu(false); });

/* ================================================================ router */
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h || h === "hem") return { view: "home" };
  if (h === "lab") return { view: "lab" };
  if (h === "app") return { view: "app" };
  const cid = h.split("-")[0];
  const c = courseById(cid);
  if (!c) {
    // links from the first version (#loopar, #uppgifter, ...)
    const legacy = COURSES[0];
    if (lessonIdx(legacy, h) >= 0) return { redirect: legacy.id + "-" + h };
    if (h === "uppgifter" || h === "resurser") return { redirect: legacy.id + "-" + h };
    return { view: "home" };
  }
  const rest = h.slice(cid.length + 1);
  if (!rest) return { view: "course", course: c };
  if (rest === "prov") return { view: "exam", course: c };
  if (rest === "uppgifter") return { view: "assign", course: c };
  if (rest === "resurser") return { view: "res", course: c };
  if (lessonIdx(c, rest) >= 0) return { view: "lesson", course: c, lesson: rest };
  return { view: "course", course: c };
}
function route() {
  clearInterval(examTimer);
  const ctx = parseHash();
  if (ctx.redirect) { location.replace("#" + ctx.redirect); return; }
  const main = $("#main"), c = ctx.course;
  if (ctx.view === "home") main.innerHTML = viewHome();
  else if (ctx.view === "course") main.innerHTML = viewCourse(c);
  else if (ctx.view === "lesson") main.innerHTML = viewLesson(c, ctx.lesson);
  else if (ctx.view === "assign") { main.innerHTML = viewAssign(c); bindAssign(); }
  else if (ctx.view === "res") main.innerHTML = viewRes(c);
  else if (ctx.view === "exam") { main.innerHTML = viewExamShell(c); examConfirm = false; renderExam(c); }
  else if (ctx.view === "lab") { main.innerHTML = viewLab(); renderLab(); }
  else if (ctx.view === "app") { main.innerHTML = viewApp(); bindApp(); }
  renderChrome(ctx);
  document.title = ctx.view === "home" ? "Nollterm Kurser"
    : ctx.view === "lesson" ? `${c.lessons[lessonIdx(c, ctx.lesson)].title} · ${c.short}`
    : ctx.view === "exam" ? `Prov · ${c.short}` : ctx.view === "lab" ? "Kodlabb · Nollterm" : ctx.view === "app" ? "Appen · Nollterm" : `${c.short} · Nollterm`;
  $$(".article pre code[class^='language-']", main).forEach(el => { try { window.hljs && hljs.highlightElement(el); } catch (e) {} });
  if (ctx.view === "lesson") bindLesson(c, ctx.lesson);
  if (pendingSec && document.getElementById(pendingSec)) {
    const el = document.getElementById(pendingSec); pendingSec = null;
    setTimeout(() => el.scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
}
function bindCopy(root) {
  root.addEventListener("click", e => {
    const b = e.target.closest(".copy"); if (!b) return;
    const code = b.closest(".codewrap").querySelector("code");
    const ok = () => { b.textContent = "Kopierat"; setTimeout(() => (b.textContent = "Kopiera"), 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Markerat, tryck Ctrl+C"; };
    try { navigator.clipboard.writeText(code.innerText).then(ok, fallback); } catch (err) { fallback(); }
  });
}
bindCopy($("#main"));
window.addEventListener("hashchange", route);
route();

</script>
</html>
