llkor, loopar, funktioner och pekare.","topics":["kom-igang","villkor","loopar","funktioner"]}],"links":[{"k":"Ref","t":"cppreference.com","u":"https://en.cppreference.com/w/","d":"Referensen kursen hänvisar till. Slå upp varje nytt begrepp här, både C och C++."},{"k":"Repo","t":"Kursens GitHub-repo (c-cpp-cj)","u":"https://github.com/CalleFreme/c-cpp-cj","d":"Exempelkod, buggyLoops.cpp och DeviceManager-basprogrammet."},{"k":"Git","t":"Pro Git (gratis bok)","u":"https://git-scm.com/book/sv/v2","d":"Hela Git-boken, delvis på svenska."},{"k":"Docs","t":"Visual Studio: debugga C++","u":"https://learn.microsoft.com/visualstudio/debugger/getting-started-with-the-debugger-cpp","d":"Breakpoints, stegning och Locals-fönstret."}]},{"id":"oop","badge":"OOP","title":"Objektorienterad programmering och design","short":"OOP","tag":"C++ · Design","desc":"Klasser, inkapsling, komposition, arv, polymorfism och designmönster i C++, med IoT- och spelexempel.","headline":"Objekt som <em>samarbetar</em>.","lessons":[{"id":"klasser-typer","cat":"Grunder","min":10,"title":"Klasser och egna typer","lead":"Från data och funktioner till objekt med ansvar: vad en typ är, struct och class, konstruktorer, const och this.","src":["Tisdag 28/10 – Klasser","Övningsuppgifter Dag 1 – klasser och structs"],"goals":["Förklara vad en typ är och varför vi skapar egna typer","Skilja på struct och class och använda konstruktorer med initieringslista","Förklara const-metoder och this-pekaren","Dela upp en klass i .h och .cpp"],"blocks":[["h","Hur kom vi hit?"],["p","I C/C++-kursen tänkte vi ofta \"C-aktigt\": data först, funktioner sen. Nu går vi över till att tänka i <strong>objekt</strong>: delar med ett eget ansvar som samarbetar i ett system. Historiskt gick utvecklingen från procedurprogrammering (funktioner + data) via modulprogrammering till objektorienterad programmering (OOP) med klasser och objekt."],["p","I IoT och inbyggda system finns många samverkande komponenter: sensorer, aktuatorer, kommunikation. OOP hjälper oss att hålla isär dem. En luftkvalitetssensor mäter, har ett namn och kanske en intern klocka. Det är mer än ett <code>double</code>-värde. Det är ett objekt med beteende."],["h","Vad är en typ?"],["p","<strong>En typ definierar vilka värden en variabel kan ha och vilka operationer som är tillåtna.</strong> <code>int</code>, <code>double</code> och <code>char</code> är primitiva typer."],["list",["<strong>Säkerhet:</strong> kompilatorn upptäcker fel, som att lägga ihop en sträng och en sensor.","<strong>Struktur:</strong> programmet organiseras kring begrepp.","<strong>Läsbarhet:</strong> andra förstår vad datan betyder."]],["p","Men primitiva typer säger inget om beteende, relationer, ansvar eller livscykel. Därför skapar vi egna typer med <code>struct</code> och <code>class</code>: data <em>och</em> beteende i samma enhet."],["code","cpp","int temperature = 22;      // ett tal, men vad betyder det?\ndouble voltage = 3.3;\n\nstruct Point {             // egen typ: data som hör ihop\n    double x;\n    double y;\n};\n\nclass Sensor {             // egen typ: data + beteende\npublic:\n    std::string name;\n    double value;\n    void read() { value = 42.0; }   // simulerad läsning\n};"],["h","struct eller class?"],["list",["<code>struct</code>: alla medlemmar är <strong>public</strong> som standard.","<code>class</code>: alla medlemmar är <strong>private</strong> som standard."]],["p","Annars är de identiska. Konventionen: struct för enkla datapaket (<code>Position</code>, <code>SensorReading</code>), class när objektet har regler och ett gränssnitt (<code>Device</code>, <code>Logger</code>). Ställ tre frågor när du designar: <em>Vad representerar objektet? Vilka egenskaper har det? Vilket ansvar ska det ha?</em>"],["code","cpp","struct Position {\n    double x;\n    double y;\n    void move(double dx, double dy) { x += dx; y += dy; }\n    void print() const { std::cout << \"(\" << x << \", \" << y << \")\\n\"; }\n};\n\nclass Device {\nprivate:\n    int id;\n    std::string name;\npublic:\n    Device(int id, const std::string& name)\n        : id(id), name(name) {}               // initieringslista\n\n    void rename(const std::string& newName) { name = newName; }\n    void printInfo() const { std::cout << \"Device \" << id << \": \" << name << \"\\n\"; }\n};","repetition"],["h","const-metoder och this"],["p","<code>const</code> efter parameterlistan lovar att metoden inte ändrar objektet. Då kan den anropas på konstanta objekt och via <code>const&amp;</code>, och kompilatorn stoppar oavsiktliga ändringar."],["p","<code>this</code> är en pekare till objektet som metoden anropas på. Den behövs sällan, men är praktisk när en parameter har samma namn som en medlem, eller när en metod ska returnera objektet självt."],["code","cpp","class Counter {\n    int count = 0;\npublic:\n    Counter& increment() {       // returnerar *this → anrop kan kedjas\n        this->count++;\n        return *this;\n    }\n    int value() const { return count; }\n};\n\nCounter c;\nc.increment().increment().increment();\nstd::cout << c.value();          // 3"],["h","Kursens mål i korthet"],["table",["Kod","Mål","Exempel"],[["KUN8","Kunskaper om OOP","Vad är ett objekt, en klass, och hur hänger de ihop?"],["KUN9","Utvecklingsmiljö","Bygga ett program med flera .cpp/.h-filer"],["KUN10","Polymorfism och arv","Introduceras tidigt, fördjupas senare"],["KUN11","Kompilerade vs interpreterade språk","C++ kompileras, Python interpreteras"],["KUN12","UML","Rita klassdiagram för att modellera objekt"],["F10–F14","Färdigheter","Söka info, strukturera kod, sätta upp miljö, hitta buggar, kommunicera lösningar"],["KOM6–KOM8","Kompetenser","Utveckla IoT-mjukvara, utvärdera och förbättra, professionell utveckling"]]],["h","Övningar (Dag 1)"],["ex","Position och Device i egna filer","<ol><li>Deklarera <code>struct Position</code> i <code>Position.h</code>, implementera <code>move</code> och <code>print</code> i <code>Position.cpp</code>. print ska skriva <code>Position(x=…, y=…)</code>.</li><li>Gör samma sak med <code>class Device</code>: konstruktor, <code>rename</code> och <code>printInfo</code>.</li><li>I <code>main.cpp</code>: skapa objekten, flytta och byt namn, skriv ut och verifiera.</li></ol><p>Tips: prova i Kodlabbet i desktop-appen, som klarar flera filer.</p>"],["ex","Sensor, SensorReading och Logger","<p>Ett IoT-system ska läsa en sensor, paketera värdet som en <code>SensorReading</code> och logga det.</p><ul><li><code>struct SensorReading { double value; std::string timestamp; void print() const; }</code></li><li><code>class Sensor</code> med <code>read()</code> som returnerar en SensorReading (dummyvärde 42.0) och <code>getName()</code>.</li><li><code>class Logger</code> med <code>log(const SensorReading&amp;, const std::string&amp; sensorName) const</code>.</li></ul>","SensorReading Sensor::read() const {\n    return SensorReading{42.0, \"2025-10-28 14:35\"};\n}\n\nvoid Logger::log(const SensorReading& r, const std::string& sensorName) const {\n    std::cout << sensorName << \": \";\n    r.print();\n}","cpp"],["ex","Luftkvalitetssystem (komposition)","<p><code>AirSensor</code> har ett namn och <code>read()</code>. <code>AirMonitor</code> har en <code>std::vector&lt;AirSensor&gt;</code> och <code>logAll()</code> som läser varje sensor och loggar med Logger. Skapa tre sensorer och anropa logAll().</p>"],["ex","Parkeringshus","<p><code>struct Car { std::string regNumber; std::string arrivalTime; void print() const; }</code> och <code>class ParkingHouse</code> med <code>addCar</code>, <code>removeCar</code> (returnerar true/false) och <code>printStatus</code>.</p>","bool ParkingHouse::removeCar(const std::string& regNumber) {\n    for (auto it = cars.begin(); it != cars.end(); ++it) {\n        if (it->regNumber == regNumber) {\n            cars.erase(it);\n            return true;\n        }\n    }\n    return false;\n}","cpp"]],"pool":[{"t":"mc","q":"Vad definierar en typ?","o":["Bara hur mycket minne en variabel tar","Vilka värden en variabel kan ha och vilka operationer som är tillåtna","Vilken fil koden ligger i","Variabelns namn"],"a":1,"why":"En typ beskriver både värdemängden och de tillåtna operationerna. Därför kan kompilatorn hitta fel."},{"t":"mc","q":"Vad är skillnaden mellan <code>struct</code> och <code>class</code> i C++?","o":["Structs kan inte ha metoder","Standardåtkomsten: public i struct, private i class","Klasser måste skapas med new","Structs kan inte ha konstruktorer"],"a":1,"why":"Det är den enda språkliga skillnaden. Valet handlar om vad du vill signalera."},{"t":"mc","q":"Vad betyder <code>void print() const;</code>?","o":["print returnerar en konstant","print ändrar inte objektets medlemmar","print kan bara anropas en gång","print är private"],"a":1,"why":"En const-metod kan anropas på <code>const</code>-objekt och via <code>const&amp;</code>."},{"t":"mc","q":"Vad är <code>this</code> inuti en metod?","o":["En kopia av objektet","En pekare till objektet som metoden anropas på","Klassens namn","En referens till main"],"a":1,"why":"<code>this-&gt;count</code> och <code>count</code> betyder samma sak inuti en metod. <code>*this</code> är själva objektet."},{"t":"mc","q":"Varför använder vi initieringslistan i konstruktorn?","o":["Den krävs alltid","Medlemmarna initieras direkt istället för att först skapas och sedan tilldelas","Den gör medlemmarna private","Den anropar destruktorn"],"a":1,"why":"<code>: id(id), name(name)</code> bygger medlemmarna med rätt värde direkt. const-medlemmar och referenser <em>måste</em> initieras där."},{"t":"multi","q":"Vilka av följande är sanna om en klass i C++? Välj alla.","o":["Den kan ha både data och metoder","Medlemmar är private som standard","Den måste ha en destruktor","Den kan ha flera konstruktorer"],"a":[0,1,3],"why":"Kompilatorn skapar en destruktor åt dig om du inte skriver en."},{"t":"mc","q":"Vad returnerar <code>*this</code> i en metod?","o":["En pekare till objektet","Objektet självt (som referens om returtypen är en referens)","Klassens namn","nullptr"],"a":1,"why":"<code>this</code> är pekaren, <code>*this</code> är objektet. <code>Counter&amp; increment() { ...; return *this; }</code> gör att anrop kan kedjas."},{"t":"text","q":"Vilket nyckelord efter parameterlistan lovar att en metod inte ändrar objektet?","accept":["const"],"ph":"nyckelord","why":"<code>void print() const;</code>"},{"t":"text","q":"Vilken filändelse har filen som innehåller klassens <em>deklaration</em>, enligt kursens konvention?","accept":[".h","h",".hpp","hpp"],"ph":".?","why":"Deklarationen i <code>.h</code>, implementationen i <code>.cpp</code>."},{"t":"code","q":"Skriv klassen <code>Counter</code> med en privat räknare som startar på 0, en metod <code>increment()</code> och en const-metod <code>value()</code>. main läser n och anropar increment n gånger.","why":"Räknaren är private och nås bara via metoderna. <code>value()</code> är const eftersom den bara läser.","task":"01-klasser-typer-1","tests":[{"in":"3\n","out":"3\n"},{"in":"0\n","out":"0\n"},{"in":"42\n","out":"42\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nclass Counter {\n    // privat räknare\n\npublic:\n    // increment() och value()\n\n};\n\nint main() {\n    int n;\n    cin >> n;\n    Counter c;\n    for (int i = 0; i < n; i++) c.increment();\n    cout << c.value() << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass Counter {\n    int count_ = 0;\npublic:\n    void increment() { count_++; }\n    int value() const { return count_; }\n};\n\nint main() {\n    int n;\n    cin >> n;\n    Counter c;\n    for (int i = 0; i < n; i++) c.increment();\n    cout << c.value() << endl;\n    return 0;\n}\n"},"py":{"starter":"class Counter:\n    # privat räknare som startar på 0, increment() och value()\n    pass\n\n\nn = int(input())\nc = Counter()\nfor _ in range(n):\n    c.increment()\nprint(c.value())\n","sol":"class Counter:\n    def __init__(self):\n        self._count = 0          # _ betyder \"privat\" enligt konvention\n\n    def increment(self):\n        self._count += 1\n\n    def value(self):\n        return self._count\n\n\nn = int(input())\nc = Counter()\nfor _ in range(n):\n    c.increment()\nprint(c.value())\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Implementera <code>Position::move</code> och <code>Position::print</code>. print ska skriva <code>Position(x=X, y=Y)</code>.","why":"<code>Position::</code> knyter definitionen till structen, och print behåller sin <code>const</code> även i definitionen.","task":"01-klasser-typer-2","tests":[{"in":"0 0 3 -1.5\n","out":"Position(x=3, y=-1.5)\n"},{"in":"1 2 1 1\n","out":"Position(x=2, y=3)\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nstruct Position {\n    double x;\n    double y;\n    void move(double dx, double dy);\n    void print() const;\n};\n\n// implementera move och print här\n\n\nint main() {\n    double x, y, dx, dy;\n    cin >> x >> y >> dx >> dy;\n    Position p{x, y};\n    p.move(dx, dy);\n    p.print();\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nstruct Position {\n    double x;\n    double y;\n    void move(double dx, double dy);\n    void print() const;\n};\n\nvoid Position::move(double dx, double dy) {\n    x += dx;\n    y += dy;\n}\n\nvoid Position::print() const {\n    cout << \"Position(x=\" << x << \", y=\" << y << \")\" << endl;\n}\n\nint main() {\n    double x, y, dx, dy;\n    cin >> x >> y >> dx >> dy;\n    Position p{x, y};\n    p.move(dx, dy);\n    p.print();\n    return 0;\n}\n"},"py":{"starter":"class Position:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def move(self, dx, dy):\n        pass\n\n    def print(self):\n        # skriv Position(x=…, y=…) med :g-format\n        pass\n\n\nx, y, dx, dy = map(float, input().split())\np = Position(x, y)\np.move(dx, dy)\np.print()\n","sol":"class Position:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def move(self, dx, dy):\n        self.x += dx\n        self.y += dy\n\n    def print(self):\n        print(f\"Position(x={self.x:g}, y={self.y:g})\")\n\n\nx, y, dx, dy = map(float, input().split())\np = Position(x, y)\np.move(dx, dy)\np.print()\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tis 28/10"},{"id":"inkapsling","cat":"Design","min":7,"title":"Inkapsling och gränssnitt","lead":"Skydda objektets data och ge det ett litet, stabilt gränssnitt: access-nivåer, getters och setters i idiomatisk C++.","src":["Torsdag 30/10 – Inkapsling, komposition"],"goals":["Förklara inkapsling och varför den minskar buggar","Använda public, protected och private","Skriva idiomatiska accessorer som <code>value()</code> och <code>setValue()</code>"],"blocks":[["h","Vad är inkapsling?"],["p","Inkapsling handlar om att avgränsa vad som syns från utsidan av ett objekt. Vi vill:"],["list",["skydda intern data från direkt åtkomst,","förhindra oavsiktliga eller felaktiga ändringar,","exponera ett tydligt och stabilt gränssnitt utåt."]],["code","cpp","class Example {\npublic:\n    void doSomething();     // synligt och åtkomligt utifrån\nprotected:\n    // åtkomligt i subklasser men inte utifrån\nprivate:\n    int internalValue;      // bara inom den här klassen\n};"],["code","cpp","class TemperatureSensor {\nprivate:\n    double currentValue = 0.0;\npublic:\n    void read() { currentValue = 23.5; }          // simulerad läsning\n    double value() const { return currentValue; } // kontrollerad läsning\n};","data skyddas, läsning sker via en metod"],["h","Getters och setters i C++"],["p","Python och C# har <em>properties</em>. I C++ använder vi metoder, men namnger dem så att anropen läses naturligt:"],["code","cpp","// mindre idiomatiskt\ndouble getValue();\nvoid setValue(double);\n\n// mer idiomatiskt i modern C++\ndouble value() const;\nvoid setValue(double v);\n\nsensor.setValue(25.0);\nstd::cout << sensor.value();"],["p","Ett vanligt mönster är att ge privata medlemmar ett suffix <code>_</code> så att accessorn kan heta som begreppet:"],["code","cpp","class Device {\nprivate:\n    int id_;\n    std::string name_;\npublic:\n    Device(int id, const std::string& name) : id_{id}, name_{name} {}\n    const std::string& name() const { return name_; }\n    void rename(const std::string& newName) { name_ = newName; }\n};"],["h","En setter som skyddar invarianter"],["p","Värdet av inkapsling syns när setter-metoden har en regel. En <strong>invariant</strong> är något som alltid ska vara sant för objektet, till exempel att en ljusstyrka ligger mellan 0 och 100."],["code","cpp","class Lamp {\n    int brightness_ = 0;          // invariant: 0–100\npublic:\n    void setBrightness(int b) {\n        if (b < 0) b = 0;\n        if (b > 100) b = 100;\n        brightness_ = b;\n    }\n    int brightness() const { return brightness_; }\n};"],["note","tip","Skriv inte getters och setters för varje medlem av ren vana. Fråga vad användaren av klassen behöver göra. Ofta är <code>lamp.dim(10)</code> ett bättre gränssnitt än <code>lamp.setBrightness(lamp.brightness() - 10)</code>."]],"pool":[{"t":"mc","q":"Vad är huvudsyftet med inkapsling?","o":["Att koden ska gå snabbare","Att skydda intern data och exponera ett tydligt gränssnitt","Att undvika arv","Att kunna använda pekare"],"a":1,"why":"Objektet kontrollerar själv hur dess data får ändras."},{"t":"mc","q":"Vem kommer åt en <code>protected</code>-medlem?","o":["Alla","Bara klassen själv","Klassen och dess subklasser","Bara main"],"a":2,"why":"protected är private utåt men synlig i klasser som ärver."},{"t":"mc","q":"Vilket accessor-namn är mest idiomatiskt i modern C++?","o":["<code>double getValue()</code>","<code>double value() const</code>","<code>double GetTheValue()</code>","<code>double value_get()</code>"],"a":1,"why":"Kort namn och <code>const</code> eftersom metoden bara läser."},{"t":"mc","q":"Vad är en invariant?","o":["En variabel som aldrig används","Ett villkor som alltid ska gälla för objektet","En konstant global variabel","En virtuell funktion"],"a":1,"why":"Till exempel att ljusstyrkan alltid ligger mellan 0 och 100. Settern ser till att den håller."},{"t":"mc","q":"Varför ska getters som bara läser vara const?","o":["Det gör dem snabbare","Så att de kan anropas på konstanta objekt och inte råkar ändra något","Det krävs av kompilatorn","För att de ska bli private"],"a":1,"why":"Ett objekt som skickas som <code>const Device&amp;</code> kan bara använda const-metoder."},{"t":"multi","q":"Vilka är fördelar med inkapsling? Välj alla.","o":["Färre buggar eftersom data inte ändras direkt utifrån","Implementationen kan bytas utan att användarna påverkas","Programmet blir alltid snabbare","Klassen kan garantera sina invarianter"],"a":[0,1,3],"why":"Inkapsling handlar om korrekthet och underhåll, inte om hastighet."},{"t":"mc","q":"<code>sensor.currentValue = -999;</code> ger kompileringsfel. Varför?","o":["currentValue är private","currentValue är const","Negativa tal är förbjudna","sensor är en pekare"],"a":0,"why":"Private-medlemmar kan bara nås inifrån klassen."},{"t":"text","q":"Vilken åtkomstnivå gör en medlem synlig i subklasser men inte utåt?","accept":["protected"],"ph":"nyckelord","why":"<code>protected</code>"},{"t":"text","q":"Vad kallas ett villkor som alltid ska gälla för ett objekt, till exempel att ljusstyrkan ligger mellan 0 och 100?","accept":["invariant","en invariant","klassinvariant"],"ph":"begrepp","why":"En invariant. Setter-metoderna ser till att den håller."},{"t":"code","q":"Skriv klassen <code>Lamp</code> med en privat ljusstyrka (startar på 0), <code>setBrightness(int)</code> som begränsar värdet till 0–100, och <code>brightness()</code>. main läser värden tills indata tar slut och skriver ut ljusstyrkan efter varje.","why":"Settern skyddar invarianten: inget värde utanför 0–100 kan någonsin lagras.","task":"02-inkapsling-1","tests":[{"in":"50 150 -5 100\n","out":"50\n100\n0\n100\n"},{"in":"0\n","out":"0\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nclass Lamp {\n\n};\n\nint main() {\n    Lamp lamp;\n    int v;\n    while (cin >> v) {\n        lamp.setBrightness(v);\n        cout << lamp.brightness() << endl;\n    }\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass Lamp {\n    int brightness_ = 0;\npublic:\n    void setBrightness(int b) {\n        if (b < 0) b = 0;\n        if (b > 100) b = 100;\n        brightness_ = b;\n    }\n    int brightness() const { return brightness_; }\n};\n\nint main() {\n    Lamp lamp;\n    int v;\n    while (cin >> v) {\n        lamp.setBrightness(v);\n        cout << lamp.brightness() << endl;\n    }\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Lamp:\n    pass\n\n\nlamp = Lamp()\nfor v in sys.stdin.read().split():\n    lamp.set_brightness(int(v))\n    print(lamp.brightness)\n","sol":"import sys\n\n\nclass Lamp:\n    def __init__(self):\n        self._brightness = 0\n\n    @property                        # läses som lamp.brightness\n    def brightness(self):\n        return self._brightness\n\n    def set_brightness(self, b):\n        self._brightness = max(0, min(100, b))   # invariant: 0–100\n\n\nlamp = Lamp()\nfor v in sys.stdin.read().split():\n    lamp.set_brightness(int(v))\n    print(lamp.brightness)\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 30/10"},{"id":"komposition-uml","cat":"Design","min":8,"title":"Komposition och UML","lead":"Bygg klasser av andra klasser och rita relationerna som UML-klassdiagram.","src":["Torsdag 30/10 – Inkapsling, komposition","Övningsuppgifter Dag 1 (block 3)","UML-avsnittet kompletterat av Nollterm"],"goals":["Förklara komposition som en har-en-relation","Bygga klasser som innehåller andra objekt","Läsa och rita ett enkelt UML-klassdiagram"],"blocks":[["h","Vad är komposition?"],["p","Komposition betyder att en klass innehåller andra klasser som medlemmar. Den är lättare att förstå än arv och mycket vanlig i inbyggda system. Relationen är <strong>har-en</strong>: <em>a robot has a position</em>."],["code","cpp","class Position {\npublic:\n    double x, y;\n    Position(double x, double y) : x{x}, y{y} {}\n};\n\nclass Robot {\nprivate:\n    std::string name_;\n    Position pos_;                          // Robot HAR EN Position\npublic:\n    Robot(const std::string& name) : name_{name}, pos_{0.0, 0.0} {}\n    void move(double dx, double dy) { pos_.x += dx; pos_.y += dy; }\n    void printStatus() const {\n        std::cout << name_ << \" at (\" << pos_.x << \", \" << pos_.y << \")\\n\";\n    }\n};"],["p","Delarna skapas tillsammans med helheten och förstörs med den. Kompositionen kan också vara en samling: <code>AirMonitor</code> har flera <code>AirSensor</code>, <code>ParkingHouse</code> har flera <code>Car</code>."],["code","cpp","class AirMonitor {\n    std::vector<AirSensor> sensors_;\n    Logger logger_;\npublic:\n    void addSensor(const AirSensor& s) { sensors_.push_back(s); }\n    void logAll() const {\n        for (const auto& s : sensors_) logger_.log(s.read(), s.name());\n    }\n};"],["h","UML-klassdiagram"],["p","UML (Unified Modeling Language) är ett standardiserat sätt att rita klasser och deras relationer. En klass ritas som en låda i tre fack: <strong>namn</strong>, <strong>attribut</strong> och <strong>operationer</strong>. Tecknet före varje medlem visar åtkomsten."],["code","bash","┌───────────────────────────┐\n│          Robot            │\n├───────────────────────────┤\n│ - name_ : string          │\n│ - pos_ : Position         │\n├───────────────────────────┤\n│ + Robot(name : string)    │\n│ + move(dx, dy : double)   │\n│ + printStatus() : void    │\n└───────────────────────────┘","UML-klass"],["table",["Symbol","Betyder"],[["<code>+</code>","public"],["<code>-</code>","private"],["<code>#</code>","protected"],["<code>namn : Typ</code>","attribut med typ"],["<code>op(p : Typ) : Retur</code>","operation med parametrar och returtyp"]]],["table",["Relation","Ritas","Exempel"],[["Komposition (äger, samma livstid)","linje med fylld romb vid helheten ◆","Robot ◆── Position"],["Aggregation (har, men äger inte)","linje med ofylld romb ◇","Team ◇── Player"],["Arv (är-en)","linje med ofylld triangel mot basklassen △","TempSensor ──▷ Sensor"],["Beroende (använder)","streckad pil","Logger - - > SensorReading"]]],["p","Multiplicitet skrivs vid linjens ände: <code>1</code>, <code>0..1</code>, <code>*</code> (många). <code>AirMonitor ◆── * AirSensor</code> betyder att en monitor äger många sensorer."],["note","tip","Rita diagrammet innan du kodar. Det tvingar fram frågorna: vem äger vad, vem anropar vem, och vilket ansvar har varje klass?"],["h","Övning"],["ex","Rita och bygg luftkvalitetssystemet","<ol><li>Rita UML för <code>AirSensor</code>, <code>AirMonitor</code>, <code>Logger</code> och <code>SensorReading</code> med åtkomst, typer och relationer.</li><li>Markera var det är komposition och var det bara är ett beroende.</li><li>Implementera och jämför koden med diagrammet.</li></ol>"]],"pool":[{"t":"mc","q":"Vilken relation beskriver komposition?","o":["är-en","har-en","använder ibland","ärver från"],"a":1,"why":"En Robot har en Position. Arv är är-en."},{"t":"mc","q":"Vad betyder <code>-</code> framför ett attribut i UML?","o":["public","private","protected","static"],"a":1,"why":"<code>+</code> public, <code>-</code> private, <code>#</code> protected."},{"t":"mc","q":"Hur ritas arv i ett UML-klassdiagram?","o":["Linje med fylld romb","Linje med ofylld triangel som pekar mot basklassen","Streckad linje utan pil","Dubbel linje"],"a":1,"why":"Triangeln pekar alltid mot den mer generella klassen."},{"t":"mc","q":"Vilka tre fack har en UML-klass?","o":["Namn, attribut, operationer","Namn, filer, tester","Public, private, protected","Header, källkod, main"],"a":0,"why":"Namn överst, sedan data, sist metoder."},{"t":"mc","q":"<code>AirMonitor</code> innehåller <code>std::vector&lt;AirSensor&gt;</code>. Vad är det?","o":["Arv","Komposition","Polymorfism","Ett designmönster"],"a":1,"why":"Monitorn äger sina sensorer. De skapas och förstörs med den."},{"t":"mc","q":"Vilken relation är aggregation snarare än komposition?","o":["En Robot har en Position som skapas med roboten","Ett Team har Players som kan finnas kvar när laget upplöses","Ett Hus har Rum som rivs med huset","En Car har en Engine som byggs in"],"a":1,"why":"Aggregation: helheten har delarna men äger inte deras livstid."},{"t":"multi","q":"Vad visar ett UML-klassdiagram? Välj alla.","o":["Klassernas attribut och operationer","Åtkomst (+, -, #)","Relationer som arv och komposition","Exakt i vilken ordning koden körs"],"a":[0,1,2],"why":"Körordning visas i sekvensdiagram, inte klassdiagram."},{"t":"text","q":"Vilket tecken markerar protected i UML?","accept":["#"],"ph":"tecken","why":"<code>+</code> public, <code>-</code> private, <code>#</code> protected."},{"t":"text","q":"Hur skrivs multipliciteten \"många\" i UML?","accept":["*","0..*","1..*"],"ph":"symbol","why":"<code>*</code> (eller <code>0..*</code>)."},{"t":"code","q":"Komposition: <code>Robot</code> har en <code>Position</code>. Implementera <code>Robot::move</code> och <code>Robot::printStatus</code> som skriver <code>NAMN at (X, Y)</code>.","why":"Roboten delegerar positionen till sin Position-medlem. Den har en position, den är inte en.","task":"03-komposition-uml-1","tests":[{"in":"R2D2 1 2 3 -1\n","out":"R2D2 at (4, 1)\n"},{"in":"Wall-E\n","out":"Wall-E at (0, 0)\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Position {\n    double x, y;\n};\n\nclass Robot {\n    string name_;\n    Position pos_;\npublic:\n    Robot(const string& name) : name_{name}, pos_{0.0, 0.0} {}\n    void move(double dx, double dy);\n    void printStatus() const;\n};\n\n// implementera här\n\n\nint main() {\n    string name;\n    cin >> name;\n    Robot r(name);\n    double dx, dy;\n    while (cin >> dx >> dy) r.move(dx, dy);\n    r.printStatus();\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Position {\n    double x, y;\n};\n\nclass Robot {\n    string name_;\n    Position pos_;\npublic:\n    Robot(const string& name) : name_{name}, pos_{0.0, 0.0} {}\n    void move(double dx, double dy);\n    void printStatus() const;\n};\n\nvoid Robot::move(double dx, double dy) {\n    pos_.x += dx;\n    pos_.y += dy;\n}\n\nvoid Robot::printStatus() const {\n    cout << name_ << \" at (\" << pos_.x << \", \" << pos_.y << \")\" << endl;\n}\n\nint main() {\n    string name;\n    cin >> name;\n    Robot r(name);\n    double dx, dy;\n    while (cin >> dx >> dy) r.move(dx, dy);\n    r.printStatus();\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Position:\n    def __init__(self, x=0.0, y=0.0):\n        self.x = x\n        self.y = y\n\n\nclass Robot:\n    def __init__(self, name):\n        self._name = name\n        self._pos = Position()       # Robot HAR EN Position\n\n    def move(self, dx, dy):\n        pass\n\n    def print_status(self):\n        pass\n\n\ndata = sys.stdin.read().split()\nr = Robot(data[0])\nnums = [float(v) for v in data[1:]]\nfor i in range(0, len(nums) - 1, 2):\n    r.move(nums[i], nums[i + 1])\nr.print_status()\n","sol":"import sys\n\n\nclass Position:\n    def __init__(self, x=0.0, y=0.0):\n        self.x = x\n        self.y = y\n\n\nclass Robot:\n    def __init__(self, name):\n        self._name = name\n        self._pos = Position()       # Robot HAR EN Position\n\n    def move(self, dx, dy):\n        self._pos.x += dx\n        self._pos.y += dy\n\n    def print_status(self):\n        print(f\"{self._name} at ({self._pos.x:g}, {self._pos.y:g})\")\n\n\ndata = sys.stdin.read().split()\nr = Robot(data[0])\nnums = [float(v) for v in data[1:]]\nfor i in range(0, len(nums) - 1, 2):\n    r.move(nums[i], nums[i + 1])\nr.print_status()\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 30/10"},{"id":"arv","cat":"Arv","min":9,"title":"Arv och konstruktorordning","lead":"Bygg nya klasser på befintliga, förstå i vilken ordning objekt byggs och rivs, och välj mellan arv och komposition.","src":["Tisdag 4/11 – Arv"],"goals":["Skapa basklasser och subklasser med public-arv","Förklara konstruktor- och destruktorordningen","Anropa basklassens konstruktor från subklassen","Välja arv (är-en) eller komposition (har-en)"],"blocks":[["h","Vad är arv?"],["p","Arv låter oss skapa nya klasser som bygger på befintliga. Med arv kan vi återanvända kod från en <strong>basklass</strong>, utöka eller ändra beteendet i en <strong>subklass</strong> (derived class), och skapa logiska hierarkier."],["code","cpp","class Animal {\nprotected:\n    std::string name_;\npublic:\n    Animal(const std::string& name) : name_{name} {\n        std::cout << \"Animal-konstruktor\\n\";\n    }\n    void speak() const { std::cout << name_ << \" gör ett ljud.\\n\"; }\n};\n\nclass Dog : public Animal {\npublic:\n    Dog(const std::string& name) : Animal(name) {      // anropa basens konstruktor\n        std::cout << \"Dog-konstruktor\\n\";\n    }\n    void wagTail() const { std::cout << name_ << \" viftar på svansen.\\n\"; }\n};\n\nint main() {\n    Dog d(\"Fido\");\n    d.speak();      // ärvs från Animal\n    d.wagTail();    // finns bara i Dog\n}"],["code","bash","Animal-konstruktor\nDog-konstruktor\nFido gör ett ljud.\nFido viftar på svansen.","utdata"],["h","Begrepp"],["table",["Begrepp","Förklaring"],[["Base class","klassen som andra ärver från"],["Derived class","klassen som ärver"],["public-arv","det vanliga: basens publika gränssnitt är publikt även i subklassen (<code>class Dog : public Animal</code>)"],["protected","medlemmar som syns i subklasser men inte utåt"]]],["h","Konstruktor- och destruktorordning"],["p","När ett subklassobjekt skapas byggs <strong>basen först</strong>, sedan subklassen. Destruktorerna körs i <strong>omvänd ordning</strong>: subklassen rivs först. Tänk dig ett hus: grunden byggs först och rivs sist."],["widget","ctororder"],["list",["Subklassen ärver <strong>inte</strong> basens konstruktorer.","Har basen ingen standardkonstruktor måste du anropa rätt konstruktor i initieringslistan: <code>TemperatureSensor(const std::string&amp; id) : Sensor(id) {}</code>.","En basklass i en polymorf hierarki ska ha en <code>virtual</code> destruktor (mer om det i lektionen om polymorfism)."]],["h","Vad ärvs?"],["p","Subklassen kommer åt basens <code>public</code>- och <code>protected</code>-medlemmar. <code>private</code>-medlemmar finns kvar i objektet men går inte att nå direkt från subklassen."],["code","cpp","class Base {\nprotected:\n    int protected_value = 42;\nprivate:\n    int private_value = 100;\n};\n\nclass Derived : public Base {\npublic:\n    void print() {\n        std::cout << protected_value << \"\\n\";    // OK\n        // std::cout << private_value;          // fel: inte åtkomlig\n    }\n};"],["h","Arv eller komposition?"],["table",["Relation","Välj","Exempel"],[["är-en","arv","en TemperatureSensor är en Sensor, en Dog är ett Animal"],["har-en","komposition","en Car har en Engine, en SensorStation har flera Sensor"]]],["note","warn","Ärv inte bara för att återanvända kod. Om du inte kan säga \"X är en Y\" utan att det låter fel, använd komposition."],["h","Övning"],["ex","Sensorhierarki","<p>Skapa <code>Sensor</code> med ett skyddat <code>id_</code> och en konstruktor som skriver ut att sensorn skapas. Låt <code>TemperatureSensor</code> och <code>HumiditySensor</code> ärva och anropa basens konstruktor. Skapa ett objekt av varje och studera utskrifterna.</p>"]],"pool":[{"t":"mc","q":"<code>class Car : public Vehicle</code>. Vilken konstruktor körs först när du skapar en Car?","o":["Car","Vehicle","Det är odefinierat","Bara Car körs"],"a":1,"why":"Basen byggs alltid först, sedan subklassen."},{"t":"mc","q":"I vilken ordning körs destruktorerna för ett Car-objekt?","o":["Vehicle, sedan Car", öts automatiskt av språket.","task":"04-arv-1","tests":[{"in":"\n","out":"Base()\nDerived()\n~Derived()\n~Base()\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\n// skriv Base och Derived\n\n\nint main() {\n    {\n        Derived d;\n    }   // d förstörs här\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass Base {\npublic:\n    Base() { cout << \"Base()\" << endl; }\n    virtual ~Base() { cout << \"~Base()\" << endl; }\n};\n\nclass Derived : public Base {\npublic:\n    Derived() { cout << \"Derived()\" << endl; }\n    ~Derived() { cout << \"~Derived()\" << endl; }\n};\n\nint main() {\n    {\n        Derived d;\n    }   // d förstörs här\n    return 0;\n}\n"}},"langs":["cpp"],"web":[],"gpp":true},{"t":"code","q":"<code>TemperatureSensor</code> ärver <code>Sensor</code>, vars konstruktor kräver ett id. Skriv TemperatureSensors konstruktor som skickar id vidare, och en metod <code>describe()</code> som skriver <code>TemperatureSensor ID</code>.","why":"Sensor saknar standardkonstruktor, så TemperatureSensor måste anropa <code>Sensor(id)</code> i initieringslistan. <code>id_</code> är protected och kan läsas i subklassen.","task":"04-arv-2","tests":[{"in":"T-01\n","out":"TemperatureSensor T-01\n"},{"in":"kok\n","out":"TemperatureSensor kok\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Sensor {\nprotected:\n    string id_;\npublic:\n    Sensor(const string& id) : id_{id} {}\n};\n\nclass TemperatureSensor : public Sensor {\npublic:\n    // konstruktor och describe()\n\n};\n\nint main() {\n    string id;\n    cin >> id;\n    TemperatureSensor t(id);\n    t.describe();\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Sensor {\nprotected:\n    string id_;\npublic:\n    Sensor(const string& id) : id_{id} {}\n};\n\nclass TemperatureSensor : public Sensor {\npublic:\n    TemperatureSensor(const string& id) : Sensor(id) {}\n    void describe() const { cout << \"TemperatureSensor \" << id_ << endl; }\n};\n\nint main() {\n    string id;\n    cin >> id;\n    TemperatureSensor t(id);\n    t.describe();\n    return 0;\n}\n"},"py":{"starter":"class Sensor:\n    def __init__(self, sensor_id):\n        self._id = sensor_id\n\n\nclass TemperatureSensor(Sensor):\n    # konstruktor som skickar id vidare med super(), och describe()\n    pass\n\n\nt = TemperatureSensor(input())\nt.describe()\n","sol":"class Sensor:\n    def __init__(self, sensor_id):\n        self._id = sensor_id\n\n\nclass TemperatureSensor(Sensor):\n    def __init__(self, sensor_id):\n        super().__init__(sensor_id)      # motsvarar : Sensor(id) i C++\n\n    def describe(self):\n        print(f\"TemperatureSensor {self._id}\")\n\n\nt = TemperatureSensor(input())\nt.describe()\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tis 4/11"},{"id":"enums","cat":"Typer","min":7,"title":"enum och enum class","lead":"Ersätt magiska tal med namngivna värden, och se varför enum class är det typsäkra valet.","src":["Tisdag 4/11 – Arv (avsnitt 7)","Övningar – enums"],"goals":["Ersätta magiska tal med enum","Förklara skillnaden mellan enum och enum class","Använda enum class i switch och konvertera till text"],"blocks":[["h","Magiska tal"],["code","cpp","int weather = 2;     // vad betyder 2?"],["p","Svårt att läsa och lätt att göra fel. Med en enum får varje värde ett namn."],["h","Klassisk enum"],["code","cpp","enum Weather { Sunny, Cloudy, Rainy };\n\nWeather today = Sunny;\nstd::cout << today;      // skriver 0: en vanlig enum är i grunden en int"],["list",["Alla namn hamnar i samma namnrymd. Två enums med <code>None</code> eller <code>Error</code> krockar.","Svag typkontroll: värdet omvandlas tyst till int och kan jämföras med vilka tal som helst."]],["h","enum class (scoped enum)"],["code","cpp","enum class Weather { Sunny, Cloudy, Rainy };\n\nWeather w = Weather::Cloudy;      // namnet måste anges med Weather::\n\nif ligger i enumens eget scope."},{"t":"multi","q":"Vilka påståenden om enum class stämmer? Välj alla.","o":["Värdena omvandlas inte automatiskt till int","Två enum class kan ha värden med samma namn","Kan användas i switch","Kan bara ha tre värden"],"a":[0,1,2],"why":"Antalet värden är obegränsat."},{"t":"text","q":"Skriv uttrycket som omvandlar <code>enum class</code>-värdet <code>w</code> till int.","accept":["static_cast<int>(w)","(int)w","int(w)"],"ph":"...(w)","why":"<code>static_cast&lt;int&gt;(w)</code>"},{"t":"code","q":"Skriv <code>std::string toString(Direction d)</code> för <code>enum class Direction { North, East, South, West }</code>. main läser ett tal 0–3 och skriver ut <code>norr</code>, <code>öster</code>, <code>söder</code> eller <code>väster</code>.","why":"En switch utan default låter <code>-Wall</code> varna om du lägger till ett värde utan att hantera det.","task":"05-enums-1","tests":[{"in":"0\n","out":"norr\n"},{"in":"1\n","out":"öster\n"},{"in":"2\n","out":"söder\n"},{"in":"3\n","out":"väster\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class Direction { North, East, South, West };\n\nstring toString(Direction d) {\n\n}\n\nint main() {\n    int n;\n    cin >> n;\n    cout << toString(static_cast<Direction>(n)) << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class Direction { North, East, South, West };\n\nstring toString(Direction d) {\n    switch (d) {\n        case Direction::North: return \"norr\";\n        case Direction::East:  return \"öster\";\n        case Direction::South: return \"söder\";\n        case Direction::West:  return \"väster\";\n    }\n    return \"okänd\";\n}\n\nint main() {\n    int n;\n    cin >> n;\n    cout << toString(static_cast<Direction>(n)) << endl;\n    return 0;\n}\n"},"py":{"starter":"from enum import Enum\n\n\nclass Direction(Enum):\n    NORTH = 0\n    EAST = 1\n    SOUTH = 2\n    WEST = 3\n\n\ndef to_string(d):\n    pass\n\n\nprint(to_string(Direction(int(input()))))\n","sol":"from enum import Enum\n\n\nclass Direction(Enum):\n    NORTH = 0\n    EAST = 1\n    SOUTH = 2\n    WEST = 3\n\n\ndef to_string(d):\n    match d:                         # Pythons motsvarighet till switch (3.10+)\n        case Direction.NORTH:\n            return \"norr\"\n        case Direction.EAST:\n            return \"öster\"\n        case Direction.SOUTH:\n            return \"söder\"\n        case Direction.WEST:\n            return \"väster\"\n\n\nprint(to_string(Direction(int(input()))))\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Klassen <code>Machine</code> har en <code>MachineState</code> som startar på Idle. Kommandon på indata: <code>start</code> sätter Running, <code>fail</code> sätter Error. Skriv <code>printStatus()</code> som skriver <code>Idle</code>, <code>Running</code> eller <code>Error</code>.","why":"Tillståndet är en enum class i klassen, och switch översätter det till text.","task":"05-enums-2","tests":[{"in":"\n","out":"Idle\n"},{"in":"start\n","out":"Running\n"},{"in":"start fail\n","out":"Error\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class MachineState { Idle, Running, Error };\n\nclass Machine {\n    MachineState state_ = MachineState::Idle;\npublic:\n    void start() { state_ = MachineState::Running; }\n    void fail()  { state_ = MachineState::Error; }\n    void printStatus() const {\n        // skriv ut statusen\n    }\n};\n\nint main() {\n    Machine m;\n    string cmd;\n    while (cin >> cmd) {\n        if (cmd == \"start\") m.start();\n        else if (cmd == \"fail\") m.fail();\n    }\n    m.printStatus();\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class MachineState { Idle, Running, Error };\n\nclass Machine {\n    MachineState state_ = MachineState::Idle;\npublic:\n    void start() { state_ = MachineState::Running; }\n    void fail()  { state_ = MachineState::Error; }\n    void printStatus() const {\n        switch (state_) {\n            case MachineState::Idle:    cout << \"Idle\" << endl;    break;\n            case MachineState::Running: cout << \"Running\" << endl; break;\n            case MachineState::Error:   cout << \"Error\" << endl;   break;\n        }\n    }\n};\n\nint main() {\n    Machine m;\n    string cmd;\n    while (cin >> cmd) {\n        if (cmd == \"start\") m.start();\n        else if (cmd == \"fail\") m.fail();\n    }\n    m.printStatus();\n    return 0;\n}\n"},"py":{"starter":"import sys\nfrom enum import Enum, auto\n\n\nclass MachineState(Enum):\n    IDLE = auto()\n    RUNNING = auto()\n    ERROR = auto()\n\n\nclass Machine:\n    def __init__(self):\n        self._state = MachineState.IDLE\n\n    def start(self):\n        self._state = MachineState.RUNNING\n\n    def fail(self):\n        self._state = MachineState.ERROR\n\n    def print_status(self):\n        # skriv Idle, Running eller Error\n        pass\n\n\nm = Machine()\nfor cmd in sys.stdin.read().split():\n    if cmd == \"start\":\n        m.start()\n    elif cmd == \"fail\":\n        m.fail()\nm.print_status()\n","sol":"import sys\nfrom enum import Enum, auto\n\n\nclass MachineState(Enum):\n    IDLE = auto()\n    RUNNING = auto()\n    ERROR = auto()\n\n\nclass Machine:\n    def __init__(self):\n        self._state = MachineState.IDLE\n\n    def start(self):\n        self._state = MachineState.RUNNING\n\n    def fail(self):\n        self._state = MachineState.ERROR\n\n    def print_status(self):\n        names = {\n            MachineState.IDLE: \"Idle\",\n            MachineState.RUNNING: \"Running\",\n            MachineState.ERROR: \"Error\",\n        }\n        print(names[self._state])\n\n\nm = Machine()\nfor cmd in sys.stdin.read().split():\n    if cmd == \"start\":\n        m.start()\n    elif cmd == \"fail\":\n        m.fail()\nm.print_status()\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tis 4/11"},{"id":"polymorfism","cat":"Polymorfism","min":10,"title":"Polymorfism och abstrakta klasser","lead":"Programmera mot ett gemensamt gränssnitt och låt varje subklass bestämma beteendet: virtual, override, final och rena virtuella funktioner.","src":["Torsdag 6/11 – Polymorfism, casting (avsnitt 1–3, 7–8)"],"goals":["Förklara vad som krävs för att en klass ska vara polymorf","Använda <code>virtual</code>, <code>override</code> och <code>final</code>","Skriva abstrakta klasser med rena virtuella funktioner","Förklara varför basklassen behöver en virtuell destruktor"],"blocks":[["h","Varför polymorfism?"],["p","Polymorfism låter oss programmera mot ett gemensamt gränssnitt och byta beteende under körning, utan en <code>switch</code> på typer. Vi skiljer <em>vad</em> som ska göras från <em>hur</em> varje subklass gör det. Samma kodväg kan driva helt olika IoT-enheter."],["code","cpp","#include <iostream>\n#include <memory>\n#include <vector>\n\nstruct Device {\n    virtual ~Device() = default;      // viktigt\n    virtual void tick() = 0;          // ren virtuell (abstrakt)\n};\n\nstruct TempSensor : Device {\n    void tick() override { std::cout << \"TempSensor läser av.\\n\"; }\n};\n\nstruct LedActuator : Device {\n    void tick() override { std::cout << \"LedActuator blinkar.\\n\"; }\n};\n\nint main() {\n    std::vector<std::unique_ptr<Device>> devices;\n    devices.push_back(std::make_unique<TempSensor>());\n    devices.push_back(std::make_unique<LedActuator>());\n    for (auto& d : devices) d->tick();    // samma anrop, olika beteende\n}"],["p","För att en klass ska vara polymorf i C++ behöver den minst en <code>virtual</code>-funktion, och anropet måste ske via en <strong>pekare eller referens</strong> till basen."],["widget","dispatch"],["h","virtual, override och final"],["list",["Gör de funktioner <code>virtual</code> i basen där beteendet ska kunna specialiseras.","Märk överskuggningar med <code>override</code>. Då kontrollerar kompilatorn att signaturen faktiskt matchar en virtuell funktion i basen.","Använd <code>final</code> för att stoppa vidare överskuggning eller arv när det är avsiktligt.","Ge polymorfa basklasser en <code>virtual</code> destruktor, så att <code>delete</code> via baspekare river hela objektet."]],["code","cpp","struct Logger {\n    virtual ~Logger() = default;\n    virtual void write(const std::string& msg) = 0;\n};\n\nstruct ConsoleLogger : Logger {\n    void write(const std::string& msg) override { std::cout << msg << \"\\n\"; }\n};\n\nstruct QuietLogger final : Logger {          // går inte att ärva vidare\n    void write(const std::string&) override {}\n};"],["note","fix","Utan <code>override</code> blir ett stavfel eller en saknad <code>const</code> tyst en <em>ny</em> funktion som döljer basens, och den virtuella anropas aldrig. Med <code>override</code> blir det ett kompileringsfel."],["note","warn","Om basens destruktor inte är virtuell och du gör <code>delete</code> via <code>Logger*</code> körs bara basens destruktor. Det är odefinierat beteende och läcker subklassens resurser."],["h","Abstrakta klasser"],["p","En klass med minst en ren virtuell funktion (<code>= 0</code>) är <strong>abstrakt</strong>. Den kan inte instansieras, bara ärvas. Den fungerar som ett kontrakt: varje konkret subklass måste implementera funktionerna."],["code","cpp","struct Drawable {\n    virtual ~Drawable() = default;\n    virtual void draw() const = 0;\n\n    void render() const {                 // icke-virtuell hjälpfunktion\n        std::cout << \"--- figur ---\\n\";\n        draw();                           // anropar subklassens version\n    }\n};\n\nstruct Line : Drawable {\n    void draw() const override { std::cout << \"Ritar linje\\n\"; }\n};\nstruct Circle : Drawable {\n    void draw() const override { std::cout << \"Ritar cirkel\\n\"; }\n};\n\n// Drawable d;     // FEL: abstrakt klass"],["note","tip","Håll gränssnittet minimalt. Några få väl valda virtuella funktioner är lättare att testa och underhålla."],["h","Fallgropar och riktlinjer"],["list",["Anropa aldrig virtuella funktioner från konstruktorer eller destruktorer. Där är virtuell dispatch i praktiken avstängd.","Gör polymorfa basklasser lätta: virtuella funktioner och en virtuell destruktor, inga onödiga beroenden.","Virtuell dispatch kostar ett indirekt hopp via en <strong>vtable</strong>. Oftast obetydligt, men kan märkas i tighta loopar på en mikrokontroller.","Välj <code>enum class</code> istället för arv när typerna inte behöver olika data eller tillstånd och antalet fall är litet och slutet."]],["h","Övningar"],["ex","render() för Drawable","<p>Bygg ut <code>Drawable</code> med en icke-virtuell <code>render()</code> som skriver en rubrik och anropar <code>draw()</code>. Lägg några figurer i en <code>std::vector&lt;std::unique_ptr&lt;Drawable&gt;&gt;</code> och anropa render på alla.</p>"],["ex","Icke-virtuell open()","<p>Lägg till en metod <code>open()</code> i <code>Logger</code> som inte gör något och inte är virtuell. När är det rimligt att en metod <em>inte</em> är virtuell?</p>"]],"pool":[{"t":"mc","q":"Vad krävs för polymorft beteende i C++?","o":["Att klassen är en struct","En virtuell funktion i basen, och anrop via pekare eller referens till basen","Att alla medlemmar är public","Att man använder new"],"a":1,"why":"Utan virtual väljs funktionen vid kompilering utifrån den statiska typen."},{"t":"mc","q":"Vad gör <code>override</code>?","o":["Gör funktionen virtuell i basen","Låter kompilatorn kontrollera att funktionen verkligen överskuggar en virtuell funktion","Förhindrar arv","Gör funktionen snabbare"],"a":1,"why":"Stavfel eller fel signatur blir kompileringsfel istället för tysta buggar."},{"t":"mc","q":"Vad betyder <code>virtual void draw() const = 0;</code>?","o":["draw returnerar 0","draw är en ren virtuell funktion och klassen blir abstrakt","draw är private","draw anropas aldrig"],"a":1,"why":"Subklasserna måste implementera den, och basen kan inte instansieras."},{"t":"mc","q":"Varför ska en polymorf basklass ha en virtuell destruktor?","o":["För att kunna skapa objekt","Så att delete via baspekare kör subklassens destruktor också","För att få använda override","Det behövs inte"],"a":1,"why":"Annars körs bara basens destruktor: odefinierat beteende och läckor."},{"t":"mc","q":"Vad gör <code>final</code> på en klass?","o":["Gör klassen abstrakt","Förhindrar att någon ärver från den","Gör alla metoder const","Tar bort vtablen"],"a":1,"why":"<code>struct QuietLogger final : Logger</code> kan inte vara basklass. final på en metod stoppar vidare överskuggning."},{"t":"mc","q":"<code>Base* p = new Derived; p-&gt;f();</code> där f <em>inte</em> är virtual. Vilken f körs?","o":["Derived::f","Base::f","Båda","Odefinierat"],"a":1,"why":"Utan virtual bestäms anropet av pekarens statiska typ, Base*."},{"t":"mc","q":"Kan man skapa ett objekt av en abstrakt klass?","o":["Ja, alltid","Nej, bara av konkreta subklasser som implementerar alla rena virtuella funktioner","Ja, med new","Bara om den har en konstruktor"],"a":1,"why":"Men du kan ha pekare och referenser av den abstrakta typen, och det är hela poängen."},{"t":"multi","q":"Vilka hör hemma i en lätt polymorf basklass? Välj alla.","o":["En virtuell destruktor","Rena virtuella funktioner för gränssnittet","Många datamedlemmar och beroenden","Anrop av virtuella funktioner från konstruktorn"],"a":[0,1],"why":"Virtuella anrop från konstruktorn går inte till subklassen, och tunga baser gör hierarkin svår att ändra."},{"t":"text","q":"Vilket nyckelord sätter du efter en metod i subklassen för att kompilatorn ska kontrollera att den överskuggar en virtuell funktion?","accept":["override"],"ph":"nyckelord","why":"<code>void tick() override;</code>"},{"t":"text","q":"Vad kallas tabellen som används för virtuell dispatch? Ett ord.","accept":["vtable","v-table","virtual table","vtbl"],"ph":"ord","why":"vtable: varje polymorf klass har en tabell med pekare till sina virtuella funktioner."},{"t":"code","q":"Abstrakt <code>Shape</code> med <code>virtual double area() const = 0</code>. Skriv <code>Rect</code> och <code>Circle</code> (π = 3.14). Indata: rader med <code>rect B H</code> eller <code>circle R</code>. Skriv ut total area.","why":"Loopen vet bara om <code>Shape</code>. Varje objekt bidrar med sin egen area via virtuell dispatch.","task":"06-polymorfism-1","tests":[{"in":"rect 2 3\ncircle 1\n","out":"9.14\n"},{"in":"rect 4 5\n","out":"20\n"},{"in":"circle 2\ncircle 2\n","out":"25.12\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Shape {\n    virtual ~Shape() = default;\n    virtual double area() const = 0;\n};\n\n// skriv Rect och Circle\n\n\nint main() {\n    vector<unique_ptr<Shape>> shapes;\n    string kind;\n    while (cin >> kind) {\n        if (kind == \"rect\") { double b, h; cin >> b >> h; shapes.push_back(make_unique<Rect>(b, h)); }\n        else if (kind == \"circle\") { double r; cin >> r; shapes.push_back(make_unique<Circle>(r)); }\n    }\n    double total = 0;\n    for (const auto& s : shapes) total += s->area();\n    cout << total << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Shape {\n    virtual ~Shape() = default;\n    virtual double area() const = 0;\n};\n\nstruct Rect : Shape {\n    double b, h;\n    Rect(double b, double h) : b(b), h(h) {}\n    double area() const override { return b * h; }\n};\n\nstruct Circle : Shape {\n    double r;\n    Circle(double r) : r(r) {}\n    double area() const override { return 3.14 * r * r; }\n};\n\nint main() {\n    vector<unique_ptr<Shape>> shapes;\n    string kind;\n    while (cin >> kind) {\n        if (kind == \"rect\") { double b, h; cin >> b >> h; shapes.push_back(make_unique<Rect>(b, h)); }\n        else if (kind == \"circle\") { double r; cin >> r; shapes.push_back(make_unique<Circle>(r)); }\n    }\n    double total = 0;\n    for (const auto& s : shapes) total += s->area();\n    cout << total << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\n\n# skriv Rect och Circle (pi = 3.14)\n\n\nshapes = []\ndata = sys.stdin.read().split()\ni = 0\nwhile i < len(data):\n    if data[i] == \"rect\":\n        shapes.append(Rect(float(data[i + 1]), float(data[i + 2])))\n        i += 3\n    else:\n        shapes.append(Circle(float(data[i + 1])))\n        i += 2\nprint(f\"{sum(s.area() for s in shapes):g}\")\n","sol":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\n\nclass Rect(Shape):\n    def __init__(self, b, h):\n        self.b, self.h = b, h\n\n    def area(self):\n        return self.b * self.h\n\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n\n    def area(self):\n        return 3.14 * self.r * self.r\n\n\nshapes = []\ndata = sys.stdin.read().split()\ni = 0\nwhile i < len(data):\n    if data[i] == \"rect\":\n        shapes.append(Rect(float(data[i + 1]), float(data[i + 2])))\n        i += 3\n    else:\n        shapes.append(Circle(float(data[i + 1])))\n        i += 2\nprint(f\"{sum(s.area() for s in shapes):g}\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 6/11"},{"id":"agande-casting","cat":"Polymorfism","min":9,"title":"Slicing, ägande och dynamic_cast","lead":"Lagra polymorfa objekt rätt med unique_ptr, undvik object slicing, skapa objekt i fabriker och använd RTTI sparsamt.","src":["Torsdag 6/11 – Polymorfism, casting (avsnitt 4–6)"],"goals":["Förklara object slicing och undvika det","Lagra polymorfa objekt i <code>std::vector&lt;std::unique_ptr&lt;Base&gt;&gt;</code>","Skriva en enkel fabriksfunktion","Använda <code>dynamic_cast</code> och <code>typeid</code>, och veta när de bör undvikas"],"blocks":[["h","Object slicing"],["p","Virtuell dispatch fungerar bara via pekare eller referenser till basen. Kopierar du ett subklassobjekt till en variabel av bastyp skärs den subklass-specifika delen bort. Det kallas <strong>object slicing</strong>."],["code","cpp","struct Base {\n    virtual ~Base() = default;\n    virtual void f() const { std::cout << \"Base\\n\"; }\n};\nstruct Der : Base {\n    void f() const override { std::cout << \"Der\\n\"; }\n};\n\nint main() {\n    Der d;\n    Base b = d;      // slicing: b är en ren Base\n    b.f();           // \"Base\"\n\n    Base& r = d;     // referens: ingen kopia\n    r.f();           // \"Der\"\n}"],["p","Därför fungerar inte <code>std::vector&lt;Base&gt;</code> för polymorfa objekt: varje element är en kopia av bastyp. Lagra pekare istället."],["h","Ägande med unique_ptr"],["p","I modern C++ undviker vi råa <code>new</code>/<code>delete</code>. <code>std::unique_ptr</code> ger exklusivt ägande: objektet förstörs automatiskt när pekaren försvinner. Behöver flera dela på ett objekt finns <code>std::shared_ptr</code>, men det ska motiveras."],["code","cpp","#include <memory>\n\nstd::vector<std::unique_ptr<Device>> devices;\ndevices.push_back(std::make_unique<TempSensor>());\ndevices.push_back(std::make_unique<LedActuator>());\n// inget delete behövs: vektorn äger objekten\n\nauto p = std::make_unique<TempSensor>();\n// auto q = p;              // FEL: unique_ptr kan inte kopieras\nauto q = std::move(p);      // ägandet flyttas, p blir nullptr"],["h","Fabriker"],["p","En fabriksfunktion samlar objektskapandet på ett ställe. Resten av koden behöver inte känna till de konkreta typerna."],["code","cpp","struct Effect { virtual ~Effect() = default; virtual void apply() = 0; };\nstruct Slow : Effect { void apply() override { std::cout << \"Slow\\n\"; } };\nstruct Burn : Effect { void apply() override { std::cout << \"Burn\\n\"; } };\n\nstd::unique_ptr<Effect> makeEffect(int code) {\n    switch (code) {\n        case 1: return std::make_unique<Slow>();\n        case 2: return std::make_unique<Burn>();\n        default: return nullptr;\n    }\n}\n\nint main() {\n    std::vector<std::unique_ptr<Effect>> effects;\n    effects.push_back(makeEffect(1));\n    effects.push_back(makeEffect(2));\n    for (auto& e : effects) if (e) e->apply();\n}"],["h","RTTI, dynamic_cast och typeid"],["p","RTTI (Run-Time Type Information) låter programmet fråga om typen under körning. Det fungerar bara på polymorfa typer, kostar lite vid körning och kan stängas av i kompilatorn (vanligt i inbyggda system)."],["list",["<code>dynamic_cast&lt;Derived*&gt;(basePtr)</code> returnerar en pekare, eller <code>nullptr</code> om objektet inte är av den typen.","<code>dynamic_cast&lt;Derived&amp;&gt;(baseRef)</code> kastar <code>std::bad_cast</code> vid fel.","<code>typeid(obj)</code> ger ett <code>std::type_info</code>, mest användbart för loggning och diagnos."]],["code","cpp","void maybeSpecialHandle(Device& d) {\n    if (auto* led = dynamic_cast<LedActuator*>(&d)) {\n        std::cout << \"Särbehandlar LED\\n\";\n        led->tick();\n    } else {\n        d.tick();\n    }\n}"],["note","warn","Behöver du ofta dynamic_cast är det ett tecken på att gränssnittet saknar en virtuell funktion. RTTI är rimligt i legacy-kod du inte får ändra, i testkod och verktyg, eller i dokumenterade specialfall."],["h","Övningar"],["ex","Fabrik med strängar","<p>Ändra <code>makeEffect</code> så att den tar <code>\"slow\"</code> eller <code>\"burn\"</code>. Fundera på hur en <code>std::map&lt;std::string, std::function&lt;std::unique_ptr&lt;Effect&gt;()&gt;&gt;</code> med lambdas kan ersätta switchen.</p>","std::unique_ptr<Effect> makeEffect(const std::string& name) {\n    static const std::map<std::string, std::function<std::unique_ptr<Effect>()>> table = {\n        {\"slow\", [] { return std::make_unique<Slow>(); }},\n        {\"burn\", [] { return std::make_unique<Burn>(); }},\n    };\n    auto it = table.find(name);\n    return it != table.end() ? it->second() : nullptr;\n}","cpp"],["ex","Räkna LED-aktuatorer","<p>Skriv <code>int countLedActuators(const std::vector&lt;std::unique_ptr&lt;Device&gt;&gt;&amp; ds)</code> med dynamic_cast. Diskutera ett alternativ utan RTTI, till exempel en virtuell <code>kind()</code> som returnerar en enum class.</p>"]],"pool":[{"t":"mc","q":"<code>Der d; Base b = d; b.f();</code> där f är virtuell. Vilken f körs?","o":["Der::f","Base::f","Båda","Kompileringsfel"],"a":1,"why":"b är en kopia av bastyp. Der-delen skars bort (slicing)."},{"t":"mc","q":"Varför passar inte <code>std::vector&lt;Base&gt;</code> för polymorfa objekt?","o":["vector kan inte lagra klasser","Varje element kopieras till en Base och tappar sin subklassdel","Det är för långsamt","Base måste vara abstrakt"],"a":1,"why":"Använd <code>std::vector&lt;std::unique_ptr&lt;Base&gt;&gt;</code>."},{"t":"mc","q":"Vad returnerar <code>dynamic_cast&lt;Led*&gt;(p)</code> om p inte pekar på en Led?","o":["Ett undantag","<code>nullptr</code>","Samma pekare","En kopia"],"a":1,"why":"Pekarvarianten ger nullptr. Referensvarianten kastar <code>std::bad_cast</code>."},{"t":"mc","q":"Vad händer med objektet när en <code>unique_ptr</code> går ur scope?","o":["Inget, du måste köra delete","Objektet förstörs automatiskt","Det flyttas till stacken","Det kopieras"],"a":1,"why":"unique_ptr äger objektet och frigör det i sin destruktor."},{"t":"mc","q":"När är dynamic_cast mest motiverat?","o":["I varje polymorft anrop","När gränssnittet inte går att ändra, eller i test- och diagnoskod","Istället för virtuella funktioner","För att omvandla int till double"],"a":1,"why":"Ofta är en extra virtuell funktion i basen en bättre lösning."},{"t":"mc","q":"Vad gör <code>auto q = std::move(p);</code> om p är en unique_ptr?","o":["Kopierar objektet","Flyttar ägandet till q, och p blir nullptr","Raderar objektet","Ger kompileringsfel"],"a":1,"why":"unique_ptr kan inte kopieras, bara flyttas."},{"t":"multi","q":"När är RTTI (dynamic_cast, typeid) rimligt enligt materialet? Välj alla.","o":["Migrering av legacy-kod där basen inte kan ändras","Testkod och instrumentation","I varje polymorft anrop","Istället för att lägga till en virtuell funktion som saknas"],"a":[0,1],"why":"Saknas en virtuell funktion är det oftast bättre att lägga till den."},{"t":"text","q":"Vad kastar <code>dynamic_cast&lt;Led&amp;&gt;(ref)</code> om objektet inte är en Led? Skriv typens namn.","accept":["std::bad_cast","bad_cast"],"ph":"std::...","why":"<code>std::bad_cast</code>. Pekarvarianten returnerar nullptr istället."},{"t":"text","q":"Vad kallas det när ett subklassobjekt kopieras till en basvariabel och tappar sin subklassdel? Två ord eller ett på engelska.","accept":["object slicing","slicing","objektslicing"],"ph":"begrepp","why":"Object slicing."},{"t":"code","q":"Fabrik: skriv <code>unique_ptr&lt;Effect&gt; makeEffect(const string&amp; name)</code> som returnerar <code>Slow</code> för \"slow\", <code>Burn</code> för \"burn\" och annars nullptr. main skriver <code>okänd</code> för nullptr.","why":"main känner bara till Effect. Nya effekter läggs till i fabriken.","task":"07-agande-casting-1","tests":[{"in":"slow burn\n","out":"Slow\nBurn\n"},{"in":"freeze slow\n","out":"okänd\nSlow\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct Effect { virtual ~Effect() = default; virtual void apply() = 0; };\nstruct Slow : Effect { void apply() override { cout << \"Slow\" << endl; } };\nstruct Burn : Effect { void apply() override { cout << \"Burn\" << endl; } };\n\nunique_ptr<Effect> makeEffect(const string& name) {\n\n}\n\nint main() {\n    string name;\n    while (cin >> name) {\n        auto e = makeEffect(name);\n        if (e) e->apply();\n        else cout << \"okänd\" << endl;\n    }\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct Effect { virtual ~Effect() = default; virtual void apply() = 0; };\nstruct Slow : Effect { void apply() override { cout << \"Slow\" << endl; } };\nstruct Burn : Effect { void apply() override { cout << \"Burn\" << endl; } };\n\nunique_ptr<Effect> makeEffect(const string& name) {\n    if (name == \"slow\") return make_unique<Slow>();\n    if (name == \"burn\") return make_unique<Burn>();\n    return nullptr;\n}\n\nint main() {\n    string name;\n    while (cin >> name) {\n        auto e = makeEffect(name);\n        if (e) e->apply();\n        else cout << \"okänd\" << endl;\n    }\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Effect:\n    def apply(self):\n        raise NotImplementedError\n\n\nclass Slow(Effect):\n    def apply(self):\n        print(\"Slow\")\n\n\nclass Burn(Effect):\n    def apply(self):\n        print(\"Burn\")\n\n\ndef make_effect(name):\n    # returnera Slow() eller Burn(), annars None\n    pass\n\n\nfor name in sys.stdin.read().split():\n    e = make_effect(name)\n    if e:\n        e.apply()\n    else:\n        print(\"okänd\")\n","sol":"import sys\n\n\nclass Effect:\n    def apply(self):\n        raise NotImplementedError\n\n\nclass Slow(Effect):\n    def apply(self):\n        print(\"Slow\")\n\n\nclass Burn(Effect):\n    def apply(self):\n        print(\"Burn\")\n\n\nEFFECTS = {\"slow\": Slow, \"burn\": Burn}      # tabell istället för if-kedja\n\n\ndef make_effect(name):\n    cls = EFFECTS.get(name)\n    return cls() if cls else None\n\n\nfor name in sys.stdin.read().split():\n    e = make_effect(name)\n    if e:\n        e.apply()\n    else:\n        print(\"okänd\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Skriv <code>int countLeds(const vector&lt;unique_ptr&lt;Device&gt;&gt;&amp; ds)</code> som räknar LedActuator-objekt med <code>dynamic_cast</code>. Indata är en lista med <code>led</code> och <code>temp</code>.","why":"<code>d.get()</code> ger den råa pekaren. dynamic_cast returnerar nullptr för allt som inte är en LedActuator.","task":"07-agande-casting-2","tests":[{"in":"led temp led\n","out":"2\n"},{"in":"temp temp\n","out":"0\n"},{"in":"\n","out":"0\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Device { virtual ~Device() = default; virtual void tick() = 0; };\nstruct TempSensor : Device { void tick() override {} };\nstruct LedActuator : Device { void tick() override {} };\n\nint countLeds(const vector<unique_ptr<Device>>& ds) {\n\n}\n\nint main() {\n    vector<unique_ptr<Device>> ds;\n    string k;\n    while (cin >> k) {\n        if (k == \"led\") ds.push_back(make_unique<LedActuator>());\n        else ds.push_back(make_unique<TempSensor>());\n    }\n    cout << countLeds(ds) << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Device { virtual ~Device() = default; virtual void tick() = 0; };\nstruct TempSensor : Device { void tick() override {} };\nstruct LedActuator : Device { void tick() override {} };\n\nint countLeds(const vector<unique_ptr<Device>>& ds) {\n    int n = 0;\n    for (const auto& d : ds) {\n        if (dynamic_cast<LedActuator*>(d.get())) n++;\n    }\n    return n;\n}\n\nint main() {\n    vector<unique_ptr<Device>> ds;\n    string k;\n    while (cin >> k) {\n        if (k == \"led\") ds.push_back(make_unique<LedActuator>());\n        else ds.push_back(make_unique<TempSensor>());\n    }\n    cout << countLeds(ds) << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Device:\n    def tick(self):\n        pass\n\n\nclass TempSensor(Device):\n    pass\n\n\nclass LedActuator(Device):\n    pass\n\n\ndef count_leds(devices):\n    # räkna LedActuator-objekt med isinstance (Pythons motsvarighet till dynamic_cast)\n    pass\n\n\ndevices = [LedActuator() if k == \"led\" else TempSensor() for k in sys.stdin.read().split()]\nprint(count_leds(devices))\n","sol":"import sys\n\n\nclass Device:\n    def tick(self):\n        pass\n\n\nclass TempSensor(Device):\n    pass\n\n\nclass LedActuator(Device):\n    pass\n\n\ndef count_leds(devices):\n    return sum(1 for d in devices if isinstance(d, LedActuator))\n\n\ndevices = [LedActuator() if k == \"led\" else TempSensor() for k in sys.stdin.read().split()]\nprint(count_leds(devices))\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 6/11"},{"id":"designmonster","cat":"Designmönster","min":11,"title":"Designmönster: Strategy, Observer och Factory","lead":"Beprövade lösningar på återkommande designproblem: utbytbara beteenden, aviseringar och kontrollerat objektskapande.","src":["Torsdag 13/11 – Design Patterns intro (avsnitt 1–4)"],"goals":["Förklara vad ett designmönster är och inte är","Använda Strategy för utbytbara beteenden","Använda Observer för att meddela flera mottagare","Centralisera objektskapande med Factory Method"],"blocks":[["h","Varför designmönster?"],["p","I större program återkommer samma frågor: hur skapar vi objekt kontrollerat, hur organiserar vi beroenden så att systemet blir lätt att ändra, och hur utökar vi beteende utan att förstöra befintlig kod?"],["p","<strong>Designmönster är beprövade lösningar på återkommande problem i objektorienterad design.</strong> De är inte färdig kod, utan idéer: strukturer och relationer mellan klasser som brukar fungera."],["h","Strategy: utbytbara beteenden"],["p","Om en <code>Player</code> ska kunna attackera på många sätt och alla varianter hårdkodas blir klassen en jätteklass full av if-else. Strategy lyfter ut beteendet till egna klasser bakom ett gemensamt gränssnitt. Spelaren <em>har en</em> strategi som kan bytas under körning."],["list",["En abstrakt basklass definierar beteendet (<code>AttackStrategy</code>).","Subklasser implementerar konkret logik (<code>SwordAttack</code>, <code>FireballAttack</code>).","En kontextklass (<code>Player</code>) har en pekare till strategin och kan byta den."]],["code","cpp","struct AttackStrategy {\n    virtual ~AttackStrategy() = default;\n    virtual int damage() const = 0;\n};\nstruct SwordAttack : AttackStrategy {\n    int damage() const override { return 10; }\n};\nstruct FireballAttack : AttackStrategy {\n    int damage() const override { return 15; }\n};\n\nclass Player {\npublic:\n    explicit Player(std::unique_ptr<AttackStrategy> a) : attack(std::move(a)) {}\n    void setAttack(std::unique_ptr<AttackStrategy> a) { attack = std::move(a); }\n    void attackTarget(Player& target) { target.takeDamage(attack->damage()); }\n    int health() const { return health_; }\nprivate:\n    void takeDamage(int dmg) { health_ -= dmg; }\n    int health_ = 100;\n    std::unique_ptr<AttackStrategy> attack;\n};\n\n// plocka upp ett nytt vapen:\n// hero.setAttack(std::make_unique<FireballAttack>());"],["p","Fördelar: nya attacktyper utan att ändra Player, logiken kan bytas under körning, och switch-monstren försvinner."],["h","Observer: avisering vid ändringar"],["p","En sensor ändrar värde och flera delar av systemet (logg, display, larm) behöver veta det. Observer låter ett objekt annonsera händelser till många mottagare <em>utan att känna till dem</em>."],["list",["<strong>Subject</strong> (observable) håller en lista med observers och meddelar dem.","<strong>Observer</strong> är ett gränssnitt med en funktion som anropas vid förändring."]],["code","cpp","struct Observer {\n    virtual ~Observer() = default;\n    virtual void onNotify(int value) = 0;\n};\n\nclass Sensor {\npublic:\n    void addObserver(Observer* obs) { observers.push_back(obs); }\n    void newReading(int v) { value = v; notifyAll(); }\nprivate:\n    void notifyAll() { for (auto* o : observers) o->onNotify(value); }\n    int value = 0;\n    std::vector<Observer*> observers;\n};\n\nstruct Logger : Observer {\n    void onNotify(int v) override { std::cout << \"Logg: sensorvärde = \" << v << \"\\n\"; }\n};\nstruct Alarm : Observer {\n    void onNotify(int v) override { if (v > 30) std::cout << \"LARM! \" << v << \"\\n\"; }\n};"],["note","warn","Sensorn lagrar råa pekare men äger inte sina observers. Se till att en observer lever minst lika länge som sensorn, eller avregistrera den innan den förstörs."],["h","Factory Method: kontrollerat objektskapande"],["p","Utan fabrik sprids <code>new TempSensor()</code> och if-kedjor över hela koden. En fabrik samlar skapandet på ett ställe och fungerar bra ihop med enum class och menyval."],["code","cpp","enum class SensorType { Temperature, Humidity };\n\nstd::unique_ptr<Sensor> makeSensor(SensorType type) {\n    switch (type) {\n        case SensorType::Temperature: return std::make_unique<TempSensor>();\n        case SensorType::Humidity:    return std::make_unique<HumiditySensor>();\n    }\n    return nullptr;\n}"],["p","Fördelar: centraliserat skapande, och hierarkin kan byggas ut utan att resten av systemet ändras. I större system kan fabriken vara ett eget objekt."]],"pool":[{"t":"mc","q":"Vad är ett designmönster?","o":["Ett färdigt bibliotek","En beprövad idé för hur klasser kan organiseras för att lösa ett återkommande problem","En kodstandard för indentering","Ett UML-diagram"],"a":1,"why":"Mönster beskriver strukturer och relationer, inte färdig kod."},{"t":"mc","q":"Vilket problem löser Strategy?","o":["Att bara en instans finns","Att beteenden ska kunna bytas ut utan att ändra klassen som använder dem","Att översätta gränssnitt","Att spara objekt till fil"],"a":1,"why":"Player har en AttackStrategy som kan bytas under körning."},{"t":"mc","q":"I Observer: vem känner till vem?","o":["Observers känner till alla andra observers","Subjektet känner bara till Observer-gränssnittet, inte de konkreta mottagarna","Subjektet måste känna till Logger","Ingen känner till någon"],"a":1,"why":"Därför kan nya mottagare läggas till utan att subjektet ändras."},{"t":"mc","q":"Vad är huvudfördelen med Factory Method?","o":["Snabbare objekt","Objektskapandet samlas på ett ställe, så resten av koden slipper känna till konkreta typer","Objekten blir const","Den ersätter arv"],"a":1,"why":"Ny sensortyp = ändra fabriken, inte varje ställe som skapar sensorer."},{"t":"mc","q":"Varför tar <code>Player</code> en <code>std::unique_ptr&lt;AttackStrategy&gt;</code>?","o":["För att unique_ptr är snabbare än int","Player äger sin strategi, och den måste nås via pekare för polymorfism","För att AttackStrategy inte får ha virtuella funktioner","För att kunna kopiera Player"],"a":1,"why":"Pekaren ger polymorfism och unique_ptr gör ägandet tydligt."},{"t":"mc","q":"Ett larm, en logg och en display ska reagera när en sensor får ett nytt värde. Vilket mönster passar?","o":["Singleton","Observer","Adapter","Factory Method"],"a":1,"why":"Sensorn meddelar alla registrerade observers utan att känna till dem."},{"t":"mc","q":"En spelare ska kunna byta vapen under spelets gång. Vilket mönster passar?","o":["Strategy","Singleton","Observer","Adapter"],"a":0,"why":"<code>setAttack(std::make_unique&lt;FireballAttack&gt;())</code> byter beteendet."},{"t":"multi","q":"Vilka delar ingår i Observer-mönstret? Välj alla.","o":["Ett subject som håller en lista med observers","Ett Observer-gränssnitt med en notifieringsfunktion","En privat konstruktor","Konkreta observers som implementerar gränssnittet"],"a":[0,1,3],"why":"Privat konstruktor hör till Singleton."},{"t":"text","q":"Vilket mönster samlar objektskapandet i en funktion eller klass? Skriv namnet på engelska.","accept":["factory method","factory","factory pattern"],"ph":"namn","why":"Factory Method."},{"t":"code","q":"Strategy: skriv <code>SwordAttack</code> (10 i skada) och <code>FireballAttack</code> (15). Indata är en lista med <code>sword</code> och <code>fireball</code>. Spelaren byter strategi och attackerar för varje ord. Skriv ut total skada.","why":"Player vet inget om svärd eller eldklot. Nya attacker kräver ingen ändring i Player.","task":"08-designmonster-1","tests":[{"in":"sword sword fireball\n","out":"35\n"},{"in":"fireball\n","out":"15\n"},{"in":"\n","out":"0\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct AttackStrategy {\n    virtual ~AttackStrategy() = default;\n    virtual int damage() const = 0;\n};\n\n// skriv SwordAttack och FireballAttack\n\n\nclass Player {\n    unique_ptr<AttackStrategy> attack_;\npublic:\n    void setAttack(unique_ptr<AttackStrategy> a) { attack_ = move(a); }\n    int attack() const { return attack_ ? attack_->damage() : 0; }\n};\n\nint main() {\n    Player p;\n    int total = 0;\n    string w;\n    while (cin >> w) {\n        if (w == \"sword\") p.setAttack(make_unique<SwordAttack>());\n        else if (w == \"fireball\") p.setAttack(make_unique<FireballAttack>());\n        total += p.attack();\n    }\n    cout << total << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct AttackStrategy {\n    virtual ~AttackStrategy() = default;\n    virtual int damage() const = 0;\n};\n\nstruct SwordAttack : AttackStrategy {\n    int damage() const override { return 10; }\n};\n\nstruct FireballAttack : AttackStrategy {\n    int damage() const override { return 15; }\n};\n\nclass Player {\n    unique_ptr<AttackStrategy> attack_;\npublic:\n    void setAttack(unique_ptr<AttackStrategy> a) { attack_ = move(a); }\n    int attack() const { return attack_ ? attack_->damage() : 0; }\n};\n\nint main() {\n    Player p;\n    int total = 0;\n    string w;\n    while (cin >> w) {\n        if (w == \"sword\") p.setAttack(make_unique<SwordAttack>());\n        else if (w == \"fireball\") p.setAttack(make_unique<FireballAttack>());\n        total += p.attack();\n    }\n    cout << total << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass AttackStrategy(ABC):\n    @abstractmethod\n    def damage(self):\n        ...\n\n\n# skriv SwordAttack (10) och FireballAttack (15)\n\n\nclass Player:\n    def __init__(self):\n        self._attack = None\n\n    def set_attack(self, strategy):\n        self._attack = strategy\n\n    def attack(self):\n        return self._attack.damage() if self._attack else 0\n\n\np = Player()\ntotal = 0\nfor w in sys.stdin.read().split():\n    if w == \"sword\":\n        p.set_attack(SwordAttack())\n    elif w == \"fireball\":\n        p.set_attack(FireballAttack())\n    total += p.attack()\nprint(total)\n","sol":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass AttackStrategy(ABC):\n    @abstractmethod\n    def damage(self):\n        ...\n\n\nclass SwordAttack(AttackStrategy):\n    def damage(self):\n        return 10\n\n\nclass FireballAttack(AttackStrategy):\n    def damage(self):\n        return 15\n\n\nclass Player:\n    def __init__(self):\n        self._attack = None\n\n    def set_attack(self, strategy):\n        self._attack = strategy\n\n    def attack(self):\n        return self._attack.damage() if self._attack else 0\n\n\np = Player()\ntotal = 0\nfor w in sys.stdin.read().split():\n    if w == \"sword\":\n        p.set_attack(SwordAttack())\n    elif w == \"fireball\":\n        p.set_attack(FireballAttack())\n    total += p.attack()\nprint(total)\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Observer: skriv <code>Alarm</code> som skriver <code>LARM V</code> när värdet V är över 30, och <code>Counter</code> som räknar notifieringar. main registrerar båda, skickar alla värden från indata och skriver till sist <code>N notifieringar</code>.","why":"Sensorn vet bara om Observer-gränssnittet. Fler mottagare kräver ingen ändring i Sensor.","task":"08-designmonster-2","tests":[{"in":"20 35 31 10\n","out":"LARM 35\nLARM 31\n4 notifieringar\n"},{"in":"\n","out":"0 notifieringar\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Observer {\n    virtual ~Observer() = default;\n    virtual void onNotify(int value) = 0;\n};\n\nclass Sensor {\n    vector<Observer*> observers_;\npublic:\
