EMPTY_KEY; map->table[i].value = 0; }\n}\n\nvoid put(HashMap* map, int key, int value) {\n    // TODO: linjär sondering. Tom plats: lägg in. Samma nyckel: uppdatera.\n    //       Hittas ingen plats: printf(\"FULL: key=%d\\n\", key);\n}\n\nint get(HashMap* map, int key, int* outValue) {\n    // TODO: samma sondering. Stoppa på tom plats.\n    return 0;\n}\n\nvoid printTable(const HashMap* map) {\n    for (int i = 0; i < CAP; i++) {\n        if (map->table[i].key == EMPTY_KEY) printf(\"[%d] EMPTY\\n\", i);\n        else printf(\"[%d] key=%d value=%d\\n\", i, map->table[i].key, map->table[i].value);\n    }\n}\n\nint main(void) {\n    HashMap map;\n    init(&map);\n    int m;\n    scanf(\"%d\", &m);\n    for (int i = 0; i < m; i++) {\n        char cmd[16];\n        int k, v;\n        scanf(\"%15s\", cmd);\n        if (strcmp(cmd, \"put\") == 0) { scanf(\"%d %d\", &k, &v); put(&map, k, v); }\n        else if (strcmp(cmd, \"get\") == 0) {\n            scanf(\"%d\", &k);\n            if (get(&map, k, &v)) printf(\"get(%d) -> %d\\n\", k, v);\n            else printf(\"get(%d) -> NOT FOUND\\n\", k);\n        } else if (strcmp(cmd, \"print\") == 0) printTable(&map);\n    }\n    return 0;\n}\n","sol":"#include <stdio.h>\n#include <string.h>\n\n#define CAP 11\n#define EMPTY_KEY 0   // nyckeln 0 betyder tom plats\n\ntypedef struct {\n    int key;\n    int value;\n} Entry;\n\ntypedef struct {\n    Entry table[CAP];\n    int size;\n} HashMap;\n\nint f(int key) {\n    return key % CAP;\n}\n\nvoid init(HashMap* map) {\n    map->size = 0;\n    for (int i = 0; i < CAP; i++) { map->table[i].key = EMPTY_KEY; map->table[i].value = 0; }\n}\n\nvoid put(HashMap* map, int key, int value) {\n    int start = f(key);\n    for (int step = 0; step < CAP; step++) {\n        int idx = (start + step) % CAP;   // nästa plats, och runt till 0 efter sista\n        if (map->table[idx].key == EMPTY_KEY) {        // tom: insert\n            map->table[idx].key = key;\n            map->table[idx].value = value;\n            map->size++;\n            return;\n        }\n        if (map->table[idx].key == key) {              // samma nyckel: update\n            map->table[idx].value = value;\n            return;\n        }\n        // annan nyckel: kollision, prova nästa\n    }\n    printf(\"FULL: key=%d\\n\", key);\n}\n\nint get(HashMap* map, int key, int* outValue) {\n    int start = f(key);\n    for (int step = 0; step < CAP; step++) {\n        int idx = (start + step) % CAP;\n        if (map->table[idx].key == EMPTY_KEY) return 0;   // ett hål: nyckeln kan inte finnas längre fram\n        if (map->table[idx].key == key) {\n            *outValue = map->table[idx].value;\n            return 1;\n        }\n    }\n    return 0;\n}\n\nvoid printTable(const HashMap* map) {\n    for (int i = 0; i < CAP; i++) {\n        if (map->table[i].key == EMPTY_KEY) printf(\"[%d] EMPTY\\n\", i);\n        else printf(\"[%d] key=%d value=%d\\n\", i, map->table[i].key, map->table[i].value);\n    }\n}\n\nint main(void) {\n    HashMap map;\n    init(&map);\n    int m;\n    scanf(\"%d\", &m);\n    for (int i = 0; i < m; i++) {\n        char cmd[16];\n        int k, v;\n        scanf(\"%15s\", cmd);\n        if (strcmp(cmd, \"put\") == 0) { scanf(\"%d %d\", &k, &v); put(&map, k, v); }\n        else if (strcmp(cmd, \"get\") == 0) {\n            scanf(\"%d\", &k);\n            if (get(&map, k, &v)) printf(\"get(%d) -> %d\\n\", k, v);\n            else printf(\"get(%d) -> NOT FOUND\\n\", k);\n        } else if (strcmp(cmd, \"print\") == 0) printTable(&map);\n    }\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nconst int CAP = 11;\nconst int EMPTY_KEY = 0;   // nyckeln 0 betyder tom plats\n\nstruct Entry {\n    int key = EMPTY_KEY;\n    int value = 0;\n};\n\nclass HashMap {\npublic:\n    // TODO: linjär sondering. Tom plats: lägg in. Samma nyckel: uppdatera.\n    //       Hittas ingen plats: cout << \"FULL: key=\" << key << endl;\n    void put(int key, int value) {}\n    // TODO: samma sondering. Stoppa på tom plats. Returnera true och sätt out om nyckeln finns.\n    bool get(int key, int& out) const { return false; }\n\n    void print() const {\n        for (int i = 0; i < CAP; i++) {\n            if (table[i].key == EMPTY_KEY) cout << \"[\" << i << \"] EMPTY\" << endl;\n            else cout << \"[\" << i << \"] key=\" << table[i].key << \" value=\" << table[i].value << endl;\n        }\n    }\n\nprivate:\n    static int hash(int key) { return key % CAP; }\n    Entry table[CAP];\n};\n\nint main() {\n    HashMap map;\n    int m;\n    cin >> m;\n    for (int i = 0; i < m; i++) {\n        string cmd;\n        int k, v;\n        cin >> cmd;\n        if (cmd == \"put\") { cin >> k >> v; map.put(k, v); }\n        else if (cmd == \"get\") {\n            cin >> k;\n            if (map.get(k, v)) cout << \"get(\" << k << \") -> \" << v << endl;\n            else cout << \"get(\" << k << \") -> NOT FOUND\" << endl;\n        } else if (cmd == \"print\") map.print();\n    }\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nconst int CAP = 11;\nconst int EMPTY_KEY = 0;   // nyckeln 0 betyder tom plats\n\nstruct Entry {\n    int key = EMPTY_KEY;\n    int value = 0;\n};\n\nclass HashMap {\npublic:\n    void put(int key, int value) {\n        int start = hash(key);\n        for (int step = 0; step < CAP; step++) {\n            Entry& e = table[(start + step) % CAP];   // nästa plats, runt till 0 efter sista\n            if (e.key == EMPTY_KEY) { e.key = key; e.value = value; return; }   // insert\n            if (e.key == key) { e.value = value; return; }                     // update\n        }\n        cout << \"FULL: key=\" << key << endl;\n    }\n\n    bool get(int key, int& out) const {\n        int start = hash(key);\n        for (int step = 0; step < CAP; step++) {\n            const Entry& e = table[(start + step) % CAP];\n            if (e.key == EMPTY_KEY) return false;   // hål: nyckeln kan inte finnas längre fram\n            if (e.key == key) { out = e.value; return true; }\n        }\n        return false;\n    }\n\n    void print() const {\n        for (int i = 0; i < CAP; i++) {\n            if (table[i].key == EMPTY_KEY) cout << \"[\" << i << \"] EMPTY\" << endl;\n            else cout << \"[\" << i << \"] key=\" << table[i].key << \" value=\" << table[i].value << endl;\n        }\n    }\n\nprivate:\n    static int hash(int key) { return key % CAP; }\n    Entry table[CAP];\n};\n\nint main() {\n    HashMap map;\n    int m;\n    cin >> m;\n    for (int i = 0; i < m; i++) {\n        string cmd;\n        int k, v;\n        cin >> cmd;\n        if (cmd == \"put\") { cin >> k >> v; map.put(k, v); }\n        else if (cmd == \"get\") {\n            cin >> k;\n            if (map.get(k, v)) cout << \"get(\" << k << \") -> \" << v << endl;\n            else cout << \"get(\" << k << \") -> NOT FOUND\" << endl;\n        } else if (cmd == \"print\") map.print();\n    }\n    return 0;\n}\n"},"py":{"starter":"CAP = 11\ntable = [None] * CAP   # varje plats är None eller en tupel (key, value)\n\n\ndef put(key, value):\n    # TODO: linjär sondering från key % CAP. Tom plats: lägg in. Samma nyckel: uppdatera.\n    #       Hittas ingen plats: print(f\"FULL: key={key}\")\n    pass\n\n\ndef get(key):\n    # TODO: samma sondering. Stoppa på tom plats. Returnera värdet eller None.\n    return None\n\n\ndef print_table():\n    for i, e in enumerate(table):\n        print(f\"[{i}] EMPTY\" if e is None else f\"[{i}] key={e[0]} value={e[1]}\")\n\n\nfor _ in range(int(input())):\n    cmd, *arg = input().split()\n    if cmd == \"put\":\n        put(int(arg[0]), int(arg[1]))\n    elif cmd == \"get\":\n        v = get(int(arg[0]))\n        print(f\"get({arg[0]}) -> {'NOT FOUND' if v is None else v}\")\n    elif cmd == \"print\":\n        print_table()\n","sol":"CAP = 11\ntable = [None] * CAP   # varje plats är None eller en tupel (key, value)\n\n\ndef put(key, value):\n    start = key % CAP\n    for step in range(CAP):\n        idx = (start + step) % CAP     # nästa plats, runt till 0 efter sista\n        if table[idx] is None or table[idx][0] == key:\n            table[idx] = (key, value)  # insert i tom plats, eller update av samma nyckel\n            return\n    print(f\"FULL: key={key}\")\n\n\ndef get(key):\n    start = key % CAP\n    for step in range(CAP):\n        e = table[(start + step) % CAP]\n        if e is None:\n            return None                # hål: nyckeln kan inte finnas längre fram\n        if e[0] == key:\n            return e[1]\n    return None\n\n\ndef print_table():\n    for i, e in enumerate(table):\n        print(f\"[{i}] EMPTY\" if e is None else f\"[{i}] key={e[0]} value={e[1]}\")\n\n\nfor _ in range(int(input())):\n    cmd, *arg = input().split()\n    if cmd == \"put\":\n        put(int(arg[0]), int(arg[1]))\n    elif cmd == \"get\":\n        v = get(int(arg[0]))\n        print(f\"get({arg[0]}) -> {'NOT FOUND' if v is None else v}\")\n    elif cmd == \"print\":\n        print_table()\n"}},"langs":["c","cpp","py"],"web":["py"],"gpp":false}]},{"id":"grafer","cat":"Datastrukturer","min":15,"title":"Grafer","lead":"Noder och bågar: riktade, viktade, hur grafer sparas, BFS och DFS, och kända grafproblem som kortaste väg och minsta uppspännande träd.","src":["Grafer","Övningar 7 – Grafer"],"goals":["Förklara riktad/oriktad och viktad/oviktad graf, grad och angränsande","Spara en graf som grannlista och som grannmatris och jämföra dem","Köra BFS och DFS för hand och i kod, med visited","Känna till Prim, Dijkstra, A*, Floyd-Warshall, kappsäcksproblemet och handelsresandeproblemet"],"blocks":[["h","Vad är en graf?"],["p","En <strong>graf</strong> är en samling <strong>noder</strong> (vertex) och <strong>bågar</strong> (edge) mellan dem. Den liknar ett träd, men har ingen speciell startpunkt och får ha cykler. Grafer modellerar vägnät, flygrutter, nätverk, beroenden mellan uppgifter och drag i brädspel."],["list",["<strong>Oriktad:</strong> bågarna går åt båda hållen, som \"vi är vänner\".","<strong>Riktad:</strong> bågarna har en riktning, som \"följer\" på sociala medier.","<strong>Viktad:</strong> bågarna har ett värde, som restid eller avstånd.","<strong>Multigraf:</strong> flera bågar mellan samma par av noder."]],["p","Två noder är <strong>angränsande</strong> om det finns en båge mellan dem. I riktade grafer kallas grannen för <strong>successor</strong>. En nods <strong>grad</strong> är antalet bågar den har. I riktade grafer skiljer man på in-grad och ut-grad."],["h","Representation"],["table",["","Grannlista (adjacency list)","Grannmatris (adjacency matrix)"],[["Hur","En lista per nod med grannarnas id","En V × V-tabell där M[i][j] = 1 om det finns en båge i → j"],["Minne","O(V + E)","O(V²)"],["Finns båge i → j?","O(grad), gå igenom listan","O(1), titta i M[i][j]"],["Passar","Glesa grafer: vägnät, sociala nätverk","Täta grafer, eller små grafer där man ofta frågar om bågar"]]],["note","tip","Med 10 000 noder blir matrisen 100 miljoner celler, även om varje nod bara har ett fåtal grannar. Då är grannlistan självklar."],["h","Traversering och visited"],["p","När man traverserar vill man oftast besöka alla noder en gång. Eftersom grafer kan ha cykler måste man <strong>markera besökta noder</strong> (visited). Annars kan man gå runt i en cykel för alltid: 0 → 1 → 2 → 0 → 1 …"],["h","BFS och DFS"],["list",["<strong>Bredden först (BFS):</strong> besök noden, lägg alla obesökta grannar i en <strong>kö</strong>, ta nästa från kön. Går nivå för nivå, som levelorder i ett träd. Hittar kortaste vägen i antal bågar.","<strong>Djupet först (DFS):</strong> besök noden och gå direkt vidare till en obesökt granne, så djupt det går, innan nästa granne. Använder en <strong>stack</strong>, oftast anropsstacken via rekursion. Liknar preorder."]],["code","text","Bågar: 0-1, 0-2, 1-3, 1-4, 2-5, 4-5, 5-6\n\nGrannlista:\n0: 1, 2        4: 1, 5\n1: 0, 3, 4     5: 2, 4, 6\n2: 0, 5        6: 5\n3: 1\n\nBFS från 0:  0 1 2 3 4 5 6\nDFS från 0:  0 1 3 4 5 2 6\n","exempelgrafen"],["code","c","void bfs(int start) {\n    int visited[N] = {0};\n    Queue q;\n    queue_init(&q);\n    visited[start] = 1;          // markera när noden läggs i kön\n    queue_push(&q, start);\n    while (!queue_is_empty(&q)) {\n        int v = queue_pop(&q);\n        printf(\"%d \", v);\n        for (int i = 0; i < deg[v]; i++) {\n            int u = neighbors[v][i];\n            if (!visited[u]) {\n                visited[u] = 1;\n                queue_push(&q, u);\n            }\n        }\n    }\n}\n","BFS i C"],["note","warn","Markera visited när noden läggs i kön, inte när den tas ut. Annars kan samma nod läggas i kön flera gånger av olika grannar."],["h","Begrepp och kända problem"],["list",["<strong>Cykel:</strong> en väg som börjar och slutar i samma nod.","<strong>Hamiltonsk graf:</strong> det finns en cykel som besöker varje nod exakt en gång.","<strong>Eulergraf:</strong> det finns en väg som går längs varje båge exakt en gång.","<strong>Homeomorfa grafer:</strong> kan sträckas ut till samma form. Svårt att avgöra.","<strong>Minsta uppspännande träd (MST):</strong> ett träd med alla noder där summan av bågvikterna är minsta möjliga. <strong>Prims algoritm</strong> börjar i valfri nod och lägger hela tiden till den billigaste bågen till en nod som inte är med än.","<strong>Dijkstra:</strong> kortaste vägen från a till b, söker i alla riktningar.","<strong>A*:</strong> som Dijkstra men styr sökningen mot målet med en uppskattning, och blir oftast snabbare.","<strong>Floyd-Warshall:</strong> kortaste vägen mellan alla par av noder i en körning, O(n³).","<strong>Kappsäcksproblemet:</strong> välj föremål med vikt och värde så att värdet blir störst utan att maxvikten överskrids. Kan lösas med DFS/BFS i ett binärt beslutsträd: vänster tar med nästa föremål, höger tar inte med det.","<strong>Handelsresandeproblemet:</strong> kortaste cykeln genom alla noder. Ingen känd snabb lösning. I praktiken nöjer man sig med bra uppskattningar."]],["h","Variadiska funktioner"],["p","Inte grafrelaterat, men användbart: en <strong>variadisk funktion</strong> tar ett okänt antal argument, som <code>printf</code>. I C används <code>&lt;stdarg.h&gt;</code> med <code>va_list</code>, <code>va_start</code>, <code>va_arg</code> och <code>va_end</code>."],["ex","Grad i en riktad graf","<p>Noder A, B, C, D med bågarna A→B, A→C, B→C, C→A, D→C. Ange in- och ut-grad för varje nod.</p><p><strong>Svar:</strong> A: in 1, ut 2. B: in 1, ut 1. C: in 3, ut 1. D: in 0, ut 1. C har flest inkommande och verkar mest central.</p>"],["ex","Matris till lista och DFS","<p>Den riktade grafen har M[0][1], M[0][4], M[1][2], M[2][3], M[3][1] och M[4][3] lika med 1. Bygg grannlistan, kör DFS från 0 och leta efter en cykel.</p><p><strong>Svar:</strong> 0: 1, 4. 1: 2. 2: 3. 3: 1. 4: 3. DFS från 0 ger 0 1 2 3 4. Cykeln är 1 → 2 → 3 → 1.</p>"]],"pool":[{"t":"multi","q":"Vilka grafer är riktade?","o":["\"Följer\" på sociala medier","Vänskap","Beroenden: A måste vara klar före B","Vägnät med enkelriktade gator"],"a":[0,2,3],"why":"Vänskap gäller åt båda hållen."},{"t":"mc","q":"Vad är en viktad graf?","o":["En graf med många noder","En graf där bågarna har ett värde, som avstånd","En graf utan cykler","En graf med riktade bågar"],"a":1,"why":"Vikterna kan vara restid, kostnad eller avstånd."},{"t":"mc","q":"Vilken representation tar O(V²) minne?","o":["Grannlista","Grannmatris","Båda","Ingen"],"a":1,"why":"En cell för varje par av noder."},{"t":"mc","q":"Vilken representation svarar snabbast på \"finns båge i → j?\"","o":["Grannlista","Grannmatris","Lika snabbt","Ingen av dem"],"a":1,"why":"O(1): titta i M[i][j]."},{"t":"mc","q":"Vilken datastruktur använder BFS?","o":["Stack","Kö","Mängd","Hashtabell"],"a":1,"why":"Först in, först ut ger nivå för nivå."},{"t":"mc","q":"Vilken datastruktur använder DFS?","o":["Kö","Stack (eller rekursion)","Hashtabell","Pri  { neighbors[u][deg[u]++] = v; }\n\nvoid sortNeighbors(int v) {   // grannar i stigande ordning (insertion sort)\n    for (int i = 1; i < deg[v]; i++) {\n        int key = neighbors[v][i], j = i - 1;\n        while (j >= 0 && neighbors[v][j] > key) { neighbors[v][j + 1] = neighbors[v][j]; j--; }\n        neighbors[v][j + 1] = key;\n    }\n}\n\ntypedef struct {\n    int data[N];\n    int head, tail, count;\n} Queue;\n\nvoid queue_init(Queue* q) { q->head = q->tail = q->count = 0; }\nint queue_is_empty(Queue* q) { return q->count == 0; }\nvoid queue_push(Queue* q, int x) { /* TODO */ }\nint queue_pop(Queue* q) { /* TODO */ return -1; }\n\nvoid bfs(int start) {\n    int visited[N] = {0};\n    Queue q;\n    queue_init(&q);\n    // TODO: markera start och lägg den i kön, och loopa tills kön är tom\n    printf(\"\\n\");\n}\n\nint main(void) {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        addEdge(u, v);\n        addEdge(v, u);    // oriktad graf: bågen går åt båda hållen\n    }\n    for (int v = 0; v < n; v++) sortNeighbors(v);\n    int start;\n    scanf(\"%d\", &start);\n\n    bfs(start);\n    return 0;\n}\n","sol":"#include <stdio.h>\n\n#define N 100\n\nint deg[N];\nint neighbors[N][N];   // grannlista: neighbors[v][0..deg[v]-1]\n\nvoid addEdge(int u, int v) { neighbors[u][deg[u]++] = v; }\n\nvoid sortNeighbors(int v) {   // grannar i stigande ordning (insertion sort)\n    for (int i = 1; i < deg[v]; i++) {\n        int key = neighbors[v][i], j = i - 1;\n        while (j >= 0 && neighbors[v][j] > key) { neighbors[v][j + 1] = neighbors[v][j]; j--; }\n        neighbors[v][j + 1] = key;\n    }\n}\n\ntypedef struct {\n    int data[N];\n    int head, tail, count;\n} Queue;\n\nvoid queue_init(Queue* q) { q->head = q->tail = q->count = 0; }\nint queue_is_empty(Queue* q) { return q->count == 0; }\n\nvoid queue_push(Queue* q, int x) {\n    q->data[q->tail] = x;\n    q->tail = (q->tail + 1) % N;   // ringbuffert\n    q->count++;\n}\n\nint queue_pop(Queue* q) {\n    int x = q->data[q->head];\n    q->head = (q->head + 1) % N;\n    q->count--;\n    return x;\n}\n\nvoid bfs(int start) {\n    int visited[N] = {0};\n    Queue q;\n    queue_init(&q);\n    visited[start] = 1;            // markera när noden läggs i kön, så att den inte läggs dit två gånger\n    queue_push(&q, start);\n    int first = 1;\n    while (!queue_is_empty(&q)) {\n        int v = queue_pop(&q);\n        printf(first ? \"%d\" : \" %d\", v);\n        first = 0;\n        for (int i = 0; i < deg[v]; i++) {\n            int u = neighbors[v][i];\n            if (!visited[u]) {\n                visited[u] = 1;\n                queue_push(&q, u);\n            }\n        }\n    }\n    printf(\"\\n\");\n}\n\nint main(void) {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        addEdge(u, v);\n        addEdge(v, u);    // oriktad graf: bågen går åt båda hållen\n    }\n    for (int v = 0; v < n; v++) sortNeighbors(v);\n    int start;\n    scanf(\"%d\", &start);\n\n    bfs(start);\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nvector<vector<int>> readGraph(int& start) {\n    int n, m;\n    cin >> n >> m;\n    vector<vector<int>> adj(n);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        cin >> u >> v;\n        adj[u].push_back(v);\n        adj[v].push_back(u);   // oriktad graf: bågen går åt båda hållen\n    }\n    for (auto& list : adj) sort(list.begin(), list.end());   // grannar i stigande ordning\n    cin >> start;\n    return adj;\n}\n\nvoid bfs(const vector<vector<int>>& adj, int start) {\n    vector<bool> visited(adj.size(), false);\n    queue<int> q;\n    // TODO: markera start och lägg den i kön. Plocka ut, skriv ut och lägg till obesökta grannar.\n    cout << endl;\n}\n\nint main() {\n    int start;\n    auto adj = readGraph(start);\n    bfs(adj, start);\n    return 0;\n}\n","sol":"#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nvector<vector<int>> readGraph(int& start) {\n    int n, m;\n    cin >> n >> m;\n    vector<vector<int>> adj(n);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        cin >> u >> v;\n        adj[u].push_back(v);\n        adj[v].push_back(u);   // oriktad graf: bågen går åt båda hållen\n    }\n    for (auto& list : adj) sort(list.begin(), list.end());   // grannar i stigande ordning\n    cin >> start;\n    return adj;\n}\n\nvoid bfs(const vector<vector<int>>& adj, int start) {\n    vector<bool> visited(adj.size(), false);\n    queue<int> q;\n    visited[start] = true;         // markera när noden läggs i kön, så att den inte läggs dit två gånger\n    q.push(start);\n    bool first = true;\n    while (!q.empty()) {\n        int v = q.front();\n        q.pop();\n        cout << (first ? \"\" : \" \") << v;\n        first = false;\n        for (int u : adj[v]) {\n            if (!visited[u]) {\n                visited[u] = true;\n                q.push(u);\n            }\n        }\n    }\n    cout << endl;\n}\n\nint main() {\n    int start;\n    auto adj = readGraph(start);\n    bfs(adj, start);\n    return 0;\n}\n"},"py":{"starter":"n, m = (int(x) for x in input().split())\nadj = [[] for _ in range(n)]\nfor _ in range(m):\n    u, v = (int(x) for x in input().split())\n    adj[u].append(v)\n    adj[v].append(u)   # oriktad graf: bågen går åt båda hållen\nfor lst in adj:\n    lst.sort()         # grannar i stigande ordning\nstart = int(input())\n\nfrom collections import deque\n\nvisited = [False] * n\nqueue = deque()\norder = []\n# TODO: BFS från start. Markera när noden läggs i kön.\nprint(*order)\n","sol":"n, m = (int(x) for x in input().split())\nadj = [[] for _ in range(n)]\nfor _ in range(m):\n    u, v = (int(x) for x in input().split())\n    adj[u].append(v)\n    adj[v].append(u)   # oriktad graf: bågen går åt båda hållen\nfor lst in adj:\n    lst.sort()         # grannar i stigande ordning\nstart = int(input())\n\nfrom collections import deque\n\nvisited = [False] * n\nqueue = deque([start])\nvisited[start] = True        # markera när noden läggs i kön, så att den inte läggs dit två gånger\norder = []\nwhile queue:\n    v = queue.popleft()      # kö: först in, först ut\n    order.append(v)\n    for u in adj[v]:\n        if not visited[u]:\n            visited[u] = True\n            queue.append(u)\nprint(*order)\n"}},"langs":["c","cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"DFS. Samma indata som BFS-uppgiften. Skriv ut besöksordningen med rekursiv DFS, grannar i stigande ordning.","why":"Markera noden när du går in i den, och anropa dfs på varje obesökt granne i tur och ordning.","task":"08-grafer-2","tests":[{"in":"7 7\n0 1\n0 2\n1 3\n1 4\n2 5\n4 5\n5 6\n0\n","out":"0 1 3 4 5 2 6\n"},{"in":"6 6\n5 0\n0 3\n3 1\n1 2\n2 0\n4 2\n0\n","out":"0 2 1 3 4 5\n"},{"in":"5 3\n0 1\n1 2\n3 4\n3\n","out":"3 4\n"},{"in":"4 4\n2 3\n1 3\n0 3\n0 1\n2\n","out":"2 3 0 1\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\n#define N 100\n\nint deg[N];\nint neighbors[N][N];   // grannlista: neighbors[v][0..deg[v]-1]\n\nvoid addEdge(int u, int v) { neighbors[u][deg[u]++] = v; }\n\nvoid sortNeighbors(int v) {   // grannar i stigande ordning (insertion sort)\n    for (int i = 1; i < deg[v]; i++) {\n        int key = neighbors[v][i], j = i - 1;\n        while (j >= 0 && neighbors[v][j] > key) { neighbors[v][j + 1] = neighbors[v][j]; j--; }\n        neighbors[v][j + 1] = key;\n    }\n}\n\nint visited[N];\nint printed = 0;\n\nvoid dfs(int v) {\n    // TODO: markera v, skriv ut den och gå rekursivt till varje obesökt granne\n}\n\nint main(void) {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        addEdge(u, v);\n        addEdge(v, u);    // oriktad graf: bågen går åt båda hållen\n    }\n    for (int v = 0; v < n; v++) sortNeighbors(v);\n    int start;\n    scanf(\"%d\", &start);\n\n    dfs(start);\n    printf(\"\\n\");\n    return 0;\n}\n","sol":"#include <stdio.h>\n\n#define N 100\n\nint deg[N];\nint neighbors[N][N];   // grannlista: neighbors[v][0..deg[v]-1]\n\nvoid addEdge(int u, int v) { neighbors[u][deg[u]++] = v; }\n\nvoid sortNeighbors(int v) {   // grannar i stigande ordning (insertion sort)\n    for (int i = 1; i < deg[v]; i++) {\n        int key = neighbors[v][i], j = i - 1;\n        while (j >= 0 && neighbors[v][j] > key) { neighbors[v][j + 1] = neighbors[v][j]; j--; }\n        neighbors[v][j + 1] = key;\n    }\n}\n\nint visited[N];\nint printed = 0;\n\nvoid dfs(int v) {\n    visited[v] = 1;                // markera när vi går in i noden\n    printf(printed++ ? \" %d\" : \"%d\", v);\n    for (int i = 0; i < deg[v]; i++) {\n        int u = neighbors[v][i];\n        if (!visited[u]) dfs(u);   // gå så djupt som möjligt innan nästa granne\n    }\n}\n\nint main(void) {\n    int n, m;\n    scanf(\"%d %d\", &n, &m);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        scanf(\"%d %d\", &u, &v);\n        addEdge(u, v);\n        addEdge(v, u);    // oriktad graf: bågen går åt båda hållen\n    }\n    for (int v = 0; v < n; v++) sortNeighbors(v);\n    int start;\n    scanf(\"%d\", &start);\n\n    dfs(start);\n    printf(\"\\n\");\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nvector<vector<int>> readGraph(int& start) {\n    int n, m;\n    cin >> n >> m;\n    vector<vector<int>> adj(n);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        cin >> u >> v;\n        adj[u].push_back(v);\n        adj[v].push_back(u);   // oriktad graf: bågen går åt båda hållen\n    }\n    for (auto& list : adj) sort(list.begin(), list.end());   // grannar i stigande ordning\n    cin >> start;\n    return adj;\n}\n\nvector<bool> visited;\nvector<int> order;\n\nvoid dfs(const vector<vector<int>>& adj, int v) {\n    // TODO: markera v, lägg den i order och gå rekursivt till varje obesökt granne\n}\n\nint main() {\n    int start;\n    auto adj = readGraph(start);\n    visited.assign(adj.size(), false);\n    dfs(adj, start);\n    for (size_t i = 0; i < order.size(); i++) cout << (i ? \" \" : \"\") << order[i];\n    cout << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nvector<vector<int>> readGraph(int& start) {\n    int n, m;\n    cin >> n >> m;\n    vector<vector<int>> adj(n);\n    for (int i = 0; i < m; i++) {\n        int u, v;\n        cin >> u >> v;\n        adj[u].push_back(v);\n        adj[v].push_back(u);   // oriktad graf: bågen går åt båda hållen\n    }\n    for (auto& list : adj) sort(list.begin(), list.end());   // grannar i stigande ordning\n    cin >> start;\n    return adj;\n}\n\nvector<bool> visited;\nvector<int> order;\n\nvoid dfs(const vector<vector<int>>& adj, int v) {\n    visited[v] = true;             // markera när vi går in i noden\n    order.push_back(v);\n    for (int u : adj[v])\n        if (!visited[u]) dfs(adj, u);   // gå så djupt som möjligt innan nästa granne\n}\n\nint main() {\n    int start;\n    auto adj = readGraph(start);\n    visited.assign(adj.size(), false);\n    dfs(adj, start);\n    for (size_t i = 0; i < order.size(); i++) cout << (i ? \" \" : \"\") << order[i];\n    cout << endl;\n    return 0;\n}\n"},"py":{"starter":"n, m = (int(x) for x in input().split())\nadj = [[] for _ in range(n)]\nfor _ in range(m):\n    u, v = (int(x) for x in input().split())\n    adj[u].append(v)\n    adj[v].append(u)   # oriktad graf: bågen går åt båda hållen\nfor lst in adj:\n    lst.sort()         # grannar i stigande ordning\nstart = int(input())\n\nvisited = [False] * n\norder = []\n\n\ndef dfs(v):\n    # TODO: markera v, lägg den i order och gå rekursivt till varje obesökt granne\n    pass\n\n\ndfs(start)\nprint(*order)\n","sol":"n, m = (int(x) for x in input().split())\nadj = [[] for _ in range(n)]\nfor _ in range(m):\n    u, v = (int(x) for x in input().split())\n    adj[u].append(v)\n    adj[v].append(u)   # oriktad graf: bågen går åt båda hållen\nfor lst in adj:\n    lst.sort()         # grannar i stigande ordning\nstart = int(input())\n\nvisited = [False] * n\norder = []\n\n\ndef dfs(v):\n    visited[v] = True          # markera när vi går in i noden\n    order.append(v)\n    for u in adj[v]:\n        if not visited[u]:\n            dfs(u)             # gå så djupt som möjligt innan nästa granne\n\n\ndfs(start)\nprint(*order)\n"}},"langs":["c","cpp","py"],"web":["py"],"gpp":false}]},{"id":"sql","cat":"Databaser","min":14,"title":"Databaser och SQL","lead":"Varför databaser, tabeller, nycklar och relationer, SQL-frågorna som kommer på tentan, och hur C-program pratar med SQLite och Postgres.","src":["Föreläsning 8 – Databaser och SQL"],"goals":["Förklara när en databas behövs i stället för filer","Använda begreppen rad, kolumn, primärnyckel och främmande nyckel","Skriva SELECT med WHERE, DISTINCT, ORDER BY, LIMIT, LIKE och NULL","Skilja på DDL och DML och använda CRUD","Förklara normalisering, GROUP BY och JOIN på grundnivå"],"blocks":[["h","Varför databaser?"],["p","Ibland vill vi spara data mer eller mindre permanent och kunna söka effektivt bland stora mängder. Filer och CSV räcker när du bara loggar och läser allt senare. En databas behövs när du vill fråga flexibelt (\"senaste 10 events för sensor 3\", \"antal ERROR per sensor idag\"), vill ha integritet utan trasiga referenser, eller har flera klienter samtidigt."],["table",["","SQLite","PostgreSQL"],[["Typ","Filbaserad, inbyggd, ingen server","Serverdatabas"],["Passar","Edge-enheter, gateways, offline-loggning","Flera program och klienter, system som växer"]]],["h","Tabeller och nycklar"],["p","En tabell är en datastruktur som databasen optimerar för sökning, sortering och indexering."],["list",["<strong>Rad (row):</strong> en post, till exempel ett event","<strong>Kolumn (column):</strong> ett attribut, till exempel namn","<strong>Primärnyckel (PK):</strong> unik identitet för raden","<strong>Främmande nyckel (FK):</strong> pekar på en primärnyckel i en annan tabell. Så skapas relationer."]],["code","text","Sensors                    Events\nid  name      loc          id  ts                   sensor_id  type    value\n1   Temp-A    Lab1         10  2026-01-22 10:03:00  1          TEMP    21.7\n2   Motion-1  Hall         11  2026-01-22 10:03:02  2          MOTION  1\n","en sensor har många events (1 till *)"],["h","SQL-kärnan (tentan)"],["table",["ID","Name","Program","Enrolled"],[["1","Frida","IOT","2021"],["2","Elin","AI","2021"],["3","Börje","AI","2020"],["4","Ingrid","Engineering","2023"],["5","Karl","Engineering","2022"],["6","Erik","AI","2021"],["7","Jonathan","IOT","2020"]]],["code","sql","SELECT Name FROM Students;                          -- alla namn\n\nSELECT Name FROM Students WHERE Program = 'IOT';    -- Frida, Jonathan\n\nSELECT DISTINCT Program FROM Students;              -- IOT, AI, Engineering (unika)\n\nSELECT DISTINCT Program FROM Students\nORDER BY Program DESC;                              -- sorterat baklänges\n\nSELECT DISTINCT Enrolled FROM Students\nWHERE Program = 'AI';                               -- 2021, 2020\n","SELECT, WHERE, DISTINCT, ORDER BY"],["note","warn","Strängar skrivs med enkla citattecken: <code>'AI'</code>. Dubbla citattecken betyder ett kolumnnamn i Postgres."],["h","Lite mer SELECT"],["code","sql","SELECT * FROM Events ORDER BY ts DESC LIMIT 10;            -- de 10 senaste\n\nSELECT Name FROM Students\nWHERE Program = 'AI' AND Enrolled >= 2021;                 -- Elin, Erik\n\nSELECT Name FROM Students WHERE Name LIKE 'J%';            -- namn som börjar på J\n\nSELECT * FROM Events WHERE value IS NULL;                  -- saknat värde\n","LIMIT, AND, LIKE, NULL"],["p","<strong>NULL</strong> betyder saknat eller okänt värde. Det är inte samma sak som 0, och du jämför med <code>IS NULL</code> eller <code>IS NOT NULL</code>, aldrig med <code>= NULL</code>."],["h","DDL, DML och CRUD"],["list",["<strong>DDL</strong> (Data Definition Language) definierar strukturen: <code>CREATE TABLE</code>, <code>ALTER TABLE</code>, <code>DROP TABLE</code>.","<strong>DML</strong> (Data Manipulation Language) ändrar data: <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>.","<strong>DQL</strong> frågar data: <code>SELECT</code>.","<strong>CRUD</strong> är Create, Read, Update, Delete: INSERT, SELECT, UPDATE, DELETE."]],["code","sql","CREATE TABLE Sensors (\n    id   INTEGER PRIMARY KEY,\n    name TEXT NOT NULL,\n    loc  TEXT\n);\n\nCREATE TABLE Events (\n    id        INTEGER PRIMARY KEY,\n    ts        TEXT NOT NULL,\n    sensor_id INTEGER NOT NULL,\n    type      TEXT NOT NULL,\n    value     REAL,\n    FOREIGN KEY (sensor_id) REFERENCES Sensors(id)\n);\n\nINSERT INTO Students (ID, Name, Program, Enrolled) VALUES (8, 'Maja', 'IOT', 2022);\nUPDATE Students SET Program = 'AI' WHERE ID = 8;\nDELETE FROM Students WHERE ID = 8;\n","DDL och DML"],["note","warn","DELETE utan WHERE tar bort alla rader i tabellen."],["h","Normalisering"],["p","Lägger vi sensorns namn och plats direkt i varje event måste vi uppdatera många rader när sensorn flyttas, och glömmer vi en blir databasen inkonsekvent. <strong>Normaliserat</strong> sparas sensorn en gång i Sensors, och Events pekar dit med <code>sensor_id</code>. Då räcker <code>UPDATE Sensors SET loc = 'Lab2' WHERE id = 1;</code>."],["h","GROUP BY och JOIN"],["code","sql","SELECT sensor_id, COUNT(*) AS n_events\nFROM Events\nGROUP BY sensor_id\nHAVING COUNT(*) >= 100\nORDER BY n_events DESC;\n\nSELECT e.ts, s.name, e.type, e.value\nFROM Events e\nJOIN Sensors s ON s.id = e.sensor_id\nORDER BY e.ts DESC\nLIMIT 20;\n","aggregat och JOIN"],["h","Verktyg och SQL från C"],["p","<strong>DBeaver</strong>, pgAdmin och DB Browser for SQLite är grafiska verktyg. I terminalen finns <code>psql</code> (<code>\\dt</code> listar tabeller) och <code>sqlite3</code> (<code>.tables</code>, <code>.schema</code>). Från C öppnar programmet en anslutning, skickar en SQL-sträng, får rader tillbaka och itererar över dem. Använd <strong>prepared statements</strong> med parametrar (<code>?</code> i SQLite) i stället för att klistra ihop strängar, så slipper du SQL injection."],["code","c","sqlite3_stmt* stmt = NULL;\nsqlite3_prepare_v2(db, \"INSERT INTO Events(ts, sensor_id, type, value) VALUES(?,?,?,?);\", -1, &stmt, NULL);\nsqlite3_bind_int(stmt, 1, 1001);\nsqlite3_bind_int(stmt, 2, 7);\nsqlite3_bind_text(stmt, 3, \"TEMP\", -1, SQLITE_STATIC);\nsqlite3_bind_int(stmt, 4, 42);\nsqlite3_step(stmt);\nsqlite3_finalize(stmt);\n","SQLite i C (kompilera med -lsqlite3)"],["ex","Öva SQL","<p>Gör lektionerna på sqlbolt.com, och skriv frågor mot Students-tabellen: alla som började 2021, alla program sorterade i bokstavsordning utan dubbletter, och alla namn som slutar på \"n\".</p><p><strong>Förslag:</strong> <code>SELECT Name FROM Students WHERE Enrolled = 2021;</code>, <code>SELECT DISTINCT Program FROM Students ORDER BY Program;</code>, <code>SELECT Name FROM Students WHERE Name LIKE '%n';</code></p>"]],"pool":[{"t":"mc","q":"Vad är en primärnyckel?","o":["En nyckel som pekar på en annan tabell","Unik identitet för en rad","Ett lösenord till databasen","Den första kolumnen"],"a":1,"why":"En främmande nyckel pekar på en primärnyckel i en annan tabell."},{"t":"mc","q":"Vad gör en främmande nyckel (FK)?","o":["Krypterar kolumnen","Pekar på en primärnyckel i en annan tabell och skapar en relation","Gör kolumnen unik","Sorterar tabellen"],"a":1,"why":"Den garanterar att till exempel sensor_id faktiskt finns."},{"t":"mc","q":"Vilken fråga ger varje program en gång?","o":["SELECT Program FROM Students;","SELECT DISTINCT Program FROM Students;","SELECT UNIQUE Students;","SELECT * FROM Program;"],"a":1,"why":"DISTINCT tar bort dubbletter."},{"t":"multi","q":"Vilka studenter ger <code>SELECT Name FROM Students WHERE Program = 'AI' AND Enrolled &gt;= 2021;</code>?","o":["Elin","Börje","Erik","Frida"],"a":[0,2],"why":"Börje började 2020 och Frida går IOT."},{"t":"mc","q":"Hur sorterar du fallande?","o":["ORDER BY x UP","ORDER BY x DESC","SORT x DOWN","ORDER x REVERSE"],"a":1,"why":"ASC är stigande och standard."},{"t":"mc","q":"Hur kollar du om ett värde saknas?","o":["value = NULL","value IS NULL","value == 0","value = ''"],"a":1,"why":"NULL jämförs med IS NULL. NULL är inte 0."},{"t":"text","q":"Vilket nyckelord begränsar antalet rader som returneras?","accept":["LIMIT"],"ph":"nyckelord","why":"<code>... ORDER BY ts DESC LIMIT 10;</code>"},{"t":"mc","q":"Vilka namn matchar <code>LIKE 'J%'</code>?","o":["Namn som innehåller J","Namn som börjar på J","Namn som slutar på J","Bara \"J\""],"a":1,"why":"% matchar valfritt antal tecken."},{"t":"mc","q":"Är CREATE TABLE DDL eller DML?","o":["DDL","DML","DQL","Inget av dem"],"a":0,"why":"DDL definierar strukturen. INSERT, UPDATE och DELETE är DML."},{"t":"multi","q":"Vilka hör till CRUD?","o":["INSERT","SELECT","UPDATE","DELETE","CREATE TABLE"],"a":[0,1,2,3],"why":"Create, Read, Update, Delete. CREATE TABLE skapar strukturen, inte data."},{"t":"mc","q":"Vad händer med <code>DELETE FROM Students;</code>?","o":["Ingenting utan WHERE","Alla rader tas bort","Tabellen tas bort","Den första raden tas bort"],"a":1,"why":"Glöm aldrig WHERE."},{"t":"mc","q":"Varför normaliserar man?","o":["För att databasen ska bli snabbare att skapa","För att undvika dubblerad data som kan bli inkonsekvent","För att slippa nycklar","För att kunna använda LIKE"],"a":1,"why":"Då ändras en uppgift på ett ställe."},{"t":"mc","q":"När passar SQLite bättre än Postgres?","o":["Många klienter samtidigt","På en edge-enhet eller gateway utan server","När systemet ska skalas upp","Aldrig"],"a":1,"why":"SQLite är en fil, utan server."},{"t":"mc","q":"Varför använder man prepared statements?","o":["De är kortare","De skyddar mot SQL injection och är snabbare vid upprepning","De behövs för SELECT","De sorterar resultatet"],"a":1,"why":"Parametrarna skickas separat från SQL-texten."}]},{"id":"designmonster","cat":"Design","min":12,"title":"Design patterns","lead":"Beprövade lösningsmallar för vanliga designproblem: de tre familjerna, Builder, Singleton, Template Method och Strategy, och en översikt över resten.","src":["Design Patterns","Design Patterns översikt"],"goals":["Förklara vad ett design pattern är och de tre familjerna","Implementera Builder, Singleton och Template Method","Använda Strategy-light med funktionspekare för att välja algoritm","Känna igen de vanligaste mönstren och när de passar"],"blocks":[["h","Vad är ett design pattern?"],["p","Ett <strong>design pattern</strong> är en återkommande lösningsidé för ett vanligt designproblem, inte färdig kod. Det har inget med algoritmer eller datastrukturer att göra, utan handlar om hur man strukturerar program, främst inom OOP. Målet är att du ska känna igen en situation (\"det här är ett Strategy-problem\") och välja en beprövad struktur, och att utvecklare får ett gemensamt språk."],["p","De flesta mönstren kommer från boken <em>Design Patterns</em> av författargruppen <strong>Gang of Four (GoF)</strong>, som beskriver drygt 20 mönster i tre familjer:"],["table",["Familj","Handlar om","Exempel"],[["Creational","Hur objekt skapas","Singleton, Factory Method, Abstract Factory, Builder, Prototype"],["Structural","Hur klasser och objekt kopplas ihop","Adapter, Facade, Decorator, Composite, Proxy, Bridge, Flyweight"],["Behavioral","Kommunikation och ansvar mellan objekt","Template Method, Observer, Command, State, Iterator, Strategy, Memento"]]],["h","Builder"],["p","En klass med en stor konstruktor och många parametrar, där vissa är valfria, blir svår att använda. En <strong>Builder</strong> bygger objektet steg för steg. Varje set-metod returnerar builder-objektet, så anropen kan kedjas."],["code","cpp","class Car {\npublic:\n    Car(string brand, string model, string color)\n        : brand(brand), model(model), color(color) {}\nprivate:\n    string brand, model, color;\n};\n\nclass CarBuilder {\npublic:\n    CarBuilder& setBrand(string b) { brand = b; return *this; }\n    CarBuilder& setModel(string m) { model = m; return *this; }\n    CarBuilder& setColor(string c) { color = c; return *this; }\n    Car build() const { return Car(brand, model, color); }\nprivate:\n    string brand, model, color;\n};\n\nCar car = CarBuilder().setBrand(\"Volvo\").setColor(\"svart\").build();\n","Builder"],["h","Singleton"],["p","<strong>Singleton</strong> garanterar att det bara finns en instans av en klass, med kontrollerad åtkomst. \"Ett land har bara en regering.\" Bra för en global manager, men det är globalt tillstånd, vilket gör testning svårare, och den naiva varianten är inte trådsäker."],["list",["Gör alla konstruktorer privata.","Ta bort kopieringskonstruktorn.","En privat statisk pekare till den enda instansen.","En publik statisk metod som skapar instansen första gången och returnerar den."]],["code","cpp","class MySingleton {\npublic:\n    MySingleton(const MySingleton&) = delete;\n    static MySingleton* getInstance() {\n        if (instance == nullptr)\n            instance = new MySingleton();\n        return instance;\n    }\nprivate:\n    MySingleton() {}\n    static MySingleton* instance;\n};\n\nMySingleton* MySingleton::instance = nullptr;\n","Singleton (naiv)"],["h","Template Method"],["p","Olika objekt vill göra samma serie av steg, men stegen själva skiljer sig. Basklassen definierar receptet i en icke-virtuell metod, och subklasserna överskuggar de steg de vill ändra. Det har inget med C++-templates att göra."],["code","cpp","class BaseAlgorithm {\npublic:\n    void doAlgorithm() {          // receptet: inte virtuellt\n        stepOne();\n        stepTwo();\n        stepThree();\n    }\n    virtual ~BaseAlgorithm() = default;\nprotected:\n    virtual void stepOne() {}\n    virtual void stepTwo() = 0;   // måste implementeras\n    virtual void stepThree() {}\n};\n","Template Method"],["h","Strategy och Strategy-light"],["p","<strong>Strategy</strong>: kapsla in det som varierar. En utbytbar algoritm ligger bakom ett gemensamt gränssnitt, så att du kan byta den utan att ändra resten av programmet. Rätt när du har flera sätt att göra samma sak, vill välja vid körning och vill slippa if/else-kedjor överallt."],["p","I inlämningen skriver användaren <code>sort insertion</code> eller <code>sort selection</code>. <strong>Strategy-light</strong> löser det med funktionspekare i C, eller <code>std::function</code> i C++, i stället för en hel klasshierarki:"],["code","c","typedef void (*SortFn)(EventLog* log);\n\nSortFn sortfn_from_name(const char* name) {\n    if (strcmp(name, \"insertion\") == 0) return sort_insertion;\n    if (strcmp(name, \"selection\") == 0) return sort_selection;\n    return NULL;\n}\n\nSortFn fn = sortfn_from_name(arg);\nif (!fn) printf(\"Unknown sort\\n\");\nelse fn(log);\n","Strategy-light i C"],["note","tip","Alla strategier måste ha exakt samma signatur för att kunna pluggas in. Ny sortering? Skriv en ny funktion och lägg till en rad i sortfn_from_name, inget annat ändras."],["h","Fler mönster i korthet"],["table",["Mönster","Idé","Bra för"],[["Factory Method","Basklassen säger \"skapa X\", subklassen bestämmer vilket X","Skapande som beror på variant eller konfiguration"],["Adapter","En wrapper som översätter ett interface till ett annat","Återanvända gammal kod med fel interface"],["Facade","Ett enkelt API framför ett komplext delsystem","En EventSystem-front med tick, print, sort och find"],["Decorator","Lägg på funktionalitet i lager","Kombinerbara funktioner utan arvsexplosion"],["Flyweight","Dela gemensam data mellan många objekt","Hundratusentals böcker som delar författare"],["Observer","Publish/subscribe: observatörer meddelas vid ändring","Händelsestyrda system, Logger och AlarmManager"],["Command","Ett kommando som objekt","Menykommandon, kö, ångra"],["State","Som Strategy, men tillståndet byts internt","Tydliga tillståndsmaskiner"],["Memento","Spara och återställ en ögonblicksbild","Ångra"],["Iterator","Gå igenom en samling utan att visa dess insida","Containrar"]]]],"pool":[{"t":"mc","q":"Vad är ett design pattern?","o":["Färdig kod att kopiera","En återkommande lösningsidé för ett vanligt designproblem","En algoritm för sortering","En datastruktur"],"a":1,"why":"Mallar som visar vägen, inte färdig kod."},{"t":"mc","q":"Vilken familj handlar om hur objekt skapas?","o":["Creational","Structural","Behavioral","Functional"],"a":0,"why":"Singleton, Builder och Factory Method."},{"t":"mc","q":"Vilken familj hör Adapter till?","o":["Creational","Structural","Behavioral","Ingen"],"a":1,"why":"Adapter kopplar ihop interface."},{"t":"mc","q":"Vilken familj hör Observer till?","o":["Creational","Structural","Behavioral","Ingen"],"a":2,"why":"Den handlar om kommunikation mellan objekt."},{"t":"mc","q":"Vilket problem löser Builder?","o":["Att det bara ska finnas en instans","Stora konstruktorer med många, ibland valfria, parametrar","Att byta algoritm vid körning","Att översätta ett interface"],"a":1,"why":"Bygg objektet steg för steg."},{"t":"multi","q":"Vad behövs för en Singleton?","o":["Privat konstruktor","Borttagen kopieringskonstruktor","Privat statisk pekare till instansen","Publik konstruktor"],"a":[0,1,2],"why":"Plus en publik statisk getInstance()."},{"t":"mc","q":"Vad är en nackdel med Singleton?","o":["Det blir för många instanser","Globalt tillstånd som gör testning svårare","Den kan inte ha metoder","Den kräver arv"],"a":1,"why":"Och den naiva varianten är inte trådsäker."},{"t":"mc","q":"Vad kännetecknar Template Method?","o":["En fast serie steg i basklassen där subklasser byter ut enskilda steg","C++-templates","En global instans","Kloning av objekt"],"a":0,"why":"doAlgorithm() är inte virtuell, men stegen är det."},{"t":"mc","q":"Vilket mönster passar när användaren skriver <code>sort insertion</code> och programmet ska välja rätt funktion?","o":["Singleton","Strategy","Builder","Flyweight"],"a":1,"why":"Utbytbara algoritmer bakom samma signatur."},{"t":"text","q":"Vad heter författargruppen bakom den klassiska boken om design patterns? (förkortning)","accept":["GoF","Gang of Four"],"ph":"förkortning","why":"Gang of Four."},{"t":"mc","q":"Vilket mönster ger ett enkelt API framför ett komplext delsystem?","o":["Facade","Proxy","Decorator","State"],"a":0,"why":"En enkel front mot många moduler."},{"t":"mc","q":"Vilket mönster passar för ångra-funktionen genom att spara ögonblicksbilder?","o":["Memento","Adapter","Builder","Iterator"],"a":0,"why":"Spara och återställ ett objekts tillstånd."}]}],"timeline":[{"d":"Fre 2/1","t":"Introduktion, tidskomplexitet, algoritmer och rekursion","topics":["komplexitet","rekursion"]},{"d":"Ons 7/1","t":"Sortering","topics":["sortering"]},{"d":"Tors 8/1","t":"ADT och listor · inlämningsuppgiften presenteras","topics":["adt-listor"]},{"d":"Tis 13/1","t":"Stack, kö och mängd","topics":["stack-ko-mangd"]},{"d":"Tors 15/1","t":"Träd","topics":["trad"]},{"d":"Fre 16/1","t":"Hashtabeller","topics":["hashtabeller"]},{"d":"Tis 20/1","t":"Grafer","topics":["grafer"]},{"d":"Tors 22/1","t":"SQL och databaser","topics":["sql"]},{"d":"Fre 23/1","t":"Design patterns","topics":["designmonster"]},{"d":"Fre 30/1","t":"Tenta (labbstöd och repetition tis 27/1)","topics":["komplexitet","sortering","trad","hashtabeller","grafer","sql"]}],"assignments":[{"id":"eventsystem","kind":"Inlämningsuppgift (del A + B)","title":"Embedded event-system","intro":"Utveckla ett program som tar emot och hanterar events, och reflektera kring dina val av algoritmer, datastrukturer och patterns. Uppgiften presenteras torsdag 8/1, och detaljerna om krav och deadline kommer då. Det här är det som nämns i kursmaterialet.","groups":[{"h":"Kommandon","items":["Textkommandon som <code>tick</code>, <code>print</code>, <code>sort</code> och <code>find</code>","<code>sort insertion</code> / <code>sort selection</code> väljer sorteringsalgoritm"]},{"h":"Design","items":["Strategy-light: välj sorteringsfunktion via funktionspekare (C) eller <code>std::function</code> (C++)","Facade: en enkel EventSystem-front som döljer intern logg och kö","Bonus: Observer-light, där Logger och AlarmManager meddelas när ett event hanteras"]},{"h":"Reflektion (viktigt för VG)","items":["Motivera val av datastruktur för loggen och kön","Analysera tidskomplexiteten för dina operationer","Jämför för- och nackdelar med alternativen"]}],"topics":["sortering","adt-listor","stack-ko-mangd","designmonster"],"hint":"Alla sorteringsfunktioner måste ha exakt samma signatur för att Strategy-light ska fungera."},{"id":"hashgrupp","kind":"Gruppuppgift, ca 3 personer","title":"Hashtabeller och HashMap i C","intro":"Förstå hashning, kollisioner och linjär sondering, och komplettera en enkel HashMap i C med CAP = 11 där nyckeln 0 betyder tom plats. Ca 60–120 minuter. Facit finns i slutet av dokumentet.","groups":[{"h":"Del 1: papper och penna","items":["Hasha 15, 26, 37, 99, 8 och 19 med key % 11","Simulera insert av 15, 26, 37 och rita tabellen","Visa vilka index som kontrolleras för get(26) och get(99)","Genomsnitt och worst case för put och get, och load factor 3/11"]},{"h":"Del 2: kodläsning","items":["Vad representerar Entry, och varför key == 0 som tom plats?","Varför får get() stanna på en tom plats här?","Vad händer om tabellen blir full, eller CAP = 3?"]},{"h":"Del 3: skriv klart","items":["<code>f()</code>, <code>init()</code>, <code>put()</code> med insert och update","<code>get()</code> och <code>printTable()</code>","Kör testerna och hitta kollisionerna i utskriften"]}],"topics":["hashtabeller"],"hint":"Probing: <code>idx = (start + step) % CAP</code> för step = 0 .. CAP − 1."},{"id":"grafgrupp","kind":"Gruppuppgift, 3 personer","title":"Grafer: BFS och DFS","intro":"Resonera om graftyper och representationer, kör BFS och DFS för hand och implementera BFS i C med en kö. Rotera rollerna Driver, Navigator och Verifierare.","groups":[{"h":"Del 1: begrepp","items":["Riktad/oriktad och viktad/oviktad för fyra exempel","In- och ut-grad i en riktad graf","Grannlista eller grannmatris för 10 000 noder?","Varför behövs visited?"]},{"h":"Del 2: för hand","items":["Grannlista för grafen med noderna 0..6","BFS från 0 med köns lägen","Rekursiv DFS från 0 med anropsstacken"]},{"h":"Del 3: kod","items":["queue_push och queue_pop","BFS enligt pseudokoden","Kontrollera att utskriften stämmer med Del 2"]},{"h":"Del 4: stretch","items":["Grannmatris till grannlista","Rekursiv DFS på den riktade grafen","Hitta cykeln"]}],"topics":["grafer"],"hint":"Markera visited[u] = 1 innan du lägger u i kön."}],"sources":[{"k":"Intro","t":"Kursintro","d":"Kursens syfte, mål, schema, examination och hur man lyckas.","topics":["komplexitet"]},{"k":"F1","t":"F1 – Algoritmer, komplexitet, rekursion","d":"Algoritmer, rekursion, exponenter, logaritmer och Big-O med exempel.","topics":["komplexitet","rekursion"]},{"k":"Övn","t":"Övningar 1","d":"Rekursiv sum med utskrift, badFib och goodFib, och komplexitetsfrågor.","topics":["rekursion","komplexitet"]},{"k":"F2","t":"F2 – Sortering","d":"Stabil och in-place, bubble, selection, insertion, quick, merge och bogosort.","topics":["sortering"]},{"k":"Övn","t":"Övningsuppgifter 2 – Sortering","d":"Sorteringsverktygslåda och mätning av byten, tilldelningar och jämförelser.","topics":["sortering"]},{"k":"F3","t":"F3 – ADT, Listor","d":"ADT, interface, länkade listor, dubbelpekare och pre- och postconditions.","topics":["adt-listor"]},{"k":"Övn","t":"Övning 3 – ADT, linked list","d":"Implementera list.c mot list.h med meny och tester.","topics":["adt-listor"]},{"k":"F4","t":"Stack, Kö, Mängd","d":"static, stack, kö, mängd och map och fold.","topics":["stack-ko-mangd"]},{"k":"Övn","t":"Övning 4 – Stack, Queue, Set","d":"Stack, kö och mängd ovanpå listan, mängdoperationer, map och fold.","topics":["stack-ko-mangd"]},{"k":"F5","t":"Träd","d":"BT, BST, sökning, djup, traversering, borttagning och balansering.","topics":["trad"]},{"k":"Övn","t":"Övningar 5 – Träd (BT/BST)","d":"BST i C med traverseringar, höjd, löv, successor och bonusuppgifter.","topics":["trad"]},{"k":"F6","t":"Hashtabeller","d":"Hashfunktion, buckets, chaining, öppen adressering och delete.","topics":["hashtabeller"]},{"k":"Quiz","t":"Mini-quiz – Hashtabeller","d":"15 frågor med facit.","topics":["hashtabeller"]},{"k":"Grupp","t":"Gruppuppgift – Hashtabeller","d":"Papper och penna, kodläsning och HashMap i C med facit.","topics":["hashtabeller"]},{"k":"F7","t":"Grafer","d":"Graftyper, representation, BFS, DFS, MST, Dijkstra, A*, Floyd-Warshall och kappsäcksproblemet.","topics":["grafer"]},{"k":"Övn","t":"Övningar 7 – Grafer","d":"Gruppuppgift med begrepp, handtraversering och BFS i C.","topics":["grafer"]},{"k":"F8","t":"Föreläsning 8 – Databaser och SQL","d":"Tabeller, nycklar, SELECT, CRUD, DDL, normalisering, JOIN och SQLite i C.","topics":["sql"]},{"k":"F9","t":"Design Patterns","d":"Familjerna, Builder, Singleton och Template Method.","topics":["designmonster"]},{"k":"Över","t":"Design Patterns översikt","d":"Strategy och Strategy-light, och en översikt över GoF-mönstren.","topics":["designmonster"]}],"links":[{"k":"Repo","t":"Kursens GitHub-repo (CJ-algorithms)","u":"https://github.com/CalleFreme/CJ-algorithms","d":"Startkod till övningarna, bland annat list.h, list.c och main.c."},{"k":"SQL","t":"SQLBolt","u":"https://sqlbolt.com/","d":"Interaktiva SQL-lektioner direkt i webbläsaren."},{"k":"Viz","t":"VisuAlgo","u":"https://visualgo.net/en","d":"Animerade sorteringar, träd, hashtabeller och grafalgoritmer."},{"k":"Ref","t":"Refactoring.Guru: Design Patterns","u":"https://refactoring.guru/design-patterns","d":"Alla GoF-mönster med bilder och kodexempel i C++."},{"k":"Ref","t":"Big-O Cheat Sheet","u":"https://www.bigocheatsheet.com/","d":"Komplexiteten för vanliga datastrukturer och sorteringar."}]}];
const WIDGETS = {
  offbyone(el) {
    const arr = [21, 22, 20, 19, 23];
    let op = "<", timer = null, cur = -1;
    el.innerHTML = `<div class="wt"><b>Off-by-one i praktiken</b><span>interaktiv</span></div>
      <div class="controls"><code id="ob-code"></code><span class="seg" role="group" aria-label="Jämförelse">
      <button type="button" data-op="<" aria-pressed="true">&lt;</button><button type="button" data-op="<=" aria-pressed="false">&lt;=</button></span>
      <button type="button" class="btn" id="ob-run" style="padding:5px 12px">Kör loopen ▶</button></div>
      <div class="cells" id="ob-cells"></div><div class="readout" id="ob-out"></div>`;
    const draw = () => {
      const last = op === "<" ? 4 : 5;
      $("#ob-code", el).textContent = `for (int i = 0; i ${op} 5; i++)  sum += temps[i];`;
      $("#ob-cells", el).innerHTML = [0, 1, 2, 3, 4, 5].map(i => {
        let c;
        if (i === 5) c = cur === 5 ? "out" : "junk";
        else if (i === cur) c = "cur";
        else if (cur > i) c = "hit";
        else c = "";
        return `<div class="cellbox ${c}"><span class="v">${i === 5 ? "??" : arr[i]}</span><span class="i">temps[${i}]</span></div>`;
      }).join("");
      const out = $("#ob-out", el);
      if (cur < 0) out.innerHTML = `<span>Arrayen har 5 element, index 0–4. Rutan längst till höger är minnet efter arrayen.</span>`;
      else if (cur > last) out.innerHTML = op === "<"
        ? `<span class="ok">5 varv: i = 0, 1, 2, 3, 4. Alla element lästes exakt en gång.</span>`
        : `<span class="bad">6 varv: i = 0 … 5. temps[5] ligger utanför arrayen. Summan får ett skräpvärde, eller så kraschar programmet.</span>`;
      else out.innerHTML = `<span>i = ${cur}: villkoret ${cur} ${op} 5 är sant → läser temps[${cur}]${cur === 5 ? ' <b class="bad">utanför arrayen!</b>' : ` = ${arr[cur]}`}</span>`;
    };
    $$(".seg button", el).forEach(b => b.addEventListener("click", () => {
      op = b.dataset.op; clearInterval(timer); cur = -1;
      $$(".seg button", el).forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
    }));
    $("#ob-run", el).addEventListener("click", () => {
      clearInterval(timer); cur = 0; draw();
      const last = op === "<" ? 4 : 5;
      timer = setInterval(() => { cur++; draw(); if (cur > last) clearInterval(timer); }, 650);
    });
    draw();
  },

  stack(el) {
    const code = [
      "float average(float a, float b) {",
      "    float sum = a + b;",
      "    return sum / 2;",
      "}",
      "",
      "int main() {",
      "    float t1 = 21.5;",
      "    float t2 = 23.5;",
      "    float avg = average(t1, t2);",
      "    printf(\"%.1f\\n\", avg);",
      "}",
    ];
    const S = [
      { l: 5, f: [["main", "t1 = ?", "t2 = ?", "avg = ?"]], c: "Programmet startar. main() får en stack frame med plats för sina lokala variabler." },
      { l: 6, f: [["main", "t1 = 21.5", "t2 = ?", "avg = ?"]], c: "t1 tilldelas ett värde i main:s frame." },
      { l: 7, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"]], c: "t2 tilldelas." },
      { l: 0, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = ?"]], c: "average() anropas. En ny frame läggs överst. a och b är kopior av t1 och t2 (call by value)." },
      { l: 1, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = 45.0"]], c: "sum är en lokal variabel. Den finns bara i average():s frame." },
      { l: 2, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = 45.0", "→ returnerar 22.5"]], c: "return lämnar tillbaka 22.5 till den som anropade." },
      { l: 8, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = 22.5"]], c: "average():s frame är borta. a, b och sum finns inte längre. Returvärdet hamnar i avg." },
      { l: 9, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = 22.5"]], c: "printf skriver ut värdet.", o: "22.5" },
      { l: 10, f: [], c: "main() returnerar och dess frame tas bort. Stacken är tom igen." },
    ];
    let s = 0;
    el.innerHTML = `<div class="wt"><b>Anropsstacken steg för steg</b><span>interaktiv</span></div>
      <div class="stackw"><pre id="st-code"></pre><div><div class="eyebrow" style="margin-bottom:6px">Stacken (överst = aktiv)</div><div class="frames" id="st-frames"></div><div class="out-term" id="st-out" aria-label="Utskrift"></div></div></div>
      <div class="stack-caption" id="st-cap" aria-live="polite"></div>
      <div class="stepbtns"><button type="button" id="st-prev">← Föregående</button><button type="button" id="st-next">Nästa steg →</button><button type="button" id="st-reset">Börja om</button></div>`;
    const draw = () => {
      const st = S[s];
      $("#st-code", el).innerHTML = code.map((c, i) => `<span class="ln ${i === st.l ? "now" : ""}">${esc(c) || " "}</span>`).join("");
      $("#st-frames", el).innerHTML = st.f.length ? st.f.map((f, i) => `<div class="frame ${i === st.f.length - 1 ? "top" : ""}"><b>${f[0]}()</b>${f.slice(1).map(esc).join("<br>")}</div>`).join("") : `<div style="color:var(--muted);font-size:.85rem;margin:auto">tom</div>`;
      $("#st-cap", el).textContent = `Steg ${s + 1}/${S.length}: ${st.c}`;
      $("#st-out", el).textContent = s >= 7 ? "$ ./program\n22.5" : "$ ./program";
      $("#st-prev", el).disabled = s === 0;
      $("#st-next", el).disabled = s === S.length - 1;
    };
    $("#st-prev", el).addEventListener("click", () => { if (s > 0) { s--; draw(); } });
    $("#st-next", el).addEventListener("click", () => { if (s < S.length - 1) { s++; draw(); } });
    $("#st-reset", el).addEventListener("click", () => { s = 0; draw(); });
    $("#st-out", el).style.whiteSpace = "pre";
    draw();
  },

  pointer(el) {
    const arr = [21, 22, 20, 19, 23], base = 0x7ffe1000;
    el.innerHTML = `<div class="wt"><b>Pekararitmetik: p + i</b><span>interaktiv</span></div>
      <div class="controls"><code>int temps[5] = {21, 22, 20, 19, 23};  int* p = temps;</code></div>
      <div class="controls"><label for="pt-i">i =</label><input type="range" id="pt-i" min="0" max="5" value="0"><b id="pt-iv" style="font-family:var(--f-mono)">0</b></div>
      <div class="cells" id="pt-cells"></div><div class="readout" id="pt-out"></div>`;
    const draw = () => {
      const i = +$("#pt-i", el).value;
      $("#pt-iv", el).textContent = i;
      $("#pt-cells", el).innerHTML = [0, 1, 2, 3, 4, 5].map(k => `<div class="cellbox ${k === 5 ? (k === i ? "out" : "junk") : k === i ? "cur" : ""}"><span class="v">${k === 5 ? "??" : arr[k]}</span><span class="i">0x…${(base + k * 4).toString(16).slice(-3)}</span></div>`).join("");
      const a = "0x" + (base + i * 4).toString(16);
      $("#pt-out", el).innerHTML = `<span>p + ${i} = 0x${base.toString(16)} + ${i} × sizeof(int) = ${a}</span>` +
        (i < 5 ? `<span>*(p + ${i}) = temps[${i}] = <b class="ok">${arr[i]}</b></span>` : `<span class="bad">*(p + 5) pekar precis efter arrayen. Adressen är giltig att räkna fram, men att läsa där är odefinierat beteende.</span>`);
    };
    $("#pt-i", el).addEventListener("input", draw);
    draw();
  },

  cstring(el) {
    el.innerHTML = `<div class="wt"><b>Strängen i minnet</b><span>interaktiv</span></div>
      <div class="controls"><label for="cs-t">Text</label><input type="text" id="cs-t" value="Hello" maxlength="14">
      <label for="cs-n">char buf[</label><input type="number" id="cs-n" value="5" min="1" max="16"><span style="font-family:var(--f-mono)">];</span></div>
      <div class="cells" id="cs-cells"></div><div class="readout" id="cs-out"></div>`;
    const draw = () => {
      const t = $("#cs-t", el).value;
      let n = Math.max(1, Math.min(16, parseInt($("#cs-n", el).value, 10) || 1));
      const need = t.length + 1;
      const total = Math.max(n, need);
      const chars = [...t, "\\0"];
      $("#cs-cells", el).innerHTML = Array.from({ length: total }, (_, i) => {
        const inBuf = i < n;
        const ch = i < chars.length ? chars[i] : "?";
        let cls = !inBuf ? "out" : ch === "\\0" ? "nul" : ch === "?" ? "junk" : "";
        const shown = ch === " " ? "␣" : ch;
        return `<div class="cellbox ${cls}"><span class="v">${esc(shown)}</span><span class="i">${inBuf ? `buf[${i}]` : "utanför"}</span></div>`;
      }).join("");
      $("#cs-out", el).innerHTML = `<span>strlen = ${t.length} · sizeof(buf) = ${n} · behöver ${need} bytes</span>` +
        (need <= n ? `<span class="ok">Får plats, inklusive '\\0'.</span>` : `<span class="bad">Buffer overflow: ${need - n} byte${need - n > 1 ? "s" : ""} skrivs utanför bufferten och förstör annat minne.${need - n === 1 ? " Det är nolltecknet som inte fick plats." : ""}</span>`);
    };
    $("#cs-t", el).addEventListener("input", draw);
    $("#cs-n", el).addEventListener("input", draw);
    draw();
  },
};

    };
    const steps = async (names, built) => {
      busy = true;
      for (let k = 0; k < names.length; k++) {
        const i = built ? k : names.length - 1 - k;
        const n = chains[depth][i];
        log.push(built ? `${n}()` : `~${n}()`);
        if (!built && k === names.length - 1) alive = false;
        draw(built ? i + 1 : i);
        if (built) $$(".layer", el)[i].classList.add("on");

    $$(".seg button", el).forEach(b => b.addEventListener("click", () => {

      $("#co-cap", el).textContent = ""; draw();
    }));
    $("#co-make", el).addEventListener("click", async () => {

      await steps(chains[depth], false); alive = false; draw();
      $("#co-cap", el).textContent = "Destruktorerna körs i omvänd ordning: den mest specifika klassen rivs först, basen sist.";
    });
    draw();
  },

  dispatch(el) {
    let virt = true, via = "ref";
    const code = () => `struct Base {
    ${virt ? "virtual " : ""}void f() const { cout << "Base::f\\n"; }
    virtual ~Base() = default;
};
struct Der : Base {
    void f() const${virt ? " override" : ""} { cout << "Der::f\\n"; }
};

Der d;
${via === "ref" ? "const Base& b = d;   // referens" : via === "ptr" ? "const Base* b = &d;  // pekare" : "Base b = d;          // kopia av bastyp"}
b${via === "ptr" ? "->" : "."}f();`;
    el.innerHTML = `<div class="wt"><b>Vilken f() körs?</b><span>interaktiv</span></div>
      <div class="controls">
        <span class="seg" role="group" aria-label="virtual"><button type="button" data-v="1" aria-pressed="true">virtual</button><button type="button" data-v="0" aria-pressed="false">utan virtual</button></span>
        <span class="seg" role="group" aria-label="Åtkomst"><button type="button" data-w="ref" aria-pressed="true">Base&amp;</button><button type="button" data-w="ptr" aria-pressed="false">Base*</button><button type="button" data-w="copy" aria-pressed="false">Base (kopia)</button></span>
      </div>
      <div class="stackw"><pre style="margin:0"><code class="language-cpp" id="dp-code"></code></pre>
        <div><div class="eyebrow" style="margin-bottom:6px">Utdata</div><div class="out-term" id="dp-out" style="font-size:1rem;margin:0 0 10px"></div><div id="dp-why" style="font-size:.9rem"></div></div></div>`;
    const draw = () => {
      const c = $("#dp-code", el);
      c.textContent = code(); c.removeAttribute("data-highlighted"); c.className = "language-cpp";
      try { window.hljs && hljs.highlightElement(c); } catch (e) {}
      const der = virt && via !== "copy";
      $("#dp-out", el).textContent = der ? "Der::f" : "Base::f";
      $("#dp-why", el).innerHTML = via === "copy"
        ? `<b class="bad" style="color:var(--bad)">Object slicing.</b> <code>b</code> är en ny <code>Base</code>, kopierad från d. Der-delen är bortskuren, så det finns ingen Der att anropa${virt ? ", trots virtual" : ""}.`
        : virt ? `<b style="color:var(--ok)">Virtuell dispatch.</b> Anropet går via objektets vtable och hittar <code>Der::f</code>, fast variabeln har typen ${via === "ref" ? "<code>Base&amp;</code>" : "<code>Base*</code>"}.`
        : `<b style="color:var(--copper)">Statisk bindning.</b> Utan <code>virtual</code> väljer kompilatorn funktion utifrån variabelns typ (<code>Base</code>), inte objektets.`;
      $$("[data-v]", el).forEach(b => b.setAttribute("aria-pressed", (b.dataset.v === "1") === virt));
      $$("[data-w]", el).forEach(b => b.setAttribute("aria-pressed", b.dataset.w === via));
    };
    $$("[data-v]", el).forEach(b => b.addEventListener("click", () => { virt = b.dataset.v === "1"; draw(); }));
    $$("[data-w]", el).forEach(b => b.addEventListener("click", () => { via = b.dataset.w; draw(); }));
    draw();
  },
});

  const names = { c: "C", cpp: "C++", bash: "terminal", py: "Python", python: "Python", sql: "SQL", text: "" };
  const label = cap || (lang in names ? names[lang] : lang);
  const hl = ({ c: "c", bash: "bash", py: "python", python: "python", sql: "sql", text: "plaintext" })[lang] || "cpp";
  return `<div class="codewrap"><div class="cap"><span>${esc(label)}</span><button class="copy" type="button">Kopiera</button></div><pre><code class="language-${hl}">${esc(src)}</code></pre></div>`;
}
function renderBlocks(t, ti) {
  let si = 0, exn = 0;
  return t.blocks.map(b => {
    switch (b[0]) {
      case "h": si++; return `<h2 id="${t.id}-s${si}"><span class="addr">${addr(ti, si)}</span><span>${esc(b[1])}</span></h2>`;
      case "p": return `<p>${b[1]}</p>`;
      case "list": return `<ul>${b[1].map(x => `<li>${x}</li>`).join("")}</ul>`;
      case "code": return codeBlock(b[1], b[2], b[3]);
      case "table": return `<div class="tablewrap"><table><thead><tr>${b[1].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${b[2].map(r => `<tr>${r.map((cell, ci) => ci === 0 && b[1][0] === "" ? `<th scope="row" style="background:transparent;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:.9rem;color:var(--ink)">${cell}</th>` : `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "note": return `<div class="note ${b[1]}"><span class="tag">${b[1] === "tip" ? "Tips" : b[1] === "warn" ? "Se upp" : "Felsök"}</span><div><p>${b[2]}</p></div></div>`;
      case "widget": return `<div class="widget" data-widget="${b[1]}"></div>`;
      case "ex": exn++; return `<details class="ex"><summary><span class="n">ÖVN ${String(exn).padStart(2, "0")}</span><b>${esc(b[1])}</b><span class="chev">›</span></summary><div class="body">${b[2]}${b[3] ? `<details class="sol"><summary>Visa ett lösningsförslag</summary>${codeBlock(b[4] || "cpp", b[3], "lösningsförslag")}</details>` : ""}</div></details>`;
    }

  }).join("");
}
