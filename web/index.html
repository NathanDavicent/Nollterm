<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c6a4e">
<meta name="description" content="Kursportal: lektioner, frågor, prov och kod i C/C++.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nollterm Kurser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header + left "memory map" sidebar of topics, reading column ~68ch; topics read like a datasheet with hex-address gutters. */
:root {
  --paper: #f3f5f1;
  --surface: #ffffff;
  --ink: #15201c;
  --muted: #59665f;
  --line: #d6ddd6;
  --mask: #0c6a4e;        /* PCB solder-mask green */
  --mask-ink: #ffffff;
  --mask-soft: #e0eee7;
  --copper: #a85a22;      /* copper trace */
  --copper-soft: #f5e6d8;
  --ok: #1c7a4a;  --ok-soft: #dff1e6;
  --bad: #b3261e; --bad-soft: #fae3e0;
  --code-bg: #0f1c17; --code-fg: #d9e6df; --code-line: #23362e;
  --hl-kw: #f0a56b; --hl-str: #8fd8a8; --hl-com: #7e958b; --hl-num: #e6c87a; --hl-meta: #7fc4e6; --hl-fn: #f2e6c9;
  --shadow: 0 1px 0 rgba(21,32,28,.04), 0 8px 24px -12px rgba(21,32,28,.18);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --header-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1412; --surface: #131d19; --ink: #e3eae5; --muted: #95a49c; --line: #26352f;
    --mask: #4cc69c; --mask-ink: #08130f; --mask-soft: #16302a;
    --copper: #e59d63; --copper-soft: #36261b;
    --ok: #63d494; --ok-soft: #173326; --bad: #f2877e; --bad-soft: #3a1c1a;
    --code-bg: #08100d; --code-fg: #d9e6df; --code-line: #1c2b25;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1412; --surface: #131d19; --ink: #e3eae5; --muted: #95a49c; --line: #26352f;
  --mask: #4cc69c; --mask-ink: #08130f; --mask-soft: #16302a;
  --copper: #e59d63; --copper-soft: #36261b;
  --ok: #63d494; --ok-soft: #173326; --bad: #f2877e; --bad-soft: #3a1c1a;
  --code-bg: #08100d; --code-fg: #d9e6df; --code-line: #1c2b25;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--mask); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
code, kbd, pre { font-family: var(--f-mono); }
:not(pre) > code { font-size: .86em; background: var(--mask-soft); color: var(--ink); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
kbd { font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface); padding: .05em .4em; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { height: var(--header-h); display: flex; align-items: center; gap: 14px; max-width: 1240px; margin: 0 auto; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; color: var(--ink); text-decoration: none; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 2px; }
.brand b { font-family: var(--f-mono); font-weight: 600; font-size: .78em; color: var(--mask); }
.brand small { font-family: var(--f-mono); font-size: .62rem; font-weight: 400; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-left: 10px; }
.topnav { display: flex; gap: 4px; margin-left: 12px; }
.topnav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-size: .92rem; }
.topnav a[aria-current="page"], .topnav a:hover { color: var(--ink); background: var(--paper); }
.spacer { flex: 1; }
.searchbtn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: .9rem; }
.searchbtn:hover { border-color: var(--mask); color: var(--ink); }
.menubtn { display: none; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; font-size: .9rem; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
.side { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - var(--header-h) - 48px); overflow-y: auto; padding-right: 4px; }
.side h2 { font-family: var(--f-mono); font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc a { display: grid; grid-template-columns: 30px 1fr 16px; gap: 6px; align-items: baseline; padding: 7px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: .92rem; line-height: 1.3; }
.toc a:hover { background: var(--surface); }
.toc a[aria-current="page"] { background: var(--mask-soft); }
.toc .n { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.toc .ck { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); align-self: center; }
.toc .ck.on { background: var(--mask); border-color: var(--mask); box-shadow: inset 0 0 0 2px var(--surface); }
.journey { margin-top: 22px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.journey strong { font-family: var(--f-display); font-size: 1rem; }
.bar { height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.bar i { display: block; height: 100%; background: var(--mask); border-radius: 99px; transition: width .4s; }
.journey p { margin: 0; font-size: .85rem; color: var(--muted); }
.side .links { margin-top: 18px; display: grid; gap: 2px; }
.side .links a { text-decoration: none; color: var(--muted); font-size: .9rem; padding: 5px 8px; border-radius: 6px; }
.side .links a:hover { color: var(--ink); background: var(--surface); }
main { min-width: 0; }

/* ---------- overview ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; align-items: center; padding-block: 12px 36px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(2.1rem, 4.6vw, 3.4rem); font-weight: 700; letter-spacing: -.03em; margin: 10px 0 14px; }
.hero h1 em { font-style: normal; color: var(--mask); }
.hero p.lead { font-size: 1.12rem; color: var(--muted); max-width: 46ch; margin: 0 0 22px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; font-weight: 700; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: .95rem; }
.btn.primary { background: var(--mask); color: var(--mask-ink); border-color: var(--mask); }
.btn:hover { border-color: var(--mask); }
.btn.primary:hover { filter: brightness(1.08); }
.memcard { background: var(--code-bg); color: var(--code-fg); border-radius: 12px; padding: 18px; font-family: var(--f-mono); font-size: .8rem; box-shadow: var(--shadow); min-width: 0; }
.memcard .decl { color: var(--hl-fn); margin-bottom: 14px; white-space: nowrap; overflow-x: auto; }
.memcard .decl .k { color: var(--hl-kw); } .memcard .decl .s { color: var(--hl-str); }
.mem { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.mem div { display: grid; gap: 4px; text-align: center; }
.mem .cell { border: 1px solid var(--code-line); border-radius: 6px; padding: 10px 0; font-size: 1.1rem; color: var(--code-fg); background: rgba(255,255,255,.03); animation: pop .5s backwards; }
.mem .cell.z { color: var(--hl-kw); border-color: var(--hl-kw); }
.mem .ad { font-size: .62rem; color: var(--hl-com); }
.memcard .foot { margin-top: 14px; color: var(--hl-com); font-size: .74rem; line-height: 1.5; }
@keyframes pop { from { transform: translateY(6px); opacity: .2; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 28px 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stats div { padding: 14px 16px; border-left: 1px solid var(--line); }
.stats div:first-child { border-left: 0; }
.stats b { display: block; font-family: var(--f-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .85rem; color: var(--muted); }
section.block { padding-block: 34px 6px; }
section.block > h2 { font-size: 1.7rem; margin: 6px 0 6px; }
section.block > p.sub { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 22px 22px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--mask); }
.timeline .d { font-family: var(--f-mono); font-size: .75rem; color: var(--copper); letter-spacing: .06em; text-transform: uppercase; }
.timeline h3 { font-size: 1.1rem; margin: 2px 0 6px; }
.timeline .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .8rem; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 3px 10px; border-radius: 99px; }
a.chip:hover { border-color: var(--mask); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: .85rem; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tcard { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.tcard:hover { border-color: var(--mask); transform: translateY(-2px); }
.tcard .row { display: flex; justify-content: space-between; align-items: center; }
.tcard .addr { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.tcard h3 { font-size: 1.12rem; }
.tcard p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.45; flex: 1; }
.tcard .meta { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); display: flex; gap: 10px; }
.cat { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--copper); }
.done-pill { font-family: var(--f-mono); font-size: .68rem; color: var(--ok); background: var(--ok-soft); padding: 2px 8px; border-radius: 99px; }

/* ---------- topic ---------- */
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 18px; display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.thead { padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.thead h1 { font-size: clamp(1.9rem, 4vw, 2.7rem); letter-spacing: -.025em; margin: 8px 0 12px; }
.thead .lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
.thead .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }
.goals { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 22px 0 8px; }
.goals h2 { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.goals ul { margin: 0; padding-left: 20px; }
.article { max-width: 72ch; }
.article h2 { font-size: 1.5rem; margin: 40px 0 12px; display: flex; gap: 12px; align-items: baseline; }
.article h2 .addr { font-family: var(--f-mono); font-size: .72rem; font-weight: 400; color: var(--copper); letter-spacing: .04em; flex: none; }
.article h3 { font-size: 1.12rem; margin: 26px 0 8px; }
.article p { margin: 0 0 14px; }
.article ul, .article ol { margin: 0 0 16px; padding-left: 22px; }
.article li { margin-bottom: 4px; }
.codewrap { position: relative; margin: 6px 0 18px; border-radius: 10px; background: var(--code-bg); border: 1px solid var(--code-line); }
.codewrap .cap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--code-line); font-family: var(--f-mono); font-size: .72rem; color: var(--hl-com); }
.codewrap .copy { background: transparent; border: 1px solid var(--code-line); color: var(--code-fg); border-radius: 5px; padding: 2px 8px; font-size: .7rem; font-family: var(--f-mono); }
.codewrap .copy:hover { border-color: var(--hl-com); }
pre { margin: 0; overflow-x: auto; padding: 14px 16px; font-size: .84rem; line-height: 1.55; color: var(--code-fg); tab-size: 4; }
pre code { background: none; padding: 0; color: inherit; white-space: pre; }
.hljs-keyword, .hljs-type, .hljs-built_in { color: var(--hl-kw); }
.hljs-string, .hljs-char { color: var(--hl-str); }
.hljs-comment { color: var(--hl-com); font-style: italic; }
.hljs-number, .hljs-literal { color: var(--hl-num); }
.hljs-meta, .hljs-meta .hljs-keyword { color: var(--hl-meta); }
.hljs-meta .hljs-string { color: var(--hl-str); }
.hljs-title, .hljs-title.function_ { color: var(--hl-fn); }
.tablewrap { overflow-x: auto; margin: 6px 0 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
.note { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 14px; border-radius: 10px; margin: 6px 0 18px; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); }
.note .tag { font-family: var(--f-mono); font-size: .68rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; align-self: start; margin-top: 3px; }
.note.tip .tag { background: var(--mask-soft); color: var(--mask); }
.note.warn .tag { background: var(--copper-soft); color: var(--copper); }
.note.fix .tag { background: var(--bad-soft); color: var(--bad); }
.note p:last-child { margin-bottom: 0; }

/* exercises */
.ex { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; margin: 10px 0; }
.ex > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline; }
.ex > summary::-webkit-details-marker { display: none; }
.ex > summary .n { font-family: var(--f-mono); font-size: .72rem; color: var(--copper); }
.ex > summary b { font-family: var(--f-display); font-weight: 600; }
.ex > summary .chev { font-family: var(--f-mono); color: var(--muted); transition: transform .2s; }
.ex[open] > summary .chev { transform: rotate(90deg); }
.ex .body { padding: 0 14px 12px; }
.ex .sol { margin-top: 6px; }
.ex .sol > summary { cursor: pointer; font-size: .88rem; color: var(--mask); font-weight: 700; margin-bottom: 8px; }

/* widgets */
.widget { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; margin: 8px 0 22px; box-shadow: var(--shadow); }
.widget .wt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.widget .wt b { font-family: var(--f-display); font-size: 1.05rem; }
.widget .wt span { font-family: var(--f-mono); font-size: .7rem; color: var(--copper); letter-spacing: .08em; text-transform: uppercase; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; font-size: .9rem; }
.controls label { display: flex; gap: 8px; align-items: center; }
.controls input[type="text"], .controls input[type="number"], .controls select { font: inherit; font-family: var(--f-mono); font-size: .88rem; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.controls input[type="number"] { width: 70px; }
.controls input[type="range"] { accent-color: var(--mask); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 5px 12px; font-family: var(--f-mono); font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cells { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.cellbox { flex: none; width: 58px; display: grid; gap: 4px; text-align: center; }
.cellbox .v { font-family: var(--f-mono); font-size: 1rem; border: 1.5px solid var(--line); border-radius: 7px; padding: 9px 0; background: var(--paper); transition: background .2s, border-color .2s; }
.cellbox .i { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.cellbox.hit .v { border-color: var(--mask); background: var(--mask-soft); }
.cellbox.cur .v { border-color: var(--copper); background: var(--copper-soft); font-weight: 600; }
.cellbox.nul .v { color: var(--copper); }
.cellbox.out .v { border-style: dashed; border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.cellbox.junk .v { color: var(--muted); }
.readout { font-family: var(--f-mono); font-size: .85rem; margin-top: 12px; display: grid; gap: 4px; }
.readout .bad { color: var(--bad); font-weight: 600; }
.readout .ok { color: var(--ok); font-weight: 600; }
.stackw { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
.stackw pre { background: var(--code-bg); border-radius: 8px; padding: 10px 0; font-size: .8rem; }
.stackw pre .ln { display: block; padding: 0 12px; }
.stackw pre .ln.now { background: rgba(240,165,107,.18); box-shadow: inset 3px 0 0 var(--hl-kw); }
.frames { display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 6px; min-height: 180px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; }
.frame { border: 1.5px solid var(--mask); background: var(--mask-soft); border-radius: 7px; padding: 8px 10px; font-family: var(--f-mono); font-size: .78rem; animation: pop .3s; }
.frame b { display: block; font-size: .8rem; margin-bottom: 4px; }
.frame.top { border-color: var(--copper); background: var(--copper-soft); }
.stack-caption { font-size: .9rem; margin-top: 10px; min-height: 3em; }
.stepbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.stepbtns button { white-space: nowrap; }
.stepbtns button { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 12px; font-size: .88rem; }

  { t: "code", q: R`Skriv <code>void reverseArray(int* arr, int size)</code> som vänder arrayen på plats.`,

    int n;

    int a[100];

    reverseArray(a, n);
    for (int i = 0; i < n; i++) {
        cout << a[i];

    }
    cout << endl;

    tests: [{ in: "5\n1 2 3 4 5", out: "5 4 3 2 1" }, { in: "4\n10 20 30 40", out: "40 30 20 10" }, { in: "1\n7", out: "7" }],
    sol: R`#include <iostream>
using namespace std;

void reverseArray(int* arr, int size) {
    for (int i = 0; i < size / 2; i++) {
        int tmp = arr[i];
        arr[i] = arr[size - 1 - i];
        arr[size - 1 - i] = tmp;
    }
}

int main() {
    int n;
    cin >> n;
    int a[100];
    for (int i = 0; i < n; i++) cin >> a[i];
    reverseArray(a, n);
    for (int i = 0; i < n; i++) {

        if (i < n - 1) cout << " ";

  { t: "code", q: R`Funktionen <code>average</code> har tre buggar (oinitierad summa, off-by-one och heltalsdivision). Rätta den. Om n är 0 ska den returnera 0.`,
    starter: R`#include <iostream>
using namespace std;

float average(int arr[], int n) {
    int sum;
    for (int i = 0; i <= n; i++)
        sum += arr[i];
    return sum / n;
}

int main() {
    int n;
    cin >> n;
    int a[100];
    for (int i = 0; i < n; i++) cin >> a[i];
    cout << average(a, n) << endl;
    return 0;
}`,
    tests: [{ in: "5\n2 4 6 8 10", out: "6" }, { in: "2\n1 2", out: "1.5" }, { in: "0", out: "0" }],
    sol: R`#include <iostream>
using namespace std;

float average(int arr[], int n) {
    if (n <= 0) return 0;
    int sum = 0;
    for (int i = 0; i < n; i++)
        sum += arr[i];
    return (float)sum / n;
}

int main() {
    int n;
    cin >> n;
    int a[100];
    for (int i = 0; i < n; i++) cin >> a[i];
    cout << average(a, n) << endl;
    return 0;
}`, why: R`<code>sum = 0</code>, <code>i &lt; n</code> och en konvertering till float före divisionen.` },
  { t: "code", q: R`Statuskoder: skriv <code>int readSensor(int raw, float* val)</code>. Giltiga råvärden är 0–1023. Vid fel: returnera -1 och rör inte val. Annars: sätt <code>*val = raw * 100.0 / 1023</code> och returnera 0. main skriver ut <code>OK</code> eller <code>SENSOR_ERROR</code>.`,
    starter: R`#include <iostream>
using namespace std;

int readSensor(int raw, float* val) {

}

int main() {
    int raw;
    cin >> raw;
    float v = 0;
    if (readSensor(raw, &v) == 0) cout << "OK" << endl;
    else cout << "SENSOR_ERROR" << endl;
    return 0;
}`,
    tests: [{ in: "512", out: "OK" }, { in: "2000", out: "SENSOR_ERROR" }, { in: "-1", out: "SENSOR_ERROR" }, { in: "1023", out: "OK" }],
    sol: R`#include <iostream>
using namespace std;

int readSensor(int raw, float* val) {
    if (raw < 0 || raw > 1023) return -1;
    *val = raw * 100.0 / 1023;
    return 0;
}

int main() {
    int raw;
    cin >> raw;
    float v = 0;
    if (readSensor(raw, &v) == 0) cout << "OK" << endl;
    else cout << "SENSOR_ERROR" << endl;
    return 0;
}`, why: "Felet signaleras via returvärdet och resultatet via pekaren, precis som i många inbyggda bibliotek." },
],

const WIDGETS = {

    const arr = [21, 22, 20, 19, 23];

      <div class="controls"><code id="ob-code"></code><span class="seg" role="group" aria-label="Jämförelse">

    const draw = () => {
      const last = op === "<" ? 4 : 5;

      $("#ob-cells", el).innerHTML = [0, 1, 2, 3, 4, 5].map(i => {

        else if (cur > i) c = "hit";
        else c = "";
        return `<div class="cellbox ${c}"><span class="v">${i === 5 ? "??" : arr[i]}</span><span class="i">temps[${i}]</span></div>`;
      }).join("");
      const out = $("#ob-out", el);
      if (cur < 0) out.innerHTML = `<span>Arrayen har 5 element, index 0–4. Rutan längst till höger är minnet efter arrayen.</span>`;
      else if (cur > last) out.innerHTML = op === "<"
        ? `<span class="ok">5 varv: i = 0, 1, 2, 3, 4. Alla element lästes exakt en gång.</span>`
        : `<span class="bad">6 varv: i = 0 … 5. temps[5] ligger utanför arrayen. Summan får ett skräpvärde, eller så kraschar programmet.</span>`;
      else out.innerHTML = `<span>i = ${cur}: villkoret ${cur} ${op} 5 är sant → läser temps[${cur}]${cur === 5 ? ' <b class="bad">utanför arrayen!</b>' : ` = ${arr[cur]}`}</span>`;
    };
    $$(".seg button", el).forEach(b => b.addEventListener("click", () => {
      op = b.dataset.op; clearInterval(timer); cur = -1;
      $$(".seg button", el).forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
    }));
    $("#ob-run", el).addEventListener("click", () => {
      clearInterval(timer); cur = 0; draw();
      const last = op === "<" ? 4 : 5;
      timer = setInterval(() => { cur++; draw(); if (cur > last) clearInterval(timer); }, 650);
    });
    draw();
  },

      "}",
    ];
    const S = [
      { l: 5, f: [["main", "t1 = ?", "t2 = ?", "avg = ?"]], c: "Programmet startar. main() får en stack frame med plats för sina lokala variabler." },
      { l: 6, f: [["main", "t1 = 21.5", "t2 = ?", "avg = ?"]], c: "t1 tilldelas ett värde i main:s frame." },
      { l: 7, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"]], c: "t2 tilldelas." },
      { l: 0, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = ?"]], c: "average() anropas. En ny frame läggs överst. a och b är kopior av t1 och t2 (call by value)." },
      { l: 1, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = 45.0"]], c: "sum är en lokal variabel. Den finns bara i average():s frame." },

      { l: 8, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = 22.5"]], c: "average():s frame är borta. a, b och sum finns inte längre. Returvärdet hamnar i avg." },
      { l: 9, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = 22.5"]], c: "printf skriver ut värdet.", o: "22.5" },

      <div class="stack-caption" id="st-cap" aria-live="polite"></div>

    el.innerHTML = `<div class="wt"><b>Strängen i minnet</b><span>interaktiv</span></div>
      <div class="controls"><label for="cs-t">Text</label><input type="text" id="cs-t" value="Hello" maxlength="14">
      <label for="cs-n">char buf[</label><input type="number" id="cs-n" value="5" min="1" max="16"><span style="font-family:var(--f-mono)">];</span></div>
      <div class="cells" id="cs-cells"></div><div class="readout" id="cs-out"></div>`;
    const draw = () => {
      const t = $("#cs-t", el).value;
      let n = Math.max(1, Math.min(16, parseInt($("#cs-n", el).value, 10) || 1));
      const need = t.length + 1;
      const total = Math.max(n, need);
      const chars = [...t, "\\0"];
      $("#cs-cells", el).innerHTML = Array.from({ length: total }, (_, i) => {
        const inBuf = i < n;
        const ch = i < chars.length ? chars[i] : "?";
        let cls = !inBuf ? "out" : ch === "\\0" ? "nul" : ch === "?" ? "junk" : "";
        const shown = ch === " " ? "␣" : ch;
        return `<div class="cellbox ${cls}"><span class="v">${esc(shown)}</span><span class="i">${inBuf ? `buf[${i}]` : "utanför"}</span></div>`;
      }).join("");
      $("#cs-out", el).innerHTML = `<span>strlen = ${t.length} · sizeof(buf) = ${n} · behöver ${need} bytes</span>` +

    };
    $("#cs-t", el).addEventListener("input", draw);
    $("#cs-n", el).addEventListener("input", draw);
    draw();
  },
};

const state = { done: {}, practice: {}, checks: {}, exams: {}, run: {}, prefs: {} };
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) Object.assign(state, JSON.parse(raw));
  else {
    const old = JSON.parse(localStorage.getItem("nollterm-cpp-v1") || "null");   // carry over v1 progress
    if (old) {
      state.done.cpp = old.done || [];
      Object.entries(old.checks || {}).forEach(([k, v]) => (state.checks["cpp:" + k] = v));
    }
  }
} catch (e) { /* storage unavailable: start fresh */ }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
const doneList = cid => (state.done[cid] = state.done[cid] || []);
const isDone = (cid, lid) => doneList(cid).includes(lid);

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const strip = s => String(s).replace(/<[^>]+>/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim();
const nn = i => String(i + 1).padStart(2, "0");
const addr = (ti, si) => "0x" + ((ti + 1) * 0x100 + si * 0x10).toString(16).toUpperCase().padStart(4, "0");
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const fmtDate = ts => { try { return new Date(ts).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ""; } };
const gradeOf = pct => pct >= 75 ? "VG" : pct >= 50 ? "G" : "IG";

function practiceStats(c, l) {
  const p = state.practice[c.id + ":" + l.id] || {};
  const right = Object.values(p).filter(a => a && a.ok).length;
  return { right, total: l.pool.length };
}

      <a href="#${c.id}-resurser" ${ctx.view === "res" ? 'aria-current="page"' : ""}>Resurser <span>${c.sources.length}</span></a>

    <ol class="toc">${c.lessons.map((l, i) => `
      <li><a href="#${c.id}-${l.id}" ${ctx.lesson === l.id ? 'aria-current="page"' : ""}>
        <span class="n">${nn(i)}</span><span>${esc(l.title)}</span><span class="ck ${isDone(c.id, l.id) ? "on" : ""}" title="${isDone(c.id, l.id) ? "Klar" : "Inte klar"}"></span>
      </a></li>`).join("")}</ol>
    <div class="journey">
      <strong>Din lärresa</strong>
      <div class="bar"><i style="width:${d / c.lessons.length * 100}%"></i></div>
      <p>${d === c.lessons.length ? `Alla ${c.lessons.length} lektioner klara.` : `${d} av ${c.lessons.length} lektioner klara.`}</p>
    </div>`;
  void rest;
}

/* ================================================================ course */
function courseHead(c, cur) {
  return `<nav class="crumbs" aria-label="Brödsmulor"><a href="#hem">Kurser</a><span>/</span>${cur === "course" ? `<span>${esc(c.short)}</span>` : `<a href="#${c.id}">${esc(c.short)}</a>`}</nav>
  <nav class="ctabs" aria-label="Kursens delar">
    <a href="#${c.id}" ${cur === "course" ? 'aria-current="page"' : ""}>Lektioner</a>
    <a href="#${c.id}-prov" ${cur === "exam" ? 'aria-current="page"' : ""}>Prov</a>
    <a href="#${c.id}-uppgifter" ${cur === "assign" ? 'aria-current="page"' : ""}>Uppgifter</a>
    <a href="#${c.id}-resurser" ${cur === "res" ? 'aria-current="page"' : ""}>Resurser</a>
  </nav>`;
}
function lessonRow(c, l) {
  const i = lessonIdx(c, l.id), ps = practiceStats(c, l);
  return `<a class="lrow" href="#${c.id}-${l.id}">
    <span class="num">LEKTION<b>${nn(i)}</b></span>
    <div><h4>${esc(l.title)}</h4><p>${esc(l.lead)}</p></div>
    <div class="right">${isDone(c.id, l.id) ? '<span class="done-pill">klar</span>' : `<span>${l.min} min</span>`}
      <span>${ps.right}/${ps.total} rätt</span><span class="mini-bar"><i style="width:${ps.right / ps.total * 100}%"></i></span></div>
  </a>`;
}
function viewCourse(c) {
  const next = c.lessons.find(l => !isDone(c.id, l.id)) || c.lessons[0];
  const started = doneList(c.id).length > 0;
  const q = c.lessons.reduce((n, l) => n + l.pool.length, 0);
  const codeQ = c.lessons.reduce((n, l) => n + l.pool.filter(x => x.t === "code").length, 0);
  const cells = [..."C/C++", "\\0"].map((ch, i) => `<div><span class="cell ${ch === "\\0" ? "z" : ""}" style="animation-delay:${i * 90}ms">${esc(ch)}</span><span class="ad">…${(0x10 + i).toString(16)}</span></div>`).join("");
  const used = new Set();
  const groups = c.timeline.map(g => {
    const ls = g.topics.filter(id => !used.has(id) && lessonIdx(c, id) >= 0);
    ls.forEach(id => used.add(id));
    return ls.length ? `<section class="lgroup"><header><span class="d">${esc(g.d)}</span><h3>${esc(g.t)}</h3></header><div class="lrows">${ls.map(id => lessonRow(c, c.lessons[lessonIdx(c, id)])).join("")}</div></section>` : "";
  }).join("");
  const rest = c.lessons.filter(l => !used.has(l.id));
  return `${courseHead(c, "course")}
  <section class="hero" style="padding-top:0">
    <div>
      <div class="eyebrow">${esc(c.title)} · ${esc(c.tag)}</div>
      <h1>Varje byte har en <em>adress</em>.</h1>
      <p class="lead">${esc(c.desc)}</p>
      <div class="cta">
        <a class="btn primary" href="#${c.id}-${next.id}">${started ? "Fortsätt" : "Börja"} med lektion ${nn(lessonIdx(c, next.id))} →</a>
        <a class="btn" href="#${c.id}-prov">Gör ett prov</a>
      </div>
    </div>
    <div class="memcard" aria-label="Exempel: en C-sträng i minnet">
      <div class="decl"><span class="k">char</span> kurs[] = <span class="s">"C/C++"</span>;</div>
      <div class="mem">${cells}</div>
      <div class="foot">sizeof(kurs) == 6, strlen(kurs) == 5.<br>Det sista tecknet, nolltecknet, gav sajten dess namn.</div>
    </div>
  </section>
  <div class="stats">
    <div><b>${c.lessons.length}</b><span>lektioner</span></div>
    <div><b>${q}</b><span>frågor i poolen</span></div>
    <div><b>${codeQ}</b><span>kodfrågor att köra</span></div>
    <div><b>${c.assignments.length}</b><span>uppgifter</span></div>
  </div>
  <section class="block">
    <div class="eyebrow">Lektioner</div>
    <h2>Lektionerna, i kursens ordning.</h2>
    <p class="sub">Grupperade efter lektionstillfälle. Varje lektion har genomgång, övningar och frågor.</p>
    ${groups}
    ${rest.length ? `<section class="lgroup"><header><span class="d">Fler</span><h3>Övriga lektioner</h3></header><div class="lrows">${rest.map(l => lessonRow(c, l)).join("")}</div></section>` : ""}
  </section>`;
}

/* ================================================================ lesson */
function codeBlock(lang, src, cap) {
  const label = cap || (lang === "c" ? "C" : lang === "cpp" ? "C++" : lang === "bash" ? "terminal" : lang);
  return `<div class="codewrap"><div class="cap"><span>${esc(label)}</span><button class="copy" type="button">Kopiera</button></div><pre><code class="language-${lang === "c" ? "c" : lang === "bash" ? "bash" : "cpp"}">${esc(src)}</code></pre></div>`;
}
function renderBlocks(t, ti) {
  let si = 0, exn = 0;
  return t.blocks.map(b => {
    switch (b[0]) {
      case "h": si++; return `<h2 id="${t.id}-s${si}"><span class="addr">${addr(ti, si)}</span><span>${esc(b[1])}</span></h2>`;
      case "p": return `<p>${b[1]}</p>`;
      case "list": return `<ul>${b[1].map(x => `<li>${x}</li>`).join("")}</ul>`;
      case "code": return codeBlock(b[1], b[2], b[3]);
      case "table": return `<div class="tablewrap"><table><thead><tr>${b[1].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${b[2].map(r => `<tr>${r.map((cell, ci) => ci === 0 && b[1][0] === "" ? `<th scope="row" style="background:transparent;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:.9rem;color:var(--ink)">${cell}</th>` : `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "note": return `<div class="note ${b[1]}"><span class="tag">${b[1] === "tip" ? "Tips" : b[1] === "warn" ? "Se upp" : "Felsök"}</span><div><p>${b[2]}</p></div></div>`;
      case "widget": return `<div class="widget" data-widget="${b[1]}"></div>`;
      case "ex": exn++; return `<details class="ex"><summary><span class="n">ÖVN ${String(exn).padStart(2, "0")}</span><b>${esc(b[1])}</b><span class="chev">›</span></summary><div class="body">${b[2]}${b[3] ? `<details class="sol"><summary>Visa ett lösningsförslag</summary>${codeBlock(b[4] || "cpp", b[3], "lösningsförslag")}</details>` : ""}</div></details>`;
    }
    return "";
  }).join("");
}
let practiceFilter = "alla";
function viewLesson(c, id) {
  const ti = lessonIdx(c, id), t = c.lessons[ti];
  const prev = c.lessons[ti - 1], next = c.lessons[ti + 1];
  return `
  <nav class="crumbs" aria-label="Brödsmulor"><a href="#hem">Kurser</a><span>/</span><a href="#${c.id}">${esc(c.short)}</a><span>/</span><span>Lektion ${nn(ti)}</span></nav>
  <header class="thead">
    <div class="eyebrow">Lektion ${nn(ti)} · ${esc(t.cat)}</div>
    <h1>${esc(t.title)}</h1>
    <p class="lead">${esc(t.lead)}</p>
    <div class="meta"><span>≈ ${t.min} min</span><span>${t.pool.length} frågor</span>${t.date ? `<span>Lektionstillfälle ${esc(t.date)}</span>` : ""}<span>Källa: ${t.src.map(esc).join(" · ")}</span></div>
  </header>
  <div class="article">
    <section class="goals"><h2>Efter lektionen kan du</h2><ul>${t.goals.map(g => `<li>${g}</li>`).join("")}</ul></section>
    ${renderBlocks(t, ti)}
  </div>
  <section class="quiz" id="quiz"></section>
  <div class="complete" id="complete"></div>
  <nav class="pager" aria-label="Föregående och nästa lektion">
    ${prev ? `<a href="#${c.id}-${prev.id}"><small>← Lektion ${nn(ti - 1)}</small><b>${esc(prev.title)}</b></a>` : "<span></span>"}
    ${next ? `<a class="next" href="#${c.id}-${next.id}"><small>Lektion ${nn(ti + 1)} →</small><b>${esc(next.title)}</b></a>` : `<a class="next" href="#${c.id}-prov"><small>Nästa →</small><b>Gör ett prov på hela kursen</b></a>`}
  </nav>`;
}
function renderPractice(c, t) {
  const key = c.id + ":" + t.id;
  const store = (state.practice[key] = state.practice[key] || {});
  const counts = { alla: t.pool.length };
  t.pool.forEach(q => (counts[q.t] = (counts[q.t] || 0) + 1));
  const ps = practiceStats(c, t);
  const list = t.pool.map((q, qi) => ({ q, qi })).filter(x => practiceFilter === "alla" || x.q.t === practiceFilter);
  const box = $("#quiz");
  box.innerHTML = `<h2>Testa din förståelse</h2>
    <p>${t.pool.length} frågor: flerval, flera rätt, fritext${counts.code ? " och kod du kör direkt i webbläsaren" : ""}. Svaren sparas.</p>
    <div class="pfilter" role="group" aria-label="Filtrera frågetyp">
      ${["alla", "mc", "multi", "text", "code"].filter(k => counts[k]).map(k => `<button type="button" data-f="${k}" aria-pressed="${practiceFilter === k}">${k === "alla" ? "Alla" : TYPE_LABEL[k]} · ${counts[k]}</button>`).join("")}
      <span class="score">${ps.right}/${ps.total} rätt</span>
    </div>
    <div id="qlist"></div>
    <div class="qscore"><b>${ps.right} av ${ps.total} rätt</b><span>Vill du testa dig på riktigt? Gör ett slumpat prov på den här lektionen.</span>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="qreset">Nollställ svaren</button><button type="button" id="qexam">Prov på lektionen →</button></span></div>`;
  const ql = $("#qlist", box);
  list.forEach(({ q, qi }) => {
    const el = document.createElement("div");
    ql.appendChild(el);
    mountQuestion(el, q, {
      mode: "practice", n: qi + 1, total: t.pool.length, uid: t.id + "-" + qi,
      ans: store[qi],
      onAnswer: a => { store[qi] = a; save(); const s = practiceStats(c, t); $(".pfilter .score", box).textContent = `${s.right}/${s.total} rätt`; $(".qscore b", box).textContent = `${s.right} av ${s.total} rätt`; },
    });
  });
  $$(".pfilter button", box).forEach(b => b.addEventListener("click", () => { practiceFilter = b.dataset.f; renderPractice(c, t); }));
  $("#qreset", box).addEventListener("click", () => { state.practice[key] = {}; save(); renderPractice(c, t); });
  $("#qexam", box).addEventListener("click", () => { state.prefs[c.id] = Object.assign({}, state.prefs[c.id] || {}, { lessons: [t.id], count: 10 }); save(); location.hash = c.id + "-prov"; });
}
function completeInner(c, t) {
  return isDone(c.id, t.id)
    ? `<p><strong>Lektionen är markerad som klar.</strong> Det syns i din lärresa i sidomenyn.</p><button class="btn" id="donebtn" type="button">Ångra</button>`
    : `<p>Har du läst igenom lektionen och svarat på frågorna? Markera den som klar.</p><button class="btn primary" id="donebtn" type="button">Markera som klar</button>`;
}
function bindLesson(c, id) {
  const t = c.lessons[lessonIdx(c, id)];
  renderPractice(c, t);
  const bindDone = () => {
    $("#complete").innerHTML = completeInner(c, t);
    $("#donebtn").addEventListener("click", () => {
      const l = doneList(c.id);
      if (isDone(c.id, id)) state.done[c.id] = l.filter(x => x !== id); else l.push(id);
      save(); bindDone(); renderChrome({ view: "lesson", course: c, lesson: id });
    });
  };
  bindDone();
  $$("[data-widget]").forEach(w => WIDGETS[w.dataset.widget] && WIDGETS[w.dataset.widget](w));
}

/* ================================================================ assignments */
function viewAssign(c) {
  return `${courseHead(c, "assign")}
  <header class="thead"><div class="eyebrow">Uppgifter och inlämningar</div><h1>Bocka av kraven medan du bygger.</h1>
  <p class="lead">Alla uppgifter från materialet, uppdelade i krav du kan bocka av. Bockarna sparas i den här webbläsaren.</p></header>
  <div style="display:grid;gap:4px;margin-top:22px">
  ${c.assignments.map(a => {
    const keys = a.groups.flatMap((g, gi) => g.items.map((_, ii) => `${c.id}:${a.id}:${gi}:${ii}`));
    const doneN = keys.filter(k => state.checks[k]).length;
    return `<article class="assign" id="${a.id}">
      <div class="eyebrow">${esc(a.kind)} · <span data-count="${a.id}">${doneN}/${keys.length}</span> klara</div>
      <h2>${esc(a.title)}</h2>
      <div class="bar"><i data-bar="${a.id}" style="width:${doneN / keys.length * 100}%"></i></div>
      <p>${a.intro}</p>
      ${a.groups.map((g, gi) => `<h3>${esc(g.h)}</h3><ul class="checks">${g.items.map((it, ii) => { const k = `${c.id}:${a.id}:${gi}:${ii}`; return `<li><label><input type="checkbox" id="c-${k.replace(/:/g, "-")}" data-a="${a.id}" data-k="${k}" ${state.checks[k] ? "checked" : ""}><span>${it}</span></label></li>`; }).join("")}</ul>`).join("")}
      ${a.grade ? `<div class="grade">${a.grade.map(([g, d]) => `<div><b>${g}</b>${esc(d)}</div>`).join("")}</div>` : ""}
      ${a.hint ? `<div class="note tip" style="margin-top:14px"><span class="tag">Tips</span><div><p>${a.hint}</p></div></div>` : ""}
      <h3>Lektioner du behöver</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${a.topics.map(id => `<a class="chip" href="#${c.id}-${id}">${nn(lessonIdx(c, id))} ${esc(c.lessons[lessonIdx(c, id)].title)}</a>`).join("")}</div>
    </article>`;
  }).join("")}
  </div>`;
}
function bindAssign() {
  $$(".checks input").forEach(cb => cb.addEventListener("change", () => {
    state.checks[cb.dataset.k] = cb.checked; save();

/* ================================================================ C++ runner (Web Worker, lazy) */
let cppWorker = null, cppSeq = 0;
const cppPending = new Map();
function failAllPending(msg) {
  cppPending.forEach(p => { clearTimeout(p.to); p.res({ ok: false, out: "", error: msg }); });
  cppPending.clear();
}
function getCppWorker() {
  if (cppWorker) return cppWorker;
  cppWorker = new Worker("cpp-runner.js");
  cppWorker.onmessage = e => {
    const p = cppPending.get(e.data.id);
    if (!p) return;
    clearTimeout(p.to); cppPending.delete(e.data.id); p.res(e.data);
  };
  cppWorker.onerror = () => { failAllPending("Kodtolken kunde inte laddas här. Öppna koden i Compiler Explorer istället."); try { cppWorker.terminate(); } catch (e) {} cppWorker = null; };
  return cppWorker;
}
/* In the desktop app, preload exposes window.nollterm with a real g++ bridge. */
const NATIVE = !!(window.nollterm && typeof window.nollterm.run === "function");
async function runNative(files, input, flags) {

    const r = await window.nollterm.run({ files, stdin: input || "", flags });
    if (r.stage === "compile" && !r.ok) return { ok: false, out: "", error: "Kompileringsfel:\n" + (r.stderr || r.error || ""), compile: true };
    if (!r.ok) return { ok: false, out: r.out || "", error: r.error || r.stderr || "Programmet avslutades med fel." };
    return { ok: true, out: r.out || "", stderr: r.stderr || "", warnings: r.warnings || "" };
  } catch (e) { return { ok: false, out: "", error: "Kunde inte köra g++: " + (e && e.message || e) }; }
}
function runCpp(code, input) {
  if (NATIVE) return runNative([{ name: /#include\s*<iostream>|std::|\bclass\b|\bcout\b/.test(code) || !/#include\s*<stdio\.h>/.test(code) ? "main.cpp" : "main.c", content: code }], input);
  return runInterp(code, input);
}
function runInterp(code, input) {
  return new Promise(res => {
    let w;
    try { w = getCppWorker(); } catch (e) { res({ ok: false, out: "", error: "Kodtolken är inte tillgänglig i den här vyn. Öppna koden i Compiler Explorer istället." }); return; }
    const id = ++cppSeq;
    const to = setTimeout(() => {
      cppPending.delete(id);
      try { w.terminate(); } catch (e) {}
      cppWorker = null;
      failAllPending("Avbruten.");
      res({ ok: false, out: "", error: "Tidsgränsen överskreds. Har du en oändlig loop, eller väntar programmet på mer indata?" });
    }, 6000);
    cppPending.set(id, { res, to });
    w.postMessage({ id, code, input: input || "" });
  });
}
const normOut = s => String(s || "").replace(/\r/g, "").split("\n").map(l => l.replace(/\s+$/, "")).join("\n").replace(/\n+$/, "").replace(/^\n+/, "");
function explainError(msg) {

}
async function runTests(q, code) {

    const r = await runCpp(code, t.in);
    out.push({ in: t.in, want: t.out, got: r.out || "", error: r.ok ? null : r.error, pass: r.ok && normOut(r.out) === normOut(t.out) });

/* ---------------- running */
function renderRun(c, box, run) {
  const N = run.items.length;
  const it = run.items[run.cur], q = qOf(c, it);
  const answered = run.items.filter((x, i) => isAnswered(qOf(c, x), run.ans[i])).length;
  box.innerHTML = `
  <div class="exambar">
    <div class="row1"><b>Prov${run.label ? " · " + esc(run.label) : ""} · fråga ${run.cur + 1} av ${N}</b><span style="display:flex;gap:10px;align-items:center"><span style="font-size:.85rem;color:var(--muted)">${answered}/${N} besvarade</span><span class="timer" id="timer"></span></span></div>
    <div class="qnav" role="group" aria-label="Hoppa till fråga">${run.items.map((x, i) => `<button type="button" data-go="${i}" class="${i === run.cur ? "cur" : ""} ${isAnswered(qOf(c, x), run.ans[i]) ? "ans" : ""} ${run.flags[i] ? "flag" : ""}" aria-label="Fråga ${i + 1}">${i + 1}</button>`).join("")}</div>
  </div>
  <div id="exq"></div>
  <div class="exnav">
    <div class="grp"><button type="button" class="btn" data-nav="-1" ${run.cur === 0 ? "disabled" : ""}>← Föregående</button><button type="button" class="btn" data-flag>${run.flags[run.cur] ? "Ta bort markering" : "Markera för senare"}</button></div>
    <div class="grp">${run.cur < N - 1 ? `<button type="button" class="btn" data-nav="1">Nästa →</button>` : ""}<button type="button" class="btn primary" data-submit>Lämna in</button></div>
  </div>
  <div id="confirm"></div>
  <p style="margin-top:22px"><button type="button" class="chip" data-abort>Avbryt provet utan att spara</button></p>`;
  mountQuestion($("#exq", box), q, {
    mode: "exam", n: run.cur + 1, total: N, uid: "ex" + run.cur, perm: it.perm,
    from: "Lektion " + nn(lessonIdx(c, it.l)), ans: run.ans[run.cur],
    onAnswer: a => {
      run.ans[run.cur] = a; save();
      const b = $(`[data-go="${run.cur}"]`, box); if (b) b.classList.toggle("ans", isAnswered(q, a));
      const cnt = run.items.filter((x, i) => isAnswered(qOf(c, x), run.ans[i])).length;
      $(".row1 span span", box).textContent = `${cnt}/${N} besvarade`;
    },
  });
  const go = i => { run.cur = i; examConfirm = false; save(); renderRun(c, box, run); };
  $$("[data-go]", box).forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
  $$("[data-nav]", box).forEach(b => b.addEventListener("click", () => go(run.cur + +b.dataset.nav)));
  $("[data-flag]", box).addEventListener("click", () => { run.flags[run.cur] = !run.flags[run.cur]; save(); renderRun(c, box, run); });
  $("[data-abort]", box).addEventListener("click", () => {
    $("#confirm", box).innerHTML = `<div class="confirm"><p>Avbryta provet? Dina svar sparas inte.</p><button type="button" class="btn" data-no>Fortsätt provet</button><button type="button" class="btn primary" data-yes>Avbryt provet</button></div>`;
    $("[data-no]", box).addEventListener("click", () => ($("#confirm", box).innerHTML = ""));
    $("[data-yes]", box).addEventListener("click", () => { delete state.run[c.id]; save(); renderExam(c); });
  });
  const showConfirm = () => {
    const left = N - run.items.filter((x, i) => isAnswered(qOf(c, x), run.ans[i])).length;
    const flagged = Object.values(run.flags).filter(Boolean).length;
    $("#confirm", box).innerHTML = `<div class="confirm"><p><b>Lämna in provet?</b> ${left ? `${left} fråg${left === 1 ? "a" : "or"} är obesvarad${left === 1 ? "" : "e"}.` : "Alla frågor är besvarade."}${flagged ? ` ${flagged} är markerad${flagged === 1 ? "" : "e"} för senare.` : ""}</p><button type="button" class="btn" data-no>Fortsätt skriva</button><button type="button" class="btn primary" data-yes>Lämna in</button></div>`;
    $("[data-no]", box).addEventListener("click", () => { examConfirm = false; $("#confirm", box).innerHTML = ""; });
    $("[data-yes]", box).addEventListener("click", () => submitExam(c));
    $("#confirm", box).scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  $("[data-submit]", box).addEventListener("click", () => { examConfirm = true; showConfirm(); });
  if (examConfirm) showConfirm();
  const tick = () => {
    const el = $("#timer"); if (!el) return clearInterval(examTimer);
    const elapsed = Math.floor((Date.now() - run.start) / 1000);
    if (run.limit) {
      const left = run.limit * 60 - elapsed;
      if (left <= 0) { clearInterval(examTimer); submitExam(c, true); return; }
      el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} kvar`;
      el.classList.toggle("low", left <= 60);
    } else el.textContent = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, "0")}`;
  };
  tick(); clearInterval(examTimer); examTimer = setInterval(tick, 1000);
}

async function submitExam(c, timeout) {
  clearInterval(examTimer);
  const run = state.run[c.id]; if (!run) return;
  const box = $("#exam");
  if (box) box.innerHTML = `<div class="panel" style="margin-top:20px"><h3>${timeout ? "Tiden är ute. " : ""}Rättar provet…</h3><p style="margin:0;color:var(--muted)" id="gprog">Kodfrågorna körs mot dolda tester.</p></div>`;
  const per = [];
  for (let i = 0; i < run.items.length; i++) {
    const it = run.items[i], q = qOf(c, it);
    let a = run.ans[i] ? JSON.parse(JSON.stringify(run.ans[i])) : null;
    let ok = false;
    if (q.t === "code") {
      if (a && isAnswered(q, a)) {
        const p = $("#gprog"); if (p) p.textContent = `Kör tester för fråga ${i + 1}…`;
        const r = await runTests(q, a.v);
        ok = r.every(x => x.pass); a = Object.assign(a, { res: r, ok });
      }
    } else ok = gradeSync(q, a);
    per.push({ l: it.l, i: it.i, perm: it.perm, ans: a, ok, pts: ok ? TYPE_POINTS[q.t] : 0, max: TYPE_POINTS[q.t] });
  }
  const pts = per.reduce((n, x) => n + x.pts, 0), max = per.reduce((n, x) => n + x.max, 0);
  const pct = max ? Math.round(pts / max * 100) : 0;
  const res = { ts: Date.now(), secs: Math.round((Date.now() - run.start) / 1000), pts, max, pct, grade: gradeOf(pct), per, label: run.label };
  state.exams[c.id] = [res, ...(state.exams[c.id] || [])].slice(0, 15);
  delete state.run[c.id];
  examResultIdx = 0; save();
  renderChrome({ view: "exam", course: c });
  renderExam(c); window.scrollTo(0, 0);
}

/* ---------------- result */
let reviewOnlyWrong = false;
function renderResult(c, box, r) {
  const right = r.per.filter(x => x.ok).length;
  const byL = {}, byT = {};
  r.per.forEach(x => {
    const q = qOf(c, x);
    (byL[x.l] = byL[x.l] || { p: 0, m: 0 }); byL[x.l].p += x.pts; byL[x.l].m += x.max;
    (byT[q.t] = byT[q.t] || { p: 0, m: 0 }); byT[q.t].p += x.pts; byT[q.t].m += x.max;
  });
  const bar = (p, m) => { const v = m ? p / m * 100 : 0; return `<span class="mini-bar"><i class="${v < 50 ? "lowv" : v < 75 ? "midv" : ""}" style="width:${v}%"></i></span>`; };
  const R = 52, C = 2 * Math.PI * R, off = C * (1 - r.pct / 100);
  const missed = r.per.filter(x => !x.ok);
  const weakest = Object.entries(byL).filter(([, v]) => v.m && v.p / v.m < .5).sort((a, b) => (a[1].p / a[1].m) - (b[1].p / b[1].m) || b[1].m - a[1].m).slice(0, 4).map(([k]) => k);
  box.innerHTML = `
  <div class="result-hero">
    <svg class="ring" viewBox="0 0 130 130" role="img" aria-label="${r.pct} procent">
      <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"></circle>
      <circle cx="65" cy="65" r="${R}" fill="none" stroke="${r.grade === "IG" ? "var(--bad)" : r.grade === "G" ? "var(--mask)" : "var(--ok)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"></circle>
      <text x="65" y="62" text-anchor="middle" font-size="28" fill="var(--ink)">${r.pct}%</text>
      <text x="65" y="86" text-anchor="middle" font-size="15" fill="var(--muted)">${r.grade}</text>
    </svg>
    <div>
      <div class="eyebrow">Resultat · ${esc(fmtDate(r.ts))}${r.label ? " · " + esc(r.label) : ""}</div>
      <h2>${r.grade === "VG" ? "Väl godkänt." : r.grade === "G" ? "Godkänt." : "Inte godkänt än."} ${r.pts} av ${r.max} poäng.</h2>
      <p>${right} av ${r.per.length} frågor rätt på ${Math.floor(r.secs / 60)} min ${r.secs % 60} s.</p>
      ${weakest.length ? `<p>Repetera: ${weakest.map(id => `<a href="#${c.id}-${id}">${esc(c.lessons[lessonIdx(c, id)].title)}</a>`).join(", ")}.</p>` : ""}
      <div class="cta" style="margin-top:12px">
        <button type="button" class="btn primary" data-again>Nytt prov</button>
        ${missed.length ? `<button type="button" class="btn" data-missed>Öva på de ${missed.length} du missade</button>` : ""}
        <button type="button" class="btn" data-setup>Inställningar och historik</button>
      </div>
    </div>
  </div>
  <div class="exam-setup">
    <div class="panel"><h3>Per lektion</h3><div class="breakdown">${Object.entries(byL).map(([lid, v]) => `<div class="brow"><span>${nn(lessonIdx(c, lid))} ${esc(c.lessons[lessonIdx(c, lid)].title)}</span>${bar(v.p, v.m)}<span>${v.p}/${v.m}</span></div>`).join("")}</div></div>
    <div class="panel"><h3>Per frågetyp</h3><div class="breakdown">${Object.entries(byT).map(([t, v]) => `<div class="brow"><span>${TYPE_LABEL[t]}</span>${bar(v.p, v.m)}<span>${v.p}/${v.m}</span></div>`).join("")}</div></div>
  </div>
  <div class="review-head"><h3>Genomgång</h3><div class="pfilter" style="margin:0"><button type="button" data-rf="0" aria-pressed="${!reviewOnlyWrong}">Alla · ${r.per.length}</button><button type="button" data-rf="1" aria-pressed="${reviewOnlyWrong}">Bara fel · ${missed.length}</button></div></div>
  <div id="review"></div>`;
  const rv = $("#review", box);
  r.per.forEach((x, i) => {
    if (reviewOnlyWrong && x.ok) return;
    const q = qOf(c, x);
    const el = document.createElement("div"); rv.appendChild(el);
    mountQuestion(el, q, { mode: "review", n: i + 1, total: r.per.length, uid: "rv" + i, perm: x.perm, from: "Lektion " + nn(lessonIdx(c, x.l)), ans: x.ans || (q.t === "code" ? { v: q.starter, res: null } : null) });
    if (!x.ans || !isAnswered(q, x.ans)) el.querySelector(".q").insertAdjacentHTML("beforeend", `<p class="yours"><b>Obesvarad.</b></p>`);
    else if (q.t === "code" && !x.ans.res) el.querySelector(".q").insertAdjacentHTML("beforeend", `<p class="yours">Koden rättades inte.</p>`);
    if (q.t === "code" && x.ans && x.ans.res) el.querySelector("[data-tests]").innerHTML = testsHtml(x.ans.res);
  });
  $$("[data-rf]", box).forEach(b => b.addEventListener("click", () => { reviewOnlyWrong = b.dataset.rf === "1"; renderResult(c, box, r); }));
  $("[data-again]", box).addEventListener("click", () => { const p = examPrefs(c); startExam(c, drawItems(c, p), p); });
  const mb = $("[data-missed]", box);
  if (mb) mb.addEventListener("click", () => startExam(c, shuffle(missed.map(x => { const q = qOf(c, x); return Object.assign({ l: x.l, i: x.i }, q.o ? { perm: shuffle(q.o.map((_, k) => k)) } : {}); })), { time: 0, label: "missade frågor" }));
  $("[data-setup]", box).addEventListener("click", () => { examResultIdx = null; renderExam(c); window.scrollTo(0, 0); });
}

  $("[data-new]", box).addEventListener("click", () => { const nf = $("#lab-newfile"); nf.hidden = !nf.hidden; if (!nf.hidden) $("#lab-fname").focus(); });
  const create = () => {
    const n = $("#lab-fname").value.trim();
    if (!/^[\w-]+\.(cpp|cc|c|h|hpp)$/.test(n)) { $("[data-ferr]", box).textContent = "Namn som sensor.h eller utils.cpp"; return; }
    if (L.files.some(x => x.name === n)) { $("[data-ferr]", box).textContent = "Filen finns redan"; return; }
    const guard = n.replace(/\W/g, "_").toUpperCase();
    L.files.push({ name: n, content: /\.(h|hpp)$/.test(n) ? `#ifndef ${guard}\n#define ${guard}\n\n\n\n#endif\n` : `#include <iostream>\n\n` });
    L.cur = L.files.length - 1; save(); renderLab();
  };
  $("[data-create]", box).addEventListener("click", create);
  $("#lab-fname").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); create(); } });
  $("#lab-ex").addEventListener("change", e => {
    const ex = LAB_EXAMPLES[e.target.value]; if (!ex) return;
    L.files = JSON.parse(JSON.stringify(ex.files)); L.cur = 0; L.stdin = ex.stdin; save(); renderLab();
  });
  $("[data-gb]", box).addEventListener("click", e => { e.currentTarget.href = godboltUrl(L.files.filter(x => /\.(cpp|cc|c)$/.test(x.name)).map(x => x.content)[0] || ta.value, L.stdin); });
  $("#lab-run").addEventListener("click", async () => {
    const out = $("#lab-out"), st = $("#lab-st");
    out.innerHTML = `<span class="dim">${NATIVE ? "Kompilerar…" : "Kör…"}</span>`; st.textContent = "";
    const t0 = performance.now();
    let r;
    if (NATIVE) r = await runNative(L.files, L.stdin, L.flags.split(/\s+/).filter(Boolean));
    else {
      const srcs = L.files.filter(x => /\.(cpp|cc|c)$/.test(x.name));
      const main = L.files.find(x => /^main\.(cpp|cc|c)$/.test(x.name)) || srcs[0];
      if (!main) { out.innerHTML = '<span class="err">Ingen .cpp-fil att köra.</span>'; return; }
      if (srcs.length > 1 || /#include\s*"/.test(main.content)) { out.innerHTML = '<span class="err">Flera filer och egna headers kräver desktop-appen (riktig g++). Öppna gärna i Compiler Explorer.</span>'; return; }
      r = await runInterp(main.content, L.stdin);
    }
    const ms = Math.round(performance.now() - t0);
    out.innerHTML = (r.warnings ? `<span class="dim">${esc(r.warnings)}</span>\n` : "") + esc(r.out || "") + (r.stderr ? `<span class="err">${esc(r.stderr)}</span>` : "") +
      (r.ok ? (r.out || r.stderr ? "" : '<span class="dim">(ingen utdata)</span>') : `<span class="err">${r.out ? "\n" : ""}${esc(explainError(r.error))}</span>`);
    st.textContent = `${r.ok ? "Klart" : "Fel"} på ${ms} ms`;
  });
}

/* ================================================================ offline (PWA) */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !NATIVE && !/^localhost$|^127\./.test(location.hostname)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });

/* ================================================================ search */
const INDEX = [
  { href: "lab", title: "Kodlabb", sub: "Fri editor med flera filer", text: "kodlabb editor kod kör kompilera g++ sandlåda playground flera filer", w: 3 },
  { href: "app", title: "Appen", sub: "Desktop med g++, mobil", text: "app desktop windows ladda ner installera g++ kompilator mobil telefon offline", w: 3 },
];
COURSES.forEach(c => {
  INDEX.push({ href: c.id, title: c.title, sub: "Kurs", text: (c.title + " " + c.desc + " kurs").toLowerCase(), w: 4 });
  INDEX.push({ href: c.id + "-prov", title: "Prov: " + c.short, sub: "Slumpat prov med rättning", text: "prov tenta test slumpa betyg rättning quiz frågor " + c.short.toLowerCase(), w: 3 });
  INDEX.push({ href: c.id + "-uppgifter", title: "Uppgifter: " + c.short, sub: "Inlämningar och labbar", text: "uppgifter inlämning inlämningsuppgift datainsamlare gruppuppgift device manager labb miniräknare repetition betyg", w: 2 });
  INDEX.push({ href: c.id + "-resurser", title: "Resurser: " + c.short, sub: "Kursdokument och länkar", text: "resurser källor pdf cppreference github dokument", w: 1 });
  c.lessons.forEach((t, ti) => {
    const href = c.id + "-" + t.id;
    INDEX.push({ href, title: t.title, sub: `${c.short} · Lektion ${nn(ti)} · ${t.cat}`, text: (t.title + " " + t.lead + " " + t.cat).toLowerCase(), w: 3 });
    let si = 0, buf = "", curH = null;
    const flush = () => { if (curH) INDEX.push({ href, sec: `${t.id}-s${si}`, title: curH, sub: `${c.short} · Lektion ${nn(ti)} · ${t.title}`, text: (curH + " " + buf).toLowerCase(), w: 2 }); };
    t.blocks.forEach(b => {
      if (b[0] === "h") { flush(); si++; curH = b[1]; buf = ""; }
      else if (b[0] === "p" || b[0] === "note") buf += " " + strip(b[0] === "p" ? b[1] : b[2]);
      else if (b[0] === "list") buf += " " + strip(b[1].join(" "));
      else if (b[0] === "code") buf += " " + b[2];
      else if (b[0] === "table") buf += " " + strip(b[2].flat().join(" "));
      else if (b[0] === "ex") buf += " " + b[1] + " " + strip(b[2]);
    });
    flush();
  });
});

let sSel = 0;
function openSearch() { $("#scrim").hidden = false; $("#sq").value = ""; runSearch(); setTimeout(() => $("#sq").focus(), 10); }
function closeSearch() { $("#scrim").hidden = true; }
function runSearch() {
  const q = $("#sq").value.trim().toLowerCase();
  let hits;
  if (!q) hits = INDEX.filter(e => e.w >= 3 && !e.sec).slice(0, 14);
  else {
    const words = q.split(/\s+/);
    hits = INDEX.map(e => words.every(w => e.text.includes(w)) ? Object.assign({ s: e.w * 10 + (e.title.toLowerCase().includes(q) ? 20 : 0) }, e) : null)
      .filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 12);
  }
  sSel = 0;
  $("#sres").innerHTML = hits.length ? hits.map((h, i) => `<a href="#${h.href}" data-sec="${h.sec || ""}" class="${i === 0 ? "act" : ""}"><b>${esc(h.title)}</b><small>${esc(h.sub)}</small></a>`).join("")
    : `<div class="empty">Inget matchade "${esc(q)}". Prova ett annat ord, t.ex. pekare, vector eller exception.</div>`;
}
let pendingSec = null;
$("#sres").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  pendingSec = a.dataset.sec || null; closeSearch();
  if (location.hash === a.getAttribute("href")) { e.preventDefault(); route(); }
});
$("#sq").addEventListener("input", runSearch);
$("#sq").addEventListener("keydown", e => {
  const links = $$("#sres a");
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && links.length) {
    e.preventDefault();
    sSel = (sSel + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
    links.forEach((l, i) => l.classList.toggle("act", i === sSel));
    links[sSel].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && links[sSel]) links[sSel].click();
});
$("#searchbtn").addEventListener("click", openSearch);
$("#sclose").addEventListener("click", closeSearch);
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSearch(); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#scrim").hidden ? openSearch() : closeSearch(); }
  else if (e.key === "Escape") { closeSearch(); toggleMenu(false); }
});

/* ================================================================ menu (mobile) */
function toggleMenu(open) {
  const side = $("#side");
  const o = open === undefined ? !side.classList.contains("open") : open;
  side.classList.toggle("open", o);
  $("#menubtn").setAttribute("aria-expanded", o);
}
$("#menubtn").addEventListener("click", () => toggleMenu());
$("#side").addEventListener("click", e => { if (e.target.closest("a")) toggleMenu(false); });

/* ================================================================ router */
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h || h === "hem") return { view: "home" };
  if (h === "lab") return { view: "lab" };
  if (h === "app") return { view: "app" };
  const cid = h.split("-")[0];
  const c = courseById(cid);
  if (!c) {
    // links from the first version (#loopar, #uppgifter, ...)
    const legacy = COURSES[0];
    if (lessonIdx(legacy, h) >= 0) return { redirect: legacy.id + "-" + h };
    if (h === "uppgifter" || h === "resurser") return { redirect: legacy.id + "-" + h };
    return { view: "home" };
  }
  const rest = h.slice(cid.length + 1);
  if (!rest) return { view: "course", course: c };
  if (rest === "prov") return { view: "exam", course: c };
  if (rest === "uppgifter") return { view: "assign", course: c };
  if (rest === "resurser") return { view: "res", course: c };
  if (lessonIdx(c, rest) >= 0) return { view: "lesson", course: c, lesson: rest };
  return { view: "course", course: c };
}
function route() {
  clearInterval(examTimer);
  const ctx = parseHash();
  if (ctx.redirect) { location.replace("#" + ctx.redirect); return; }
  const main = $("#main"), c = ctx.course;
  if (ctx.view === "home") main.innerHTML = viewHome();
  else if (ctx.view === "course") main.innerHTML = viewCourse(c);
  else if (ctx.view === "lesson") main.innerHTML = viewLesson(c, ctx.lesson);
  else if (ctx.view === "assign") { main.innerHTML = viewAssign(c); bindAssign(); }
  else if (ctx.view === "res") main.innerHTML = viewRes(c);
  else if (ctx.view === "exam") { main.innerHTML = viewExamShell(c); examConfirm = false; renderExam(c); }
  else if (ctx.view === "lab") { main.innerHTML = viewLab(); renderLab(); }
  else if (ctx.view === "app") { main.innerHTML = viewApp(); bindApp(); }
  renderChrome(ctx);
  document.title = ctx.view === "home" ? "Nollterm Kurser"
    : ctx.view === "lesson" ? `${c.lessons[lessonIdx(c, ctx.lesson)].title} · ${c.short}`
    : ctx.view === "exam" ? `Prov · ${c.short}` : ctx.view === "lab" ? "Kodlabb · Nollterm" : ctx.view === "app" ? "Appen · Nollterm" : `${c.short} · Nollterm`;
  $$(".article pre code[class^='language-']", main).forEach(el => { try { window.hljs && hljs.highlightElement(el); } catch (e) {} });
  if (ctx.view === "lesson") bindLesson(c, ctx.lesson);
  if (pendingSec && document.getElementById(pendingSec)) {
    const el = document.getElementById(pendingSec); pendingSec = null;
    setTimeout(() => el.scrollIntoView({ block: "start" }), 30);
  } else window.scrollTo(0, 0);
}
function bindCopy(root) {
  root.addEventListener("click", e => {
    const b = e.target.closest(".copy"); if (!b) return;
    const code = b.closest(".codewrap").querySelector("code");
    const ok = () => { b.textContent = "Kopierat"; setTimeout(() => (b.textContent = "Kopiera"), 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Markerat, tryck Ctrl+C"; };
    try { navigator.clipboard.writeText(code.innerText).then(ok, fallback); } catch (err) { fallback(); }
  });
}
bindCopy($("#main"));
window.addEventListener("hashchange", route);
route();
