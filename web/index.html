 *b</code>"],"a":1,"why":"<code>a == b</code> jämför adresser. <code>*a == *b</code> jämför bara första tecknet. <code>strcmp</code> jämför hela texten."},{"t":"mc","q":"Vad gör <code>buffer[strcspn(buffer, \"\\n\")] = '\\0';</code>?","o":["Tömmer bufferten","Tar bort radbrytningen som fgets sparade","Lägger till en radbrytning","Räknar antalet rader"],"a":1,"why":"<code>strcspn</code> ger positionen för första <code>'\\n'</code> (eller strängens längd om den saknas). Där skrivs <code>'\\0'</code>."},{"t":"mc","q":"Vilket tecken avslutar alltid en C-sträng?","o":["<code>'\\n'</code>","<code>'\\0'</code>","<code>' '</code>","<code>'0'</code>"],"a":1,"why":"Nolltecknet <code>'\\0'</code> har värdet 0. Tecknet <code>'0'</code> är siffran noll och har värdet 48."},{"t":"mc","q":"Varför måste du lägga till <code>'\\0'</code> själv efter <code>strncpy(dest, src, n)</code>?","o":["strncpy lägger aldrig till det","strncpy lägger inte till det om källan är n tecken eller längre","Det behövs inte","För att strncpy tar bort det"],"a":1,"why":"Om källan inte får plats kopierar strncpy exakt n tecken utan avslutning. Skriv <code>dest[size - 1] = '\\0';</code>."},{"t":"multi","q":"Vilka funktioner begränsar hur mycket som skrivs till bufferten? Välj alla.","o":["<code>fgets</code>","<code>gets</code>","<code>snprintf</code>","<code>strcpy</code>","<code>strncpy</code>"],"a":[0,2,4],"why":"<code>gets</code> och <code>strcpy</code> vet inget om buffertens storlek."},{"t":"text","q":"Vilken funktion i <code>&lt;string.h&gt;</code> hittar första förekomsten av ett tecken i en sträng?","accept":["strchr","strchr()"],"ph":"funktion","why":"<code>strchr(cmd, '=')</code> returnerar en pekare till tecknet, eller NULL om det saknas."},{"t":"text","q":"Vilken std::string-metod letar efter ett tecken och returnerar <code>std::string::npos</code> om det saknas?","accept":["find","find()",".find"],"ph":"metod","why":"<code>cmd.find('=')</code>"},{"t":"code","q":"Skriv <code>int my_strlen(const char* str)</code> som räknar tecknen fram till <code>'\\0'</code>. Använd inte <code>strlen</code>.","why":"Pekaren flyttas ett tecken i taget tills den når nolltecknet.","task":"06-c-strangar-1","tests":[{"in":"Hello\n","out":"5\n"},{"in":"IoT\n","out":"3\n"},{"in":"a\n","out":"1\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint my_strlen(const char* str) {\n\n}\n\nint main() {\n    char buf[64];\n    scanf(\"%s\", buf);\n    printf(\"%d\\n\", my_strlen(buf));\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint my_strlen(const char* str) {\n    int len = 0;\n    while (*str != '\\0') {\n        len++;\n        str++;\n    }\n    return len;\n}\n\nint main() {\n    char buf[64];\n    scanf(\"%s\", buf);\n    printf(\"%d\\n\", my_strlen(buf));\n    return 0;\n}\n"}},"langs":["c"],"web":["c"],"gpp":false},{"t":"code","q":"Skriv <code>int countVowels(const char* s)</code> som räknar vokalerna a, e, i, o, u och y, oavsett stor eller liten bokstav.","why":"<code>tolower</code> gör att 'I' och 'i' räknas likadant.","task":"06-c-strangar-2","tests":[{"in":"Mikrokontroller\n","out":"5\n"},{"in":"IoT\n","out":"2\n"},{"in":"xyz\n","out":"1\n"}],"code":{"c":{"starter":"#include <stdio.h>\n#include <ctype.h>\n\nint countVowels(const char* s) {\n\n}\n\nint main() {\n    char buf[64];\n    scanf(\"%s\", buf);\n    printf(\"%d\\n\", countVowels(buf));\n    return 0;\n}\n","sol":"#include <stdio.h>\n#include <ctype.h>\n\nint countVowels(const char* s) {\n    int c = 0;\n    for (; *s; s++) {\n        char ch = tolower(*s);\n        if (ch == 'a' || ch == 'e' || ch == 'i' || ch == 'o' || ch == 'u' || ch == 'y')\n            c++;\n    }\n    return c;\n}\n\nint main() {\n    char buf[64];\n    scanf(\"%s\", buf);\n    printf(\"%d\\n\", countVowels(buf));\n    return 0;\n}\n"},"py":{"starter":"def count_vowels(s):\n    # räkna a, e, i, o, u, y oavsett stor eller liten bokstav\n    pass\n\n\nprint(count_vowels(input()))\n","sol":"def count_vowels(s):\n    count = 0\n    for ch in s.lower():\n        if ch in \"aeiouy\":\n            count += 1\n    return count\n\n\nprint(count_vowels(input()))\n"}},"langs":["c","py"],"web":["c","py"],"gpp":false}]},{"id":"klasser","cat":"Objekt","min":12,"title":"Structs, klasser och objekt","lead":"Samla data som hör ihop, välj mellan stack och heap och skydda dina värden med inkapsling och konstruktorer.","src":["Torsdag 16/10 – Klasser, structs, objekt"],"goals":["Skapa structs i C och C++ och förklara vad en medlem är","Skilja på objekt på stacken och på heapen, och använda . och ->","Förklara skillnaden mellan struct och class, och public/private","Skriva konstruktorer med initieringslista"],"blocks":[["h","Structs: data som hör ihop"],["p","En <strong>struct</strong> samlar flera värden, ofta av olika typer, under ett namn. Varje värde kallas <strong>medlem</strong> (eller fält)."],["code","c","struct Device {\n    int id;            // data-medlem\n    char name[20];     // data-medlem\n    float temperature; // data-medlem\n};\n\nstruct Device d = {1, \"Sensor A\", 23.5f};   // i C skriver du \"struct Device\"\nprintf(\"%s: %.1f\\n\", d.name, d.temperature);","C"],["p","I C++ kan en struct dessutom innehålla <strong>metoder</strong> (funktioner som hör till structen), och du behöver inte skriva <code>struct</code> framför typnamnet."],["code","cpp","struct Device {\n    int id;\n    std::string name;\n    float temperature;\n\n    void printInfo() const {              // metod (funktionsmedlem)\n        std::cout << \"Device \" << id << \" (\" << name << \") -> \"\n                  << temperature << \" °C\\n\";\n    }\n};\n\nDevice d1 = {1, \"Sensor A\", 23.5f};       // en instans, ett objekt\nd1.printInfo();","C++"],["p","Definitionen av <code>Device</code> är en ritning. Varje <strong>instans</strong> (objekt) du skapar har sina egna värden på <code>id</code>, <code>name</code> och <code>temperature</code>."],["h","Stack och heap"],["p","All data i ett program lagras någonstans i minnet. Två områden är viktiga att känna till:"],["table",["","Stack","Heap"],[["Skapas","automatiskt: <code>Device d1;</code>","manuellt: <code>new Device{...}</code> eller <code>malloc</code>"],["Frigörs","automatiskt när funktionen avslutas","när du anropar <code>delete</code> (eller <code>free</code>)"],["Används till","lokala variabler, parametrar, temporära objekt","objekt som ska leva längre än funktionen, eller när antalet är okänt"],["Egenskaper","snabb men begränsad i storlek","flexibel, men du ansvarar för att frigöra"]]],["p","När du har en <strong>pekare</strong> till ett objekt använder du <code>-&gt;</code> istället för punkt. <code>d2-&gt;name</code> är kortform för <code>(*d2).name</code>."],["code","cpp","Device d1 = {1, \"Sensor A\", 22.5f};              // stack\nDevice* d2 = new Device{2, \"Sensor B\", 25.0f};   // heap\n\nstd::cout << d1.name  << \"\\n\";    // punkt för objekt\nstd::cout << d2->name << \"\\n\";    // pil för pekare\nstd::cout << &d1 << \" \" << d2 << \"\\n\";   // jämför adresserna\n\ndelete d2;          // annars minnesläcka\nd2 = nullptr;"],["note","tip","I inbyggda system med lite RAM undviker man ofta heapen helt efter uppstart. Statisk eller stackbaserad allokering är förutsägbar och kan inte fragmentera minnet."],["h","Från struct till class"],["p","I C++ är <code>struct</code> och <code>class</code> nästan samma sak. Den enda skillnaden är standardåtkomsten:"],["list",["I en <code>struct</code> är medlemmarna <strong>public</strong> om inget annat anges.","I en <code>class</code> är medlemmarna <strong>private</strong> om inget annat anges."]],["p","Konventionen är att använda struct för enkla datapaket och class när objektet har regler för hur datan får användas."],["table",["Åtkomst","Vem kommer åt medlemmen"],[["<code>public</code>","alla, även kod utanför klassen"],["<code>private</code>","bara klassens egna metoder"],["<code>protected</code>","klassen och klasser som ärver från den (arv kommer senare)"]]],["h","Inkapsling"],["p","<strong>Inkapsling</strong> (encapsulation) betyder att klassen själv bestämmer hur dess data används. Gör <code>value</code> privat och låt ändringar gå via <code>setValue()</code>, så kan klassen garantera att värdet alltid är rimligt."],["code","cpp","class Sensor {\nprivate:\n    float value = 0.0f;\npublic:\n    bool setValue(float v) {\n        if (v < 0.0f || v > 100.0f) return false;   // avvisa orimliga värden\n        value = v;\n        return true;\n    }\n    float getValue() const { return value; }\n};"],["list",["Färre buggar: ingen utanför kan ändra känsliga värden direkt.","Lättare att underhålla: gränssnittet är tydligt.","Du kan byta implementation utan att resten av programmet påverkas."]],["h","Konstruktorer"],["p","En <strong>konstruktor</strong> har samma namn som klassen och körs automatiskt när ett objekt skapas. Den sätter startvärden, så att ett objekt aldrig existerar i ett halvfärdigt läge. Initieringslistan efter kolonet sätter medlemmarna direkt."],["code","cpp","class Device {\nprivate:\n    int id;\n    std::string type;\n    float value;\npublic:\n    Device(int i, std::string t, float v)\n        : id(i), type(t), value(v) {}           // initieringslista\n\n    void setValue(float v) { value = v; }\n    void print() const {\n        std::cout << \"Device \" << id << \" (\" << type << \"): \" << value << \"\\n\";\n    }\n};\n\nint main() {\n    Device d1(1, \"Sensor A\", 23.5f);   // konstruktorn anropas här\n    d1.print();\n}"],["p","En klass kan ha flera konstruktorer (överlagring), så att objekt kan skapas på olika sätt:"],["code","cpp","Device() : id(0), type(\"Unnamed\"), value(0.0f) {}                  // standard\nDevice(int i, std::string t) : id(i), type(t), value(0.0f) {}           // delvis\nDevice(int i, std::string t, float v) : id(i), type(t), value(v) {}     // full\n\nDevice a;                         // standard\nDevice b(2, \"TempSensor\");        // delvis\nDevice c(3, \"Pressure\", 101.3f);  // full"],["note","warn","Metoder som bara läser, som <code>print()</code>, markeras med <code>const</code> efter parentesen. Då kan de anropas på konstanta objekt och kompilatorn stoppar oavsiktliga ändringar."],["h","Övningar"],["ex","struct Device","<p>Skapa en struct med <code>int id</code>, <code>string type</code>, <code>bool active</code> och <code>float value</code>. Skriv <code>void printDevice(Device d)</code>, skapa två objekt i <code>main</code> och skriv ut dem. Extra: läs in värden med <code>cin</code>.</p>"],["ex","Stack och heap","<ol><li>Skapa en Device på stacken och en på heapen.</li><li>Ändra <code>value</code> för båda.</li><li>Skriv ut <code>&amp;d1</code> och <code>d2</code> och jämför adresserna.</li><li>Diskutera: vilken allokering passar inbyggda system med lite minne?</li></ol>"],["ex","class Sensor","<p>Skapa en klass <code>Sensor</code> med privata medlemmar <code>id</code>, <code>unit</code> och <code>value</code>, en konstruktor som tar alla tre och en metod <code>printInfo()</code>. Skapa två sensorer i <code>main</code>.</p>","class Sensor {\nprivate:\n    int id;\n    std::string unit;\n    float value;\npublic:\n    Sensor(int i, std::string u, float v) : id(i), unit(u), value(v) {}\n    void printInfo() const {\n        std::cout << \"Sensor \" << id << \": \" << value << \" \" << unit << \"\\n\";\n    }\n};\n\nint main() {\n    Sensor s1(1, \"°C\", 22.5f);\n    Sensor s2(2, \"%RH\", 41.0f);\n    s1.printInfo();\n    s2.printInfo();\n}","cpp"],["ex","vector av devices","<p>Skapa en <code>vector&lt;Device&gt;</code> med flera objekt och en funktion som skriver ut alla. Tips: ta listan som <code>const vector&lt;Device&gt;&amp;</code>.</p>"],["ex","Utmaning: statusmeddelande","<p>Lägg till en metod som returnerar ett statusmeddelande beroende på <code>value</code>, till exempel \"Sensor normal\", \"Warning: High value\" eller \"Offline\".</p>"]],"pool":[{"t":"mc","q":"Vad är den enda skillnaden mellan <code>struct</code> och <code>class</code> i C++?","o":["Structs kan inte ha metoder","Standardåtkomsten: public i struct, private i class","Klasser lagras alltid på heapen","Structs kan inte ha konstruktorer"],"a":1,"why":"I C++ kan båda ha metoder, konstruktorer och arv. Bara standardåtkomsten skiljer."},{"t":"mc","q":"<code>Device* d2 = new Device{2, \"B\", 25.0f};</code> Hur når du namnet?","o":["<code>d2.name</code>","<code>d2-&gt;name</code>","<code>&amp;d2.name</code>","<code>d2::name</code>"],"a":1,"why":"d2 är en pekare, så du använder <code>-&gt;</code>. Det är kortform för <code>(*d2).name</code>."},{"t":"mc","q":"Vad händer om du glömmer <code>delete d2;</code>?","o":["Kompileringsfel","Objektet raderas automatiskt när main slutar köra rader","Minnet frigörs aldrig under körningen: en minnesläcka","d2 flyttas till stacken"],"a":2,"why":"Heapminne frigörs bara när du gör det själv. I ett program som körs länge, som en IoT-enhet, kan läckor till slut ta slut på minnet."},{"t":"mc","q":"När körs en konstruktor?","o":["När du anropar den manuellt med obj.Konstruktor()","Automatiskt när objektet skapas","När objektet förstörs","Bara för objekt på heapen"],"a":1,"why":"<code>Device d1(1, \"A\", 23.5f);</code> anropar konstruktorn direkt. Det gör också <code>new Device(...)</code>."},{"t":"mc","q":"Varför göra <code>value</code> private och ha en <code>setValue()</code>-metod?","o":["Det gör programmet snabbare","Klassen kan kontrollera att värdet alltid är giltigt","Private-medlemmar tar mindre minne","Det krävs för att kunna använda konstruktorer"],"a":1,"why":"Det är inkapsling: all ändring går via en metod som kan validera, logga eller avvisa värden."},{"t":"mc","q":"Vad är en <em>instans</em>?","o":["En metod i en klass","Ett konkret objekt skapat från en klass eller struct","En headerfil","En privat medlem"],"a":1,"why":"<code>Device d1;</code> skapar en instans av Device. Klassen är ritningen, instansen är det som byggs."},{"t":"mc","q":"Vad betyder <code>const</code> efter metoden i <code>void print() const</code>?","o":["Metoden returnerar en konstant","Metoden ändrar inte objektets medlemmar","Metoden kan inte anropas","Metoden är private"],"a":1,"why":"Kompilatorn stoppar alla ändringar av medlemmar i metoden, och den kan anropas på konstanta objekt."},{"t":"multi","q":"Vilka hamnar på stacken? Välj alla.","o":["<code>int x = 5;</code> i en funktion","En funktions parametrar","Objektet som skapas av <code>new Device{}</code>","<code>Device d1;</code> i main"],"a":[0,1,3],"why":"<code>new</code> allokerar på heapen. Pekaren som håller adressen kan däremot ligga på stacken."},{"t":"multi","q":"Vilka åtkomstnivåer finns i C++? Välj alla.","o":["public","private","protected","internal","hidden"],"a":[0,1,2],"why":"<code>internal</code> finns i C#, inte i C++."},{"t":"text","q":"Vilken operator använder du för att nå en medlem via en pekare till ett objekt?","accept":["->"],"ph":"operator","why":"<code>ptr-&gt;medlem</code> är samma som <code>(*ptr).medlem</code>."},{"t":"text","q":"Vilket nyckelord frigör ett objekt som skapats med <code>new</code>?","accept":["delete","delete;"],"ph":"nyckelord","why":"<code>delete ptr;</code> (för arrayer: <code>delete[] ptr;</code>)."},{"t":"text","q":"Vad kallas idén att en klass döljer sin data och bara visar ett gränssnitt? Ett ord, svenska eller engelska.","accept":["inkapsling","encapsulation"],"ph":"begrepp","why":"Inkapsling (encapsulation): privat data, publika metoder."}],"date":"Tors 16/10"},{"id":"headerfiler","cat":"Objekt","min":8,"title":"Headerfiler och projektstruktur","lead":"Dela upp koden i .h- och .cpp-filer så att projektet går att läsa, återanvända och jobba i tillsammans.","src":["Torsdag 16/10 – Klasser, structs, objekt (del 4)","Startkod för klasser och structs"],"goals":["Skilja på deklarationer i headerfiler och definitioner i källfiler","Skriva include guards och förstå varför de behövs","Strukturera inlämningsuppgiften med DataManager och Measurement"],"blocks":[["h","Varför flera filer?"],["p","När programmet växer blir en enda <code>main.cpp</code> svår att hitta i. Uppdelningen följer en enkel regel:"],["list",["<strong>Headerfiler</strong> (<code>.h</code>/<code>.hpp</code>) innehåller <strong>deklarationer</strong>: vad som finns. Klassens medlemmar och funktionsprototyper.","<strong>Källfiler</strong> (<code>.cpp</code>) innehåller <strong>definitioner</strong>: hur det fungerar."]],["p","Det håller koden organiserad (en klass per filpar är standard), gör den återanvändbar, kan snabba upp kompileringen och låter flera personer jobba i olika filer samtidigt."],["h","Exempel: Sensor i tre filer"],["code","cpp","#ifndef SENSOR_H\n#define SENSOR_H\n\n#include <string>\n\nclass Sensor {\nprivate:\n    int id;\n    std::string name;\n    float value;\npublic:\n    Sensor(int i, std::string n, float v);\n    void setValue(float v);\n    void printInfo() const;\n};\n\n#endif","sensor.h"],["code","cpp","#include <iostream>\n#include \"sensor.h\"\n\nSensor::Sensor(int i, std::string n, float v)\n    : id(i), name(n), value(v) {}\n\nvoid Sensor::setValue(float v) {\n    value = v;\n}\n\nvoid Sensor::printInfo() const {\n    std::cout << \"Sensor \" << id << \" (\" << name << \"): \" << value << \"\\n\";\n}","sensor.cpp"],["code","cpp","#include \"sensor.h\"\n\nint main() {\n    Sensor s1(1, \"TempSensor\", 22.5f);\n    s1.printInfo();\n    s1.setValue(23.1f);\n    s1.printInfo();\n}","main.cpp"],["p","<code>Sensor::</code> framför metodnamnet säger att definitionen hör till klassen Sensor. Utan det tror kompilatorn att du skriver en fristående funktion."],["code","bash","g++ main.cpp sensor.cpp -o app     # alla .cpp-filer måste med\n./app","kompilera flera filer"],["note","fix","Felet <code>undefined reference to Sensor::Sensor(...)</code> betyder nästan alltid att <code>sensor.cpp</code> inte kompilerades med. I Visual Studio: kontrollera att filen ligger under Source Files i projektet."],["h","Include guards"],["p","Om samma header inkluderas två gånger (direkt eller via en annan header) blir klassen definierad två gånger, och det är ett kompileringsfel. Include guards förhindrar det:"],["code","cpp","#ifndef DEVICE_H     // om DEVICE_H inte är definierat ...\n#define DEVICE_H     // ... definiera det och ta med innehållet\n// innehåll\n#endif               // annars hoppas allt över\n\n// Modernt alternativ som alla stora kompilatorer stöder:\n#pragma once"],["p","<code>#include \"fil.h\"</code> med citattecken letar först i projektets mappar. <code>#include &lt;string&gt;</code> med vinkelparenteser används för standard- och systembibliotek."],["h","Startkod för inlämningsuppgiften"],["p","En rimlig struktur för datainsamlaren:"],["code","bash","Inlamning1/\n├── main.cpp            programstart, menyn\n├── measurement.h       structs: Measurement, Statistics\n├── data_manager.h      klassdeklaration\n└── data_manager.cpp    implementation","filstruktur"],["code","cpp","#ifndef MEASUREMENT_H\n#define MEASUREMENT_H\n#include <string>\n\nstruct Measurement {\n    std::string timestamp;   // t.ex. \"2025-10-07 10:00\"\n    float value;             // t.ex. temperatur\n};\n\nstruct Statistics {\n    float min;\n    float max;\n    float average;\n    float stddev;\n};\n\n#endif","measurement.h"],["code","cpp","#ifndef DATA_MANAGER_H\n#define DATA_MANAGER_H\n#include \"measurement.h\"\n#include <vector>\n#include <string>\n\nclass DataManager {\nprivate:\n    std::vector<Measurement> measurements;\npublic:\n    void addMeasurement(const Measurement& m);\n    bool loadFromFile(const std::string& filename);\n    bool saveToFile(const std::string& filename) const;\n    Statistics calculateStatistics() const;\n    void printMeasurements() const;\n};\n\n#endif","data_manager.h"],["code","cpp","#include \"data_manager.h\"\n#include <iostream>\n#include <fstream>\n#include <sstream>\n#include <cmath>\n\nvoid DataManager::addMeasurement(const Measurement& m) {\n    // TODO: lägg till m i measurements\n}\n\nbool DataManager::loadFromFile(const std::string& filename) {\n    // TODO: öppna filen, läs rad för rad, skapa Measurement-objekt\n    return true;\n}\n\nbool DataManager::saveToFile(const std::string& filename) const {\n    // TODO: skriv alla mätningar till filen\n    return true;\n}\n\nStatistics DataManager::calculateStatistics() const {\n    Statistics stats{};\n    // TODO: min, max, medel, standardavvikelse\n    return stats;\n}\n\nvoid DataManager::printMeasurements() const {\n    // TODO: loopa och skriv ut varje mätning\n}","data_manager.cpp – kodskelett"],["code","cpp","#include \"data_manager.h\"\n#include <iostream>\n\nint main() {\n    DataManager manager;\n    manager.loadFromFile(\"data.csv\");\n\n    Measurement m1{\"2025-10-07 09:00\", 22.5f};\n    manager.addMeasurement(m1);     // const& → ingen kopia av m1 skapas\n\n    manager.printMeasurements();\n    manager.saveToFile(\"data.csv\");\n    return 0;\n}","main.cpp"],["note","tip","I Visual Studio: högerklicka på projektet → <strong>Add → New Item…</strong> → Header File (.h) eller C++ File (.cpp). Implementera en metod i taget och testa den i <code>main</code> innan du går vidare."],["h","Övning"],["ex","Dela upp en klass","<ol><li>Dela upp din Device- eller Sensor-klass i <code>device.h</code> och <code>device.cpp</code>.</li><li>Kompilera och kör. Fungerar det fortfarande?</li><li>Reflektera: varför är det bra att skilja gränssnitt från implementation, och hur hjälper det när flera utvecklare jobbar tillsammans?</li></ol>"]],"pool":[{"t":"mc","q":"Vad hör hemma i en headerfil?","o":["Hela implementationen av alla metoder","Deklarationer: klassdefinitionen och funktionsprototyper","Bara <code>main()</code>","Testdata"],"a":1,"why":"Headern beskriver <em>vad</em> som finns. <code>.cpp</code>-filen beskriver <em>hur</em> det fungerar."},{"t":"mc","q":"Vad skyddar include guards mot?","o":["Att headern ändras av misstag","Att samma header tas med flera gånger, vilket ger omdefinitionsfel","Att andra kan läsa koden","Minnesläckor"],"a":1,"why":"<code>#ifndef/#define/#endif</code> (eller <code>#pragma once</code>) gör att innehållet bara tas med första gången."},{"t":"mc","q":"Vad betyder <code>void Sensor::setValue(float v)</code> i sensor.cpp?","o":["Det anropar setValue","Det är definitionen av metoden setValue som tillhör klassen Sensor","Det skapar ett nytt Sensor-objekt","Det är en deklaration"],"a":1,"why":"<code>::</code> är scope-operatorn. <code>Sensor::setValue</code> betyder \"setValue i klassen Sensor\"."},{"t":"mc","q":"Vad är skillnaden mellan <code>#include \"sensor.h\"</code> och <code>#include &lt;string&gt;</code>?","o":["Ingen skillnad","Citattecken letar först i projektet, vinkelparenteser i standard- och systembibliotek","Vinkelparenteser är bara för C","Citattecken kräver include guards"],"a":1,"why":"Egna headers inkluderas med citattecken, standardbiblioteket med vinkelparenteser."},{"t":"mc","q":"Du kör <code>g++ main.cpp -o app</code> och får \"undefined reference to Sensor::Sensor\". Varför?","o":["sensor.h saknar include guards","sensor.cpp kompilerades inte med, så länkaren hittar inte definitionen","Konstruktorn måste vara private","main.cpp måste inkludera sensor.cpp"],"a":1,"why":"Headern räcker för att kompilera <code>main.cpp</code>, men länkaren behöver definitionerna. Kör <code>g++ main.cpp sensor.cpp -o app</code>."},{"t":"mc","q":"Vilken fil ska normalt <em>inte</em> inkluderas med #include?","o":["<code>sensor.h</code>","<code>sensor.cpp</code>","<code>&lt;iostream&gt;</code>","<code>measurement.h</code>"],"a":1,"why":".cpp-filer kompileras separat. Inkluderar du dem blir definitionerna dubbla vid länkningen."},{"t":"mc","q":"Var placeras <code>#endif</code> i en include guard?","o":["Först i filen","Sist i filen","Direkt efter #define","I .cpp-filen"],"a":1,"why":"<code>#ifndef</code> och <code>#define</code> överst, <code>#endif</code> sist, så att hela innehållet skyddas."},{"t":"multi","q":"Vad hör hemma i data_manager.cpp? Välj alla.","o":["Implementationen av DataManager::addMeasurement","<code>#include \"data_manager.h\"</code>","Include guards","Implementationen av calculateStatistics"],"a":[0,1,3],"why":"Include guards behövs bara i headerfiler."},{"t":"text","q":"Skriv det moderna direktivet som ersätter include guards med en enda rad.","accept":["#pragma once","#pragmaonce"],"ph":"#...","why":"<code>#pragma once</code> stöds av alla stora kompilatorer."},{"t":"text","q":"Vad heter operatorn <code>::</code> i <code>Sensor::setValue</code>? Skriv namnet på svenska eller engelska.","accept":["scope-operatorn","scopeoperatorn","scope","scope resolution operator","scope resolution","räckviddsoperatorn"],"ph":"namn","why":"Scope-operatorn (scope resolution operator)."},{"t":"text","q":"Skriv kommandot som kompilerar <code>main.cpp</code> och <code>sensor.cpp</code> till programmet <code>app</code> med g++.","accept":["g++ main.cpp sensor.cpp -o app","g++ sensor.cpp main.cpp -o app","g++ -o app main.cpp sensor.cpp","g++ -o app sensor.cpp main.cpp"],"ph":"g++ ...","why":"<code>g++ main.cpp sensor.cpp -o app</code>. Alla .cpp-filer måste med."}],"date":"Tors 16/10"},{"id":"filhantering","cat":"Data","min":9,"title":"Filhantering","lead":"Spara sensordata till fil och läs in den igen, rad för rad, till structs i en vector.","src":["Filhantering i C och C++","Tisdag 21/10 – Felhantering, debugging, nästa steg (avsnitt 3)"],"goals":["Öppna, läsa, skriva och stänga filer i C och i C++","Kontrollera att filen faktiskt gick att öppna","Läsa en CSV-fil till en vector av structs"],"blocks":[["h","Tre steg"],["p","Filhantering (file I/O) följer samma mönster i båda språken: <strong>öppna</strong> filen, <strong>läs eller skriv</strong>, <strong>stäng</strong>. I IoT-program är det så sensordata loggas och analyseras i efterhand."],["h","Filer i C"],["p","Funktionerna finns i <code>&lt;stdio.h&gt;</code>. <code>fopen</code> returnerar en <code>FILE*</code>, eller <code>NULL</code> om filen inte gick att öppna."],["table",["Läge","Betyder"],[["<code>\"r\"</code>","läs, filen måste finnas"],["<code>\"w\"</code>","skriv, skapar filen eller tömmer den om den finns"],["<code>\"a\"</code>","lägg till sist (append), skapar filen om den saknas"]]],["code","c","#include <stdio.h>\n\nint main(void) {\n    FILE* file = fopen(\"data.txt\", \"w\");\n    if (file == NULL) {\n        perror(\"Kunde inte öppna filen\");\n        return 1;\n    }\n    fprintf(file, \"Temperature: %.2f\\n\", 23.5);\n    fclose(file);\n\n    file = fopen(\"data.txt\", \"r\");\n    if (file == NULL) return 1;\n    char line[128];\n    while (fgets(line, sizeof(line), file) != NULL) {\n        printf(\"%s\", line);\n    }\n    fclose(file);\n    return 0;\n}","skriv och läs i C"],["h","Filer i C++"],["p","I C++ använder du <code>&lt;fstream&gt;</code>: <code>std::ofstream</code> för att skriva och <code>std::ifstream</code> för att läsa. Strömmarna fungerar som <code>cout</code> och <code>cin</code>, och filen stängs automatiskt när objektet går ur scope."],["code","cpp","#include <fstream>\n#include <iostream>\n#include <string>\n\nint main() {\n    std::ofstream out(\"data.txt\");                 // std::ios::app för att lägga till\n    if (!out) {\n        std::cerr << \"Kunde inte öppna filen!\\n\";\n        return 1;\n    }\n    out << \"Temperature: \" << 23.5 << \"\\n\";\n    out.close();\n\n    std::ifstream in(\"data.txt\");\n    if (!in.is_open()) return 1;\n    std::string line;\n    while (std::getline(in, line)) {\n        std::cout << line << \"\\n\";\n    }\n}","skriv och läs i C++"],["code","cpp","std::ofstream log(\"sensor_log.txt\", std::ios::app);   // skriv inte över, lägg till\nlog << \"2025-10-07 10:01,22.8\\n\";","append"],["h","Från textfil till datastruktur"],["p","Mätdata sparas ofta som CSV, en mätning per rad:"],["code","bash","2025-10-07,22.5\n2025-10-07,22.7\n2025-10-07,22.8","sensor_data.csv"],["p","Varje rad blir en <code>Measurement</code> i en vector. <code>std::stringstream</code> låter dig läsa från en sträng som om den vore en fil."],["code","cpp","#include <fstream>\n#include <sstream>\n#include <vector>\n#include <string>\n\nstruct Measurement {\n    std::string timestamp;\n    float value;\n};\n\n// const std::string&           → läser bara filnamnet\n// std::vector<Measurement>&    → listan som ska fyllas på\nbool loadData(const std::string& filename, std::vector<Measurement>& data) {\n    std::ifstream file(filename);\n    if (!file.is_open()) {\n        std::cerr << \"Fel: kunde inte öppna \" << filename << \"\\n\";\n        return false;\n    }\n    std::string line;\n    while (std::getline(file, line)) {\n        std::stringstream ss(line);\n        Measurement m;\n        std::getline(ss, m.timestamp, ',');   // läs fram till kommatecknet\n        if (ss >> m.value) {                   // hoppa över trasiga rader\n            data.push_back(m);\n        }\n    }\n    return true;\n}\n\nvoid printData(const std::vector<Measurement>& data) {\n    for (const auto& m : data)\n        std::cout << m.timestamp << \" -> \" << m.value << \" °C\\n\";\n}\n\nint main() {\n    std::vector<Measurement> data;\n    if (!loadData(\"sensor_data.csv\", data)) return 1;\n    printData(data);\n}","CSV → vector<Measurement>"],["table",["Kod","Typ","Syfte"],[["<code>const string&amp; filename</code>","konstant referens","ingen kopia, kan inte ändras"],["<code>vector&lt;Measurement&gt;&amp; data</code>","referens","funktionen fyller på listan"],["<code>const vector&lt;Measurement&gt;&amp; data</code>","konstant referens","skickas till utskrift, ska inte ändras"],["<code>const auto&amp; m</code>","konstant referens i loop","ingen kopia av varje Measurement"]]],["h","Övningar"],["ex","Sensorloggning","<ol><li>Fråga användaren efter 5 temperaturer.</li><li>Spara dem i <code>temperatures.txt</code>, ett värde per rad.</li><li>Läs tillbaka filen och skriv ut medelvärdet.</li></ol><p>Extra: spara en tidsstämpel med varje värde, och använd <code>std::vector</code>.</p>","#include <fstream>\n#include <iostream>\n\nint main() {\n    {\n        std::ofstream out(\"temperatures.txt\");\n        if (!out) { std::cerr << \"Kan inte skriva\\n\"; return 1; }\n        for (int i = 0; i < 5; i++) {\n            float t;\n            std::cout << \"Temperatur \" << i + 1 << \": \";\n            std::cin >> t;\n            out << t << \"\\n\";\n        }\n    }   // out stängs här\n\n    std::ifstream in(\"temperatures.txt\");\n    if (!in) { std::cerr << \"Kan inte läsa\\n\"; return 1; }\n    float t, sum = 0;\n    int n = 0;\n    while (in >> t) { sum += t; n++; }\n    if (n > 0) std::cout << \"Medel: \" << sum / n << \"\\n\";\n}","cpp"],["ex","Räkna rader och medelvärde","<p>Skapa <code>tempdata.csv</code> med några rader. Ändra <code>loadData()</code> så att den räknar hur många rader som lästs, och skriv <code>float calcAverage(const vector&lt;Measurement&gt;&amp; data)</code>.</p>"]],"pool":[{"t":"mc","q":"Vilket läge i <code>fopen</code> lägger till text sist utan att radera det som finns?","o":["<code>\"r\"</code>","<code>\"w\"</code>","<code>\"a\"</code>","<code>\"x\"</code>"],"a":2,"why":"<code>\"a\"</code> står för append. <code>\"w\"</code> tömmer filen först."},{"t":"mc","q":"Vad returnerar <code>fopen</code> om filen inte kan öppnas?","o":["-1","0.0","<code>NULL</code>","Ett tomt FILE-objekt"],"a":2,"why":"Kontrollera alltid <code>if (file == NULL)</code> innan du läser. <code>perror</code> skriver ut orsaken."},{"t":"mc","q":"Vilken klass använder du för att läsa från en fil i C++?","o":["<code>std::ofstream</code>","<code>std::ifstream</code>","<code>std::cin</code>","<code>FILE*</code>"],"a":1,"why":"<code>i</code> = input (läsa), <code>o</code> = output (skriva)."},{"t":"mc","q":"I <code>std::getline(ss, m.timestamp, ',')</code> – vad gör <code>','</code>?","o":["Lägger till ett kommatecken","Läser fram till kommatecknet, som fungerar som avgränsare","Hoppar över första kommatecknet","Byter kommatecken mot punkt"],"a":1,"why":"Det tredje argumentet är avgränsaren. Utan det läser <code>getline</code> fram till radslut."},{"t":"mc","q":"Varför tar <code>loadData</code> parametern <code>std::vector&lt;Measurement&gt;&amp; data</code> utan <code>const</code>?","o":["Det är ett misstag","Funktionen ska fylla på listan, så den måste få ändra den","const fungerar inte med vector","För att undvika en kopia av filnamnet"],"a":1,"why":"Referensen låter funktionen ändra anroparens vektor. <code>const</code> skulle förbjuda <code>push_back</code>."},{"t":"mc","q":"Vad händer med innehållet i en befintlig fil som öppnas med <code>std::ofstream out(\"data.txt\");</code>?","o":["Det behålls och nytt läggs till sist","Filen töms","Det går inte att öppna filen","Innehållet läses in"],"a":1,"why":"Standardläget skriver över. Använd <code>std::ios::app</code> för att lägga till."},{"t":"mc","q":"Vilken loop läser en fil rad för rad i C++?","o":["<code>while (std::getline(in, line))</code>","<code>for (line : in)</code>","<code>while (!in.eof()) in &gt;&gt; line;</code>","<code>do { getline(line); } while (in);</code>"],"a":0,"why":"getline returnerar strömmen, som blir falsk när inget mer kan läsas. Att testa <code>eof()</code> först ger ofta ett extra varv."},{"t":"multi","q":"Vilka sätt kontrollerar att <code>std::ifstream in(\"x.txt\")</code> lyckades? Välj alla.","o":["<code>if (!in)</code>","<code>if (!in.is_open())</code>","<code>if (in == NULL)</code>","<code>if (in.fail())</code>"],"a":[0,1,3],"why":"En ifstream är ett objekt, inte en pekare, så den jämförs inte med NULL."},{"t":"text","q":"Vilken C-funktion stänger en fil som öppnats med <code>fopen</code>?","accept":["fclose","fclose()"],"ph":"funktion","why":"<code>fclose(file);</code>"},{"t":"text","q":"Vilken flagga skickar du till ofstream för att lägga till i slutet av filen?","accept":["std::ios::app","ios::app","app","ios_base::app","std::ios_base::app"],"ph":"std::ios::...","why":"<code>std::ofstream log(\"log.txt\", std::ios::app);</code>"},{"t":"text","q":"Vilken klass i <code>&lt;sstream&gt;</code> låter dig läsa från en sträng som om den vore en fil?","accept":["stringstream","std::stringstream","istringstream","std::istringstream"],"ph":"klass","why":"<code>std::stringstream ss(line);</code>"}],"date":"Tis 21/10"},{"id":"felhantering","cat":"Robusthet","min":12,"title":"Felhantering och debugging","lead":"Fånga fel innan de blir krascher, hitta buggar med debuggern och se hur samma idéer fungerar på en mikrokontroller.","src":["Tisdag 21/10 – Felhantering, debugging, nästa steg","Övningar: felhantering, debugging, filhantering"],"goals":["Skilja på syntaxfel, körningsfel och logiska fel","Hantera fel med returvärden i C och exceptions i C++","Felsöka med utskrifter, breakpoints och assert","Förklara hur felhantering skiljer sig i inbyggda system"],"blocks":[["h","Tre sorters fel"],["table",["Typ","Exempel","Upptäcks av"],[["Syntaxfel","saknat semikolon","kompilatorn"],["Körningsfel (runtime)","division med noll, null-pekare","programmet, under körning"],["Logiskt fel","fel formel, fel loopvillkor","dig, när du testar"]]],["h","Felhantering i C"],["p","C har inga exceptions. Fel signaleras med <strong>returvärden</strong> (ofta <code>NULL</code>, <code>-1</code> eller 0) och ibland med den globala variabeln <code>errno</code>. Du måste själv kontrollera varje anrop som kan misslyckas."],["code","c","FILE* file = fopen(\"data.txt\", \"r\");\nif (file == NULL) {\n    perror(\"Kunde inte öppna filen\");   // skriver ut orsaken från errno\n    return 1;\n}"],["h","Exceptions i C++"],["p","I C++ kan en funktion <strong>kasta</strong> (throw) ett undantag när något går fel. Den som anropar <strong>fångar</strong> det med <code>try</code>/<code>catch</code>. Om ingen fångar det avslutas programmet."],["code","cpp","#include <stdexcept>\n#include <fstream>\n\nvoid readFile(const std::string& filename) {\n    std::ifstream file(filename);\n    if (!file.is_open()) {\n        throw std::runtime_error(\"Kunde inte öppna filen: \" + filename);\n    }\n    std::cout << \"Filen öppnades.\\n\";\n}\n\nfloat divide(float a, float b) {\n    if (b == 0) throw std::invalid_argument(\"Division med noll\");\n    return a / b;\n}\n\nint main() {\n    try {\n        readFile(\"data.txt\");\n        std::cout << divide(10, 0) << \"\\n\";\n    } catch (const std::exception& e) {\n        std::cerr << \"Fel: \" << e.what() << \"\\n\";\n    }\n}"],["h","Robust inmatning"],["p","Om användaren skriver \"hej\" när programmet väntar på ett tal hamnar <code>std::cin</code> i ett felläge, och alla följande inläsningar misslyckas. Återställ felflaggan och släng den felaktiga raden:"],["code","cpp","#include <limits>\n\nint readNumber() {\n    int n;\n    while (true) {\n        std::cout << \"Ange ett tal: \";\n        if (std::cin >> n) return n;\n        std::cout << \"Fel: ogiltig inmatning! Försök igen.\\n\";\n        std::cin.clear();                                                    // återställ felflaggan\n        std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');  // släng resten av raden\n    }\n}","readNumber() som aldrig kraschar"],["h","Statuskoder: felhantering för inbyggda system"],["p","På mikrokontroller är exceptions ofta avstängda, eftersom de kostar kodstorlek och har svårförutsägbar körtid. Istället returnerar funktioner en statuskod, och resultatet skickas ut via en referens."],["code","cpp","enum StatusCode { OK, SENSOR_ERROR, FILE_ERROR };\n\nStatusCode readSensor(float& val) {\n    int raw = std::rand() % 10;\n    if (raw == 0) return SENSOR_ERROR;      // simulerat fel\n    val = 20.0f + raw;\n    return OK;\n}\n\nint main() {\n    float v;\n    for (int attempt = 1; attempt <= 3; attempt++) {      // enkel retry\n        if (readSensor(v) == OK) {\n            std::cout << \"Värde: \" << v << \"\\n\";\n            return 0;\n        }\n        std::cout << \"Sensorfel, försök \" << attempt << \"\\n\";\n    }\n    return 1;\n}"], först.</li></ol>","float average(const int arr[], int n) {\n    if (n <= 0) return 0.0f;              // skydda mot division med noll\n    int sum = 0;\n    for (int i = 0; i < n; i++)\n        sum += arr[i];\n    return static_cast<float>(sum) / n;\n}","cpp"],["h","Nästa steg: inbyggda system"],["table",["","PC-program","Inbyggt system"],[["Miljö","operativsystem","inget eller minimalt OS"],["Minne","dynamisk allokering går bra","ofta statiskt, strikt kontrollerat"],["Felhantering","exceptions möjliga","oftast returkoder"],["Debugging","IDE, breakpoints","seriell port, LED-signaler, JTAG"]]],["list",["Fördjupa dig i pekare, arrayer och minneslayout.","Lär dig CMake eller Makefile.","Börja med Arduino, ESP32 eller STM32.","Läs om bitmanipulation och registerhantering.","Lär dig grunderna i UART, I2C och SPI.","Öva realtidstänkande: loopar, timers och interrupts."]],["h","Övningar"],["ex","Hitta syntaxfelen","<p>Programmet nedan kompilerar inte. Fixa det, kör det och förklara vad som händer.</p>","#include <iostream>\nusing namespace std;          // semikolon saknades\n\nint main() {\n    int a = 10;               // semikolon saknades\n    int b = 0;\n    cout << \"Result: \" << a / b << endl;   // kompilerar, men heltalsdivision med 0\n}                                          // är odefinierat beteende och kraschar oftast","cpp"],["ex","Loggning med felhantering","<p>Läs temperatur, tryck och fuktighet från användaren och skriv varje post till <code>sensor_log.txt</code> med <code>std::ios::app</code>. Om filen inte kan öppnas: kasta ett undantag och fånga det i <code>main</code>. Utmaning: lägg till en tidsstämpel med <code>std::time_t</code>.</p>"],["ex","SensorAnalyzer","<p>Läs <code>data.csv</code> (datum,värde) till en <code>vector&lt;float&gt;</code>. Hoppa över felaktiga rader och räkna dem. Skriv ut medel, max, min och antal giltiga rader, och spara resultatet i <code>summary.txt</code>. Om filen saknas: skapa en ny med exempeldata.</p>"],["ex","Debugga calcAverage","<p>Programmet kraschar ibland. Förklara varför och rätta det.</p><pre style=\"background:var(--code-bg);border-radius:8px\"><code>float calcAverage(vector&lt;float&gt; values) {\n    float sum;\n    for (int i = 0; i &lt;= values.size(); i++)\n        sum += values[i];\n    return sum / values.size();\n}</code></pre>","float calcAverage(const std::vector<float>& values) {  // const& istället för kopia\n    if (values.empty()) return 0.0f;                     // tom fil → ingen division med 0\n    float sum = 0.0f;                                    // initierad\n    for (size_t i = 0; i < values.size(); i++)           // < istället för <=\n        sum += values[i];\n    return sum / values.size();\n}","cpp"]],"pool":[{"t":"mc","q":"En beräkning ger fel svar men programmet kraschar inte. Vilken typ av fel är det?","o":["Syntaxfel","Körningsfel","Logiskt fel","Länkningsfel"],"a":2,"why":"Programmet gör exakt vad koden säger, men koden säger fel sak. Sådana fel hittar du bara genom att testa."},{"t":"mc","q":"Vilken tangent går in i en funktion när du stegar i Visual Studio?","o":["<kbd>F5</kbd>","<kbd>F10</kbd>","<kbd>F11</kbd>","<kbd>Shift</kbd>+<kbd>F5</kbd>"],"a":2,"why":"F11 = step into, F10 = step over (kör hela funktionsanropet som en rad), F5 = fortsätt."},{"t":"mc","q":"Vad är fel med <code>int sum; for (...) sum += arr[i];</code>?","o":["sum borde vara float","sum är inte initierad och startar med ett okänt värde","+= fungerar inte i loopar","Inget"],"a":1,"why":"Lokala variabler får inget automatiskt startvärde. Skriv <code>int sum = 0;</code>."},{"t":"mc","q":"Varför används ofta statuskoder istället för exceptions i inbyggda system?","o":["Exceptions finns inte i C++","Exceptions kostar kodstorlek och körtid, och är ofta avstängda på mikrokontroller","Statuskoder hittar fler buggar","Exceptions fungerar bara med filer"],"a":1,"why":"Returkoder är förutsägbara och billiga, och fungerar även i ren C."},{"t":"mc","q":"Vad gör <code>std::cin.clear()</code> efter en misslyckad inläsning?","o":["Tömmer konsolen","Återställer felflaggan så att cin kan läsa igen","Slänger resten av raden","Avslutar programmet"],"a":1,"why":"<code>clear()</code> nollställer felläget. Den felaktiga texten ligger kvar i bufferten, så du behöver också <code>ignore()</code>."},{"t":"mc","q":"Ett saknat semikolon är vilken typ av fel?","o":["Logiskt fel","Körningsfel","Syntaxfel","Länkningsfel"],"a":2,"why":"Kompilatorn hittar det innan programmet ens körs."},{"t":"mc","q":"Vilket block körs om ett undantag kastas inuti <code>try</code>?","o":["Det första matchande catch-blocket","Alla catch-block","Inget, programmet avslutas alltid","finally"],"a":0,"why":"Körningen hoppar till första <code>catch</code> vars typ matchar. C++ har inget finally."},{"t":"multi","q":"Vilka är rimliga sätt att felsöka? Välj alla.","o":["Breakpoints och stegning","Utskrifter av mellanresultat","<code>assert()</code> för antaganden","Ta bort felkontroller tills det fungerar"],"a":[0,1,2],"why":"Felkontroller hjälper dig hitta fel. De är inte orsaken till dem."},{"t":"text","q":"Vilken metod på ett undantag ger felmeddelandet som text?","accept":["what","what()","e.what()",".what()"],"ph":"metod","why":"<code>e.what()</code>"},{"t":"text","q":"Vilken tangent i Visual Studio kör nästa rad utan att gå in i funktioner (step over)?","accept":["f10"],"ph":"tangent","why":"F10 = step over, F11 = step into."},{"t":"text","q":"Vilken C-funktion skriver ut ett felmeddelande följt av orsaken från <code>errno</code>?","accept":["perror","perror()"],"ph":"funktion","why":"<code>perror(\"Kunde inte öppna filen\");</code>"},{"t":"code","q":"Funktionen <code>average</code> har tre buggar (oinitierad summa, off-by-one och heltalsdivision). Rätta den. Om n är 0 ska den returnera 0.","why":"<code>sum = 0</code>, <code>i &lt; n</code> och en konvertering till float före divisionen.","task":"10-felhantering-1","tests":[{"in":"5\n2 4 6 8 10\n","out":"6\n"},{"in":"2\n1 2\n","out":"1.5\n"},{"in":"0\n","out":"0\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nfloat average(int arr[], int n) {\n    int sum;\n    for (int i = 0; i <= n; i++)\n        sum += arr[i];\n    return sum / n;\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    int a[100];\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n    printf(\"%g\\n\", average(a, n));\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nfloat average(int arr[], int n) {\n    if (n <= 0) return 0;\n    int sum = 0;\n    for (int i = 0; i < n; i++)\n        sum += arr[i];\n    return (float)sum / n;\n}\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    int a[100];\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n    printf(\"%g\\n\", average(a, n));\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nfloat average(int arr[], int n) {\n    int sum;\n    for (int i = 0; i <= n; i++)\n        sum += arr[i];\n    return sum / n;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    int a[100];\n    for (int i = 0; i < n; i++) cin >> a[i];\n    cout << average(a, n) << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nfloat average(int arr[], int n) {\n    if (n <= 0) return 0;\n    int sum = 0;\n    for (int i = 0; i < n; i++)\n        sum += arr[i];\n    return (float)sum / n;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    int a[100];\n    for (int i = 0; i < n; i++) cin >> a[i];\n    cout << average(a, n) << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\ndef average(values):\n    total = 0\n    for i in range(len(values) + 1):\n        total += values[i]\n    return total // len(values)\n\n\ndata = sys.stdin.read().split()\nn = int(data[0])\nprint(f\"{average([int(x) for x in data[1:1 + n]]):g}\")\n","sol":"import sys\n\n\ndef average(values):\n    if not values:                    # tom lista → ingen division med noll\n        return 0\n    total = 0\n    for i in range(len(values)):      # range(len) räcker, +1 går utanför\n        total += values[i]\n    return total / len(values)        # / ger decimaltal, // kapar\n\n\ndata = sys.stdin.read().split()\nn = int(data[0])\nprint(f\"{average([int(x) for x in data[1:1 + n]]):g}\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false},{"t":"code","q":"Statuskoder: skriv <code>int readSensor(int raw, float* val)</code>. Giltiga råvärden är 0–1023. Vid fel: returnera -1 och rör inte val. Annars: sätt <code>*val = raw * 100.0 / 1023</code> och returnera 0. main skriver ut <code>OK</code> eller <code>SENSOR_ERROR</code>.","why":"Felet signaleras via returvärdet och resultatet via pekaren, precis som i många inbyggda bibliotek.","task":"10-felhantering-2","tests":[{"in":"512\n","out":"OK\n"},{"in":"2000\n","out":"SENSOR_ERROR\n"},{"in":"-1\n","out":"SENSOR_ERROR\n"},{"in":"1023\n","out":"OK\n"}],"code":{"c":{"starter":"#include <stdio.h>\n\nint readSensor(int raw, float* val) {\n\n}\n\nint main(void) {\n    int raw;\n    scanf(\"%d\", &raw);\n    float v = 0;\n    if (readSensor(raw, &v) == 0) printf(\"OK\\n\");\n    else printf(\"SENSOR_ERROR\\n\");\n    return 0;\n}\n","sol":"#include <stdio.h>\n\nint readSensor(int raw, float* val) {\n    if (raw < 0 || raw > 1023) return -1;\n    *val = raw * 100.0f / 1023;\n    return 0;\n}\n\nint main(void) {\n    int raw;\n    scanf(\"%d\", &raw);\n    float v = 0;\n    if (readSensor(raw, &v) == 0) printf(\"OK\\n\");\n    else printf(\"SENSOR_ERROR\\n\");\n    return 0;\n}\n"},"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nint readSensor(int raw, float* val) {\n\n}\n\nint main() {\n    int raw;\n    cin >> raw;\n    float v = 0;\n    if (readSensor(raw, &v) == 0) cout << \"OK\" << endl;\n    else cout << \"SENSOR_ERROR\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nint readSensor(int raw, float* val) {\n    if (raw < 0 || raw > 1023) return -1;\n    *val = raw * 100.0 / 1023;\n    return 0;\n}\n\nint main() {\n    int raw;\n    cin >> raw;\n    float v = 0;\n    if (readSensor(raw, &v) == 0) cout << \"OK\" << endl;\n    else cout << \"SENSOR_ERROR\" << endl;\n    return 0;\n}\n"},"py":{"starter":"class SensorError(Exception):\n    pass\n\n\ndef read_sensor(raw):\n    # kasta SensorError om raw ligger utanför 0–1023, annars returnera procent\n    pass\n\n\nraw = int(input())\ntry:\n    read_sensor(raw)\n    print(\"OK\")\nexcept SensorError:\n    print(\"SENSOR_ERROR\")\n","sol":"class SensorError(Exception):\n    pass\n\n\ndef read_sensor(raw):\n    if raw < 0 or raw > 1023:\n        raise SensorError(f\"ogiltigt råvärde: {raw}\")\n    return raw * 100.0 / 1023\n\n\nraw = int(input())\ntry:\n    read_sensor(raw)\n    print(\"OK\")\nexcept SensorError:\n    print(\"SENSOR_ERROR\")\n"}},"langs":["c","cpp","py"],"web":["cpp","py"],"gpp":false}],"date":"Tis 21/10"},{"id":"git","cat":"Samarbete","min":8,"title":"Git, GitHub och kodgranskning","lead":"Versionshantera din kod, jobba i branches och granska varandras pull requests.","src":["Kom igång med Git och GitHub i Visual Studio","Guide till kodgranskning och Git-flöde"],"goals":["Skapa ett repo, klona det och följa arbetsflödet pull, commit, push","Skriva tydliga commit-meddelanden","Arbeta i branches och skapa pull requests","Ge konstruktiv feedback i en kodgranskning"],"blocks":[["h","Git och GitHub"],["p","<strong>Git</strong> är ett versionshanteringssystem som sparar en historik över ändringarna i din kod. <strong>GitHub</strong> är en molntjänst där du lagrar dina Git-repon online. Tillsammans ger de dig historik, en trygg backup och möjlighet att samarbeta utan att skriva över varandras arbete."],["h","Kom igång"],["list",["På github.com: klicka <strong>New</strong>, döp repot (t.ex. <code>inlamning1</code>), välj Public eller Private, kryssa i <strong>Add a README file</strong> och klicka <strong>Create repository</strong>.","I Visual Studio: startfönstret → <strong>Clone a repository</strong>, klistra in repo nskning"],["p","En kodgranskning betyder att någon läser och utvärderar koden innan den slås ihop. Målet är bättre kod tillsammans, inte att hitta någon att skylla på."],["table",["Område","Fråga dig"],[["Funktionalitet","Gör koden det den ska? Testas olika indata och fel?"],["Struktur","Är koden uppdelad i små, begripliga funktioner? Finns onödig upprepning?"],["Läsbarhet","Är namnen tydliga? Följer koden samma stil som resten av projektet?"],["Effektivitet","Görs onödigt arbete i loopar? Används rätt datatyper och strukturer?"]]],["h","Så granskar du en PR"],["list",["Läs titeln och beskrivningen: vad försöker ändringen lösa?","Läs igenom hela flödet innan du kommenterar detaljer.","Gå igenom varje funktion: vad tar den in, vad returnerar den?","Leta efter out-of-bounds, null-pekare, fel typ och obehandlade fel.","Kommentera direkt i koden. Var konkret och föreslå en förbättring.","När du är nöjd: <strong>Approve</strong> och merge."]],["note","tip","Bra feedback är konkret och vänlig: \"Kan den här funktionen delas upp i två? Den både läser filen och räknar statistik.\" Fråga dig själv: kan någon annan förstå den här koden nästa månad?"]],"pool":[{"t":"mc","q":"Vad gör en commit?","o":["Laddar upp koden till GitHub","Sparar en version lokalt, med ett meddelande","Hämtar andras ändringar","Skapar en ny branch"],"a":1,"why":"Commit sparar lokalt. Push är det som laddar upp till GitHub."},{"t":"mc","q":"Vad bör du göra innan push för att undvika konflikter?","o":["Fetch","Pull","Ta bort branchen","Skapa en ny commit"],"a":1,"why":"Pull hämtar och slår ihop det andra har pushat, så att du löser eventuella konflikter lokalt."},{"t":"mc","q":"Vilket kommando skapar en ny branch och byter till den?","o":["<code>git branch -d feature-temp</code>","<code>git checkout -b feature-temp</code>","<code>git push feature-temp</code>","<code>git commit -b feature-temp</code>"],"a":1,"why":"<code>-b</code> skapar branchen. I nyare Git finns också <code>git switch -c feature-temp</code>."},{"t":"mc","q":"Vad är en pull request?","o":["Ett sätt att hämta kod från GitHub","En begäran om att slå ihop en branch med main, efter granskning","En automatisk backup","Ett felmeddelande från GitHub"],"a":1,"why":"En PR samlar ändringarna i en branch så att andra kan granska och kommentera innan merge."},{"t":"mc","q":"Vilken feedback är mest konstruktiv?","o":["Det här är dålig kod.","Kan funktionen delas upp i två? Den både läser filen och räknar statistik.","Skriv om allt.","LGTM"],"a":1,"why":"Konkret, förklarar varför och föreslår en förbättring. Det är målet med en kodgranskning."},{"t":"mc","q":"Vad är skillnaden mellan fetch och pull?","o":["Ingen","Fetch kollar efter ändringar utan att slå ihop dem, pull hämtar och slår ihop","Pull laddar upp, fetch laddar ner","Fetch tar bort lokala ändringar"],"a":1,"why":"Fetch uppdaterar bara din bild av GitHub. Pull = fetch + merge."},{"t":"mc","q":"Vilket commit-meddelande följer riktlinjerna bäst?","o":["fix","Ändringar","Lägg till medelvärdesberäkning","Jag har nu lagt till en funktion som räknar ut medelvärdet av alla mätvärden i listan"],"a":2,"why":"Kort, under 50 tecken, börjar med ett verb och säger vad som ändrats."},{"t":"multi","q":"Vad bör du titta på i en kodgranskning? Välj alla.","o":["Fungerar koden och hanteras fel?","Är namnen tydliga?","Finns onödig upprepning?","Vem som skrev koden"],"a":[0,1,2],"why":"Granskningen handlar om koden, inte om personen."},{"t":"text","q":"Skriv kommandot som skickar dina commits till GitHub.","accept":["git push","git push origin","git push origin main"],"ph":"git ...","why":"<code>git push</code>"},{"t":"text","q":"Skriv kommandot som skapar och byter till branchen <code>feature-temp</code>.","accept":["git checkout -b feature-temp","git switch -c feature-temp"],"ph":"git ...","why":"<code>git checkout -b feature-temp</code> eller <code>git switch -c feature-temp</code>."},{"t":"text","q":"Skriv kommandot som sparar en commit med meddelandet <code>Fixa off-by-one</code>.","accept":["git commit -m \"Fixa off-by-one\"","git commit -m 'Fixa off-by-one'"],"ph":"git commit ...","why":"<code>git commit -m \"Fixa off-by-one\"</code>"},{"t":"text","q":"Vilket kommando markerar <code>main.cpp</code> för nästa commit (stage)?","accept":["git add main.cpp"],"ph":"git ...","why":"<code>git add main.cpp</code> (eller <code>git add .</code> för alla ändrade filer)."}]}],"timeline":[{"d":"Vecka 39","t":"Introduktion, variabler och villkor","topics":["kom-igang","villkor"]},{"d":"Tors 2/10","t":"Loopar och iteration · Inlämning 1 presenteras","topics":["loopar"]},{"d":"Tis 6/10","t":"Funktioner, pekare och referenser","topics":["funktioner"]},{"d":"Fre 10/10","t":"Arrayer, pekare, vektorer och maps","topics":["arrayer-pekare","c-strangar"]},{"d":"Tors 16/10","t":"Klasser, structs och objekt · gruppuppgift","topics":["klasser","headerfiler","git"]},{"d":"Tis 21/10","t":"Felhantering, debugging och nästa steg","topics":["filhantering","felhantering"]}],"assignments":[{"id":"inl1","kind":"Inlämningsuppgift 1","title":"Datainsamlare och analysverktyg för mätvärden","intro":"I ett IoT-system samlar vi in mätvärden från sensorer (temperatur, luftfuktighet, tryck). Utveckla ett C/C++-program som hanterar en lista av mätvärden. Koden ska ligga i ett GitHub-repo och arbetet dokumenteras i repots README.","groups":[{"h":"1. Datainmatning","items":["Användaren kan ange mätvärden manuellt","Ogiltig input hanteras robust","Utmaning: tillåt både hel- och decimaltal"]},{"h":"2. Databehandling","items":["Antal värden","Summa","Medelvärde","Min- och maxvärde","Varians och standardavvikelse"]},{"h":"3. Menygränssnitt","items":["Lägg till nya mätvärden","Visa statistiken","Sök efter ett visst värde","Sortera listan (valfritt stigande/fallande)","Avsluta programmet"]},{"h":"4. Struktur och kvalitet","items":["Uppdelat i flera funktioner eller metoder","Väl kommenterad och dokumenterad kod","Fel hanteras, t.ex. tom lista vid analys"]},{"h":"5. Extra utm uest och låt en gruppkamrat granska","Merga till main när allt fungerar"]},{"h":"Avslutning","items":["Kör hela programmet tillsammans","Diskutera hur samarbetet gick","Reflektera kort över vad ni lärt er"]}],"topics":["klasser","git"]},{"id":"labb","kind":"Labb","title":"Miniräknare med meny","intro":"Bygg en miniräknare där menyn upprepas tills användaren väljer Avsluta.","groups":[{"h":"Grund","items":["1. Addera två tal","2. Subtrahera två tal","3. Multiplicera två tal","4. Dividera två tal (hantera division med noll)","5. Avsluta"]},{"h":"Extra","items":["Potens (x^y) och rest (%)","Program som frågar efter ålder och skriver ut kategori: barn, ungdom, vuxen, pensionär"]}],"topics":["villkor","loopar"]},{"id":"rep","kind":"Repetition","title":"Diagnostiska repetitionsövningar","intro":"Lös uppgifterna utan att titta på lösningar. Försök förklara vad varje rad gör, inte bara få rätt output.","groups":[{"h":"Variabler och villkor","items":["Skriv ut en int, float, double och char","Summa, skillnad, produkt och kvot av två inmatade tal","Celsius till Fahrenheit","Cirkelns area med en konstant för π","Positivt, negativt eller noll","Skottår","Meny med switch: area, volym, avsluta"]},{"h":"Loopar och funktioner","items":["Summan av 1–100","Största talet i en array med 5 heltal","Medelvärde av användarinmatade tal","Funktion som skriver ut det största av tre tal","void-funktion som skriver ut en snygg meny"]},{"h":"Pekare och referenser","items":["Funktion som tar en int-pekare och ökar värdet med 10","<code>swap</code> med pekare och med referenser","<code>getRange(float* min, float* max)</code>","<code>printData(const vector&lt;int&gt;&amp; data)</code>"]},{"h":"Större uppgifter","items":["5 temperaturer → min, max och medel via funktioner","Meny: summa av två tal, medel av tre tal, avsluta","FizzBuzz med funktioner","Standardavvikelse för en lista av tal"]}],"topics":["kom-igang","villkor","loopar","funktioner"]}],"sources":[{"k":"V39","t":"C/C++ – V39 Studiehäfte"
