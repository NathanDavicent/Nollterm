ligger i enumens eget scope."},{"t":"multi","q":"Vilka påståenden om enum class stämmer? Välj alla.","o":["Värdena omvandlas inte automatiskt till int","Två enum class kan ha värden med samma namn","Kan användas i switch","Kan bara ha tre värden"],"a":[0,1,2],"why":"Antalet värden är obegränsat."},{"t":"text","q":"Skriv uttrycket som omvandlar <code>enum class</code>-värdet <code>w</code> till int.","accept":["static_cast<int>(w)","(int)w","int(w)"],"ph":"...(w)","why":"<code>static_cast&lt;int&gt;(w)</code>"},{"t":"code","q":"Skriv <code>std::string toString(Direction d)</code> för <code>enum class Direction { North, East, South, West }</code>. main läser ett tal 0–3 och skriver ut <code>norr</code>, <code>öster</code>, <code>söder</code> eller <code>väster</code>.","why":"En switch utan default låter <code>-Wall</code> varna om du lägger till ett värde utan att hantera det.","task":"05-enums-1","tests":[{"in":"0\n","out":"norr\n"},{"in":"1\n","out":"öster\n"},{"in":"2\n","out":"söder\n"},{"in":"3\n","out":"väster\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class Direction { North, East, South, West };\n\nstring toString(Direction d) {\n\n}\n\nint main() {\n    int n;\n    cin >> n;\n    cout << toString(static_cast<Direction>(n)) << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class Direction { North, East, South, West };\n\nstring toString(Direction d) {\n    switch (d) {\n        case Direction::North: return \"norr\";\n        case Direction::East:  return \"öster\";\n        case Direction::South: return \"söder\";\n        case Direction::West:  return \"väster\";\n    }\n    return \"okänd\";\n}\n\nint main() {\n    int n;\n    cin >> n;\n    cout << toString(static_cast<Direction>(n)) << endl;\n    return 0;\n}\n"},"py":{"starter":"from enum import Enum\n\n\nclass Direction(Enum):\n    NORTH = 0\n    EAST = 1\n    SOUTH = 2\n    WEST = 3\n\n\ndef to_string(d):\n    pass\n\n\nprint(to_string(Direction(int(input()))))\n","sol":"from enum import Enum\n\n\nclass Direction(Enum):\n    NORTH = 0\n    EAST = 1\n    SOUTH = 2\n    WEST = 3\n\n\ndef to_string(d):\n    match d:                         # Pythons motsvarighet till switch (3.10+)\n        case Direction.NORTH:\n            return \"norr\"\n        case Direction.EAST:\n            return \"öster\"\n        case Direction.SOUTH:\n            return \"söder\"\n        case Direction.WEST:\n            return \"väster\"\n\n\nprint(to_string(Direction(int(input()))))\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Klassen <code>Machine</code> har en <code>MachineState</code> som startar på Idle. Kommandon på indata: <code>start</code> sätter Running, <code>fail</code> sätter Error. Skriv <code>printStatus()</code> som skriver <code>Idle</code>, <code>Running</code> eller <code>Error</code>.","why":"Tillståndet är en enum class i klassen, och switch översätter det till text.","task":"05-enums-2","tests":[{"in":"\n","out":"Idle\n"},{"in":"start\n","out":"Running\n"},{"in":"start fail\n","out":"Error\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class MachineState { Idle, Running, Error };\n\nclass Machine {\n    MachineState state_ = MachineState::Idle;\npublic:\n    void start() { state_ = MachineState::Running; }\n    void fail()  { state_ = MachineState::Error; }\n    void printStatus() const {\n        // skriv ut statusen\n    }\n};\n\nint main() {\n    Machine m;\n    string cmd;\n    while (cin >> cmd) {\n        if (cmd == \"start\") m.start();\n        else if (cmd == \"fail\") m.fail();\n    }\n    m.printStatus();\n    return 0;\n}\n","sol":"#include <iostream>\n#include <string>\nusing namespace std;\n\nenum class MachineState { Idle, Running, Error };\n\nclass Machine {\n    MachineState state_ = MachineState::Idle;\npublic:\n    void start() { state_ = MachineState::Running; }\n    void fail()  { state_ = MachineState::Error; }\n    void printStatus() const {\n        switch (state_) {\n            case MachineState::Idle:    cout << \"Idle\" << endl;    break;\n            case MachineState::Running: cout << \"Running\" << endl; break;\n            case MachineState::Error:   cout << \"Error\" << endl;   break;\n        }\n    }\n};\n\nint main() {\n    Machine m;\n    string cmd;\n    while (cin >> cmd) {\n        if (cmd == \"start\") m.start();\n        else if (cmd == \"fail\") m.fail();\n    }\n    m.printStatus();\n    return 0;\n}\n"},"py":{"starter":"import sys\nfrom enum import Enum, auto\n\n\nclass MachineState(Enum):\n    IDLE = auto()\n    RUNNING = auto()\n    ERROR = auto()\n\n\nclass Machine:\n    def __init__(self):\n        self._state = MachineState.IDLE\n\n    def start(self):\n        self._state = MachineState.RUNNING\n\n    def fail(self):\n        self._state = MachineState.ERROR\n\n    def print_status(self):\n        # skriv Idle, Running eller Error\n        pass\n\n\nm = Machine()\nfor cmd in sys.stdin.read().split():\n    if cmd == \"start\":\n        m.start()\n    elif cmd == \"fail\":\n        m.fail()\nm.print_status()\n","sol":"import sys\nfrom enum import Enum, auto\n\n\nclass MachineState(Enum):\n    IDLE = auto()\n    RUNNING = auto()\n    ERROR = auto()\n\n\nclass Machine:\n    def __init__(self):\n        self._state = MachineState.IDLE\n\n    def start(self):\n        self._state = MachineState.RUNNING\n\n    def fail(self):\n        self._state = MachineState.ERROR\n\n    def print_status(self):\n        names = {\n            MachineState.IDLE: \"Idle\",\n            MachineState.RUNNING: \"Running\",\n            MachineState.ERROR: \"Error\",\n        }\n        print(names[self._state])\n\n\nm = Machine()\nfor cmd in sys.stdin.read().split():\n    if cmd == \"start\":\n        m.start()\n    elif cmd == \"fail\":\n        m.fail()\nm.print_status()\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tis 4/11"},{"id":"polymorfism","cat":"Polymorfism","min":10,"title":"Polymorfism och abstrakta klasser","lead":"Programmera mot ett gemensamt gränssnitt och låt varje subklass bestämma beteendet: virtual, override, final och rena virtuella funktioner.","src":["Torsdag 6/11 – Polymorfism, casting (avsnitt 1–3, 7–8)"],"goals":["Förklara vad som krävs för att en klass ska vara polymorf","Använda <code>virtual</code>, <code>override</code> och <code>final</code>","Skriva abstrakta klasser med rena virtuella funktioner","Förklara varför basklassen behöver en virtuell destruktor"],"blocks":[["h","Varför polymorfism?"],["p","Polymorfism låter oss programmera mot ett gemensamt gränssnitt och byta beteende under körning, utan en <code>switch</code> på typer. Vi skiljer <em>vad</em> som ska göras från <em>hur</em> varje subklass gör det. Samma kodväg kan driva helt olika IoT-enheter."],["code","cpp","#include <iostream>\n#include <memory>\n#include <vector>\n\nstruct Device {\n    virtual ~Device() = default;      // viktigt\n    virtual void tick() = 0;          // ren virtuell (abstrakt)\n};\n\nstruct TempSensor : Device {\n    void tick() override { std::cout << \"TempSensor läser av.\\n\"; }\n};\n\nstruct LedActuator : Device {\n    void tick() override { std::cout << \"LedActuator blinkar.\\n\"; }\n};\n\nint main() {\n    std::vector<std::unique_ptr<Device>> devices;\n    devices.push_back(std::make_unique<TempSensor>());\n    devices.push_back(std::make_unique<LedActuator>());\n    for (auto& d : devices) d->tick();    // samma anrop, olika beteende\n}"],["p","För att en klass ska vara polymorf i C++ behöver den minst en <code>virtual</code>-funktion, och anropet måste ske via en <strong>pekare eller referens</strong> till basen."],["widget","dispatch"],["h","virtual, override och final"],["list",["Gör de funktioner <code>virtual</code> i basen där beteendet ska kunna specialiseras.","Märk överskuggningar med <code>override</code>. Då kontrollerar kompilatorn att signaturen faktiskt matchar en virtuell funktion i basen.","Använd <code>final</code> för att stoppa vidare överskuggning eller arv när det är avsiktligt.","Ge polymorfa basklasser en <code>virtual</code> destruktor, så att <code>delete</code> via baspekare river hela objektet."]],["code","cpp","struct Logger {\n    virtual ~Logger() = default;\n    virtual void write(const std::string& msg) = 0;\n};\n\nstruct ConsoleLogger : Logger {\n    void write(const std::string& msg) override { std::cout << msg << \"\\n\"; }\n};\n\nstruct QuietLogger final : Logger {          // går inte att ärva vidare\n    void write(const std::string&) override {}\n};"],["note","fix","Utan <code>override</code> blir ett stavfel eller en saknad <code>const</code> tyst en <em>ny</em> funktion som döljer basens, och den virtuella anropas aldrig. Med <code>override</code> blir det ett kompileringsfel."],["note","warn","Om basens destruktor inte är virtuell och du gör <code>delete</code> via <code>Logger*</code> körs bara basens destruktor. Det är odefinierat beteende och läcker subklassens resurser."],["h","Abstrakta klasser"],["p","En klass med minst en ren virtuell funktion (<code>= 0</code>) är <strong>abstrakt</strong>. Den kan inte instansieras, bara ärvas. Den fungerar som ett kontrakt: varje konkret subklass måste implementera funktionerna."],["code","cpp","struct Drawable {\n    virtual ~Drawable() = default;\n    virtual void draw() const = 0;\n\n    void render() const {                 // icke-virtuell hjälpfunktion\n        std::cout << \"--- figur ---\\n\";\n        draw();                           // anropar subklassens version\n    }\n};\n\nstruct Line : Drawable {\n    void draw() const override { std::cout << \"Ritar linje\\n\"; }\n};\nstruct Circle : Drawable {\n    void draw() const override { std::cout << \"Ritar cirkel\\n\"; }\n};\n\n// Drawable d;     // FEL: abstrakt klass"],["note","tip","Håll gränssnittet minimalt. Några få väl valda virtuella funktioner är lättare att testa och underhålla."],["h","Fallgropar och riktlinjer"],["list",["Anropa aldrig virtuella funktioner från konstruktorer eller destruktorer. Där är virtuell dispatch i praktiken avstängd.","Gör polymorfa basklasser lätta: virtuella funktioner och en virtuell destruktor, inga onödiga beroenden.","Virtuell dispatch kostar ett indirekt hopp via en <strong>vtable</strong>. Oftast obetydligt, men kan märkas i tighta loopar på en mikrokontroller.","Välj <code>enum class</code> istället för arv när typerna inte behöver olika data eller tillstånd och antalet fall är litet och slutet."]],["h","Övningar"],["ex","render() för Drawable","<p>Bygg ut <code>Drawable</code> med en icke-virtuell <code>render()</code> som skriver en rubrik och anropar <code>draw()</code>. Lägg några figurer i en <code>std::vector&lt;std::unique_ptr&lt;Drawable&gt;&gt;</code> och anropa render på alla.</p>"],["ex","Icke-virtuell open()","<p>Lägg till en metod <code>open()</code> i <code>Logger</code> som inte gör något och inte är virtuell. När är det rimligt att en metod <em>inte</em> är virtuell?</p>"]],"pool":[{"t":"mc","q":"Vad krävs för polymorft beteende i C++?","o":["Att klassen är en struct","En virtuell funktion i basen, och anrop via pekare eller referens till basen","Att alla medlemmar är public","Att man använder new"],"a":1,"why":"Utan virtual väljs funktionen vid kompilering utifrån den statiska typen."},{"t":"mc","q":"Vad gör <code>override</code>?","o":["Gör funktionen virtuell i basen","Låter kompilatorn kontrollera att funktionen verkligen överskuggar en virtuell funktion","Förhindrar arv","Gör funktionen snabbare"],"a":1,"why":"Stavfel eller fel signatur blir kompileringsfel istället för tysta buggar."},{"t":"mc","q":"Vad betyder <code>virtual void draw() const = 0;</code>?","o":["draw returnerar 0","draw är en ren virtuell funktion och klassen blir abstrakt","draw är private","draw anropas aldrig"],"a":1,"why":"Subklasserna måste implementera den, och basen kan inte instansieras."},{"t":"mc","q":"Varför ska en polymorf basklass ha en virtuell destruktor?","o":["För att kunna skapa objekt","Så att delete via baspekare kör subklassens destruktor också","För att få använda override","Det behövs inte"],"a":1,"why":"Annars körs bara basens destruktor: odefinierat beteende och läckor."},{"t":"mc","q":"Vad gör <code>final</code> på en klass?","o":["Gör klassen abstrakt","Förhindrar att någon ärver från den","Gör alla metoder const","Tar bort vtablen"],"a":1,"why":"<code>struct QuietLogger final : Logger</code> kan inte vara basklass. final på en metod stoppar vidare överskuggning."},{"t":"mc","q":"<code>Base* p = new Derived; p-&gt;f();</code> där f <em>inte</em> är virtual. Vilken f körs?","o":["Derived::f","Base::f","Båda","Odefinierat"],"a":1,"why":"Utan virtual bestäms anropet av pekarens statiska typ, Base*."},{"t":"mc","q":"Kan man skapa ett objekt av en abstrakt klass?","o":["Ja, alltid","Nej, bara av konkreta subklasser som implementerar alla rena virtuella funktioner","Ja, med new","Bara om den har en konstruktor"],"a":1,"why":"Men du kan ha pekare och referenser av den abstrakta typen, och det är hela poängen."},{"t":"multi","q":"Vilka hör hemma i en lätt polymorf basklass? Välj alla.","o":["En virtuell destruktor","Rena virtuella funktioner för gränssnittet","Många datamedlemmar och beroenden","Anrop av virtuella funktioner från konstruktorn"],"a":[0,1],"why":"Virtuella anrop från konstruktorn går inte till subklassen, och tunga baser gör hierarkin svår att ändra."},{"t":"text","q":"Vilket nyckelord sätter du efter en metod i subklassen för att kompilatorn ska kontrollera att den överskuggar en virtuell funktion?","accept":["override"],"ph":"nyckelord","why":"<code>void tick() override;</code>"},{"t":"text","q":"Vad kallas tabellen som används för virtuell dispatch? Ett ord.","accept":["vtable","v-table","virtual table","vtbl"],"ph":"ord","why":"vtable: varje polymorf klass har en tabell med pekare till sina virtuella funktioner."},{"t":"code","q":"Abstrakt <code>Shape</code> med <code>virtual double area() const = 0</code>. Skriv <code>Rect</code> och <code>Circle</code> (π = 3.14). Indata: rader med <code>rect B H</code> eller <code>circle R</code>. Skriv ut total area.","why":"Loopen vet bara om <code>Shape</code>. Varje objekt bidrar med sin egen area via virtuell dispatch.","task":"06-polymorfism-1","tests":[{"in":"rect 2 3\ncircle 1\n","out":"9.14\n"},{"in":"rect 4 5\n","out":"20\n"},{"in":"circle 2\ncircle 2\n","out":"25.12\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Shape {\n    virtual ~Shape() = default;\n    virtual double area() const = 0;\n};\n\n// skriv Rect och Circle\n\n\nint main() {\n    vector<unique_ptr<Shape>> shapes;\n    string kind;\n    while (cin >> kind) {\n        if (kind == \"rect\") { double b, h; cin >> b >> h; shapes.push_back(make_unique<Rect>(b, h)); }\n        else if (kind == \"circle\") { double r; cin >> r; shapes.push_back(make_unique<Circle>(r)); }\n    }\n    double total = 0;\n    for (const auto& s : shapes) total += s->area();\n    cout << total << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Shape {\n    virtual ~Shape() = default;\n    virtual double area() const = 0;\n};\n\nstruct Rect : Shape {\n    double b, h;\n    Rect(double b, double h) : b(b), h(h) {}\n    double area() const override { return b * h; }\n};\n\nstruct Circle : Shape {\n    double r;\n    Circle(double r) : r(r) {}\n    double area() const override { return 3.14 * r * r; }\n};\n\nint main() {\n    vector<unique_ptr<Shape>> shapes;\n    string kind;\n    while (cin >> kind) {\n        if (kind == \"rect\") { double b, h; cin >> b >> h; shapes.push_back(make_unique<Rect>(b, h)); }\n        else if (kind == \"circle\") { double r; cin >> r; shapes.push_back(make_unique<Circle>(r)); }\n    }\n    double total = 0;\n    for (const auto& s : shapes) total += s->area();\n    cout << total << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\n\n# skriv Rect och Circle (pi = 3.14)\n\n\nshapes = []\ndata = sys.stdin.read().split()\ni = 0\nwhile i < len(data):\n    if data[i] == \"rect\":\n        shapes.append(Rect(float(data[i + 1]), float(data[i + 2])))\n        i += 3\n    else:\n        shapes.append(Circle(float(data[i + 1])))\n        i += 2\nprint(f\"{sum(s.area() for s in shapes):g}\")\n","sol":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\n\nclass Rect(Shape):\n    def __init__(self, b, h):\n        self.b, self.h = b, h\n\n    def area(self):\n        return self.b * self.h\n\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n\n    def area(self):\n        return 3.14 * self.r * self.r\n\n\nshapes = []\ndata = sys.stdin.read().split()\ni = 0\nwhile i < len(data):\n    if data[i] == \"rect\":\n        shapes.append(Rect(float(data[i + 1]), float(data[i + 2])))\n        i += 3\n    else:\n        shapes.append(Circle(float(data[i + 1])))\n        i += 2\nprint(f\"{sum(s.area() for s in shapes):g}\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 6/11"},{"id":"agande-casting","cat":"Polymorfism","min":9,"title":"Slicing, ägande och dynamic_cast","lead":"Lagra polymorfa objekt rätt med unique_ptr, undvik object slicing, skapa objekt i fabriker och använd RTTI sparsamt.","src":["Torsdag 6/11 – Polymorfism, casting (avsnitt 4–6)"],"goals":["Förklara object slicing och undvika det","Lagra polymorfa objekt i <code>std::vector&lt;std::unique_ptr&lt;Base&gt;&gt;</code>","Skriva en enkel fabriksfunktion","Använda <code>dynamic_cast</code> och <code>typeid</code>, och veta när de bör undvikas"],"blocks":[["h","Object slicing"],["p","Virtuell dispatch fungerar bara via pekare eller referenser till basen. Kopierar du ett subklassobjekt till en variabel av bastyp skärs den subklass-specifika delen bort. Det kallas <strong>object slicing</strong>."],["code","cpp","struct Base {\n    virtual ~Base() = default;\n    virtual void f() const { std::cout << \"Base\\n\"; }\n};\nstruct Der : Base {\n    void f() const override { std::cout << \"Der\\n\"; }\n};\n\nint main() {\n    Der d;\n    Base b = d;      // slicing: b är en ren Base\n    b.f();           // \"Base\"\n\n    Base& r = d;     // referens: ingen kopia\n    r.f();           // \"Der\"\n}"],["p","Därför fungerar inte <code>std::vector&lt;Base&gt;</code> för polymorfa objekt: varje element är en kopia av bastyp. Lagra pekare istället."],["h","Ägande med unique_ptr"],["p","I modern C++ undviker vi råa <code>new</code>/<code>delete</code>. <code>std::unique_ptr</code> ger exklusivt ägande: objektet förstörs automatiskt när pekaren försvinner. Behöver flera dela på ett objekt finns <code>std::shared_ptr</code>, men det ska motiveras."],["code","cpp","#include <memory>\n\nstd::vector<std::unique_ptr<Device>> devices;\ndevices.push_back(std::make_unique<TempSensor>());\ndevices.push_back(std::make_unique<LedActuator>());\n// inget delete behövs: vektorn äger objekten\n\nauto p = std::make_unique<TempSensor>();\n// auto q = p;              // FEL: unique_ptr kan inte kopieras\nauto q = std::move(p);      // ägandet flyttas, p blir nullptr"],["h","Fabriker"],["p","En fabriksfunktion samlar objektskapandet på ett ställe. Resten av koden behöver inte känna till de konkreta typerna."],["code","cpp","struct Effect { virtual ~Effect() = default; virtual void apply() = 0; };\nstruct Slow : Effect { void apply() override { std::cout << \"Slow\\n\"; } };\nstruct Burn : Effect { void apply() override { std::cout << \"Burn\\n\"; } };\n\nstd::unique_ptr<Effect> makeEffect(int code) {\n    switch (code) {\n        case 1: return std::make_unique<Slow>();\n        case 2: return std::make_unique<Burn>();\n        default: return nullptr;\n    }\n}\n\nint main() {\n    std::vector<std::unique_ptr<Effect>> effects;\n    effects.push_back(makeEffect(1));\n    effects.push_back(makeEffect(2));\n    for (auto& e : effects) if (e) e->apply();\n}"],["h","RTTI, dynamic_cast och typeid"],["p","RTTI (Run-Time Type Information) låter programmet fråga om typen under körning. Det fungerar bara på polymorfa typer, kostar lite vid körning och kan stängas av i kompilatorn (vanligt i inbyggda system)."],["list",["<code>dynamic_cast&lt;Derived*&gt;(basePtr)</code> returnerar en pekare, eller <code>nullptr</code> om objektet inte är av den typen.","<code>dynamic_cast&lt;Derived&amp;&gt;(baseRef)</code> kastar <code>std::bad_cast</code> vid fel.","<code>typeid(obj)</code> ger ett <code>std::type_info</code>, mest användbart för loggning och diagnos."]],["code","cpp","void maybeSpecialHandle(Device& d) {\n    if (auto* led = dynamic_cast<LedActuator*>(&d)) {\n        std::cout << \"Särbehandlar LED\\n\";\n        led->tick();\n    } else {\n        d.tick();\n    }\n}"],["note","warn","Behöver du ofta dynamic_cast är det ett tecken på att gränssnittet saknar en virtuell funktion. RTTI är rimligt i legacy-kod du inte får ändra, i testkod och verktyg, eller i dokumenterade specialfall."],["h","Övningar"],["ex","Fabrik med strängar","<p>Ändra <code>makeEffect</code> så att den tar <code>\"slow\"</code> eller <code>\"burn\"</code>. Fundera på hur en <code>std::map&lt;std::string, std::function&lt;std::unique_ptr&lt;Effect&gt;()&gt;&gt;</code> med lambdas kan ersätta switchen.</p>","std::unique_ptr<Effect> makeEffect(const std::string& name) {\n    static const std::map<std::string, std::function<std::unique_ptr<Effect>()>> table = {\n        {\"slow\", [] { return std::make_unique<Slow>(); }},\n        {\"burn\", [] { return std::make_unique<Burn>(); }},\n    };\n    auto it = table.find(name);\n    return it != table.end() ? it->second() : nullptr;\n}","cpp"],["ex","Räkna LED-aktuatorer","<p>Skriv <code>int countLedActuators(const std::vector&lt;std::unique_ptr&lt;Device&gt;&gt;&amp; ds)</code> med dynamic_cast. Diskutera ett alternativ utan RTTI, till exempel en virtuell <code>kind()</code> som returnerar en enum class.</p>"]],"pool":[{"t":"mc","q":"<code>Der d; Base b = d; b.f();</code> där f är virtuell. Vilken f körs?","o":["Der::f","Base::f","Båda","Kompileringsfel"],"a":1,"why":"b är en kopia av bastyp. Der-delen skars bort (slicing)."},{"t":"mc","q":"Varför passar inte <code>std::vector&lt;Base&gt;</code> för polymorfa objekt?","o":["vector kan inte lagra klasser","Varje element kopieras till en Base och tappar sin subklassdel","Det är för långsamt","Base måste vara abstrakt"],"a":1,"why":"Använd <code>std::vector&lt;std::unique_ptr&lt;Base&gt;&gt;</code>."},{"t":"mc","q":"Vad returnerar <code>dynamic_cast&lt;Led*&gt;(p)</code> om p inte pekar på en Led?","o":["Ett undantag","<code>nullptr</code>","Samma pekare","En kopia"],"a":1,"why":"Pekarvarianten ger nullptr. Referensvarianten kastar <code>std::bad_cast</code>."},{"t":"mc","q":"Vad händer med objektet när en <code>unique_ptr</code> går ur scope?","o":["Inget, du måste köra delete","Objektet förstörs automatiskt","Det flyttas till stacken","Det kopieras"],"a":1,"why":"unique_ptr äger objektet och frigör det i sin destruktor."},{"t":"mc","q":"När är dynamic_cast mest motiverat?","o":["I varje polymorft anrop","När gränssnittet inte går att ändra, eller i test- och diagnoskod","Istället för virtuella funktioner","För att omvandla int till double"],"a":1,"why":"Ofta är en extra virtuell funktion i basen en bättre lösning."},{"t":"mc","q":"Vad gör <code>auto q = std::move(p);</code> om p är en unique_ptr?","o":["Kopierar objektet","Flyttar ägandet till q, och p blir nullptr","Raderar objektet","Ger kompileringsfel"],"a":1,"why":"unique_ptr kan inte kopieras, bara flyttas."},{"t":"multi","q":"När är RTTI (dynamic_cast, typeid) rimligt enligt materialet? Välj alla.","o":["Migrering av legacy-kod där basen inte kan ändras","Testkod och instrumentation","I varje polymorft anrop","Istället för att lägga till en virtuell funktion som saknas"],"a":[0,1],"why":"Saknas en virtuell funktion är det oftast bättre att lägga till den."},{"t":"text","q":"Vad kastar <code>dynamic_cast&lt;Led&amp;&gt;(ref)</code> om objektet inte är en Led? Skriv typens namn.","accept":["std::bad_cast","bad_cast"],"ph":"std::...","why":"<code>std::bad_cast</code>. Pekarvarianten returnerar nullptr istället."},{"t":"text","q":"Vad kallas det när ett subklassobjekt kopieras till en basvariabel och tappar sin subklassdel? Två ord eller ett på engelska.","accept":["object slicing","slicing","objektslicing"],"ph":"begrepp","why":"Object slicing."},{"t":"code","q":"Fabrik: skriv <code>unique_ptr&lt;Effect&gt; makeEffect(const string&amp; name)</code> som returnerar <code>Slow</code> för \"slow\", <code>Burn</code> för \"burn\" och annars nullptr. main skriver <code>okänd</code> för nullptr.","why":"main känner bara till Effect. Nya effekter läggs till i fabriken.","task":"07-agande-casting-1","tests":[{"in":"slow burn\n","out":"Slow\nBurn\n"},{"in":"freeze slow\n","out":"okänd\nSlow\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct Effect { virtual ~Effect() = default; virtual void apply() = 0; };\nstruct Slow : Effect { void apply() override { cout << \"Slow\" << endl; } };\nstruct Burn : Effect { void apply() override { cout << \"Burn\" << endl; } };\n\nunique_ptr<Effect> makeEffect(const string& name) {\n\n}\n\nint main() {\n    string name;\n    while (cin >> name) {\n        auto e = makeEffect(name);\n        if (e) e->apply();\n        else cout << \"okänd\" << endl;\n    }\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct Effect { virtual ~Effect() = default; virtual void apply() = 0; };\nstruct Slow : Effect { void apply() override { cout << \"Slow\" << endl; } };\nstruct Burn : Effect { void apply() override { cout << \"Burn\" << endl; } };\n\nunique_ptr<Effect> makeEffect(const string& name) {\n    if (name == \"slow\") return make_unique<Slow>();\n    if (name == \"burn\") return make_unique<Burn>();\n    return nullptr;\n}\n\nint main() {\n    string name;\n    while (cin >> name) {\n        auto e = makeEffect(name);\n        if (e) e->apply();\n        else cout << \"okänd\" << endl;\n    }\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Effect:\n    def apply(self):\n        raise NotImplementedError\n\n\nclass Slow(Effect):\n    def apply(self):\n        print(\"Slow\")\n\n\nclass Burn(Effect):\n    def apply(self):\n        print(\"Burn\")\n\n\ndef make_effect(name):\n    # returnera Slow() eller Burn(), annars None\n    pass\n\n\nfor name in sys.stdin.read().split():\n    e = make_effect(name)\n    if e:\n        e.apply()\n    else:\n        print(\"okänd\")\n","sol":"import sys\n\n\nclass Effect:\n    def apply(self):\n        raise NotImplementedError\n\n\nclass Slow(Effect):\n    def apply(self):\n        print(\"Slow\")\n\n\nclass Burn(Effect):\n    def apply(self):\n        print(\"Burn\")\n\n\nEFFECTS = {\"slow\": Slow, \"burn\": Burn}      # tabell istället för if-kedja\n\n\ndef make_effect(name):\n    cls = EFFECTS.get(name)\n    return cls() if cls else None\n\n\nfor name in sys.stdin.read().split():\n    e = make_effect(name)\n    if e:\n        e.apply()\n    else:\n        print(\"okänd\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Skriv <code>int countLeds(const vector&lt;unique_ptr&lt;Device&gt;&gt;&amp; ds)</code> som räknar LedActuator-objekt med <code>dynamic_cast</code>. Indata är en lista med <code>led</code> och <code>temp</code>.","why":"<code>d.get()</code> ger den råa pekaren. dynamic_cast returnerar nullptr för allt som inte är en LedActuator.","task":"07-agande-casting-2","tests":[{"in":"led temp led\n","out":"2\n"},{"in":"temp temp\n","out":"0\n"},{"in":"\n","out":"0\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Device { virtual ~Device() = default; virtual void tick() = 0; };\nstruct TempSensor : Device { void tick() override {} };\nstruct LedActuator : Device { void tick() override {} };\n\nint countLeds(const vector<unique_ptr<Device>>& ds) {\n\n}\n\nint main() {\n    vector<unique_ptr<Device>> ds;\n    string k;\n    while (cin >> k) {\n        if (k == \"led\") ds.push_back(make_unique<LedActuator>());\n        else ds.push_back(make_unique<TempSensor>());\n    }\n    cout << countLeds(ds) << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Device { virtual ~Device() = default; virtual void tick() = 0; };\nstruct TempSensor : Device { void tick() override {} };\nstruct LedActuator : Device { void tick() override {} };\n\nint countLeds(const vector<unique_ptr<Device>>& ds) {\n    int n = 0;\n    for (const auto& d : ds) {\n        if (dynamic_cast<LedActuator*>(d.get())) n++;\n    }\n    return n;\n}\n\nint main() {\n    vector<unique_ptr<Device>> ds;\n    string k;\n    while (cin >> k) {\n        if (k == \"led\") ds.push_back(make_unique<LedActuator>());\n        else ds.push_back(make_unique<TempSensor>());\n    }\n    cout << countLeds(ds) << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Device:\n    def tick(self):\n        pass\n\n\nclass TempSensor(Device):\n    pass\n\n\nclass LedActuator(Device):\n    pass\n\n\ndef count_leds(devices):\n    # räkna LedActuator-objekt med isinstance (Pythons motsvarighet till dynamic_cast)\n    pass\n\n\ndevices = [LedActuator() if k == \"led\" else TempSensor() for k in sys.stdin.read().split()]\nprint(count_leds(devices))\n","sol":"import sys\n\n\nclass Device:\n    def tick(self):\n        pass\n\n\nclass TempSensor(Device):\n    pass\n\n\nclass LedActuator(Device):\n    pass\n\n\ndef count_leds(devices):\n    return sum(1 for d in devices if isinstance(d, LedActuator))\n\n\ndevices = [LedActuator() if k == \"led\" else TempSensor() for k in sys.stdin.read().split()]\nprint(count_leds(devices))\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 6/11"},{"id":"designmonster","cat":"Designmönster","min":11,"title":"Designmönster: Strategy, Observer och Factory","lead":"Beprövade lösningar på återkommande designproblem: utbytbara beteenden, aviseringar och kontrollerat objektskapande.","src":["Torsdag 13/11 – Design Patterns intro (avsnitt 1–4)"],"goals":["Förklara vad ett designmönster är och inte är","Använda Strategy för utbytbara beteenden","Använda Observer för att meddela flera mottagare","Centralisera objektskapande med Factory Method"],"blocks":[["h","Varför designmönster?"],["p","I större program återkommer samma frågor: hur skapar vi objekt kontrollerat, hur organiserar vi beroenden så att systemet blir lätt att ändra, och hur utökar vi beteende utan att förstöra befintlig kod?"],["p","<strong>Designmönster är beprövade lösningar på återkommande problem i objektorienterad design.</strong> De är inte färdig kod, utan idéer: strukturer och relationer mellan klasser som brukar fungera."],["h","Strategy: utbytbara beteenden"],["p","Om en <code>Player</code> ska kunna attackera på många sätt och alla varianter hårdkodas blir klassen en jätteklass full av if-else. Strategy lyfter ut beteendet till egna klasser bakom ett gemensamt gränssnitt. Spelaren <em>har en</em> strategi som kan bytas under körning."],["list",["En abstrakt basklass definierar beteendet (<code>AttackStrategy</code>).","Subklasser implementerar konkret logik (<code>SwordAttack</code>, <code>FireballAttack</code>).","En kontextklass (<code>Player</code>) har en pekare till strategin och kan byta den."]],["code","cpp","struct AttackStrategy {\n    virtual ~AttackStrategy() = default;\n    virtual int damage() const = 0;\n};\nstruct SwordAttack : AttackStrategy {\n    int damage() const override { return 10; }\n};\nstruct FireballAttack : AttackStrategy {\n    int damage() const override { return 15; }\n};\n\nclass Player {\npublic:\n    explicit Player(std::unique_ptr<AttackStrategy> a) : attack(std::move(a)) {}\n    void setAttack(std::unique_ptr<AttackStrategy> a) { attack = std::move(a); }\n    void attackTarget(Player& target) { target.takeDamage(attack->damage()); }\n    int health() const { return health_; }\nprivate:\n    void takeDamage(int dmg) { health_ -= dmg; }\n    int health_ = 100;\n    std::unique_ptr<AttackStrategy> attack;\n};\n\n// plocka upp ett nytt vapen:\n// hero.setAttack(std::make_unique<FireballAttack>());"],["p","Fördelar: nya attacktyper utan att ändra Player, logiken kan bytas under körning, och switch-monstren försvinner."],["h","Observer: avisering vid ändringar"],["p","En sensor ändrar värde och flera delar av systemet (logg, display, larm) behöver veta det. Observer låter ett objekt annonsera händelser till många mottagare <em>utan att känna till dem</em>."],["list",["<strong>Subject</strong> (observable) håller en lista med observers och meddelar dem.","<strong>Observer</strong> är ett gränssnitt med en funktion som anropas vid förändring."]],["code","cpp","struct Observer {\n    virtual ~Observer() = default;\n    virtual void onNotify(int value) = 0;\n};\n\nclass Sensor {\npublic:\n    void addObserver(Observer* obs) { observers.push_back(obs); }\n    void newReading(int v) { value = v; notifyAll(); }\nprivate:\n    void notifyAll() { for (auto* o : observers) o->onNotify(value); }\n    int value = 0;\n    std::vector<Observer*> observers;\n};\n\nstruct Logger : Observer {\n    void onNotify(int v) override { std::cout << \"Logg: sensorvärde = \" << v << \"\\n\"; }\n};\nstruct Alarm : Observer {\n    void onNotify(int v) override { if (v > 30) std::cout << \"LARM! \" << v << \"\\n\"; }\n};"],["note","warn","Sensorn lagrar råa pekare men äger inte sina observers. Se till att en observer lever minst lika länge som sensorn, eller avregistrera den innan den förstörs."],["h","Factory Method: kontrollerat objektskapande"],["p","Utan fabrik sprids <code>new TempSensor()</code> och if-kedjor över hela koden. En fabrik samlar skapandet på ett ställe och fungerar bra ihop med enum class och menyval."],["code","cpp","enum class SensorType { Temperature, Humidity };\n\nstd::unique_ptr<Sensor> makeSensor(SensorType type) {\n    switch (type) {\n        case SensorType::Temperature: return std::make_unique<TempSensor>();\n        case SensorType::Humidity:    return std::make_unique<HumiditySensor>();\n    }\n    return nullptr;\n}"],["p","Fördelar: centraliserat skapande, och hierarkin kan byggas ut utan att resten av systemet ändras. I större system kan fabriken vara ett eget objekt."]],"pool":[{"t":"mc","q":"Vad är ett designmönster?","o":["Ett färdigt bibliotek","En beprövad idé för hur klasser kan organiseras för att lösa ett återkommande problem","En kodstandard för indentering","Ett UML-diagram"],"a":1,"why":"Mönster beskriver strukturer och relationer, inte färdig kod."},{"t":"mc","q":"Vilket problem löser Strategy?","o":["Att bara en instans finns","Att beteenden ska kunna bytas ut utan att ändra klassen som använder dem","Att översätta gränssnitt","Att spara objekt till fil"],"a":1,"why":"Player har en AttackStrategy som kan bytas under körning."},{"t":"mc","q":"I Observer: vem känner till vem?","o":["Observers känner till alla andra observers","Subjektet känner bara till Observer-gränssnittet, inte de konkreta mottagarna","Subjektet måste känna till Logger","Ingen känner till någon"],"a":1,"why":"Därför kan nya mottagare läggas till utan att subjektet ändras."},{"t":"mc","q":"Vad är huvudfördelen med Factory Method?","o":["Snabbare objekt","Objektskapandet samlas på ett ställe, så resten av koden slipper känna till konkreta typer","Objekten blir const","Den ersätter arv"],"a":1,"why":"Ny sensortyp = ändra fabriken, inte varje ställe som skapar sensorer."},{"t":"mc","q":"Varför tar <code>Player</code> en <code>std::unique_ptr&lt;AttackStrategy&gt;</code>?","o":["För att unique_ptr är snabbare än int","Player äger sin strategi, och den måste nås via pekare för polymorfism","För att AttackStrategy inte får ha virtuella funktioner","För att kunna kopiera Player"],"a":1,"why":"Pekaren ger polymorfism och unique_ptr gör ägandet tydligt."},{"t":"mc","q":"Ett larm, en logg och en display ska reagera när en sensor får ett nytt värde. Vilket mönster passar?","o":["Singleton","Observer","Adapter","Factory Method"],"a":1,"why":"Sensorn meddelar alla registrerade observers utan att känna till dem."},{"t":"mc","q":"En spelare ska kunna byta vapen under spelets gång. Vilket mönster passar?","o":["Strategy","Singleton","Observer","Adapter"],"a":0,"why":"<code>setAttack(std::make_unique&lt;FireballAttack&gt;())</code> byter beteendet."},{"t":"multi","q":"Vilka delar ingår i Observer-mönstret? Välj alla.","o":["Ett subject som håller en lista med observers","Ett Observer-gränssnitt med en notifieringsfunktion","En privat konstruktor","Konkreta observers som implementerar gränssnittet"],"a":[0,1,3],"why":"Privat konstruktor hör till Singleton."},{"t":"text","q":"Vilket mönster samlar objektskapandet i en funktion eller klass? Skriv namnet på engelska.","accept":["factory method","factory","factory pattern"],"ph":"namn","why":"Factory Method."},{"t":"code","q":"Strategy: skriv <code>SwordAttack</code> (10 i skada) och <code>FireballAttack</code> (15). Indata är en lista med <code>sword</code> och <code>fireball</code>. Spelaren byter strategi och attackerar för varje ord. Skriv ut total skada.","why":"Player vet inget om svärd eller eldklot. Nya attacker kräver ingen ändring i Player.","task":"08-designmonster-1","tests":[{"in":"sword sword fireball\n","out":"35\n"},{"in":"fireball\n","out":"15\n"},{"in":"\n","out":"0\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct AttackStrategy {\n    virtual ~AttackStrategy() = default;\n    virtual int damage() const = 0;\n};\n\n// skriv SwordAttack och FireballAttack\n\n\nclass Player {\n    unique_ptr<AttackStrategy> attack_;\npublic:\n    void setAttack(unique_ptr<AttackStrategy> a) { attack_ = move(a); }\n    int attack() const { return attack_ ? attack_->damage() : 0; }\n};\n\nint main() {\n    Player p;\n    int total = 0;\n    string w;\n    while (cin >> w) {\n        if (w == \"sword\") p.setAttack(make_unique<SwordAttack>());\n        else if (w == \"fireball\") p.setAttack(make_unique<FireballAttack>());\n        total += p.attack();\n    }\n    cout << total << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <memory>\n#include <string>\nusing namespace std;\n\nstruct AttackStrategy {\n    virtual ~AttackStrategy() = default;\n    virtual int damage() const = 0;\n};\n\nstruct SwordAttack : AttackStrategy {\n    int damage() const override { return 10; }\n};\n\nstruct FireballAttack : AttackStrategy {\n    int damage() const override { return 15; }\n};\n\nclass Player {\n    unique_ptr<AttackStrategy> attack_;\npublic:\n    void setAttack(unique_ptr<AttackStrategy> a) { attack_ = move(a); }\n    int attack() const { return attack_ ? attack_->damage() : 0; }\n};\n\nint main() {\n    Player p;\n    int total = 0;\n    string w;\n    while (cin >> w) {\n        if (w == \"sword\") p.setAttack(make_unique<SwordAttack>());\n        else if (w == \"fireball\") p.setAttack(make_unique<FireballAttack>());\n        total += p.attack();\n    }\n    cout << total << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass AttackStrategy(ABC):\n    @abstractmethod\n    def damage(self):\n        ...\n\n\n# skriv SwordAttack (10) och FireballAttack (15)\n\n\nclass Player:\n    def __init__(self):\n        self._attack = None\n\n    def set_attack(self, strategy):\n        self._attack = strategy\n\n    def attack(self):\n        return self._attack.damage() if self._attack else 0\n\n\np = Player()\ntotal = 0\nfor w in sys.stdin.read().split():\n    if w == \"sword\":\n        p.set_attack(SwordAttack())\n    elif w == \"fireball\":\n        p.set_attack(FireballAttack())\n    total += p.attack()\nprint(total)\n","sol":"import sys\nfrom abc import ABC, abstractmethod\n\n\nclass AttackStrategy(ABC):\n    @abstractmethod\n    def damage(self):\n        ...\n\n\nclass SwordAttack(AttackStrategy):\n    def damage(self):\n        return 10\n\n\nclass FireballAttack(AttackStrategy):\n    def damage(self):\n        return 15\n\n\nclass Player:\n    def __init__(self):\n        self._attack = None\n\n    def set_attack(self, strategy):\n        self._attack = strategy\n\n    def attack(self):\n        return self._attack.damage() if self._attack else 0\n\n\np = Player()\ntotal = 0\nfor w in sys.stdin.read().split():\n    if w == \"sword\":\n        p.set_attack(SwordAttack())\n    elif w == \"fireball\":\n        p.set_attack(FireballAttack())\n    total += p.attack()\nprint(total)\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Observer: skriv <code>Alarm</code> som skriver <code>LARM V</code> när värdet V är över 30, och <code>Counter</code> som räknar notifieringar. main registrerar båda, skickar alla värden från indata och skriver till sist <code>N notifieringar</code>.","why":"Sensorn vet bara om Observer-gränssnittet. Fler mottagare kräver ingen ändring i Sensor.","task":"08-designmonster-2","tests":[{"in":"20 35 31 10\n","out":"LARM 35\nLARM 31\n4 notifieringar\n"},{"in":"\n","out":"0 notifieringar\n"}],"code":{"cpp":{"starter":"#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Observer {\n    virtual ~Observer() = default;\n    virtual void onNotify(int value) = 0;\n};\n\nclass Sensor {\n    vector<Observer*> observers_;\npublic:\n    void addObserver(Observer* o) { observers_.push_back(o); }\n    void newReading(int v) { for (auto* o : observers_) o->onNotify(v); }\n};\n\n// skriv Alarm och Counter (Counter har en publik int count)\n\n\nint main() {\n    Sensor s;\n    Alarm alarm;\n    Counter counter;\n    s.addObserver(&alarm);\n    s.addObserver(&counter);\n    int v;\n    while (cin >> v) s.newReading(v);\n    cout << counter.count << \" notifieringar\" << endl;\n    return 0;\n}\n","sol":"#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Observer {\n    virtual ~Observer() = default;\n    virtual void onNotify(int value) = 0;\n};\n\nclass Sensor {\n    vector<Observer*> observers_;\npublic:\n    void addObserver(Observer* o) { observers_.push_back(o); }\n    void newReading(int v) { for (auto* o : observers_) o->onNotify(v); }\n};\n\nstruct Alarm : Observer {\n    void onNotify(int v) override {\n        if (v > 30) cout << \"LARM \" << v << endl;\n    }\n};\n\nstruct Counter : Observer {\n    int count = 0;\n    void onNotify(int) override { count++; }\n};\n\nint main() {\n    Sensor s;\n    Alarm alarm;\n    Counter counter;\n    s.addObserver(&alarm);\n    s.addObserver(&counter);\n    int v;\n    while (cin >> v) s.newReading(v);\n    cout << counter.count << \" notifieringar\" << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Observer:\n    def on_notify(self, value):\n        raise NotImplementedError\n\n\nclass Sensor:\n    def __init__(self):\n        self._observers = []\n\n    def add_observer(self, o):\n        self._observers.append(o)\n\n    def new_reading(self, v):\n        for o in self._observers:\n            o.on_notify(v)\n\n\n# skriv Alarm och Counter (Counter har ett attribut count)\n\n\ns = Sensor()\nalarm = Alarm()\ncounter = Counter()\ns.add_observer(alarm)\ns.add_observer(counter)\nfor v in sys.stdin.read().split():\n    s.new_reading(int(v))\nprint(f\"{counter.count} notifieringar\")\n","sol":"import sys\n\n\nclass Observer:\n    def on_notify(self, value):\n        raise NotImplementedError\n\n\nclass Sensor:\n    def __init__(self):\n        self._observers = []\n\n    def add_observer(self, o):\n        self._observers.append(o)\n\n    def new_reading(self, v):\n        for o in self._observers:\n            o.on_notify(v)\n\n\nclass Alarm(Observer):\n    def on_notify(self, value):\n        if value > 30:\n            print(f\"LARM {value}\")\n\n\nclass Counter(Observer):\n    def __init__(self):\n        self.count = 0\n\n    def on_notify(self, value):\n        self.count += 1\n\n\ns = Sensor()\nalarm = Alarm()\ncounter = Counter()\ns.add_observer(alarm)\ns.add_observer(counter)\nfor v in sys.stdin.read().split():\n    s.new_reading(int(v))\nprint(f\"{counter.count} notifieringar\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 13/11"},{"id":"singleton-adapter","cat":"Designmönster","min":8,"title":"Singleton och Adapter","lead":"En enda, kontrollerad instans, och när det är en dålig idé. Plus Adapter för att koppla ihop gränssnitt som inte passar.","src":["Torsdag 13/11 – Design Patterns intro (avsnitt 5–6)"],"goals":["Skriva en trådsäker Singleton i modern C++","Avgöra när Singleton passar och när det är en antipattern","Känna till alternativ som dependency injection","Använda Adapter för att anpassa ett befintligt gränssnitt"],"blocks":[["h","Vad är Singleton till för?"],["p","Ibland ska det bara finnas <strong>en</strong> instans: en global logger, en spelmotor, en konfigurationshanterare. Singleton ser till att endast ett objekt kan skapas, att det är globalt åtkomligt och att det skapas först när det behövs (lazy initialization)."],["h","Modern, trådsäker Singleton"],["code","cpp","class Logger {\npublic:\n    static Logger& instance() {\n        static Logger inst;        // skapas första gången, trådsäkert sedan C++11\n        return inst;\n    }\n    void log(const std::string& msg) { std::cout << \"[LOG] \" << msg << \"\\n\"; }\n\nprivate:\n    Logger() = default;                          // privat konstruktor\n    Logger(const Logger&) = delete;              // ingen kopiering\n    Logger& operator=(const Logger&) = delete;\n};\n\nLogger::instance().log(\"Programmet startar...\");\n// Logger x;           // FEL: konstruktorn är privat\n// Logger y = Logger::instance();   // FEL: kopiering är borttagen"],["list",["Den lokala <code>static</code>-variabeln skapas vid första anropet. C++11 garanterar att det är trådsäkert.","Privat konstruktor och borttagna kopieringsfunktioner gör instance() till enda vägen till objektet."]],["h","När passar Singleton?"],["table",["Bra","Dåligt"],[["en global logger","nästan allt annat"],["konfiguration som läses en gång","för att slippa skicka parametrar"],["spelmotor, resurshanterare, input","objekt som behöver bytas ut i tester"]]],["p","Singletons blir lätt en gömd global variabel: svåra att byta ut i tester, svåra att mocka, och de döljer beroenden. I stora system anses de ofta vara en <strong>antipattern</strong> om de används utan försiktighet."],["h","Vanliga misstag"],["list",["För mycket ansvar i en Singleton.","Singleton bara för att slippa skicka parametrar.","Hela programmet byggs runt global delad state.","Singletons som är omöjliga att testa.","Den gamla varianten med en statisk pekare på heapen istället för <code>static</code> lokal variabel."]],["h","Alternativ"],["code","cpp","// Dependency injection: beroendet skickas in och syns i signaturen\nclass Game {\npublic:\n    explicit Game(GameConfig& config) : config_(config) {}\nprivate:\n    GameConfig& config_;\n};\n\n// Tillståndslös hjälpkod behöver ingen klass alls\nnamespace MathUtil {\n    double clamp(double v, double lo, double hi) { return v < lo ? lo : v > hi ? hi : v; }\n}\n\n// Eller: ett Application-objekt i main äger alla system och skickar referenser"],["h","Adapter: få gränssnitt att passa"],["p","Ett bibliotek eller äldre kod kan ha ett annat gränssnitt än ditt system förväntar sig. En <strong>Adapter</strong> implementerar ditt gränssnitt och översätter anropen till det gamla."],["code","cpp","class OldSensorLib {               // kan inte ändras\npublic:\n    double readValue();\n};\n\nclass ISensor {                     // det vårt system använder\npublic:\n    virtual ~ISensor() = default;\n    virtual double read() = 0;\n};\n\nclass OldSensorAdapter : public ISensor {\npublic:\n    explicit OldSensorAdapter(OldSensorLib os) : old(os) {}\n    double read() override { return old.readValue(); }   // översätt\nprivate:\n    OldSensorLib old;\n};"]],"pool":[{"t":"mc","q":"Varför är Singletonens konstruktor privat?","o":["För att göra den snabbare","Så att ingen utanför klassen kan skapa fler instanser","För att kunna ärva","För att den ska vara virtuell"],"a":1,"why":"Enda vägen till objektet blir <code>instance()</code>."},{"t":"mc","q":"Vad gör <code>static Logger inst;</code> inuti <code>instance()</code>?","o":["Skapar en ny logger varje anrop","Skapar loggern vid första anropet och återanvänder den sedan","Skapar loggern innan main startar","Ger kompileringsfel"],"a":1,"why":"Lazy initialization, och C++11 garanterar att den är trådsäker."},{"t":"mc","q":"Vilket är ett bra användningsområde för Singleton?","o":["Varje sensor i systemet","En global konfiguration som bara ska läsas en gång","Alla spelare i ett spel","För att slippa skicka parametrar"],"a":1,"why":"Ett exempel ur materialet: Config::instance().getStartHealth()."},{"t":"mc","q":"Vad är en nackdel med Singleton?","o":["Den tar mycket minne","Den döljer beroenden och är svår att byta ut i tester","Den kan inte ha metoder","Den måste vara abstrakt"],"a":1,"why":"Därför är dependency injection ofta ett bättre val."},{"t":"mc","q":"Vilket problem löser Adapter?","o":["För många instanser","Ett befintligt gränssnitt passar inte det ditt system förväntar sig","Objekt som skapas på fel ställe","Aviseringar till många mottagare"],"a":1,"why":"OldSensorAdapter implementerar ISensor och översätter read() till readValue()."},{"t":"mc","q":"Varför markeras Singletonens kopieringskonstruktor med <code>= delete</code>?","o":["För att spara minne","Så att ingen kan skapa en kopia och därmed en andra instans","För att den ska bli virtuell","Det behövs inte"],"a":1,"why":"<code>Logger y = Logger::instance();</code> blir då ett kompileringsfel."},{"t":"multi","q":"Vilka är alternativ till Singleton enligt materialet? Välj alla.","o":["Dependency injection via konstruktorn","Tillståndslösa hjälpfunktioner i ett namespace","En Application-klass i main som äger systemen","Fler globala variabler"],"a":[0,1,2],"why":"Globala variabler har samma problem som Singleton, utan kontrollen."},{"t":"text","q":"Vad heter den statiska metoden som ger åtkomst till singleton-objektet i materialets exempel?","accept":["instance","instance()","Logger::instance()","Logger::instance"],"ph":"metod","why":"<code>Logger::instance()</code>"},{"t":"text","q":"Vilket mönster översätter ett befintligt gränssnitt till det ditt system förväntar sig? Skriv namnet på engelska.","accept":["adapter","adapter pattern"],"ph":"namn","why":"Adapter."},{"t":"code","q":"Skriv en Singleton <code>Config</code> med privat konstruktor som sätter <code>startHealth</code> till 100, borttagen kopiering, <code>static Config&amp; instance()</code>, samt <code>startHealth()</code> och <code>setStartHealth(int)</code>. main sätter värdet om indata finns och läser det via två anrop till instance().","why":"Båda referenserna pekar på samma objekt. Den lokala <code>static</code>-variabeln skapas en gång.","task":"09-singleton-adapter-1","tests":[{"in":"\n","out":"100 samma\n"},{"in":"250\n","out":"250 samma\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nclass Config {\n    // Singleton här\n\n};\n\nint main() {\n    int v;\n    if (cin >> v) Config::instance().setStartHealth(v);\n    Config& a = Config::instance();\n    Config& b = Config::instance();\n    cout << a.startHealth() << \" \" << (&a == &b ? \"samma\" : \"olika\") << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass Config {\npublic:\n    static Config& instance() {\n        static Config inst;\n        return inst;\n    }\n    int startHealth() const { return startHealth_; }\n    void setStartHealth(int v) { startHealth_ = v; }\n\n    Config(const Config&) = delete;\n    Config& operator=(const Config&) = delete;\nprivate:\n    Config() : startHealth_(100) {}\n    int startHealth_;\n};\n\nint main() {\n    int v;\n    if (cin >> v) Config::instance().setStartHealth(v);\n    Config& a = Config::instance();\n    Config& b = Config::instance();\n    cout << a.startHealth() << \" \" << (&a == &b ? \"samma\" : \"olika\") << endl;\n    return 0;\n}\n"},"py":{"starter":"import sys\n\n\nclass Config:\n    # Singleton: instance() ska alltid ge samma objekt, start_health börjar på 100\n    pass\n\n\ndata = sys.stdin.read().split()\nif data:\n    Config.instance().start_health = int(data[0])\na = Config.instance()\nb = Config.instance()\nprint(a.start_health, \"samma\" if a is b else \"olika\")\n","sol":"import sys\n\n\nclass Config:\n    _instance = None                 # klassvariabel, delas av alla\n\n    def __init__(self):\n        self.start_health = 100\n\n    @classmethod\n    def instance(cls):\n        if cls._instance is None:    # skapas första gången (lazy)\n            cls._instance = cls()\n        return cls._instance\n\n\ndata = sys.stdin.read().split()\nif data:\n    Config.instance().start_health = int(data[0])\na = Config.instance()\nb = Config.instance()\nprint(a.start_health, \"samma\" if a is b else \"olika\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false},{"t":"code","q":"Adapter: <code>OldThermo</code> har <code>int readTenths()</code> (tiondels grader). Skriv <code>ThermoAdapter</code> som implementerar <code>ISensor::read()</code> och returnerar grader som double.","why":"Adaptern översätter både metodnamnet och enheten. <code>/ 10.0</code> ger decimaldivision.","task":"09-singleton-adapter-2","tests":[{"in":"235\n","out":"23.5\n"},{"in":"-50\n","out":"-5\n"}],"code":{"cpp":{"starter":"#include <iostream>\nusing namespace std;\n\nclass OldThermo {              // kan inte ändras\n    int tenths_;\npublic:\n    OldThermo(int t) : tenths_(t) {}\n    int readTenths() const { return tenths_; }\n};\n\nclass ISensor {\npublic:\n    virtual ~ISensor() = default;\n    virtual double read() const = 0;\n};\n\n// skriv ThermoAdapter\n\n\nint main() {\n    int t;\n    cin >> t;\n    ThermoAdapter a{OldThermo(t)};\n    const ISensor& s = a;\n    cout << s.read() << endl;\n    return 0;\n}\n","sol":"#include <iostream>\nusing namespace std;\n\nclass OldThermo {              // kan inte ändras\n    int tenths_;\npublic:\n    OldThermo(int t) : tenths_(t) {}\n    int readTenths() const { return tenths_; }\n};\n\nclass ISensor {\npublic:\n    virtual ~ISensor() = default;\n    virtual double read() const = 0;\n};\n\nclass ThermoAdapter : public ISensor {\n    OldThermo old_;\npublic:\n    explicit ThermoAdapter(OldThermo old) : old_(old) {}\n    double read() const override { return old_.readTenths() / 10.0; }\n};\n\nint main() {\n    int t;\n    cin >> t;\n    ThermoAdapter a{OldThermo(t)};\n    const ISensor& s = a;\n    cout << s.read() << endl;\n    return 0;\n}\n"},"py":{"starter":"from abc import ABC, abstractmethod\n\n\nclass OldThermo:                     # kan inte ändras\n    def __init__(self, tenths):\n        self._tenths = tenths\n\n    def read_tenths(self):\n        return self._tenths\n\n\nclass ISensor(ABC):\n    @abstractmethod\n    def read(self):\n        ...\n\n\n# skriv ThermoAdapter\n\n\na = ThermoAdapter(OldThermo(int(input())))\nprint(f\"{a.read():g}\")\n","sol":"from abc import ABC, abstractmethod\n\n\nclass OldThermo:                     # kan inte ändras\n    def __init__(self, tenths):\n        self._tenths = tenths\n\n    def read_tenths(self):\n        return self._tenths\n\n\nclass ISensor(ABC):\n    @abstractmethod\n    def read(self):\n        ...\n\n\nclass ThermoAdapter(ISensor):\n    def __init__(self, old):\n        self._old = old\n\n    def read(self):\n        return self._old.read_tenths() / 10\n\n\na = ThermoAdapter(OldThermo(int(input())))\nprint(f\"{a.read():g}\")\n"}},"langs":["cpp","py"],"web":["py"],"gpp":false}],"date":"Tors 13/11"},{"id":"git-samarbete","cat":"Samarbete","min":7,"title":"Samarbete med Git: branches och pull requests","lead":"Feature branches, små commits, pull requests och code review, i ett mini-projekt i par.","src":["Samarbete med git – branches, merging, PRs"],"goals":["Skapa en feature branch per ändring","Göra små commits med meddelanden som förklarar varför","Öppna en pull request och göra code review","Undvika de vanligaste misstagen i ett delat repo"],"blocks":[["h","Arbetsflödet"],["code","bash","# 1. skapa en branch för EN ändring\ngit checkout -b feature/add-heal-spell\n\n# 2. implementera, testa att det kompilerar, gör små commits\ngit add .\ngit commit -m \"Add heal spell so mages can restore HP\"\n\n# 3. pusha branchen\ngit push -u origin feature/add-heal-spell\n\n# 4. öppna en Pull Request på GitHub, tilldela din partner som reviewer\n# 5. efter review och godkännande: merge via GitHub, sedan lokalt:\ngit checkout main\ngit pull"],["p","<strong>Regel:</strong> en feature branch = en ändring eller en deluppgift. Gör inte allt på samma branch."],["h","Pull request och code review"],["p","I PR-beskrivningen skriver du vad du lagt till, varför, och om något är oklart. Granskaren kommenterar specifika rader, ställer frågor och föreslår förbättringar i GitHubs review-verktyg. När allt är åtgärdat godkänner partnern och PR:en mergas."],["h","Vanliga misstag"],["list",["Stora branches med 300 rader ändringar.","För sena commits.","Dåliga commit-meddelanden, som \"fix\".","PR utan beskrivning.","Merge direkt till main utan review.","Båda jobbar på samma branch.","Konflikter som får växa sig stora.","Pusha utan att testa."]],["h","Mini-projekten"],["table",["Projekt","Minimikrav","Förslag på feature branches"],[["A. Mini-RPG Combat","<code>Character</code> med inkapslade stats, <code>Warrior</code> och <code>Mage</code> med polymorfa attacker, turbaserad stridsloop","print-ui, mage-spell, items, crit-chance"],["B. SmartHome","basklass <code>Device</code>, subklasser <code>Lamp</code>, <code>Thermostat</code>, <code>Fan</code>, polymorf <code>update()</code>/<code>status()</code>, <code>vector&lt;unique_ptr&lt;Device&gt;&gt;</code>","fan-mode (enum), schedules, room (komposition), logging (Singleton)"],["C. Marketplace Shop","<code>Item</code>, <code>Customer</code>, <code>VIPCustomer</code> med rabatt, <code>Shop</code> som säljer så länge lagret räcker","discount-code, out-of-stock-log, csv-load, receipt"]]],["note","tip","Bygg grunden tillsammans först: tomma klasser och en main som kompilerar. Sedan tar ni varsin feature branch. Mindre risk för konflikter."]],"pool":[{"t":"mc","q":"Hur många ändringar bör en feature branch innehålla?","o":["Alla ändringar för veckan","En ändring eller deluppgift","Minst 300 rader","Det spelar ingen roll"],"a":1,"why":"Små branches är lätta att granska och ger färre konflikter."},{"t":"mc","q":"Vad bör ett bra commit-meddelande förklara?","o":["Bara vilka filer som ändrats","Vad som ändrats och varför","Vem som skrev koden","Datumet"],"a":1,"why":"\"Add heal spell so mages can restore HP\" säger mer än \"fix\"."},{"t":"mc","q":"Vad gör <code>git push -u origin feature/x</code>?","o":["Raderar branchen","Pushar branchen och kopplar den lokala branchen till den på GitHub","Mergar till main","Skapar en PR automatiskt"],"a":1,"why":"<code>-u</code> sätter upstream så att senare <code>git push</code> och <code>git pull</code> vet vart de ska."},{"t":"mc","q":"Vem bör godkänna en PR innan merge?","o":["Den som skrev koden","En annan person, efter code review","Ingen","GitHub automatiskt"],"a":1,"why":"Merge till main utan revie const WIDGETS = {
  offbyone(el) {
    const arr = [21, 22, 20, 19, 23];
    let op = "<", timer = null, cur = -1;
    el.innerHTML = `<div class="wt"><b>Off-by-one i praktiken</b><span>interaktiv</span></div>
      <div class="controls"><code id="ob-code"></code><span class="seg" role="group" aria-label="Jämförelse">
      <button type="button" data-op="<" aria-pressed="true">&lt;</button><button type="button" data-op="<=" aria-pressed="false">&lt;=</button></span>
      <button type="button" class="btn" id="ob-run" style="padding:5px 12px">Kör loopen ▶</button></div>
      <div class="cells" id="ob-cells"></div><div class="readout" id="ob-out"></div>`;
    const draw = () => {
      const last = op === "<" ? 4 : 5;
      $("#ob-code", el).textContent = `for (int i = 0; i ${op} 5; i++)  sum += temps[i];`;
      $("#ob-cells", el).innerHTML = [0, 1, 2, 3, 4, 5].map(i => {
        let c;
        if (i === 5) c = cur === 5 ? "out" : "junk";
        else if (i === cur) c = "cur";
        else if (cur > i) c = "hit";
        else c = "";
        return `<div class="cellbox ${c}"><span class="v">${i === 5 ? "??" : arr[i]}</span><span class="i">temps[${i}]</span></div>`;
      }).join("");
      const out = $("#ob-out", el);
      if (cur < 0) out.innerHTML = `<span>Arrayen har 5 element, index 0–4. Rutan längst till höger är minnet efter arrayen.</span>`;
      else if (cur > last) out.innerHTML = op === "<"
        ? `<span class="ok">5 varv: i = 0, 1, 2, 3, 4. Alla element lästes exakt en gång.</span>`
        : `<span class="bad">6 varv: i = 0 … 5. temps[5] ligger utanför arrayen. Summan får ett skräpvärde, eller så kraschar programmet.</span>`;
      else out.innerHTML = `<span>i = ${cur}: villkoret ${cur} ${op} 5 är sant → läser temps[${cur}]${cur === 5 ? ' <b class="bad">utanför arrayen!</b>' : ` = ${arr[cur]}`}</span>`;
    };
    $$(".seg button", el).forEach(b => b.addEventListener("click", () => {
      op = b.dataset.op; clearInterval(timer); cur = -1;
      $$(".seg button", el).forEach(x => x.setAttribute("aria-pressed", x === b)); draw();
    }));
    $("#ob-run", el).addEventListener("click", () => {
      clearInterval(timer); cur = 0; draw();
      const last = op === "<" ? 4 : 5;
      timer = setInterval(() => { cur++; draw(); if (cur > last) clearInterval(timer); }, 650);
    });
    draw();
  },

  stack(el) {
    const code = [
      "float average(float a, float b) {",
      "    float sum = a + b;",
      "    return sum / 2;",
      "}",
      "",
      "int main() {",
      "    float t1 = 21.5;",
      "    float t2 = 23.5;",
      "    float avg = average(t1, t2);",
      "    printf(\"%.1f\\n\", avg);",
      "}",
    ];
    const S = [
      { l: 5, f: [["main", "t1 = ?", "t2 = ?", "avg = ?"]], c: "Programmet startar. main() får en stack frame med plats för sina lokala variabler." },
      { l: 6, f: [["main", "t1 = 21.5", "t2 = ?", "avg = ?"]], c: "t1 tilldelas ett värde i main:s frame." },
      { l: 7, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"]], c: "t2 tilldelas." },
      { l: 0, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = ?"]], c: "average() anropas. En ny frame läggs överst. a och b är kopior av t1 och t2 (call by value)." },
      { l: 1, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = 45.0"]], c: "sum är en lokal variabel. Den finns bara i average():s frame." },
      { l: 2, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = ?"], ["average", "a = 21.5", "b = 23.5", "sum = 45.0", "→ returnerar 22.5"]], c: "return lämnar tillbaka 22.5 till den som anropade." },
      { l: 8, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = 22.5"]], c: "average():s frame är borta. a, b och sum finns inte längre. Returvärdet hamnar i avg." },
      { l: 9, f: [["main", "t1 = 21.5", "t2 = 23.5", "avg = 22.5"]], c: "printf skriver ut värdet.", o: "22.5" },
      { l: 10, f: [], c: "main() returnerar och dess frame tas bort. Stacken är tom igen." },
    ];
    let s = 0;
    el.innerHTML = `<div class="wt"><b>Anropsstacken steg för steg</b><span>interaktiv</span></div>
      <div class="stackw"><pre id="st-code"></pre><div><div class="eyebrow" style="margin-bottom:6px">Stacken (överst = aktiv)</div><div class="frames" id="st-frames"></div><div class="out-term" id="st-out" aria-label="Utskrift"></div></div></div>
      <div class="stack-caption" id="st-cap" aria-live="polite"></div>
      <div class="stepbtns"><button type="button" id="st-prev">← Föregående</button><button type="button" id="st-next">Nästa steg →</button><button type="button" id="st-reset">Börja om</button></div>`;
    const draw = () => {
      const st = S[s];
      $("#st-code", el).innerHTML = code.map((c, i) => `<span class="ln ${i === st.l ? "now" : ""}">${esc(c) || " "}</span>`).join("");
      $("#st-frames", el).innerHTML = st.f.length ? st.f.map((f, i) => `<div class="frame ${i === st.f.length - 1 ? "top" : ""}"><b>${f[0]}()</b>${f.slice(1).map(esc).join("<br>")}</div>`).join("") : `<div style="color:var(--muted);font-size:.85rem;margin:auto">tom</div>`;
      $("#st-cap", el).textContent = `Steg ${s + 1}/${S.length}: ${st.c}`;
      $("#st-out", el).textContent = s >= 7 ? "$ ./program\n22.5" : "$ ./program";
      $("#st-prev", el).disabled = s === 0;
      $("#st-next", el).disabled = s === S.length - 1;
    };
    $("#st-prev", el).addEventListener("click", () => { if (s > 0) { s--; draw(); } });
    $("#st-next", el).addEventListener("click", () => { if (s < S.length - 1) { s++; draw(); } });
    $("#st-reset", el).addEventListener("click", () => { s = 0; draw(); });
    $("#st-out", el).style.whiteSpace = "pre";
    draw();
  },

  pointer(el) {
    const arr = [21, 22, 20, 19, 23], base = 0x7ffe1000;
    el.innerHTML = `<div class="wt"><b>Pekararitmetik: p + i</b><span>interaktiv</span></div>
      <div class="controls"><code>int temps[5] = {21, 22, 20, 19, 23};  int* p = temps;</code></div>
      <div class="controls"><label for="pt-i">i =</label><input type="range" id="pt-i" min="0" max="5" value="0"><b id="pt-iv" style="font-family:var(--f-mono)">0</b></div>
      <div class="cells" id="pt-cells"></div><div class="readout" id="pt-out"></div>`;
    const draw = () => {
      const i = +$("#pt-i", el).value;
      $("#pt-iv", el).textContent = i;
      $("#pt-cells", el).innerHTML = [0, 1, 2, 3, 4, 5].map(k => `<div class="cellbox ${k === 5 ? (k === i ? "out" : "junk") : k === i ? "cur" : ""}"><span class="v">${k === 5 ? "??" : arr[k]}</span><span class="i">0x…${(base + k * 4).toString(16).slice(-3)}</span></div>`).join("");
      const a = "0x" + (base + i * 4).toString(16);
      $("#pt-out", el).innerHTML = `<span>p + ${i} = 0x${base.toString(16)} + ${i} × sizeof(int) = ${a}</span>` +
        (i < 5 ? `<span>*(p + ${i}) = temps[${i}] = <b class="ok">${arr[i]}</b></span>` : `<span class="bad">*(p + 5) pekar precis efter arrayen. Adressen är giltig att räkna fram, men att läsa där är odefinierat beteende.</span>`);
    };
    $("#pt-i", el).addEventListener("input", draw);
    draw();
  },

  cstring(el) {
    el.innerHTML = `<div class="wt"><b>Strängen i minnet</b><span>interaktiv</span></div>
      <div class="controls"><label for="cs-t">Text</label><input type="text" id="cs-t" value="Hello" maxlength="14">
      <label for="cs-n">char buf[</label><input type="number" id="cs-n" value="5" min="1" max="16"><span style="font-family:var(--f-mono)">];</span></div>
      <div class="cells" id="cs-cells"></div><div class="readout" id="cs-out"></div>`;
    const draw = () => {
      const t = $("#cs-t", el).value;
      let n = Math.max(1, Math.min(16, parseInt($("#cs-n", el).value, 10) || 1));
      const need = t.length + 1;
      const total = Math.max(n, need);
      const chars = [...t, "\\0"];
      $("#cs-cells", el).innerHTML = Array.from({ length: total }, (_, i) => {
        const inBuf = i < n;
        const ch = i < chars.length ? chars[i] : "?";
        let cls = !inBuf ? "out" : ch === "\\0" ? "nul" : ch === "?" ? "junk" : "";
        const shown = ch === " " ? "␣" : ch;
        return `<div class="cellbox ${cls}"><span class="v">${esc(shown)}</span><span class="i">${inBuf ? `buf[${i}]` : "utanför"}</span></div>`;
      }).join("");
      $("#cs-out", el).innerHTML = `<span>strlen = ${t.length} · sizeof(buf) = ${n} · behöver ${need} bytes</span>` +
        (need <= n ? `<span class="ok">Får plats, inklusive '\\0'.</span>` : `<span class="bad">Buffer overflow: ${need - n} byte${need - n > 1 ? "s" : ""} skrivs utanför bufferten och förstör annat minne.${need - n === 1 ? " Det är nolltecknet som inte fick plats." : ""}</span>`);
    };
    $("#cs-t", el).addEventListener("input", draw);
    $("#cs-n", el).addEventListener("input", draw);
    draw();
  },
};

    const draw = (activeIdx = -1) => {
      const ch = chains[depth];
      $("#co-layers", el).innerHTML = ch.map((n, i) => `<div class="layer ${alive || i < activeIdx ? "on" : ""} ${i === activeIdx ? "now" : ""}" style="margin-left:${i * 14}px"><b>${n}</b><span>${i === 0 ? "basklass" : ": public " + ch[i - 1]}</span></div>`).join("");
      $("#co-log", el).textContent = log.length ? log.join("\n") : "$ ./program";
      $("#co-make", el).disabled = alive || busy;
      $("#co-kill", el).disabled = !alive || busy;
    };
    const steps = async (names, built) => {
      busy = true;
      for (let k = 0; k < names.length; k++) {
        const i = built ? k : names.length - 1 - k;
        const n = chains[depth][i];
        log.push(built ? `${n}()` : `~${n}()`);
        if (!built && k === names.length - 1) alive = false;
        draw(built ? i + 1 : i);
        if (built) $$(".layer", el)[i].classList.add("on");
        else $$(".layer", el).slice(i).forEach(x => x.classList.remove("on"));
        await new Promise(r => setTimeout(r, 550));
      }
      busy = false;
    };
    $$(".seg button", el).forEach(b => b.addEventListener("click", () => {
      if (busy) return;
      depth = +b.dataset.d; alive = false; log = [];
      $$(".seg button", el).forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#co-cap", el).textContent = ""; draw();
    }));
    $("#co-make", el).addEventListener("click", async () => {
      log = []; await steps(chains[depth], true); alive = true; draw();
      $("#co-cap", el).textContent = "Basen byggs först, sedan varje subklass utåt. Varje konstruktor kan lita på att delarna under den redan finns.";
    });
    $("#co-kill", el).addEventListener("click", async () => {
      await steps(chains[depth], false); alive = false; draw();
      $("#co-cap", el).textContent = "Destruktorerna körs i omvänd ordning: den mest specifika klassen rivs först, basen sist.";
    });
    draw();
  },

  dispatch(el) {
    let virt = true, via = "ref";
    const code = () => `struct Base {
    ${virt ? "virtual " : ""}void f() const { cout << "Base::f\\n"; }
    virtual ~Base() = default;
};
struct Der : Base {
    void f() const${virt ? " override" : ""} { cout << "Der::f\\n"; }
};

Der d;
${via === "ref" ? "const Base& b = d;   // referens" : via === "ptr" ? "const Base* b = &d;  // pekare" : "Base b = d;          // kopia av bastyp"}
b${via === "ptr" ? "->" : "."}f();`;
    el.innerHTML = `<div class="wt"><b>Vilken f() körs?</b><span>interaktiv</span></div>
      <div class="controls">
        <span class="seg" role="group" aria-label="virtual"><button type="button" data-v="1" aria-pressed="true">virtual</button><button type="button" data-v="0" aria-pressed="false">utan virtual</button></span>
        <span class="seg" role="group" aria-label="Åtkomst"><button type="button" data-w="ref" aria-pressed="true">Base&amp;</button><button type="button" data-w="ptr" aria-pressed="false">Base*</button><button type="button" data-w="copy" aria-pressed="false">Base (kopia)</button></span>
      </div>
      <div class="stackw"><pre style="margin:0"><code class="language-cpp" id="dp-code"></code></pre>
        <div><div class="eyebrow" style="margin-bottom:6px">Utdata</div><div class="out-term" id="dp-out" style="font-size:1rem;margin:0 0 10px"></div><div id="dp-why" style="font-size:.9rem"></div></div></div>`;
    const draw = () => {
      const c = $("#dp-code", el);
      c.textContent = code(); c.removeAttribute("data-highlighted"); c.className = "language-cpp";
      try { window.hljs && hljs.highlightElement(c); } catch (e) {}
      const der = virt && via !== "copy";
      $("#dp-out", el).textContent = der ? "Der::f" : "Base::f";
      $("#dp-why", el).innerHTML = via === "copy"
        ? `<b class="bad" style="color:var(--bad)">Object slicing.</b> <code>b</code> är en ny <code>Base</code>, kopierad från d. Der-delen är bortskuren, så det finns ingen Der att anropa${virt ? ", trots virtual" : ""}.`
        : virt ? `<b style="color:var(--ok)">Virtuell dispatch.</b> Anropet går via objektets vtable och hittar <code>Der::f</code>, fast variabeln har typen ${via === "ref" ? "<code>Base&amp;</code>" : "<code>Base*</code>"}.`
        : `<b style="color:var(--copper)">Statisk bindning.</b> Utan <code>virtual</code> väljer kompilatorn funktion utifrån variabelns typ (<code>Base</code>), inte objektets.`;
      $$("[data-v]", el).forEach(b => b.setAttribute("aria-pressed", (b.dataset.v === "1") === virt));
      $$("[data-w]", el).forEach(b => b.setAttribute("aria-pressed", b.dataset.w === via));
    };
    $$("[data-v]", el).forEach(b => b.addEventListener("click", () => { virt = b.dataset.v === "1"; draw(); }));
    $$("[data-w]", el).forEach(b => b.addEventListener("click", () => { via = b.dataset.w; draw(); }));
    draw();
  },
});

    if (old) {
      state.done.cpp = old.done || [];
      Object.entries(old.checks || {}).forEach(([k, v]) => (state.checks["cpp:" + k] = v));
    }

} catch (e) { /* storage unavailable: start fresh */ }

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const strip = s => String(s).replace(/<[^>]+>/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim();
const nn = i => String(i + 1).padStart(2, "0");
const addr = (ti, si) => "0x" + ((ti + 1) * 0x100 + si * 0x10).toString(16).toUpperCase().padStart(4, "0");
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const fmtDate = ts => { try { return new Date(ts).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ""; } };
const gradeOf = pct => pct >= 75 ? "VG" : pct >= 50 ? "G" : "IG";

function practiceStats(c, l) {
